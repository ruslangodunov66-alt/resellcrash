<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VIP POKER · Texas Hold'em</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           1. CORE & RESET (PREMIUM THEME)
           ========================================================================== */
        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #0a0a0f;
            --bg-panel: rgba(18, 18, 28, 0.85);
            --felt-center: #0d5c3f;
            --felt-edge: #052618;
            --wood-rim: #2d1406;
            --wood-highlight: #4a2511;
            
            --gold-bright: #FFD700;
            --gold-dark: #B8860B;
            --gold-glow: rgba(255, 215, 0, 0.4);
            
            --neon-blue: #00E5FF;
            --neon-red: #FF3366;
            --neon-green: #00FF66;
            
            --text-main: #FFFFFF;
            --text-muted: #8A92A6;
            
            --font-display: 'Cinzel', serif;
            --font-ui: 'Montserrat', sans-serif;
        }

        html, body {
            height: 100%;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.05) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(0, 229, 255, 0.05) 0%, transparent 60%);
            color: var(--text-main);
            font-family: var(--font-ui);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background: linear-gradient(180deg, rgba(20,20,30,0) 0%, #0a0a0f 100%);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        /* ==========================================================================
           2. HEADER (VIP STYLE)
           ========================================================================== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            z-index: 10;
        }

        .brand-logo {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(to bottom, #FFFFFF, #A0A0A0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }
        .brand-logo span {
            background: linear-gradient(to bottom, var(--gold-bright), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .balance-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.2);
            padding: 6px 16px;
            border-radius: 30px;
            box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.05), 0 4px 10px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        .balance-pill img {
            width: 20px;
            height: 20px;
            filter: drop-shadow(0 0 5px var(--gold-bright));
        }
        .balance-value {
            font-weight: 800;
            font-size: 18px;
            color: var(--gold-bright);
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        /* ==========================================================================
           3. LOBBY (CASINO ENTRANCE)
           ========================================================================== */
        .lobby-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 5;
            background: radial-gradient(circle at center, rgba(13, 92, 63, 0.2) 0%, transparent 70%);
        }

        .lobby-title {
            font-family: var(--font-display);
            font-size: 42px;
            text-align: center;
            background: linear-gradient(to bottom, #fff, #b3b3b3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .lobby-subtitle {
            color: var(--gold-bright);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        .control-group {
            width: 100%;
            max-width: 320px;
            background: var(--bg-panel);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            backdrop-filter: blur(20px);
        }

        .control-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
            margin-bottom: 12px;
            display: block;
        }

        .bet-input-wrapper {
            position: relative;
            margin-bottom: 15px;
        }
        .bet-input-wrapper span {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold-bright);
            font-weight: 900;
            font-size: 20px;
        }
        .bet-input {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            padding: 15px 15px 15px 45px;
            color: #fff;
            font-size: 24px;
            font-weight: 900;
            font-family: var(--font-ui);
            outline: none;
            transition: all 0.3s ease;
        }
        .bet-input:focus {
            border-color: var(--gold-bright);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        .chip-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .chip-btn {
            background: linear-gradient(180deg, #2a2a35 0%, #1a1a24 100%);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 10px 0;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chip-btn:active { transform: scale(0.95); }
        .chip-btn[data-amount="MAX"] {
            background: linear-gradient(180deg, rgba(255,51,102,0.2) 0%, rgba(200,20,60,0.1) 100%);
            border-color: rgba(255,51,102,0.4);
            color: var(--neon-red);
        }

        .bot-selector {
            display: flex;
            gap: 10px;
            justify-content: space-between;
        }
        .bot-btn {
            flex: 1;
            padding: 12px 0;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: var(--text-muted);
            font-weight: 800;
            font-size: 16px;
            transition: all 0.3s;
        }
        .bot-btn.active {
            background: linear-gradient(180deg, #00C6FF 0%, #0072FF 100%);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
        }

        .play-btn {
            width: 100%;
            max-width: 320px;
            background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold-dark) 100%);
            border: none;
            border-radius: 16px;
            padding: 18px;
            font-size: 18px;
            font-weight: 900;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.3), inset 0 2px 0 rgba(255,255,255,0.4);
            cursor: pointer;
            transition: all 0.2s;
            animation: pulse-gold 2s infinite;
        }
        .play-btn:active {
            transform: translateY(2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }

        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 215, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }

        /* ==========================================================================
           4. GAME TABLE & FELT
           ========================================================================== */
        .game-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            position: relative;
        }
        .game-screen.active {
            display: flex;
        }

        .table-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px 10px;
        }

        .poker-table-surface {
            width: 95%;
            aspect-ratio: 1.4 / 1;
            max-height: 380px;
            background: radial-gradient(ellipse at center, var(--felt-center) 0%, var(--felt-edge) 100%);
            border-radius: 120px;
            border: 14px solid var(--wood-rim);
            box-shadow: 
                inset 0 0 40px rgba(0,0,0,0.8), 
                inset 0 0 0 2px rgba(255,255,255,0.05),
                0 25px 50px rgba(0,0,0,0.9),
                0 0 0 3px #111;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        /* Inner decorative line */
        .poker-table-surface::after {
            content: '';
            position: absolute;
            top: 20px; bottom: 20px; left: 25px; right: 25px;
            border: 2px solid rgba(255,215,0,0.1);
            border-radius: 90px;
            pointer-events: none;
        }

        /* Center info (Pot) */
        .table-center-info {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            transform: translateY(-10px);
        }

        .pot-container {
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 4px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }
        .pot-container span {
            font-family: var(--font-display);
            color: var(--gold-bright);
            font-size: 18px;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .stage-badge {
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 2px 10px;
            border-radius: 10px;
            margin-top: -8px;
            z-index: 2;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Cards */
        .community-cards-wrap {
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .card {
            width: 42px;
            height: 60px;
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), -1px -1px 0 #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 20px;
            position: relative;
            opacity: 0;
            transform: translateY(-20px) scale(0.8);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .card.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        
        .card.red { color: #E52521; }
        .card.black { color: #111111; }
        
        .card::before, .card::after {
            content: attr(data-val);
            position: absolute;
            font-size: 12px;
            line-height: 1;
            letter-spacing: -1px;
        }
        .card::before { top: 3px; left: 4px; }
        .card::after { bottom: 3px; right: 4px; transform: rotate(180deg); }

        .card.back {
            background: repeating-linear-gradient(45deg, #0b192c 0, #0b192c 4px, #162a47 4px, #162a47 8px);
            border: 2px solid #fff;
            color: transparent;
        }
        .card.back::before, .card.back::after { content: ''; }

        /* Seats */
        .seats-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }

        .player-seat {
            position: absolute;
            width: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(-50%, -50%);
            z-index: 20;
            transition: all 0.3s;
        }

        .player-seat.folded {
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .avatar-wrap {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #1a1a24;
            border: 2px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            position: relative;
            z-index: 2;
            transition: all 0.3s;
        }

        .player-seat.active-turn .avatar-wrap {
            border-color: var(--gold-bright);
            box-shadow: 0 0 20px var(--gold-glow), 0 0 0 4px rgba(255,215,0,0.2);
            transform: scale(1.1);
        }

        .player-info {
            background: rgba(0,0,0,0.75);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 4px 6px;
            text-align: center;
            margin-top: -10px;
            z-index: 3;
            min-width: 65px;
            backdrop-filter: blur(4px);
        }
        .p-name {
            color: #fff;
            font-size: 9px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .p-stack {
            color: var(--gold-bright);
            font-size: 10px;
            font-weight: 900;
        }

        .p-status {
            position: absolute;
            top: -15px;
            background: #fff;
            color: #000;
            font-size: 8px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translateY(5px);
            transition: all 0.2s;
        }
        .p-status.show { opacity: 1; transform: translateY(0); }
        .p-status.fold { background: var(--neon-red); color: #fff; }
        .p-status.call { background: var(--neon-blue); color: #fff; }
        .p-status.raise { background: var(--gold-bright); color: #000; }
        .p-status.allin { background: var(--neon-green); color: #000; }

        /* Seat Positions Array for JS mapping */
        .pos-hero { top: 100%; left: 50%; } /* Hero */
        .pos-1 { top: 15%; left: 15%; }
        .pos-2 { top: 0%; left: 50%; }
        .pos-3 { top: 15%; right: 15%; }
        .pos-4 { top: 50%; left: 5%; }
        .pos-5 { top: 50%; right: 5%; }

        /* Hero Custom Big Cards */
        .hero-hand-wrap {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 30;
        }
        .hero-hand-wrap .card {
            width: 60px;
            height: 85px;
            font-size: 32px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        .hero-hand-wrap .card::before, .hero-hand-wrap .card::after {
            font-size: 16px;
        }
        .hero-hand-wrap .card:nth-child(1) { transform: rotate(-5deg) translateY(0); opacity: 1; }
        .hero-hand-wrap .card:nth-child(2) { transform: rotate(5deg) translateY(0); opacity: 1; }

        /* ==========================================================================
           5. CONTROLS FOOTER (ACTION PANEL)
           ========================================================================== */
        .action-footer {
            background: rgba(10, 10, 15, 0.95);
            border-top: 1px solid rgba(255,255,255,0.05);
            padding: 15px 15px 25px;
            z-index: 40;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
        }

        .status-msg-bar {
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            min-height: 18px;
        }
        .status-msg-bar.info { color: var(--neon-blue); text-shadow: 0 0 10px rgba(0, 229, 255, 0.4); }
        .status-msg-bar.win { color: var(--gold-bright); text-shadow: 0 0 15px rgba(255, 215, 0, 0.6); font-size: 15px; }
        .status-msg-bar.lose { color: var(--neon-red); }

        .slider-wrap {
            display: none;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,215,0,0.2);
        }
        .slider-wrap.active { display: flex; }
        
        .slider-wrap input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 6px;
            background: #2a2a35;
            border-radius: 3px;
            outline: none;
        }
        .slider-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: var(--gold-bright);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px var(--gold-glow);
        }
        .slider-val {
            color: #fff;
            font-weight: 900;
            font-size: 18px;
            min-width: 60px;
            text-align: right;
            font-family: var(--font-display);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn-grid-bot {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
        }

        .action-btn {
            border: none;
            border-radius: 12px;
            padding: 14px 10px;
            font-family: var(--font-ui);
            font-weight: 900;
            font-size: 14px;
            text-transform: uppercase;
            color: #fff;
            box-shadow: 0 4px 0 rgba(0,0,0,0.5);
            transition: all 0.15s;
        }
        .action-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.5);
        }
        .action-btn:disabled {
            opacity: 0.3; filter: grayscale(100%); pointer-events: none;
        }

        .btn-fold { background: linear-gradient(180deg, #591b1b, #3a0d0d); }
        .btn-check { background: linear-gradient(180deg, #4a4a5a, #2a2a35); }
        .btn-call { background: linear-gradient(180deg, #0072FF, #0044aa); }
        .btn-raise { 
            background: linear-gradient(180deg, var(--gold-bright), var(--gold-dark)); 
            color: #000;
            box-shadow: 0 4px 0 #8a6300, 0 0 20px rgba(255,215,0,0.3);
        }
        .btn-allin { background: linear-gradient(180deg, #00FF66, #00aa44); color: #000; }

        .bottom-tools {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        .tool-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .tool-btn:active { background: rgba(255,255,255,0.1); }

        /* ==========================================================================
           6. MODAL & LOG
           ========================================================================== */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-card {
            background: linear-gradient(180deg, #1e1e28, #12121a);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 24px;
            padding: 30px;
            width: 90%; max-width: 340px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            transform: scale(0.9); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-card { transform: scale(1); }

        .modal-title { font-family: var(--font-display); font-size: 32px; color: var(--gold-bright); margin-bottom: 10px; }
        .modal-title.lose { color: var(--neon-red); }
        .modal-text { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 25px; line-height: 1.5; }
        .modal-text b { color: var(--gold-bright); font-size: 20px; }

        .modal-card .play-btn { font-size: 14px; padding: 14px; margin-bottom: 10px; }
        .modal-card .tool-btn { width: 100%; border: none; background: rgba(255,255,255,0.05); padding: 12px; }

        .log-panel {
            display: none; position: absolute; bottom: 80px; left: 10px; right: 10px;
            background: rgba(0,0,0,0.9); border: 1px solid #333; border-radius: 12px;
            padding: 10px; max-height: 150px; overflow-y: auto; z-index: 90;
        }
        .log-panel.open { display: block; }
        .log-entry { font-size: 11px; color: var(--text-muted); padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

    </style>
</head>
<body>
    <div class="app-container">
        <!-- HEADER -->
        <header class="top-bar">
            <div class="brand-logo">VIP<span>POKER</span></div>
            <div class="balance-pill">
                <!-- Заглушка для иконки фишки, можно использовать emoji -->
                <span style="font-size: 18px;">🪙</span>
                <span class="balance-value" id="balanceDisplay">0</span>
            </div>
        </header>

        <!-- LOBBY -->
        <div class="lobby-screen" id="lobby">
            <div class="lobby-title">TEXAS HOLD'EM</div>
            <div class="lobby-subtitle">High Roller Tables</div>
            
            <div class="control-group">
                <label class="control-label">Ваша ставка</label>
                <div class="bet-input-wrapper">
                    <span>₽</span>
                    <input type="text" class="bet-input" id="betInput" value="500" inputmode="numeric">
                </div>
                <div class="chip-grid">
                    <button class="chip-btn" data-amount="100">100</button>
                    <button class="chip-btn" data-amount="500">500</button>
                    <button class="chip-btn" data-amount="1000">1K</button>
                    <button class="chip-btn" data-amount="5000">5K</button>
                    <button class="chip-btn" data-amount="10000">10K</button>
                    <button class="chip-btn" data-amount="MAX">MAX</button>
                </div>
            </div>

            <div class="control-group" style="padding-bottom: 15px;">
                <label class="control-label">Количество оппонентов</label>
                <div class="bot-selector" id="botSelect">
                    <button class="bot-btn" data-count="2">2</button>
                    <button class="bot-btn active" data-count="3">3</button>
                    <button class="bot-btn" data-count="4">4</button>
                    <button class="bot-btn" data-count="5">5</button>
                </div>
            </div>

            <button class="play-btn" id="startBtn">Играть сейчас</button>
        </div>

        <!-- GAME AREA -->
        <div class="game-screen" id="tableArea">
            <div class="table-wrapper">
                <div class="poker-table-surface" id="pokerTable">
                    
                    <!-- Center Pot -->
                    <div class="table-center-info">
                        <div class="pot-container">
                            🏆 <span id="potDisplay">0</span>
                        </div>
                        <div class="stage-badge" id="stageLabel">ПРЕФЛОП</div>
                    </div>

                    <!-- Community Cards -->
                    <div class="community-cards-wrap" id="communityCards">
                        <div class="card back"></div>
                        <div class="card back"></div>
                        <div class="card back"></div>
                        <div class="card back"></div>
                        <div class="card back"></div>
                    </div>

                    <!-- Dynamic Seats -->
                    <div class="seats-layer" id="seatsContainer"></div>

                    <!-- Hero Cards (Visually huge) -->
                    <div class="hero-hand-wrap" id="heroCards">
                        <div class="card back"></div>
                        <div class="card back"></div>
                    </div>

                </div>
            </div>

            <!-- ACTION PANEL -->
            <div class="action-footer" id="actionPanel">
                <div class="status-msg-bar" id="statusMsg">Ожидание хода...</div>
                
                <div class="slider-wrap" id="raiseControl">
                    <span style="color:var(--text-muted); font-size:12px; font-weight:800;">RAISE</span>
                    <input type="range" id="raiseRange" min="0" max="1000" value="0" step="10">
                    <span class="slider-val" id="raiseAmountDisplay">0</span>
                </div>

                <div class="btn-grid">
                    <button class="action-btn btn-fold" id="foldBtn" disabled>Fold</button>
                    <button class="action-btn btn-check" id="checkBtn" disabled>Check</button>
                    <button class="action-btn btn-call" id="callBtn" disabled>Call</button>
                </div>
                
                <div class="btn-grid-bot">
                    <button class="action-btn btn-raise" id="raiseBtn" disabled>Raise</button>
                    <button class="action-btn btn-allin" id="allinBtn" disabled>All-in</button>
                </div>

                <div class="bottom-tools">
                    <button class="tool-btn" id="logToggle">📜 Лог раздачи</button>
                    <button class="tool-btn" id="menuBtn">В лобби</button>
                </div>
                
                <div class="log-panel" id="logPanel"></div>
            </div>
        </div>
    </div>

    <!-- MODAL (WIN/LOSE) -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-title" id="modalTitle">ПОБЕДА!</div>
            <div class="modal-text" id="modalText">Вы сорвали банк:<br><b id="modalWinAmount">0 ₽</b></div>
            <button class="play-btn" id="modalBtnPrimary">Следующая раздача</button>
            <button class="tool-btn" id="modalBtnSecondary">Вернуться в лобби</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // API & Config (сохранено как в оригинале)
            const API_BASE = 'https://resellgame.bothost.tech';
            const TIMEOUT_MS = 15000;
            const STORAGE_KEY = 'rgame_poker_game_id';

            const tg = window.Telegram?.WebApp;
            if (tg) {
                tg.expand();
                tg.enableClosingConfirmation();
            }

            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('userId') || urlParams.get('user_id') || tg?.initDataUnsafe?.user?.id;

            // DOM Refs
            const balanceEl = document.getElementById('balanceDisplay');
            const lobby = document.getElementById('lobby');
            const tableArea = document.getElementById('tableArea');
            const seatsContainer = document.getElementById('seatsContainer');
            const communityCards = document.getElementById('communityCards');
            const heroCards = document.getElementById('heroCards');
            const potDisplay = document.getElementById('potDisplay');
            const stageLabel = document.getElementById('stageLabel');
            const statusMsg = document.getElementById('statusMsg');
            const logPanel = document.getElementById('logPanel');
            const logToggle = document.getElementById('logToggle');
            const foldBtn = document.getElementById('foldBtn');
            const checkBtn = document.getElementById('checkBtn');
            const callBtn = document.getElementById('callBtn');
            const raiseBtn = document.getElementById('raiseBtn');
            const allinBtn = document.getElementById('allinBtn');
            const raiseControl = document.getElementById('raiseControl');
            const raiseRange = document.getElementById('raiseRange');
            const raiseAmountDisplay = document.getElementById('raiseAmountDisplay');
            const startBtn = document.getElementById('startBtn');
            const betInput = document.getElementById('betInput');
            const menuBtn = document.getElementById('menuBtn');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalText = document.getElementById('modalText');
            const modalWinAmount = document.getElementById('modalWinAmount');
            const modalBtnPrimary = document.getElementById('modalBtnPrimary');
            const modalBtnSecondary = document.getElementById('modalBtnSecondary');

            // State
            const state = {
                gameId: null, status: null, stage: 'preflop', pot: 0,
                communityCards: [], playerCards: [], players: [], currentTurn: null,
                availableActions: {}, result: null, casinoBalance: 0, log: [],
                isActive: false, isFinished: false, isLoading: false,
            };
            let balance = 0;
            let botCount = 3;
            let bet = 500;

            // Service
            const ApiService = {
                async requestJSON(url, options = {}, timeoutMs = TIMEOUT_MS) {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
                    try {
                        const response = await fetch(url, { ...options, signal: controller.signal, headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } });
                        const text = await response.text();
                        let data = {}; try { data = text ? JSON.parse(text) : {}; } catch { throw new Error('Сервер вернул некорректный ответ'); }
                        if (!response.ok || data.success === false) throw new Error(data.error || data.detail || `Ошибка сервера: ${response.status}`);
                        return data;
                    } finally { clearTimeout(timeoutId); }
                },
                async loadProfile(tgId) { return this.requestJSON(`${API_BASE}/profile/${tgId}`, { cache: 'no-cache' }); },
                async startGame(payload) { return this.requestJSON(`${API_BASE}/poker/start`, { method: 'POST', body: JSON.stringify(payload) }); },
                async sendAction(payload) { return this.requestJSON(`${API_BASE}/poker/action`, { method: 'POST', body: JSON.stringify(payload) }); },
                async getState(gameId, tgId) { return this.requestJSON(`${API_BASE}/poker/state/${gameId}?userId=${tgId}`, { cache: 'no-cache' }); }
            };

            // Normalizer
            function normalizePokerState(raw) {
                if (!raw) raw = {};
                const players = Array.isArray(raw.players) ? raw.players : [];
                const normalizedPlayers = players.map(p => ({
                    id: p.id || p.playerId || p.tgId || null,
                    seat: p.seat || p.seat_number || 0,
                    name: p.name || 'Игрок',
                    avatar: p.avatar || '👤',
                    stack: Number(p.stack || p.chips || 0),
                    bet: Number(p.bet || p.currentBet || p.current_bet || 0),
                    isBot: !!p.isBot || !!p.is_bot,
                    isActive: !p.folded && !p.all_in,
                    folded: !!p.folded,
                    allIn: !!p.all_in || !!p.allIn,
                    cards: p.cards || p.hand || [],
                    statusText: p.status || ''
                }));
                return {
                    gameId: raw.gameId || raw.game_id || null,
                    status: raw.status || (raw.currentStage === 'finished' ? 'finished' : 'active'),
                    stage: raw.stage || raw.currentStage || 'preflop',
                    pot: Number(raw.pot || 0),
                    communityCards: Array.isArray(raw.communityCards) ? raw.communityCards : (Array.isArray(raw.community_cards) ? raw.community_cards : []),
                    playerCards: Array.isArray(raw.playerCards) ? raw.playerCards : (Array.isArray(raw.player_cards) ? raw.player_cards : []),
                    players: normalizedPlayers,
                    currentTurn: raw.currentTurn || raw.current_turn || null,
                    availableActions: raw.availableActions || raw.available_actions || {},
                    result: raw.result || null,
                    casinoBalance: raw.casino_balance ?? raw.casinoBalance ?? raw.balance ?? undefined,
                    log: Array.isArray(raw.log) ? raw.log : []
                };
            }

            // State Manager
            const StateManager = {
                update(rawState) {
                    Object.assign(state, normalizePokerState(rawState));
                    state.isActive = (state.status !== 'finished');
                    state.isFinished = (state.status === 'finished');
                    return state;
                },
                getHero() { return state.players.find(p => !p.isBot && String(p.id) === String(userId)); },
                isMyTurn() {
                    const hero = this.getHero();
                    return hero ? state.currentTurn === hero.seat : false;
                }
            };

            // Renderer
            const Renderer = {
                render() {
                    this.renderPlayers();
                    this.renderCommunityCards();
                    this.renderHeroCards();
                    this.renderPot();
                    this.renderStage();
                    this.renderActions();
                    this.renderStatus();
                    this.renderLog();
                    this.renderBalance();
                },
                
                formatCard(card) {
                    const isRed = (card.suit === '♥' || card.suit === '♦');
                    const suitSymbol = card.suit === '♥' ? '♥' : card.suit === '♦' ? '♦' : card.suit === '♣' ? '♣' : '♠';
                    return { isRed, text: `${card.rank}\n${suitSymbol}` };
                },

                renderPlayers() {
                    seatsContainer.innerHTML = '';
                    const sorted = [...state.players].sort((a, b) => a.seat - b.seat);
                    const hero = sorted.find(p => !p.isBot);
                    const bots = sorted.filter(p => p.isBot);
                    const positionMap = ['pos-hero', 'pos-1', 'pos-2', 'pos-3', 'pos-4', 'pos-5'];
                    const allPlayers = [hero, ...bots].filter(p => p);

                    allPlayers.forEach((p, index) => {
                        // Hero will always be at bottom but hide their seat graphic since big cards are used
                        if (index === 0 && p === hero) return; 

                        const div = document.createElement('div');
                        div.className = `player-seat ${positionMap[index] || 'pos-2'}`;
                        if (p.seat === state.currentTurn && !p.folded) div.classList.add('active-turn');
                        if (p.folded) div.classList.add('folded');

                        let avatarIcon = p.avatar || '👤';
                        if(typeof avatarIcon === 'string' && avatarIcon.startsWith('<svg')) { /* SVG parsing handled via external logic */ }

                        let statusBadge = '';
                        if (p.statusText) {
                            let cls = '';
                            if (p.statusText === 'fold') cls = 'fold';
                            else if (p.statusText === 'call') cls = 'call';
                            else if (p.statusText === 'raise') cls = 'raise';
                            else if (p.statusText === 'allin') cls = 'allin';
                            statusBadge = `<div class="p-status show ${cls}">${p.statusText}</div>`;
                        }

                        div.innerHTML = `
                            <div class="avatar-wrap"><span>${avatarIcon}</span>${statusBadge}</div>
                            <div class="player-info">
                                <div class="p-name">${p.name}</div>
                                <div class="p-stack">${p.stack}</div>
                            </div>
                        `;
                        seatsContainer.appendChild(div);
                    });
                },

                renderCommunityCards() {
                    const cards = state.communityCards || [];
                    const containers = communityCards.querySelectorAll('.card');
                    containers.forEach((el, i) => {
                        if (i < cards.length) {
                            const cInfo = this.formatCard(cards[i]);
                            el.className = `card show ${cInfo.isRed ? 'red' : 'black'}`;
                            el.setAttribute('data-val', cInfo.text.replace('\n',''));
                            el.innerHTML = cInfo.text.split('\n')[1]; // Big suit in middle
                        } else {
                            el.className = 'card back';
                            el.innerHTML = '';
                            el.removeAttribute('data-val');
                        }
                    });
                },

                renderHeroCards() {
                    const cards = state.playerCards || [];
                    const containers = heroCards.querySelectorAll('.card');
                    containers.forEach((el, i) => {
                        if (i < cards.length) {
                            const cInfo = this.formatCard(cards[i]);
                            el.className = `card show ${cInfo.isRed ? 'red' : 'black'}`;
                            el.setAttribute('data-val', cInfo.text.replace('\n',''));
                            el.innerHTML = cInfo.text.split('\n')[1];
                        } else {
                            el.className = 'card back';
                            el.innerHTML = '';
                            el.removeAttribute('data-val');
                        }
                    });
                },

                renderPot() { potDisplay.textContent = state.pot || 0; },
                
                renderStage() {
                    const sm = { preflop: 'ПРЕФЛОП', flop: 'ФЛОП', turn: 'ТЁРН', river: 'РИВЕР', showdown: 'ШОУДАУН', finished: 'ФИНАЛ' };
                    stageLabel.textContent = sm[state.stage] || state.stage.toUpperCase();
                },

                renderActions() {
                    const acts = state.availableActions || {};
                    const isTurn = StateManager.isMyTurn() && !state.isFinished;
                    const hero = StateManager.getHero();

                    foldBtn.disabled = !(isTurn && acts.fold);
                    checkBtn.disabled = !(isTurn && acts.check);
                    callBtn.disabled = !(isTurn && acts.call);
                    raiseBtn.disabled = !(isTurn && acts.raise);
                    allinBtn.disabled = !(isTurn && acts.allIn);

                    const canRaise = isTurn && acts.raise;
                    raiseControl.classList.toggle('active', canRaise);
                    
                    if (canRaise && hero) {
                        const min = Math.max(10, state.pot * 0.5);
                        const max = Math.min(hero.stack || 1000, 100000);
                        raiseRange.min = min; raiseRange.max = max;
                        const cur = parseInt(raiseRange.value) || min;
                        raiseRange.value = Math.min(Math.max(cur, min), max);
                        raiseAmountDisplay.textContent = raiseRange.value;
                    }
                },

                renderStatus() {
                    if (state.isFinished) {
                        if (state.result && state.result.winnerId) {
                            const win = String(state.result.winnerId) === String(userId);
                            if (win) {
                                statusMsg.textContent = `🎉 ПОБЕДА +${state.result.winAmount || state.pot} ₽`;
                                statusMsg.className = 'status-msg-bar win';
                                ModalController.show('КРУПНЫЙ ВЫИГРЫШ!', `${state.result.winAmount || state.pot} ₽`, true);
                            } else {
                                statusMsg.textContent = `Победил ${state.result.winnerName || 'бот'}`;
                                statusMsg.className = 'status-msg-bar lose';
                                ModalController.show('ПРОИГРЫШ', 'В этот раз повезло не вам.', false);
                            }
                        } else {
                            statusMsg.textContent = 'Раздача завершена';
                            statusMsg.className = 'status-msg-bar';
                        }
                    } else {
                        const sm = { preflop: 'Префлоп', flop: 'Флоп', turn: 'Тёрн', river: 'Ривер', showdown: 'Шоудаун' };
                        if (StateManager.isMyTurn()) {
                            statusMsg.textContent = `ВАШ ХОД! (${sm[state.stage] || state.stage})`;
                            statusMsg.className = 'status-msg-bar info';
                        } else {
                            statusMsg.textContent = `Ожидание оппонентов...`;
                            statusMsg.className = 'status-msg-bar';
                        }
                    }
                },

                renderLog() {
                    logPanel.innerHTML = (state.log && state.log.length) ? state.log.map(e => `<div class="log-entry">${e}</div>`).join('') : '';
                },

                renderBalance() {
                    if (state.casinoBalance !== undefined) {
                        balance = state.casinoBalance;
                        balanceEl.textContent = balance.toLocaleString('ru-RU');
                    }
                }
            };

            // Controllers
            const ActionController = {
                async sendAction(action, amount = 0) {
                    if (!state.gameId || state.isLoading) return;
                    state.isLoading = true;
                    try {
                        const res = await ApiService.sendAction({ gameId: state.gameId, userId, action, amount });
                        if (res.success) {
                            if (res.state) { StateManager.update(res.state); Renderer.render(); }
                        } else throw new Error(res.error || 'Ошибка');
                    } catch (err) {
                        statusMsg.textContent = `❌ ${err.message}`; statusMsg.className = 'status-msg-bar lose';
                    } finally {
                        state.isLoading = false; Renderer.renderActions();
                    }
                }
            };

            const ModalController = {
                show(title, text, isWin = true) {
                    modalTitle.textContent = title;
                    modalTitle.className = 'modal-title' + (isWin ? '' : ' lose');
                    modalText.innerHTML = text;
                    modalWinAmount.style.display = isWin ? 'inline' : 'none'; // text handles html
                    modalOverlay.classList.add('active');
                },
                hide() { modalOverlay.classList.remove('active'); }
            };

            // Flow
            async function startPokerGame() {
                if (state.isLoading) return;
                const amt = parseInt(betInput.value) || 500;
                if (amt < 10) { alert('Минимальная ставка 10'); return; }
                if (amt > balance) { alert('Недостаточно средств'); return; }

                state.isLoading = true; startBtn.disabled = true; startBtn.textContent = 'Раздача...';
                try {
                    const res = await ApiService.startGame({ userId, bet: amt, botCount });
                    if (res.success) {
                        state.gameId = res.gameId || res.state?.gameId;
                        localStorage.setItem(STORAGE_KEY, state.gameId);
                        lobby.style.display = 'none'; tableArea.classList.add('active');
                        if (res.state) { StateManager.update(res.state); Renderer.render(); }
                    } else throw new Error(res.error || 'Ошибка запуска');
                } catch (err) {
                    alert(err.message); startBtn.disabled = false; startBtn.textContent = 'Играть сейчас';
                } finally { state.isLoading = false; }
            }

            async function restoreGame() {
                const sid = localStorage.getItem(STORAGE_KEY);
                if (!sid || !userId) return false;
                try {
                    const res = await ApiService.getState(sid, userId);
                    if (res.success && res.state && normalizePokerState(res.state).status !== 'finished') {
                        state.gameId = sid;
                        lobby.style.display = 'none'; tableArea.classList.add('active');
                        StateManager.update(res.state); Renderer.render(); return true;
                    }
                } catch(e) {}
                localStorage.removeItem(STORAGE_KEY); return false;
            }

            function clearGame() {
                localStorage.removeItem(STORAGE_KEY);
                state.gameId = null; state.isActive = false; state.isFinished = true;
                lobby.style.display = 'flex'; tableArea.classList.remove('active');
                StateManager.update({}); Renderer.render(); startBtn.disabled = false; startBtn.textContent = 'Играть сейчас';
            }

            // Events
            startBtn.addEventListener('click', startPokerGame);
            document.querySelectorAll('.chip-btn').forEach(b => b.addEventListener('click', function() {
                betInput.value = this.dataset.amount === 'MAX' ? balance : this.dataset.amount;
            }));
            document.querySelectorAll('#botSelect .bot-btn').forEach(b => b.addEventListener('click', function() {
                document.querySelectorAll('#botSelect .bot-btn').forEach(btn => btn.classList.remove('active'));
                this.classList.add('active'); botCount = parseInt(this.dataset.count);
            }));

            foldBtn.addEventListener('click', () => ActionController.sendAction('fold'));
            checkBtn.addEventListener('click', () => ActionController.sendAction('check'));
            callBtn.addEventListener('click', () => ActionController.sendAction('call'));
            raiseBtn.addEventListener('click', () => ActionController.sendAction('raise', parseInt(raiseRange.value) || 0));
            allinBtn.addEventListener('click', () => ActionController.sendAction('all_in', parseInt(raiseRange.value) || 0));
            raiseRange.addEventListener('input', function() { raiseAmountDisplay.textContent = this.value; });

            logToggle.addEventListener('click', function() { logPanel.classList.toggle('open'); });
            menuBtn.addEventListener('click', () => window.location.href = 'casino.html?userId=' + encodeURIComponent(userId || ''));
            modalBtnPrimary.addEventListener('click', () => { ModalController.hide(); clearGame(); ApiService.loadProfile(userId).then(d=>{if(d.casino_balance) Renderer.renderBalance(d.casino_balance)}); });
            modalBtnSecondary.addEventListener('click', () => { ModalController.hide(); window.location.href = 'casino.html?userId=' + encodeURIComponent(userId || ''); });

            // Init
            async function init() {
                try {
                    const data = await ApiService.loadProfile(userId);
                    if (data.casino_balance !== undefined) { balance = Number(data.casino_balance); balanceEl.textContent = balance.toLocaleString('ru-RU'); }
                } catch(e) {}
                const restored = await restoreGame();
                if (!restored) {
                    lobby.style.display = 'flex'; tableArea.classList.remove('active');
                }
            }
            init();
        })();
    </script>
</body>
</html>
