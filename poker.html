<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>♠️ R-GAME POKER · Texas Hold'em</title>
    <script src="https://telegram.org/js/telegram-web-app.js">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Nunito:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
    <style>
        /* ==============================================================
           ROOT – НЕОНОВО-СИНИЙ СТИЛЬ (как в Blackjack)
           ============================================================== */
        :root {
            --bg-primary: #080d18;
            --bg-table: #0c1628;
            --felt-dark: #0a1a2a;
            --felt-light: #14324a;
            --neon-blue: #1882ff;
            --neon-cyan: #00d4ff;
            --neon-purple: #7b61ff;
            --gold: #ffd700;
            --gold-dim: rgba(255, 215, 0, 0.12);
            --gold-glow: rgba(255, 215, 0, 0.25);
            --green: #1bd15d;
            --red: #f03043;
            --orange: #ff9800;
            --text-primary: #e8f0fe;
            --text-secondary: #8ca3c9;
            --text-muted: #3d5670;
            --panel-bg: rgba(12, 22, 40, 0.92);
            --border-glass: rgba(24, 130, 255, 0.12);
            --shadow-heavy: 0 24px 80px rgba(0, 0, 0, 0.9);
            --shadow-card: 0 8px 30px rgba(0, 0, 0, 0.6);
            --radius-xl: 28px;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --card-width: 62px;
            --card-height: 86px;
            --seat-size: 88px;
            --font-display: 'Playfair Display', 'Montserrat', serif;
            --font-ui: 'Nunito', 'Montserrat', sans-serif;
            --ease-premium: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-bounce: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-ui);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(24, 130, 255, 0.06), transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(0, 212, 255, 0.04), transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(123, 97, 255, 0.03), transparent 60%);
            overflow-x: hidden;
        }

        /* ===== ОБЁРТКА ===== */
        .game-wrapper {
            max-width: 900px;
            width: 100%;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-glass);
            box-shadow: var(--shadow-heavy), inset 0 1px 0 rgba(255, 255, 255, 0.03);
            padding: 18px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .game-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-conic-gradient(from 0deg, transparent 0deg, rgba(24, 130, 255, 0.015) 5deg, transparent 10deg);
            animation: rotateBg 40s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes rotateBg {
            to {
                transform: rotate(360deg);
            }
        }

        .game-wrapper>* {
            position: relative;
            z-index: 1;
        }

        /* ==============================================================
           HEADER
           ============================================================== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(24, 130, 255, 0.08);
        }

        .brand {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(135deg, #ffffff, var(--neon-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 0.5px;
            text-shadow: 0 0 40px rgba(0, 212, 255, 0.15);
        }
        .brand span {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
        }

        .balance-box {
            background: rgba(8, 13, 24, 0.7);
            border-radius: 40px;
            padding: 4px 18px 4px 14px;
            border: 1.5px solid rgba(24, 130, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
            box-shadow: inset 0 0 30px rgba(24, 130, 255, 0.04), 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: border-color 0.3s;
        }
        .balance-box:hover {
            border-color: rgba(24, 130, 255, 0.4);
        }
        .balance-box .label {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            font-family: var(--font-ui);
        }
        .balance-box .value {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 900;
            color: var(--green);
            text-shadow: 0 0 30px rgba(27, 209, 93, 0.15);
            transition: color 0.3s, transform 0.3s;
            min-width: 60px;
            text-align: right;
        }
        .balance-box .value.win {
            color: var(--gold);
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
            animation: balancePop 0.6s var(--ease-bounce);
        }
        .balance-box .value.lose {
            color: var(--red);
            text-shadow: 0 0 40px rgba(240, 48, 67, 0.25);
            animation: balancePop 0.6s var(--ease-bounce);
        }
        @keyframes balancePop {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
            }
        }

        /* ==============================================================
           LOBBY
           ============================================================== */
        .lobby {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            padding: 28px 12px 18px;
            background: rgba(8, 13, 24, 0.4);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(24, 130, 255, 0.06);
        }
        .lobby-title {
            font-family: var(--font-display);
            font-size: 38px;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(135deg, var(--gold), var(--neon-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.08);
            letter-spacing: 1px;
        }
        .lobby-sub {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 16px;
            letter-spacing: 0.3px;
        }
        .lobby-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 500px;
        }
        .lobby-row label {
            font-size: 12px;
            font-weight: 800;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: var(--font-ui);
        }

        .lobby-bet-input {
            background: rgba(8, 13, 24, 0.6);
            border: 2px solid rgba(24, 130, 255, 0.15);
            border-radius: var(--radius-md);
            padding: 10px 16px;
            color: #fff;
            font-size: 22px;
            font-weight: 800;
            width: 140px;
            text-align: center;
            font-family: var(--font-ui);
            outline: none;
            transition: border 0.25s, box-shadow 0.25s;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        .lobby-bet-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 30px rgba(24, 130, 255, 0.08), inset 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        .lobby-bet-input::placeholder {
            color: rgba(255, 255, 255, 0.1);
        }

        .quick-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .quick-chips button {
            background: rgba(24, 130, 255, 0.06);
            border: 1.5px solid rgba(24, 130, 255, 0.1);
            border-radius: var(--radius-sm);
            padding: 6px 16px;
            color: var(--text-secondary);
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s var(--ease-bounce);
            font-family: var(--font-ui);
            letter-spacing: 0.3px;
        }
        .quick-chips button:hover {
            background: rgba(24, 130, 255, 0.12);
            color: #fff;
            border-color: rgba(24, 130, 255, 0.3);
            transform: translateY(-2px);
        }
        .quick-chips button:active {
            transform: scale(0.92);
        }

        .bot-select {
            display: flex;
            gap: 6px;
        }
        .bot-select button {
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(24, 130, 255, 0.08);
            border-radius: var(--radius-sm);
            padding: 7px 20px;
            color: var(--text-secondary);
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s var(--ease-bounce);
            font-family: var(--font-ui);
            font-size: 15px;
            letter-spacing: 0.5px;
        }
        .bot-select button:hover {
            border-color: rgba(24, 130, 255, 0.2);
            color: #fff;
        }
        .bot-select button.active {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border-color: var(--neon-blue);
            color: #fff;
            box-shadow: 0 0 30px rgba(24, 130, 255, 0.2);
        }
        .bot-select button:active {
            transform: scale(0.92);
        }

        .btn-start {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: none;
            border-radius: var(--radius-md);
            padding: 16px 52px;
            font-family: var(--font-ui);
            font-weight: 900;
            font-size: 18px;
            text-transform: uppercase;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 0 #0f5bb8, 0 8px 30px rgba(24, 130, 255, 0.25);
            transition: all 0.1s ease;
            letter-spacing: 1.5px;
            width: 100%;
            max-width: 280px;
            position: relative;
            overflow: hidden;
        }
        .btn-start::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 45%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), transparent);
            pointer-events: none;
            border-radius: var(--radius-md) var(--radius-md) 0 0;
        }
        .btn-start:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #0f5bb8;
        }
        .btn-start:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: 0 4px 0 #0f5bb8;
        }

        /* ==============================================================
           TABLE – ПОКЕРНЫЙ СТОЛ В НЕОНОВОМ СТИЛЕ
           ============================================================== */
        .table-area {
            display: none;
            flex-direction: column;
            gap: 14px;
        }
        .table-area.active {
            display: flex;
        }

        .felt-container {
            position: relative;
            width: 100%;
            max-width: 820px;
            aspect-ratio: 1.6 / 1;
            border-radius: 52% 52% 48% 48% / 56% 56% 40% 40%;
            background: radial-gradient(ellipse at center, var(--felt-light) 0%, var(--felt-dark) 65%, #061018 100%);
            border: 12px solid #1a1a2e;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.7), 0 16px 50px rgba(0, 0, 0, 0.7), 0 0 80px rgba(24, 130, 255, 0.04);
            margin: 0 auto;
            overflow: visible;
        }
        .felt-container::before {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: inherit;
            border: 1px solid rgba(24, 130, 255, 0.06);
            pointer-events: none;
        }
        .felt-container::after {
            content: '';
            position: absolute;
            inset: 18px;
            border-radius: inherit;
            border: 1px dashed rgba(24, 130, 255, 0.03);
            pointer-events: none;
        }

        .felt-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--font-display);
            font-weight: 900;
            font-style: italic;
            font-size: clamp(20px, 3.8vw, 38px);
            color: rgba(24, 130, 255, 0.04);
            letter-spacing: 8px;
            text-transform: uppercase;
            pointer-events: none;
            white-space: nowrap;
            text-shadow: 0 0 60px rgba(24, 130, 255, 0.02);
        }

        /* ===== SEATS ===== */
        .seat {
            position: absolute;
            width: var(--seat-size);
            height: calc(var(--seat-size) * 1.3);
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: rgba(8, 13, 24, 0.55);
            border-radius: var(--radius-md);
            padding: 6px 4px 8px;
            border: 2px solid transparent;
            transition: border 0.3s, box-shadow 0.3s, transform 0.25s var(--ease-bounce), opacity 0.3s;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            pointer-events: none;
            z-index: 2;
            min-width: 68px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .seat.active-turn {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.12), inset 0 0 30px rgba(0, 212, 255, 0.04);
            transform: translate(-50%, -50%) scale(1.06);
        }
        .seat.folded {
            opacity: 0.3;
            filter: grayscale(0.8);
        }
        .seat .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(24, 130, 255, 0.1);
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
        }
        .seat .avatar svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .seat .name {
            font-size: 10px;
            font-weight: 800;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 68px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
            font-family: var(--font-ui);
            letter-spacing: 0.3px;
        }
        .seat .stack {
            font-size: 9px;
            color: var(--text-secondary);
            font-weight: 700;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
            font-family: var(--font-ui);
        }
        .seat .status-badge {
            font-size: 7px;
            font-weight: 900;
            text-transform: uppercase;
            padding: 1px 8px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
            font-family: var(--font-ui);
            letter-spacing: 0.5px;
        }
        .seat .status-badge.fold {
            background: rgba(240, 48, 67, 0.2);
            color: var(--red);
        }
        .seat .status-badge.call {
            background: rgba(24, 130, 255, 0.2);
            color: var(--neon-blue);
        }
        .seat .status-badge.raise {
            background: rgba(255, 215, 0, 0.2);
            color: var(--gold);
        }
        .seat .status-badge.allin {
            background: rgba(27, 209, 93, 0.2);
            color: var(--green);
        }

        .seat .mini-cards {
            display: flex;
            gap: 2px;
            margin-top: 2px;
        }
        .mini-card {
            width: 14px;
            height: 20px;
            background: #fff;
            border-radius: 2px;
            font-size: 6px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
            font-family: var(--font-ui);
        }
        .mini-card.red {
            color: var(--red);
        }
        .mini-card.black {
            color: #111;
        }
        .mini-card.back {
            background: repeating-linear-gradient(45deg, #0a1a2a, #0a1a2a 3px, #0d1b2a 3px, #0d1b2a 6px);
            color: transparent;
            border-color: rgba(24, 130, 255, 0.1);
        }

        /* seat positions */
        .seat-bottom-center {
            bottom: 2%;
            left: 50%;
            transform: translateX(-50%);
            width: 115px;
            background: rgba(8, 13, 24, 0.7);
            border-color: rgba(24, 130, 255, 0.1);
        }
        .seat-top-center {
            top: 2%;
            left: 50%;
            transform: translateX(-50%);
        }
        .seat-top-left {
            top: 4%;
            left: 13%;
        }
        .seat-top-right {
            top: 4%;
            right: 13%;
        }
        .seat-mid-left {
            top: 34%;
            left: 0%;
        }
        .seat-mid-right {
            top: 34%;
            right: 0%;
        }
        .seat-bottom-left {
            bottom: 6%;
            left: 8%;
        }
        .seat-bottom-right {
            bottom: 6%;
            right: 8%;
        }

        /* ===== COMMUNITY & POT ===== */
        .community-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 1;
            pointer-events: none;
        }
        .community-cards {
            display: flex;
            gap: 10px;
        }

        .comm-card {
            width: var(--card-width);
            height: var(--card-height);
            border-radius: var(--radius-sm);
            background: #fff;
            box-shadow: var(--shadow-card), 0 0 20px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: var(--font-ui);
            position: relative;
            animation: dealCard 0.4s var(--ease-bounce);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .comm-card.red {
            color: var(--red);
        }
        .comm-card.black {
            color: #111;
        }
        .comm-card .rank {
            font-size: 16px;
            font-weight: 900;
            line-height: 1;
            font-family: var(--font-ui);
        }
        .comm-card .suit {
            font-size: 24px;
            line-height: 1;
        }
        .comm-card .corner {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 9px;
            font-weight: 800;
            line-height: 1;
            font-family: var(--font-ui);
        }
        .comm-card .corner-top {
            top: 4px;
            left: 5px;
        }
        .comm-card .corner-bottom {
            bottom: 4px;
            right: 5px;
            transform: rotate(180deg);
        }
        .comm-card .corner .suit-small {
            font-size: 9px;
        }
        .comm-card.back {
            background: repeating-linear-gradient(45deg, #0a1a2a, #0a1a2a 6px, #0d1b2a 6px, #0d1b2a 12px);
            color: transparent;
            border-color: rgba(24, 130, 255, 0.08);
            box-shadow: var(--shadow-card);
        }

        @keyframes dealCard {
            0% {
                opacity: 0;
                transform: translateY(-30px) rotateY(90deg) scale(0.7);
            }
            60% {
                opacity: 1;
                transform: translateY(4px) rotateY(-2deg) scale(1.04);
            }
            100% {
                opacity: 1;
                transform: translateY(0) rotateY(0) scale(1);
            }
        }

        .pot-display {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.1);
            padding: 3px 20px;
            background: rgba(8, 13, 24, 0.5);
            border-radius: 30px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 215, 0, 0.06);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
        }
        .pot-display span {
            font-size: 20px;
        }

        .stage-label {
            font-size: 10px;
            font-weight: 800;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2.5px;
            background: rgba(8, 13, 24, 0.4);
            padding: 3px 18px;
            border-radius: 20px;
            border: 1px solid rgba(24, 130, 255, 0.06);
            font-family: var(--font-ui);
        }

        /* ===== MY HAND ===== */
        .my-hand-area {
            position: absolute;
            bottom: 6%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 14px;
            z-index: 3;
            pointer-events: none;
        }
        .my-card {
            width: 72px;
            height: 98px;
            background: #fff;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-card), 0 0 30px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: var(--font-ui);
            position: relative;
            animation: dealCard 0.4s var(--ease-bounce);
            border: 2px solid rgba(255, 255, 255, 0.04);
            transition: transform 0.2s;
        }
        .my-card:hover {
            transform: translateY(-4px);
        }
        .my-card.red {
            color: var(--red);
        }
        .my-card.black {
            color: #111;
        }
        .my-card .rank {
            font-size: 22px;
            font-weight: 900;
            line-height: 1;

            border-color: rgba(24, 130, 255, 0.1);

        .modal-btn::before {

<body>
    <div class="game-wrapper">
        <!-- HEADER -->
        <div class="header">
            <div class="brand">R-<span>POKER</span></div>
            <div class="balance-box">
                <span class="label">Баланс</span>
                <span class="value" id="balanceDisplay">0 ₽</span>
            </div>
        </div>

        <!-- LOBBY -->
        <div class="lobby" id="lobby">
            <div class="lobby-title">♠️ Техасский Холдем</div>
            <div class="lobby-sub">Выберите ставку и соперников</div>
            <div class="lobby-row">
                <label>Ставка
                    <input type="text" class="lobby-bet-input" id="betInput" value="100" inputmode="numeric">
                </label>
                <div class="quick-chips">
                    <button data-amount="100">100</button>
                    <button data-amount="500">500</button>
                    <button data-amount="1000">1К</button>
                    <button data-amount="5000">5К</button>
                </div>
            </div>
            <div class="lobby-row">
                <label>Боты</label>
                <div class="bot-select" id="botSelect">
                    <button data-count="2">2</button>
                    <button data-count="3" class="active">3</button>
                    <button data-count="4">4</button>
                    <button data-count="5">5</button>
                </div>
            </div>
            <button class="btn-start" id="startBtn">♠ Начать игру</button>
        </div>

        <!-- TABLE -->
        <div class="table-area" id="tableArea">
            <div class="felt-container" id="feltContainer">
                <div class="felt-logo">R-GAME POKER</div>

                <!-- Seats -->
                <div id="seatsContainer"></div>

                <!-- Community & Pot -->
                <div class="community-area">
                    <div class="community-cards" id="communityCards">
                        <div class="comm-card back"></div>
                        <div class="comm-card back"></div>
                        <div class="comm-card back"></div>
                        <div class="comm-card back"></div>
                        <div class="comm-card back"></div>
                    </div>
                    <div class="pot-display">🏆 <span id="potDisplay">0</span> ₽</div>
                    <div class="stage-label" id="stageLabel">ПРЕФЛОП</div>
                </div>

                <!-- My hand -->
                <div class="my-hand-area" id="myHandArea">
                    <div class="my-card back"></div>
                    <div class="my-card back"></div>
                </div>
            </div>

            <!-- Actions -->
            <div class="actions-panel" id="actionsPanel">
                <button class="action-btn fold" id="foldBtn" disabled>✕ Fold</button>
                <button class="action-btn check" id="checkBtn" disabled>✓ Check</button>
                <button class="action-btn call" id="callBtn" disabled>📞 Call</button>
                <button class="action-btn raise" id="raiseBtn" disabled>⬆ Raise</button>
                <button class="action-btn allin" id="allinBtn" disabled>⚡ All-in</button>
            </div>
            <div class="raise-panel" id="raisePanel">
                <input type="range" id="raiseRange" min="0" max="1000" value="0" step="10">
                <span id="raiseAmountDisplay">0</span>
            </div>
            <div class="status-msg" id="statusMsg">Ожидание хода</div>
            <button class="log-toggle" id="logToggle">📜 История раздачи</button>
            <div class="log-panel" id="logPanel"></div>

            <button class="btn-menu" id="menuBtn">🏠 В меню</button>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">🎉 Победа!</div>
            <div class="modal-text" id="modalText">Вы выиграли <span class="highlight">5000 ₽</span></div>
            <button class="modal-btn primary" id="modalBtn">Продолжить</button>
        </div>
    </div>

    <script>
        // =============================================================
        //  ПОЛНОСТЬЮ СОХРАНЁННАЯ ЛОГИКА ИГРЫ (БЕЗ ИЗМЕНЕНИЙ)
        //  – все функции, API, рендеринг, действия – те же, что в оригинале
        //  – обновлён только интерфейс (CSS + HTML)
        // =============================================================
        (function() {

            function getBotById(id) { return BOTS.find(b => b.id === id) || BOTS[0]; }

            // ============================================================
            //  API HELPERS
            // ============================================================
            async function apiRequest(endpoint, options = {}) {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 15000);
                try {
                    const res = await fetch(`${API_BASE}${endpoint}`, {
                        ...options,
                        signal: controller.signal,
                        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
                    });
                    clearTimeout(timeout);
                    if (!res.ok) {
                        let errMsg = `HTTP ${res.status}`;
                        try { const data = await res.json();
                            errMsg = data.error || errMsg; } catch (_) {}
                        throw new Error(errMsg);
                    }
                    return await res.json();
                } catch (e) {
                    clearTimeout(timeout);
                    if (e.name === 'AbortError') throw new Error('Запрос превысил время ожидания');
                    throw e;
                }
            }

            // ============================================================
            //  BALANCE
            // ============================================================
            async function loadBalance() {
                if (!userId) return;
                try {
                    const data = await apiRequest(`/profile/${userId}`, { cache: 'no-cache' });
                    if (data.casino_balance !== undefined) {
                        casinoBalance = Number(data.casino_balance);
                        updateBalanceUI(casinoBalance);
                    }
                } catch (e) {
                    console.warn('Ошибка загрузки баланса', e);
                }
            }

            function updateBalanceUI(newBalance, animate = false) {
                casinoBalance = Number(newBalance);
                const el = balanceDisplay;
                el.classList.remove('win', 'lose');
                if (animate) {
                    if (newBalance > casinoBalance) el.classList.add('win');
                    else if (newBalance < casinoBalance) el.classList.add('lose');
                    setTimeout(() => el.classList.remove('win', 'lose'), 1500);
                }
                el.innerText = casinoBalance.toLocaleString() + ' ₽';
                localStorage.setItem('casinoBalance', String(casinoBalance));
            }

            // ============================================================
            //  RENDER STATE
            // ============================================================
            function renderState(state) {
                if (!state) return;
                currentState = state;
                gameActive = (state.status !== 'finished');

                potDisplay.innerText = state.pot || 0;

                const stageMap = { preflop: 'ПРЕФЛОП', flop: 'ФЛОП', turn: 'ТЁРН', river: 'РИВЕР', showdown: 'ШОУДАУН',
                    finished: 'ЗАВЕРШЕНА' };
                stageLabel.innerText = stageMap[state.stage] || state.stage.toUpperCase();

                const comm = state.communityCards || [];
                const commEls = communityCards.querySelectorAll('.comm-card');
                commEls.forEach((el, i) => {
                    if (i < comm.length) {
                        const card = comm[i];
                        const isRed = (card.suit === '♥' || card.suit === '♦');
                        el.className = 'comm-card';
                        el.classList.add(isRed ? 'red' : 'black');
                        el.innerHTML = `
                                <span class="corner corner-top"><span>${card.rank}</span><span class="suit-small">${card.suit}</span></span>
                                <span class="rank">${card.rank}</span>
                                <span class="suit">${card.suit}</span>
                                <span class="corner corner-bottom"><span>${card.rank}</span><span class="suit-small">${card.suit}</span></span>
                            `;
                    } else {
                        el.className = 'comm-card back';
                        el.innerHTML = '';
                    }
                });

                const players = state.players || [];
                const seats = seatsContainer.querySelectorAll('.seat');
                seats.forEach((seat, idx) => {
                    const p = players[idx];
                    if (!p) { seat.style.display = 'none'; return; }
                    seat.style.display = 'flex';
                    const bot = p.botId ? getBotById(p.botId) : null;
                    const avatarContent = (p.avatar && p.avatar.startsWith('<svg')) ? p.avatar : (bot ? bot.svg :
                    '👤');
                    const name = p.name || 'Игрок';
                    const stack = p.stack || 0;
                    const statusText = p.status || '';
                    const isActive = p.isActive !== false;
                    const isFolded = p.folded === true;
                    const isMine = (p.id === userId || p.id === 'me');

                    seat.className = 'seat';
                    if (isActive && !isFolded && !isMine) seat.classList.add('active-turn');
                    if (isFolded) seat.classList.add('folded');
                    if (isMine) seat.style.borderColor = 'rgba(24,130,255,0.3)';

                    let statusClass = '';
                    if (statusText === 'fold') statusClass = 'fold';
                    else if (statusText === 'call') statusClass = 'call';
                    else if (statusText === 'raise') statusClass = 'raise';
                    else if (statusText === 'allin') statusClass = 'allin';

                    const miniCardsHTML = (p.cards && p.cards.length) ?
                        p.cards.map(c =>
                            `<span class="mini-card ${c.suit === '♥' || c.suit === '♦' ? 'red' : 'black'}">${c.rank}${c.suit}</span>`
                        ).join('') :
                        (isMine ? '' : '<span class="mini-card back"></span><span class="mini-card back"></span>');

                    seat.innerHTML = `
                            <div class="avatar">${avatarContent}</div>
                            <div class="name">${name}</div>
                            <div class="stack">🪙${stack}</div>
                            ${statusText ? `<div class="status-badge ${statusClass}">${statusText}</div>` : ''}
                            <div class="mini-cards">${miniCardsHTML}</div>
                        `;
                });

                const myCards = state.playerCards || [];
                const handEls = myHandArea.querySelectorAll('.my-card');
                handEls.forEach((el, i) => {
                    if (i < myCards.length) {
                        const card = myCards[i];
                        const isRed = (card.suit === '♥' || card.suit === '♦');
                        el.className = 'my-card';
                        el.classList.add(isRed ? 'red' : 'black');
                        el.innerHTML = `
                                <span class="corner corner-top"><span>${card.rank}</span><span class="suit-small">${card.suit}</span></span>
                                <span class="rank">${card.rank}</span>
                                <span class="suit">${card.suit}</span>
                                <span class="corner corner-bottom"><span>${card.rank}</span><span class="suit-small">${card.suit}</span></span>
                            `;
                    } else {
                        el.className = 'my-card back';
                        el.innerHTML = '';
                    }
                });

                const canAct = state.status !== 'finished' && state.players.some(p => (p.id === userId || p.id === 'me') &&
                    p.isActive && !p.folded);
                foldBtn.disabled = !canAct;
                checkBtn.disabled = !canAct;
                callBtn.disabled = !canAct;
                raiseBtn.disabled = !canAct;
                allinBtn.disabled = !canAct;

                raisePanel.classList.toggle('active', canAct);
                if (canAct && state.availableActions && state.availableActions.raise) {
                    const minRaise = state.availableActions.minRaise || 100;
                    const maxRaise = Math.min(state.availableActions.maxRaise || state.stack || 1000, state.stack || 1000);
                    raiseRange.min = minRaise;
                    raiseRange.max = Math.max(minRaise, maxRaise);
                    const currentVal = parseInt(raiseRange.value) || minRaise;
                    raiseRange.value = Math.min(Math.max(currentVal, minRaise), maxRaise);
                    raiseAmountDisplay.innerText = Math.min(Math.max(currentVal, minRaise), maxRaise);
                }

                if (state.status === 'finished') {
                    if (state.result && state.result.winnerId) {
                        const isWin = String(state.result.winnerId) === String(userId);
                        if (isWin) {
                            const winAmount = state.result.winAmount || state.pot || 0;
                            statusMsg.innerText = `🎉 ВЫ ПОБЕДИЛИ! +${winAmount} ₽`;
                            statusMsg.className = 'status-msg win';
                            if (state.casino_balance !== undefined) updateBalanceUI(state.casino_balance, true);
                            if (resultShownForGameId !== state.gameId) {
                                resultShownForGameId = state.gameId;
                                showModal('🎉 Победа!', `Вы выиграли <span class="highlight">${winAmount} ₽</span>`);
                            }
                        } else {
                            statusMsg.innerText = `❌ Вы проиграли. Победитель: ${state.result.winnerName || 'бот'}`;
                            statusMsg.className = 'status-msg lose';
                            if (state.casino_balance !== undefined) updateBalanceUI(state.casino_balance);
                            if (resultShownForGameId !== state.gameId) {
                                resultShownForGameId = state.gameId;
                                showModal('❌ Поражение',
                                    `Победил <span class="highlight">${state.result.winnerName || 'бот'}</span>`
                                );
                            }
                        }
                        gameActive = false;
                        localStorage.removeItem('rgame_poker_game_id');
                        [foldBtn, checkBtn, callBtn, raiseBtn, allinBtn].forEach(b => b.disabled = true);
                    }
                } else {
                    statusMsg.innerText = `♠ ${stageMap[state.stage] || state.stage.toUpperCase()}`;
                    statusMsg.className = 'status-msg info';
                }

                if (state.casino_balance !== undefined && state.casino_balance !== casinoBalance) {
                    updateBalanceUI(state.casino_balance);
                }

                if (state.log && state.log.length) {
                    logPanel.innerHTML = state.log.map(entry =>
                        `<div class="log-entry">${entry}</div>`
                    ).join('');
                }
            }

            // ============================================================
            //  SEAT POSITIONS
            // ============================================================
            function createSeats(botCount) {
                const container = seatsContainer;
                container.innerHTML = '';
                const positions = [
                    { id: 'me', cls: 'seat-bottom-center' },
                    { id: 'bot0', cls: 'seat-top-center' },
                    { id: 'bot1', cls: 'seat-top-left' },
                    { id: 'bot2', cls: 'seat-top-right' },
                    { id: 'bot3', cls: 'seat-mid-left' },
                    { id: 'bot4', cls: 'seat-mid-right' },
                    { id: 'bot5', cls: 'seat-bottom-left' },
                    { id: 'bot6', cls: 'seat-bottom-right' }
                ];
                const used = positions.slice(0, 1 + botCount);
                used.forEach(pos => {
                    const div = document.createElement('div');
                    div.className = 'seat';
                    div.id = `seat-${pos.id}`;
                    div.style.cssText = `position:absolute; ${pos.cls};`;
                    container.appendChild(div);
                });
            }

            // ============================================================
            //  START GAME
            // ============================================================
            async function startGame() {
                if (isStartingGame) return;
                let raw = betInput.value.replace(/\s/g, '');
                let bet = parseInt(raw) || 100;
                if (bet < 10) { statusMsg.innerText = '❌ Минимальная ставка 10 ₽';
                    statusMsg.className = 'status-msg lose'; return; }
                if (bet > casinoBalance) { statusMsg.innerText = '❌ Недостаточно средств';
                    statusMsg.className = 'status-msg lose'; return; }
                isStartingGame = true;
                startBtn.disabled = true;
                startBtn.textContent = '♠ Создаём стол...';
                statusMsg.innerText = '⏳ Запуск игры...';
                statusMsg.className = 'status-msg info';
                try {
                    const data = await apiRequest('/poker/start', {
                        method: 'POST',
                        body: JSON.stringify({
                            userId: userId,
                            bet: bet,
                            botCount: botCount
                        })
                    });
                    if (data.success) {
                        gameId = data.state.gameId || data.gameId;
                        if (!gameId) throw new Error('Не получен gameId');
                        if (data.casino_balance !== undefined) updateBalanceUI(data.casino_balance);
                        localStorage.setItem('rgame_poker_game_id', gameId);
                        createSeats(botCount);
                        lobby.style.display = 'none';
                        tableArea.classList.add('active');
                        renderState(data.state);
                        statusMsg.innerText = '♠ Игра началась!';
                        statusMsg.className = 'status-msg info';
                    } else {
                        throw new Error(data.error || 'Неизвестная ошибка');
                    }
                } catch (e) {
                    statusMsg.innerText = `❌ ${e.message}`;
                    statusMsg.className = 'status-msg lose';
                    startBtn.disabled = false;
                    startBtn.textContent = '♠ Начать игру';
                } finally {
                    isStartingGame = false;
                }
            }

            // ============================================================
            //  ACTIONS
            // ============================================================
            async function sendAction(action, amount = 0) {
                if (isActionInProgress || !gameId) return;
                isActionInProgress = true;
                [foldBtn, checkBtn, callBtn, raiseBtn, allinBtn].forEach(b => b.disabled = true);
                try {
                    const data = await apiRequest('/poker/action', {
                        method: 'POST',
                        body: JSON.stringify({
                            gameId: gameId,
                            userId: userId,
                            action: action,
                            amount: amount
                        })
                    });
                    if (data.success) {
                        if (data.casino_balance !== undefined) updateBalanceUI(data.casino_balance);
                        if (data.state) renderState(data.state);
                    } else {
                        throw new Error(data.error || 'Ошибка действия');
                    }
                } catch (e) {
                    statusMsg.innerText = `❌ ${e.message}`;
                    statusMsg.className = 'status-msg lose';
                } finally {
                    isActionInProgress = false;
                }
            }

            foldBtn.onclick = () => sendAction('fold');
            checkBtn.onclick = () => sendAction('check');
            callBtn.onclick = () => sendAction('call', 0);
            allinBtn.onclick = () => {
                const amount = parseInt(raiseRange.value) || 0;
                sendAction('all_in', amount);
            };
            raiseBtn.onclick = () => {
                const amount = parseInt(raiseRange.value) || 0;
                sendAction('raise', amount);
            };
            raiseRange.oninput = function() {
                raiseAmountDisplay.innerText = this.value;
            };

            // ============================================================
            //  RESTORE GAME
            // ============================================================
            async function restoreGame() {
                const savedId = localStorage.getItem('rgame_poker_game_id');
                if (!savedId || !userId) return false;
                try {
                    const data = await apiRequest(`/poker/state/${savedId}?userId=${userId}`);
                    if (data.success && data.state && data.state.status !== 'finished') {
                        gameId = savedId;
                        createSeats(data.state.players ? data.state.players.length - 1 : 3);
                        lobby.style.display = 'none';
                        tableArea.classList.add('active');
                        renderState(data.state);
                        statusMsg.innerText = '♠ Игра восстановлена';
                        statusMsg.className = 'status-msg info';
                        return true;
                    } else {
                        localStorage.removeItem('rgame_poker_game_id');
                        return false;
                    }
                } catch (e) {
                    console.warn('Не удалось восстановить игру', e);
                    localStorage.removeItem('rgame_poker_game_id');
                    return false;
                }
            }

            // ============================================================
            //  MODAL
            // ============================================================
            function showModal(title, text) {
                modalTitle.innerText = title.replace(/[♠♥♦♣🎉❌]/g, '').trim();
                modalTitle.className = 'modal-title' + (title.includes('Поражение') ? ' lose' : '');
                modalText.innerHTML = text;
                modalOverlay.classList.add('active');
            }

            modalBtn.onclick = function() {
                modalOverlay.classList.remove('active');
                if (!gameActive) {
                    lobby.style.display = 'flex';
                    tableArea.classList.remove('active');
                    localStorage.removeItem('rgame_poker_game_id');
                    loadBalance();
                }
            };

            // ============================================================
            //  NAVIGATION
            // ============================================================
            menuBtn.onclick = function() {
                window.location.href = 'casino.html?userId=' + encodeURIComponent(userId || '');
            };

            // ============================================================
            //  QUICK CHIPS & BOT SELECT
            // ============================================================
            document.querySelectorAll('.quick-chips button').forEach(btn => {
                btn.addEventListener('click', function() { betInput.value = this.dataset.amount; });
            });

            document.querySelectorAll('#botSelect button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#botSelect button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    botCount = parseInt(this.dataset.count);
                });
            });

            startBtn.onclick = startGame;

            // ============================================================
            //  INIT
            // ============================================================
            async function init() {
                await loadBalance();
                const restored = await restoreGame();
                if (!restored) {
                    lobby.style.display = 'flex';
                    tableArea.classList.remove('active');
                    statusMsg.innerText = '♠ Сделайте ставку и начните игру';
                    statusMsg.className = 'status-msg';
                }
                betInput.value = '100';
                document.querySelector('#botSelect button[data-count="3"]')?.classList.add('active');
                botCount = 3;
                if (!userId) {
                    statusMsg.innerText = '❌ Ошибка: userId не найден';
                    statusMsg.className = 'status-msg lose';
                }
            }

            init();
        })();
    </script>
</body>
</html>
