<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0f1a">
    <title>♠️ Texas Hold'em · R-GAME</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;0,900;1,800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0a0f1a;
            font-family: 'Nunito', sans-serif;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            background-image: radial-gradient(circle at 50% 0%, rgba(24, 130, 255, 0.15), transparent 60%),
                              radial-gradient(circle at 50% 100%, rgba(139, 92, 246, 0.08), transparent 50%);
            overflow-x: hidden;
        }
        .game-container {
            max-width: 700px;
            width: 100%;
            background: rgba(17, 24, 34, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 36px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.06);
            position: relative;
            overflow: hidden;
        }
        .game-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(24, 130, 255, 0.04), transparent 50%),
                        radial-gradient(circle at 70% 60%, rgba(139, 92, 246, 0.03), transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            position: relative;
            z-index: 2;
        }
        .brand {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(135deg, #ffffff, #a0c4ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(24, 130, 255, 0.3);
        }
        .brand span {
            color: #1882ff;
            -webkit-text-fill-color: #1882ff;
        }
        .balance-card {
            background: rgba(26, 35, 50, 0.6);
            border-radius: 16px;
            padding: 6px 18px 6px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
        .balance-label {
            font-size: 10px;
            font-weight: 800;
            color: #8c9eb5;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .balance-value {
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            font-weight: 900;
            color: #1bd15d;
            text-shadow: 0 0 20px rgba(27, 209, 93, 0.3);
        }

        /* LOBBY */
        .lobby {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px 0 10px;
        }
        .lobby-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .lobby-sub {
            font-size: 16px;
            color: #8c9eb5;
            font-weight: 600;
        }
        .lobby-bet {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            width: 100%;
            max-width: 320px;
        }
        .lobby-bet label {
            font-weight: 700;
            color: #8c9eb5;
        }
        .lobby-bet input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            width: 100px;
            text-align: center;
            outline: none;
            font-family: 'Nunito', sans-serif;
        }
        .lobby-bot-select {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .lobby-bot-select button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 8px 16px;
            color: #8c9eb5;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Nunito', sans-serif;
            font-size: 14px;
        }
        .lobby-bot-select button.active {
            background: rgba(24, 130, 255, 0.15);
            border-color: #1882ff;
            color: #fff;
            box-shadow: 0 0 20px rgba(24, 130, 255, 0.1);
        }
        .btn-start {
            background: linear-gradient(135deg, #1882ff, #0d6efd);
            border: none;
            border-radius: 20px;
            padding: 16px 48px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 20px;
            text-transform: uppercase;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 6px 0 #0f5bb8, 0 10px 30px rgba(24, 130, 255, 0.3);
            transition: 0.15s;
            letter-spacing: 1px;
            width: 100%;
            max-width: 280px;
        }
        .btn-start:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0f5bb8, 0 10px 30px rgba(24, 130, 255, 0.2);
        }
        .btn-start:disabled {
            opacity: 0.4;
            transform: none;
            box-shadow: 0 4px 0 #0f5bb8;
            cursor: not-allowed;
        }

        /* TABLE */
        .table {
            display: none;
            position: relative;
            z-index: 2;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
        }
        .table.active {
            display: flex;
        }

        .felt {
            background: radial-gradient(ellipse at 50% 50%, #1a6b3c, #0d3b22);
            border-radius: 60px 60px 40px 40px;
            padding: 20px 16px 16px;
            width: 100%;
            box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.7), 0 8px 40px rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.04);
            position: relative;
            min-height: 340px;
        }
        .felt::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 60px 60px 40px 40px;
            background: repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(255, 255, 255, 0.01) 40px, rgba(255, 255, 255, 0.01) 41px);
            pointer-events: none;
        }

        .pot-display {
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            text-align: center;
            padding: 4px 0 8px;
            letter-spacing: 1px;
        }

        .community {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 6px 0 16px;
            perspective: 600px;
        }
        .community-card {
            width: 68px;
            height: 92px;
            background: #fff;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 900;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            transition: transform 0.3s ease, opacity 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transform-style: preserve-3d;
            animation: dealCard 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .community-card.hidden {
            background: repeating-linear-gradient(45deg, #1a2332, #1a2332 10px, #0d1b2a 10px, #0d1b2a 20px);
            border-color: #1882ff40;
            color: transparent;
            font-size: 0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .community-card.red { color: #dc2626; }
        .community-card.black { color: #111; }
        @keyframes dealCard {
            0% { transform: translateY(-30px) rotateY(90deg) scale(0.6); opacity: 0; }
            100% { transform: translateY(0) rotateY(0) scale(1); opacity: 1; }
        }

        .players-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 8px 0 12px;
        }
        .player-slot {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 8px 12px;
            min-width: 80px;
            flex: 1;
            max-width: 140px;
            text-align: center;
            border: 2px solid transparent;
            transition: border 0.3s, box-shadow 0.3s, transform 0.2s;
            backdrop-filter: blur(4px);
        }
        .player-slot.active-turn {
            border-color: #FFD700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
            transform: scale(1.02);
        }
        .player-slot.folded {
            opacity: 0.4;
            filter: grayscale(1);
        }
        .player-slot .avatar {
            font-size: 32px;
            line-height: 1.2;
        }
        .player-slot .name {
            font-size: 13px;
            font-weight: 800;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-slot .stack {
            font-size: 12px;
            color: #8c9eb5;
            font-weight: 700;
        }
        .player-slot .status-badge {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 4px;
        }
        .player-slot .status-badge.win {
            background: rgba(27, 209, 93, 0.2);
            color: #1bd15d;
        }
        .player-slot .status-badge.lose {
            background: rgba(220, 38, 38, 0.2);
            color: #dc2626;
        }

        .my-hand {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin: 10px 0 14px;
        }
        .my-card {
            width: 78px;
            height: 106px;
            background: #fff;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 900;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            transition: transform 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.1);
            animation: dealCard 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .my-card.red { color: #dc2626; }
        .my-card.black { color: #111; }
        .my-card.hidden {
            background: repeating-linear-gradient(45deg, #1a2332, #1a2332 10px, #0d1b2a 10px, #0d1b2a 20px);
            border-color: #1882ff40;
            color: transparent;
            font-size: 0;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .actions-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 6px 0;
        }
        .action-btn {
            border: none;
            border-radius: 16px;
            padding: 12px 20px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 15px;
            text-transform: uppercase;
            color: #fff;
            cursor: pointer;
            transition: 0.15s ease;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
            flex: 1;
            min-width: 70px;
            letter-spacing: 0.5px;
            background: #1e2530;
            box-shadow: 0 4px 0 #0d121a;
        }
        .action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0d121a;
        }
        .action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 0 #0d121a;
        }
        .action-btn.fold { background: #dc2626; box-shadow: 0 4px 0 #a8222f; }
        .action-btn.check { background: #1e2530; box-shadow: 0 4px 0 #0d121a; }
        .action-btn.call { background: #1882ff; box-shadow: 0 4px 0 #0f5bb8; }
        .action-btn.raise { background: #f59e0b; box-shadow: 0 4px 0 #b36b00; }
        .action-btn.allin { background: #1bd15d; box-shadow: 0 4px 0 #139642; }

        .bet-slider-wrap {
            display: none;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 8px 16px;
            width: 100%;
            max-width: 360px;
            margin: 4px auto 0;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .bet-slider-wrap.active {
            display: flex;
        }
        .bet-slider-wrap input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #1e2530;
            border-radius: 2px;
            outline: none;
        }
        .bet-slider-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #1882ff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(24, 130, 255, 0.4);
        }
        .bet-slider-wrap span {
            font-weight: 800;
            font-size: 18px;
            min-width: 60px;
            text-align: center;
            color: #fff;
        }

        .status-msg {
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            color: #8c9eb5;
            min-height: 28px;
            padding: 4px 0;
            letter-spacing: 0.3px;
        }
        .status-msg.win { color: #1bd15d; }
        .status-msg.lose { color: #dc2626; }
        .status-msg.info { color: #FFD700; }

        .footer {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            position: relative;
            z-index: 2;
        }
        .btn-menu {
            flex: 1;
            background: #1e2530;
            border: none;
            border-radius: 16px;
            padding: 14px;
            color: #fff;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 0 #0d121a;
            transition: 0.1s;
            font-family: 'Nunito', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-menu:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0d121a;
        }

        /* Медиа-адаптация */
        @media (max-width: 500px) {
            .game-container { padding: 14px; }
            .brand { font-size: 20px; }
            .balance-value { font-size: 16px; }
            .lobby-title { font-size: 22px; }
            .community-card { width: 54px; height: 74px; font-size: 18px; }
            .my-card { width: 64px; height: 88px; font-size: 22px; }
            .player-slot { min-width: 60px; padding: 4px 8px; }
            .player-slot .avatar { font-size: 26px; }
            .action-btn { font-size: 13px; padding: 10px 14px; }
            .felt { border-radius: 40px 40px 30px 30px; padding: 14px 10px; }
        }
        @media (max-width: 400px) {
            .community-card { width: 44px; height: 62px; font-size: 15px; }
            .my-card { width: 54px; height: 74px; font-size: 18px; }
            .action-btn { font-size: 11px; padding: 8px 10px; min-width: 50px; }
            .lobby-bet input { width: 70px; font-size: 18px; }
            .btn-start { font-size: 16px; padding: 14px 32px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <div class="brand">R-<span>POKER</span></div>
        <div class="balance-card">
            <span class="balance-label">Баланс</span>
            <span class="balance-value" id="balanceDisplay">0 ₽</span>
        </div>
    </div>

    <!-- LOBBY -->
    <div class="lobby" id="lobby">
        <div class="lobby-title">♠️ Техасский Холдем</div>
        <div class="lobby-sub">Выберите ставку и количество ботов</div>
        <div class="lobby-bet">
            <label>Ставка</label>
            <input type="number" id="betInput" value="100" min="10" step="10">
            <label>₽</label>
        </div>
        <div class="lobby-bot-select" id="botSelect">
            <button data-count="2">2 бота</button>
            <button data-count="3" class="active">3 бота</button>
            <button data-count="4">4 бота</button>
            <button data-count="5">5 ботов</button>
        </div>
        <button class="btn-start" id="startBtn">Начать игру</button>
    </div>

    <!-- TABLE -->
    <div class="table" id="table">
        <div class="felt">
            <div class="pot-display">🏆 Банк: <span id="potDisplay">0</span> ₽</div>
            <div class="community" id="communityCards">
                <div class="community-card hidden"></div>
                <div class="community-card hidden"></div>
                <div class="community-card hidden"></div>
                <div class="community-card hidden"></div>
                <div class="community-card hidden"></div>
            </div>
            <div class="players-grid" id="playersGrid"></div>
            <div class="my-hand" id="myHand">
                <div class="my-card hidden"></div>
                <div class="my-card hidden"></div>
            </div>
            <div class="actions-bar" id="actionsBar">
                <button class="action-btn fold" id="foldBtn" disabled>Fold</button>
                <button class="action-btn check" id="checkBtn" disabled>Check</button>
                <button class="action-btn call" id="callBtn" disabled>Call</button>
                <button class="action-btn raise" id="raiseBtn" disabled>Raise</button>
                <button class="action-btn allin" id="allinBtn" disabled>All-in</button>
            </div>
            <div class="bet-slider-wrap" id="betSliderWrap">
                <input type="range" id="betRange" min="0" max="1000" value="0" step="10">
                <span id="betAmountDisplay">0</span>
            </div>
            <div class="status-msg" id="statusMsg">Выберите действие</div>
        </div>
    </div>

    <div class="footer">
        <button class="btn-menu" id="menuBtn">🏠 В МЕНЮ</button>
    </div>
</div>

<script>
(function() {
    'use strict';

    // ===== API =====
    const API_BASE = 'https://resellgame.bothost.tech';
    const tg = window.Telegram.WebApp;
    tg.expand(); tg.ready();
    if (tg.HapticFeedback) tg.enableClosingConfirmation();

    let userId = new URLSearchParams(window.location.search).get('userId') || tg.initDataUnsafe?.user?.id;
    let casinoBalance = 0;
    let gameId = null;
    let currentState = null;
    let isActionInProgress = false;
    let botCount = 3;
    let myBet = 100;

    // DOM
    const balanceDisplay = document.getElementById('balanceDisplay');
    const lobby = document.getElementById('lobby');
    const table = document.getElementById('table');
    const potDisplay = document.getElementById('potDisplay');
    const communityCards = document.getElementById('communityCards');
    const playersGrid = document.getElementById('playersGrid');
    const myHand = document.getElementById('myHand');
    const statusMsg = document.getElementById('statusMsg');
    const foldBtn = document.getElementById('foldBtn');
    const checkBtn = document.getElementById('checkBtn');
    const callBtn = document.getElementById('callBtn');
    const raiseBtn = document.getElementById('raiseBtn');
    const allinBtn = document.getElementById('allinBtn');
    const betSliderWrap = document.getElementById('betSliderWrap');
    const betRange = document.getElementById('betRange');
    const betAmountDisplay = document.getElementById('betAmountDisplay');
    const startBtn = document.getElementById('startBtn');
    const betInput = document.getElementById('betInput');
    const menuBtn = document.getElementById('menuBtn');

    // ===== БАЛАНС =====
    async function loadBalance() {
        if (!userId) return;
        try {
            const res = await fetch(`${API_BASE}/profile/${userId}`, { cache: 'no-cache' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            casinoBalance = data.casino_balance || 0;
            balanceDisplay.innerText = casinoBalance.toLocaleString() + ' ₽';
        } catch(e) {
            console.warn('Ошибка загрузки баланса', e);
        }
    }

    function updateBalanceUI(newBalance) {
        casinoBalance = newBalance;
        balanceDisplay.innerText = newBalance.toLocaleString() + ' ₽';
        localStorage.setItem('casinoBalance', String(newBalance));
    }

    // ===== ОТРИСОВКА СОСТОЯНИЯ =====
    function renderState(state) {
        if (!state) return;
        currentState = state;

        // Пот
        potDisplay.innerText = state.pot;

        // Общие карты
        const comm = state.communityCards || [];
        const commCards = communityCards.querySelectorAll('.community-card');
        commCards.forEach((el, i) => {
            if (i < comm.length) {
                const card = comm[i];
                el.className = 'community-card';
                el.classList.add(card.suit === '♥' || card.suit === '♦' ? 'red' : 'black');
                el.innerText = card.rank + card.suit;
            } else {
                el.className = 'community-card hidden';
                el.innerText = '';
            }
        });

        // Игроки
        const players = state.players || [];
        playersGrid.innerHTML = '';
        players.forEach(p => {
            const div = document.createElement('div');
            div.className = 'player-slot';
            if (p.isActive && p.id !== userId) {
                div.classList.add('active-turn');
            }
            if (!p.isActive) {
                div.classList.add('folded');
            }
            div.innerHTML = `
                <div class="avatar">${p.avatar || '👤'}</div>
                <div class="name">${p.name || 'Игрок'}</div>
                <div class="stack">${p.bet || 0} ₽</div>
                ${p.isActive ? '' : '<div class="status-badge lose">пас</div>'}
            `;
            if (p.id === userId) {
                div.style.borderColor = '#1882ff';
                div.style.background = 'rgba(24,130,255,0.1)';
            }
            playersGrid.appendChild(div);
        });

        // Мои карты
        const myCards = state.playerCards || [];
        const handCards = myHand.querySelectorAll('.my-card');
        handCards.forEach((el, i) => {
            if (i < myCards.length) {
                const card = myCards[i];
                el.className = 'my-card';
                el.classList.add(card.suit === '♥' || card.suit === '♦' ? 'red' : 'black');
                el.innerText = card.rank + card.suit;
            } else {
                el.className = 'my-card hidden';
                el.innerText = '';
            }
        });

        // Кнопки действий
        const canAct = state.currentStage !== 'finished' && state.players.some(p => p.id === userId && p.isActive);
        [foldBtn, checkBtn, callBtn, raiseBtn, allinBtn].forEach(b => b.disabled = !canAct);
        betSliderWrap.classList.toggle('active', canAct);

        // Статус
        if (state.currentStage === 'finished') {
            const winner = state.players.find(p => p.isActive);
            if (winner && winner.id === userId) {
                statusMsg.innerText = '🎉 ВЫ ПОБЕДИЛИ! +' + state.pot + ' ₽';
                statusMsg.className = 'status-msg win';
            } else {
                statusMsg.innerText = '❌ Вы проиграли';
                statusMsg.className = 'status-msg lose';
            }
        } else {
            statusMsg.innerText = `Ход: ${state.currentStage.toUpperCase()}`;
            statusMsg.className = 'status-msg';
        }

        // Обновить баланс, если он изменился
        if (state.balance !== undefined) {
            updateBalanceUI(state.balance);
        }
    }

    // ===== ДЕЙСТВИЯ =====
    async function sendAction(action, amount = 0) {
        if (isActionInProgress || !gameId) return;
        isActionInProgress = true;
        try {
            const res = await fetch(`${API_BASE}/poker/action`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    gameId: gameId,
                    userId: userId,
                    action: action,
                    amount: amount
                })
            });
            const data = await res.json();
            if (data.success) {
                if (data.casino_balance !== undefined) {
                    updateBalanceUI(data.casino_balance);
                }
                if (data.state) {
                    renderState(data.state);
                }
                if (data.winner) {
                    statusMsg.innerText = '🏆 Победитель определён!';
                    statusMsg.className = 'status-msg info';
                }
            } else {
                statusMsg.innerText = 'Ошибка: ' + (data.error || '');
                statusMsg.className = 'status-msg lose';
            }
        } catch(e) {
            console.error(e);
            statusMsg.innerText = 'Ошибка соединения';
            statusMsg.className = 'status-msg lose';
        }
        isActionInProgress = false;
    }

    // Обработчики кнопок
    foldBtn.onclick = () => sendAction('fold');
    checkBtn.onclick = () => sendAction('check');
    callBtn.onclick = () => sendAction('call', 0);
    allinBtn.onclick = () => {
        const bet = parseInt(betRange.value) || 0;
        sendAction('all_in', bet);
    };
    raiseBtn.onclick = () => {
        const bet = parseInt(betRange.value) || 0;
        sendAction('raise', bet);
    };
    betRange.oninput = function() {
        betAmountDisplay.innerText = this.value;
    };

    // ===== СТАРТ ИГРЫ =====
    async function startGame(bet, bots) {
        if (!userId) return;
        startBtn.disabled = true;
        try {
            const res = await fetch(`${API_BASE}/poker/start`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: userId,
                    bet: bet,
                    botCount: bots
                })
            });
            const data = await res.json();
            if (data.success) {
                gameId = data.state.gameId;
                if (data.casino_balance !== undefined) {
                    updateBalanceUI(data.casino_balance);
                }
                lobby.style.display = 'none';
                table.classList.add('active');
                renderState(data.state);
                statusMsg.innerText = 'Игра началась!';
                statusMsg.className = 'status-msg info';
            } else {
                statusMsg.innerText = 'Ошибка: ' + (data.error || '');
                statusMsg.className = 'status-msg lose';
                startBtn.disabled = false;
            }
        } catch(e) {
            console.error(e);
            statusMsg.innerText = 'Ошибка соединения';
            statusMsg.className = 'status-msg lose';
            startBtn.disabled = false;
        }
    }

    // ===== ВЫБОР БОТОВ =====
    document.querySelectorAll('#botSelect button').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('#botSelect button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            botCount = parseInt(this.dataset.count);
        });
    });

    // ===== КНОПКА СТАРТ =====
    startBtn.onclick = function() {
        let bet = parseInt(betInput.value);
        if (isNaN(bet) || bet < 10) bet = 100;
        if (bet > casinoBalance) {
            statusMsg.innerText = '❌ Недостаточно средств!';
            statusMsg.className = 'status-msg lose';
            return;
        }
        myBet = bet;
        startGame(bet, botCount);
    };

    // ===== МЕНЮ =====
    menuBtn.onclick = function() {
        if (gameId) {
            // Можно попытаться завершить игру, но пока просто уходим
        }
        window.location.href = 'casino.html?userId=' + (userId || '');
    };

    // ===== ИНИЦИАЛИЗАЦИЯ =====
    window.onload = function() {
        loadBalance();
        statusMsg.innerText = 'Сделайте ставку и начните игру';
        statusMsg.className = 'status-msg';
    };

})();
</script>
</body>
</html>
