<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>♠️ R-GAME POKER · Texas Hold'em</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;0,900;1,800&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ========== ROOT ========== */
        :root {
            --bg-dark: #080c16;
            --bg-table: #0d1a0e;
            --felt-dark: #0f3b22;
            --felt-light: #1a5f3a;
            --gold: #FFD700;
            --gold-dim: rgba(255, 215, 0, 0.25);
            --blue: #1882ff;
            --green: #1bd15d;
            --red: #dc2626;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --panel: rgba(13, 22, 38, 0.75);
            --border-glass: rgba(255,255,255,0.06);
            --shadow-heavy: 0 20px 60px rgba(0,0,0,0.8);
            --shadow-card: 0 8px 25px rgba(0,0,0,0.6);
            --radius-table: 48%;
            --seat-size: 100px;
        }
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            background-image: radial-gradient(circle at 20% 20%, rgba(24,130,255,0.06), transparent 50%),
                              radial-gradient(circle at 80% 80%, rgba(255,215,0,0.04), transparent 50%);
            overflow-x: hidden;
        }
        .game-wrapper {
            max-width: 820px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* ========== HEADER ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-back {
            background: var(--panel);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 6px 14px;
            color: var(--text);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Nunito', sans-serif;
            backdrop-filter: blur(8px);
        }
        .btn-back:active { transform: scale(0.94); background: rgba(255,255,255,0.05); }
        .brand {
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(135deg, #fff, #a0c4ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 0.5px;
        }
        .brand span { color: var(--blue); -webkit-text-fill-color: var(--blue); }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .balance-wrap {
            background: rgba(0,0,0,0.4);
            border-radius: 100px;
            padding: 4px 16px 4px 14px;
            border: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
        }
        .balance-label {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        .balance-value {
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            font-weight: 900;
            color: var(--green);
            text-shadow: 0 0 20px rgba(27,209,93,0.2);
            transition: color 0.3s;
        }
        .balance-value.win { color: var(--gold); text-shadow: 0 0 30px rgba(255,215,0,0.4); }
        .balance-value.lose { color: var(--red); }

        /* ========== LOBBY ========== */
        .lobby {
            background: var(--panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 30px 20px;
            border: 1px solid var(--border-glass);
            box-shadow: var(--shadow-heavy);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
        }
        .lobby-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold), #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(255,215,0,0.2);
        }
        .lobby-sub {
            font-size: 16px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .lobby-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 450px;
        }
        .lobby-row label {
            font-weight: 700;
            color: var(--text-muted);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .lobby-bet-input {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 10px 16px;
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            width: 130px;
            text-align: center;
            font-family: 'Nunito', sans-serif;
            outline: none;
        }
        .lobby-bet-input:focus { border-color: var(--gold); }
        .quick-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .quick-chips button {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            padding: 6px 14px;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Nunito', sans-serif;
        }
        .quick-chips button:active { background: rgba(255,215,0,0.15); transform: scale(0.94); }
        .bot-select {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .bot-select button {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 8px 18px;
            color: var(--text-muted);
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Nunito', sans-serif;
            font-size: 14px;
        }
        .bot-select button.active {
            background: rgba(24,130,255,0.15);
            border-color: var(--blue);
            color: #fff;
            box-shadow: 0 0 20px rgba(24,130,255,0.1);
        }
        .btn-start {
            background: linear-gradient(135deg, var(--blue), #0d6efd);
            border: none;
            border-radius: 20px;
            padding: 16px 48px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 20px;
            text-transform: uppercase;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 6px 0 #0f5bb8, 0 10px 30px rgba(24,130,255,0.3);
            transition: 0.15s;
            letter-spacing: 1px;
            width: 100%;
            max-width: 280px;
        }
        .btn-start:active { transform: translateY(4px); box-shadow: 0 2px 0 #0f5bb8, 0 10px 30px rgba(24,130,255,0.2); }
        .btn-start:disabled {
            opacity: 0.4;
            transform: none;
            box-shadow: 0 4px 0 #0f5bb8;
            cursor: not-allowed;
        }

        /* ========== TABLE ========== */
        .table-area {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
        }
        .table-area.active { display: flex; }

        .felt-container {
            position: relative;
            width: 100%;
            max-width: 780px;
            aspect-ratio: 1.55 / 1;
            border-radius: var(--radius-table);
            background: radial-gradient(ellipse at center, var(--felt-light) 0%, var(--felt-dark) 55%, #0a1f12 100%);
            border: 14px solid #2d1a0e;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.7), inset 0 0 0 3px rgba(255,215,0,0.2), var(--shadow-heavy);
            overflow: visible;
            margin: 0 auto;
        }
        .felt-container::before {
            content: '';
            position: absolute;
            inset: 16px;
            border-radius: inherit;
            border: 2px solid rgba(255,220,130,0.12);
            pointer-events: none;
        }
        .felt-container .felt-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-style: italic;
            font-size: clamp(24px, 5vw, 42px);
            color: rgba(255,215,0,0.06);
            letter-spacing: 6px;
            text-transform: uppercase;
            pointer-events: none;
            white-space: nowrap;
            text-shadow: 0 0 40px rgba(255,215,0,0.02);
        }

        /* ===== SEATS ===== */
        .seat {
            position: absolute;
            width: var(--seat-size);
            height: calc(var(--seat-size) * 1.2);
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 4px 6px;
            border: 2px solid transparent;
            transition: border 0.3s, box-shadow 0.3s, transform 0.2s;
            backdrop-filter: blur(4px);
            pointer-events: none;
            z-index: 2;
        }
        .seat.active-turn {
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(255,215,0,0.2);
            transform: translate(-50%, -50%) scale(1.05);
        }
        .seat.folded { opacity: 0.4; filter: grayscale(0.8); }
        .seat .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255,255,255,0.08);
            overflow: hidden;
            flex-shrink: 0;
        }
        .seat .avatar svg { width: 100%; height: 100%; display: block; }
        .seat .name {
            font-size: 11px;
            font-weight: 800;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }
        .seat .stack {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 700;
        }
        .seat .status-badge {
            font-size: 8px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 1px 6px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
        }
        .seat .status-badge.fold { background: rgba(220,38,38,0.2); color: var(--red); }
        .seat .status-badge.call { background: rgba(24,130,255,0.2); color: var(--blue); }
        .seat .status-badge.raise { background: rgba(255,215,0,0.2); color: var(--gold); }
        .seat .status-badge.allin { background: rgba(27,209,93,0.2); color: var(--green); }
        .seat .mini-cards {
            display: flex;
            gap: 2px;
            margin-top: 2px;
        }
        .mini-card {
            width: 18px;
            height: 26px;
            background: #fff;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .mini-card.red { color: var(--red); }
        .mini-card.black { color: #111; }
        .mini-card.back {
            background: repeating-linear-gradient(45deg, #1a2332, #1a2332 4px, #0d1b2a 4px, #0d1b2a 8px);
            color: transparent;
            border-color: rgba(24,130,255,0.2);
        }

        /* seat positions */
        .seat-bottom-center { bottom: 4%; left: 50%; transform: translateX(-50%); width: 110px; }
        .seat-top-center { top: 2%; left: 50%; transform: translateX(-50%); }
        .seat-top-left { top: 6%; left: 15%; }
        .seat-top-right { top: 6%; right: 15%; }
        .seat-mid-left { top: 35%; left: 2%; }
        .seat-mid-right { top: 35%; right: 2%; }
        .seat-bottom-left { bottom: 8%; left: 12%; }
        .seat-bottom-right { bottom: 8%; right: 12%; }

        /* ===== COMMUNITY & POT ===== */
        .community-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 1;
            pointer-events: none;
        }
        .community-cards {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .comm-card {
            width: 52px;
            height: 72px;
            border-radius: 8px;
            background: #fff;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 900;
            border: 1px solid rgba(255,255,255,0.15);
            transition: transform 0.3s;
            animation: cardDeal 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .comm-card.red { color: var(--red); }
        .comm-card.black { color: #111; }
        .comm-card.back {
            background: repeating-linear-gradient(45deg, #1a2332, #1a2332 8px, #0d1b2a 8px, #0d1b2a 16px);
            color: transparent;
            border-color: rgba(24,130,255,0.3);
        }
        .comm-card .rank { font-size: 16px; line-height: 1; }
        .comm-card .suit { font-size: 22px; line-height: 1; }
        @keyframes cardDeal {
            0% { opacity:0; transform: translateY(-20px) rotateY(90deg) scale(0.6); }
            100% { opacity:1; transform: translateY(0) rotateY(0) scale(1); }
        }

        .pot-display {
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 30px rgba(255,215,0,0.3);
            text-align: center;
            padding: 2px 12px;
            background: rgba(0,0,0,0.4);
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,215,0,0.1);
        }
        .stage-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.3);
            padding: 2px 12px;
            border-radius: 20px;
        }

        /* ===== MY HAND ===== */
        .my-hand-area {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 3;
            pointer-events: none;
        }
        .my-card {
            width: 64px;
            height: 88px;
            background: #fff;
            border-radius: 10px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 900;
            border: 2px solid rgba(255,255,255,0.1);
            animation: cardDeal 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .my-card.red { color: var(--red); }
        .my-card.black { color: #111; }
        .my-card .rank { font-size: 20px; line-height: 1; }
        .my-card .suit { font-size: 28px; line-height: 1; }
        .my-card.back {
            background: repeating-linear-gradient(45deg, #1a2332, #1a2332 10px, #0d1b2a 10px, #0d1b2a 20px);
            border-color: rgba(24,130,255,0.3);
            color: transparent;
        }

        /* ========== ACTIONS ========== */
        .actions-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
            width: 100%;
            max-width: 500px;
        }
        .action-btn {
            border: none;
            border-radius: 16px;
            padding: 10px 18px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            color: #fff;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
            flex: 1;
            min-width: 60px;
            background: #1e2530;
            box-shadow: 0 4px 0 #0d121a;
            position: relative;
            overflow: hidden;
        }
        .action-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #0d121a; }
        .action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 0 #0d121a;
        }
        .action-btn.fold { background: #dc2626; box-shadow: 0 4px 0 #a8222f; }
        .action-btn.check { background: #2d3748; box-shadow: 0 4px 0 #1a202c; }
        .action-btn.call { background: var(--blue); box-shadow: 0 4px 0 #0f5bb8; }
        .action-btn.raise { background: var(--gold); color: #111; box-shadow: 0 4px 0 #b36b00; }
        .action-btn.allin { background: var(--green); box-shadow: 0 4px 0 #139642; }

        .raise-panel {
            display: none;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 6px 12px;
            width: 100%;
            max-width: 360px;
            margin: 4px auto 0;
            border: 1px solid var(--border-glass);
        }
        .raise-panel.active { display: flex; }
        .raise-panel input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #1e2530;
            border-radius: 2px;
            outline: none;
        }
        .raise-panel input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: var(--gold);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255,215,0,0.4);
        }
        .raise-panel span {
            font-weight: 800;
            font-size: 18px;
            min-width: 60px;
            text-align: center;
            color: #fff;
        }

        .status-msg {
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-muted);
            min-height: 28px;
            padding: 4px 0;
        }
        .status-msg.win { color: var(--gold); text-shadow: 0 0 30px rgba(255,215,0,0.3); }
        .status-msg.lose { color: var(--red); }
        .status-msg.info { color: var(--blue); }

        .log-toggle {
            background: none;
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 4px 14px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Nunito', sans-serif;
        }
        .log-toggle:active { background: rgba(255,255,255,0.04); }
        .log-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            width: 100%;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 0 10px;
            margin-top: 4px;
        }
        .log-panel.open { max-height: 200px; padding: 8px 10px; overflow-y: auto; }
        .log-panel .log-entry {
            font-size: 12px;
            color: var(--text-muted);
            padding: 2px 0;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        .log-panel .log-entry .hl { color: var(--gold); }

        .btn-menu {
            background: #1e2530;
            border: none;
            border-radius: 16px;
            padding: 12px;
            color: #fff;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 0 #0d121a;
            transition: 0.1s;
            font-family: 'Nunito', sans-serif;
            text-transform: uppercase;
            width: 100%;
            max-width: 200px;
            margin-top: 8px;
        }
        .btn-menu:active { transform: translateY(2px); box-shadow: 0 2px 0 #0d121a; }

        /* ========== MODAL ========== */
        .modal-overlay {
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(4,7,12,0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity:1; pointer-events:auto; }
        .modal-box {
            background: rgba(17,24,34,0.9);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            max-width: 420px;
            width:100%;
            padding: 24px 20px 20px;
            box-shadow: var(--shadow-heavy);
            text-align:center;
            transform:scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
        }
        .modal-overlay.active .modal-box { transform:scale(1); }
        .modal-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: var(--gold);
            margin-bottom: 8px;
        }
        .modal-text {
            font-size: 16px;
            color: var(--text);
            margin-bottom: 16px;
            line-height:1.5;
        }
        .modal-btn {
            padding: 12px 24px;
            border-radius: 14px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            margin: 4px;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 600px) {

        { id: 'gold',    name: 'Мистер Голд', style: 'tight',     color: '#f1c40f', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#2c2c2c"/><circle cx="50" cy="40" r="20" fill="#f5e6c8"/><circle cx="42" cy="35" r="4" fill="#fff"/><circle cx="58" cy="35" r="4" fill="#fff"/><circle cx="50" cy="45" r="4" fill="#111"/><rect x="35" y="55" width="30" height="12" rx="4" fill="#f1c40f"/><rect x="25" y="65" width="50" height="20" rx="6" fill="#d4ac0d"/><circle cx="50" cy="28" r="8" fill="#f1c40f"/></svg>' },
        { id: 'luna',    name: 'Луна',        style: 'balanced',  color: '#8e44ad', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#2c1a4a"/><circle cx="50" cy="40" r="20" fill="#f0d5b0"/><circle cx="42" cy="35" r="4" fill="#fff"/><circle cx="58" cy="35" r="4" fill="#fff"/><circle cx="50" cy="45" r="4" fill="#111"/><rect x="35" y="55" width="30" height="12" rx="4" fill="#8e44ad"/><rect x="30" y="65" width="40" height="20" rx="6" fill="#6c3483"/><circle cx="50" cy="20" r="6" fill="#8e44ad"/></svg>' },
        { id: 'sophie',  name: 'Софи Блэк',   style: 'tight',     color: '#34495e', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#1a1a2e"/><circle cx="50" cy="40" r="20" fill="#e8c99b"/><circle cx="42" cy="35" r="4" fill="#fff"/><circle cx="58" cy="35" r="4" fill="#fff"/><circle cx="50" cy="45" r="4" fill="#111"/><rect x="35" y="55" width="30" height="12" rx="4" fill="#d4a373"/><rect x="28" y="65" width="44" height="20" rx="6" fill="#2c3e50"/></svg>' },
        { id: 'max',     name: 'Макс Рой',    style: 'aggressive', color: '#e74c3c', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#3b1a1a"/><circle cx="50" cy="40" r="20" fill="#f5cba7"/><circle cx="42" cy="35" r="4" fill="#fff"/><circle cx="58" cy="35" r="4" fill="#fff"/><circle cx="50" cy="45" r="4" fill="#111"/><rect x="35" y="55" width="30" height="12" rx="4" fill="#e74c3c"/><rect x="25" y="65" width="50" height="20" rx="6" fill="#c0392b"/></svg>' },
        { id: 'daniel',  name: 'Даниэль Кросс', style: 'bluff',  color: '#2980b9', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#1a2a3a"/><circle cx="50" cy="40" r="20" fill="#d4a373"/><circle cx="42" cy="35" r="4" fill="#fff"/><circle cx="58" cy="35" r="4" fill="#fff"/><circle cx="50" cy="45" r="4" fill="#111"/><rect x="35" y="55" width="30" height="12" rx="4" fill="#2980b9"/><rect x="30" y="65" width="40" height="20" rx="6" fill="#1f618d"/></svg>' },
        { id: 'leon',    name: 'Леон Вольф',  style: 'aggressive', color: '#7f8c8d', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#2c2c2c"/><circle cx="50" cy="40" r="20" fill="#d4a373"/><circle cx="42" cy="35" r="4" fill="#fff"/><circle cx="58" cy="35" r="4" fill="#fff"/><circle cx="50" cy="45" r="4" fill="#111"/><rect x="35" y="55" width="30" height="12" rx="4" fill="#7f8c8d"/><rect x="28" y="65" width="44" height="20" rx="6" fill="#5d6d7e"/></svg>' },
        { id: 'ray',     name: 'Рэй Хадсон',  style: 'balanced',  color: '#2ecc71', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#1a3a2a"/><circle cx="50" cy="40" r="20" fill="#f0d5b0"/><circle cx="42" cy="35" r="4" fill="#fff"/><circle cx="58" cy="35" r="4" fill="#fff"/><circle cx="50" cy="45" r="4" fill="#111"/><rect x="35" y="55" width="30" height="12" rx="4" fill="#2ecc71"/><rect x="30" y="65" width="40" height="20" rx="6" fill="#27ae60"/></svg>' },
        { id: 'mia',     name: 'Мия Найт',    style: 'bluff',     color: '#c0392b', svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#2c1a1a"/><circle cx="50" cy="40" r="20" fill="#f5cba7"/><circle cx="42" cy="35" r="4" fill="#fff"/><circle cx="58" cy="35" r="4" fill="#fff"/><circle cx="50" cy="45" r="4" fill="#111"/><rect x="35" y="55" width="30" height="12" rx="4" fill="#c0392b"/><rect x="28" y="65" width="44" height="20" rx="6" fill="#922b21"/></svg>' }
    ];

    function getBotById(id) { return BOTS.find(b => b.id === id) || BOTS[0]; }

    // ============================================================
    //  API HELPERS
    // ============================================================
    async function apiRequest(endpoint, options = {}) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 15000);
        try {
            const res = await fetch(`${API_BASE}${endpoint}`, {
                ...options,
                signal: controller.signal,
                headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
            });
            clearTimeout(timeout);
            if (!res.ok) {
                let errMsg = `HTTP ${res.status}`;
                try { const data = await res.json(); errMsg = data.error || errMsg; } catch (_) {}
                throw new Error(errMsg);
            }
            return await res.json();
        } catch (e) {
            clearTimeout(timeout);
            if (e.name === 'AbortError') throw new Error('Запрос превысил время ожидания');
            throw e;
        }
    }

    // ============================================================
    //  BALANCE
    // ============================================================
    async function loadBalance() {
        if (!userId) return;
        try {
            const data = await apiRequest(`/profile/${userId}`, { cache: 'no-cache' });
            if (data.casino_balance !== undefined) {
                casinoBalance = Number(data.casino_balance);
                updateBalanceUI(casinoBalance);
            }
        } catch (e) {
            console.warn('Ошибка загрузки баланса', e);
        }
    }

    function updateBalanceUI(newBalance, animate = false) {
        casinoBalance = Number(newBalance);
        const el = balanceDisplay;
        if (animate) { el.classList.add('win'); setTimeout(() => el.classList.remove('win'), 1500); }
        el.innerText = casinoBalance.toLocaleString() + ' ₽';
        localStorage.setItem('casinoBalance', String(casinoBalance));
    }

    // ============================================================
    //  RENDER STATE
    // ============================================================
    function renderState(state) {
        if (!state) return;
        currentState = state;
        gameActive = (state.status !== 'finished');

        // Pot
        potDisplay.innerText = state.pot || 0;

        // Stage
        const stageMap = { preflop: 'ПРЕФЛОП', flop: 'ФЛОП', turn: 'ТЁРН', river: 'РИВЕР', showdown: 'ШОУДАУН', finished: 'ЗАВЕРШЕНА' };
        stageLabel.innerText = stageMap[state.stage] || state.stage.toUpperCase();

        // Community cards
        const comm = state.communityCards || [];
        const commEls = communityCards.querySelectorAll('.comm-card');
        commEls.forEach((el, i) => {
            if (i < comm.length) {
                const card = comm[i];
                el.className = 'comm-card';
                el.classList.add(card.suit === '♥' || card.suit === '♦' ? 'red' : 'black');
                el.innerHTML = `<span class="rank">${card.rank}</span><span class="suit">${card.suit}</span>`;
            } else {
                el.className = 'comm-card back';
                el.innerHTML = '';
            }
        });

        // Players / seats
        const players = state.players || [];
        const seats = seatsContainer.querySelectorAll('.seat');
        seats.forEach((seat, idx) => {
            const p = players[idx];
            if (!p) { seat.style.display = 'none'; return; }
            seat.style.display = 'flex';
            const bot = p.botId ? getBotById(p.botId) : null;
            const avatarContent = (p.avatar && p.avatar.startsWith('<svg')) ? p.avatar : (bot ? bot.svg : '👤');
            const name = p.name || 'Игрок';
            const stack = p.stack || 0;
            const statusText = p.status || '';
            const isActive = p.isActive !== false;
            const isFolded = p.folded === true;
            const isMine = (p.id === userId || p.id === 'me');

            seat.className = 'seat';
            if (isActive && !isFolded && !isMine) seat.classList.add('active-turn');
            if (isFolded) seat.classList.add('folded');
            if (isMine) seat.style.borderColor = 'var(--blue)';

            let statusClass = '';
            if (statusText === 'fold') statusClass = 'fold';
            else if (statusText === 'call') statusClass = 'call';
            else if (statusText === 'raise') statusClass = 'raise';
            else if (statusText === 'allin') statusClass = 'allin';

            seat.innerHTML = `
                <div class="avatar">${avatarContent}</div>
                <div class="name">${name}</div>
                <div class="stack">${stack} ₽</div>
                ${statusText ? `<div class="status-badge ${statusClass}">${statusText}</div>` : ''}
                <div class="mini-cards">
                    ${p.cards && p.cards.length ? p.cards.map(c => `<span class="mini-card ${c.suit === '♥' || c.suit === '♦' ? 'red' : 'black'}">${c.rank}${c.suit}</span>`).join('') :
                        (isMine ? '' : '<span class="mini-card back"></span><span class="mini-card back"></span>')}
                </div>
            `;
        });

        // My hand
        const myCards = state.playerCards || [];
        const handEls = myHandArea.querySelectorAll('.my-card');
        handEls.forEach((el, i) => {
            if (i < myCards.length) {
                const card = myCards[i];
                el.className = 'my-card';
                el.classList.add(card.suit === '♥' || card.suit === '♦' ? 'red' : 'black');
                el.innerHTML = `<span class="rank">${card.rank}</span><span class="suit">${card.suit}</span>`;
            } else {
                el.className = 'my-card back';
                el.innerHTML = '';
            }
        });

        // Actions
        const canAct = state.status !== 'finished' && state.players.some(p => (p.id === userId || p.id === 'me') && p.isActive && !p.folded);
        foldBtn.disabled = !canAct;
        checkBtn.disabled = !canAct;
        callBtn.disabled = !canAct;
        raiseBtn.disabled = !canAct;
        allinBtn.disabled = !canAct;

        // Raise slider (show only when can act)
        raisePanel.classList.toggle('active', canAct);
        if (canAct && state.availableActions && state.availableActions.raise) {
            const minRaise = state.availableActions.minRaise || 100;
            const maxRaise = Math.min(state.availableActions.maxRaise || state.stack || 1000, state.stack || 1000);
            raiseRange.min = minRaise;
            raiseRange.max = maxRaise;
            raiseRange.value = minRaise;
            raiseAmountDisplay.innerText = minRaise;
        }

        // Status message
        if (state.status === 'finished') {
            if (state.result && state.result.winnerId) {
                const isWin = String(state.result.winnerId) === String(userId);
                if (isWin) {
                    statusMsg.innerText = `🎉 ВЫ ПОБЕДИЛИ! +${state.result.winAmount || state.pot} ₽`;
                    statusMsg.className = 'status-msg win';
                    // Обновляем баланс из результата (если сервер вернул)
                    if (state.casino_balance !== undefined) updateBalanceUI(state.casino_balance, true);
                    // Показываем модалку один раз
                    if (resultShownForGameId !== state.gameId) {
                        resultShownForGameId = state.gameId;
                        showModal('🎉 Победа!', `Вы выиграли ${state.result.winAmount || state.pot} ₽`);
                    }
                } else {
                    statusMsg.innerText = `❌ Вы проиграли. Победитель: ${state.result.winnerName || 'бот'}`;
                    statusMsg.className = 'status-msg lose';
                    if (state.casino_balance !== undefined) updateBalanceUI(state.casino_balance);
                    if (resultShownForGameId !== state.gameId) {
                        resultShownForGameId = state.gameId;
                        showModal('❌ Поражение', `Победил ${state.result.winnerName || 'бот'}`);
                    }
                }
                gameActive = false;
                localStorage.removeItem('rgame_poker_game_id');
                // Кнопки отключаем полностью
                [foldBtn, checkBtn, callBtn, raiseBtn, allinBtn].forEach(b => b.disabled = true);
            }
        } else {
            statusMsg.innerText = `Ход: ${stageMap[state.stage] || state.stage.toUpperCase()}`;
            statusMsg.className = 'status-msg info';
        }

        // Update balance if included in state
        if (state.casino_balance !== undefined && state.casino_balance !== casinoBalance) {
            updateBalanceUI(state.casino_balance);
        }

        // Log
        if (state.log && state.log.length) {
            logPanel.innerHTML = state.log.map(entry =>
                `<div class="log-entry">${entry}</div>`
            ).join('');
        }
    }

    // ============================================================
    //  SEAT POSITIONS
    // ============================================================
    function createSeats(botCount) {
        const container = seatsContainer;
        container.innerHTML = '';
        // Always player at bottom center
        const positions = [
            { id: 'me', cls: 'seat-bottom-center' },
            { id: 'bot0', cls: 'seat-top-center' },
            { id: 'bot1', cls: 'seat-top-left' },
            { id: 'bot2', cls: 'seat-top-right' },
            { id: 'bot3', cls: 'seat-mid-left' },
            { id: 'bot4', cls: 'seat-mid-right' },
            { id: 'bot5', cls: 'seat-bottom-left' },
            { id: 'bot6', cls: 'seat-bottom-right' }
        ];
        // We'll use first 1 + botCount seats
        const used = positions.slice(0, 1 + botCount);
        used.forEach(pos => {
            const div = document.createElement('div');
            div.className = 'seat';
            div.id = `seat-${pos.id}`;
            div.style.cssText = `position:absolute; ${pos.cls};`;
            container.appendChild(div);
        });
    }

    // ============================================================
    //  START GAME
    // ============================================================
    async function startGame() {
        if (isStartingGame) return;
        const bet = parseInt(betInput.value.replace(/\D/g,'')) || 100;
        if (bet < 10) { statusMsg.innerText = '❌ Минимальная ставка 10 ₽'; return; }
        if (bet > casinoBalance) { statusMsg.innerText = '❌ Недостаточно средств'; return; }
        isStartingGame = true;
        startBtn.disabled = true;
        startBtn.textContent = 'Создаём стол...';
        statusMsg.innerText = '⏳ Запуск игры...';
        try {
            const data = await apiRequest('/poker/start', {
                method: 'POST',
                body: JSON.stringify({
                    userId: userId,
                    bet: bet,
                    botCount: botCount
                })
            });
            if (data.success) {
                gameId = data.state.gameId || data.gameId;
                if (!gameId) throw new Error('Не получен gameId');
                if (data.casino_balance !== undefined) updateBalanceUI(data.casino_balance);
                // Сохраняем gameId
                localStorage.setItem('rgame_poker_game_id', gameId);
                // Создаём места
                createSeats(botCount);
                // Переключаем интерфейс
                lobby.style.display = 'none';
                tableArea.classList.add('active');
                // Рендерим состояние
                renderState(data.state);
                statusMsg.innerText = 'Игра началась!';
                statusMsg.className = 'status-msg info';
            } else {
                throw new Error(data.error || 'Неизвестная ошибка');
            }
        } catch (e) {
            statusMsg.innerText = `❌ ${e.message}`;
            statusMsg.className = 'status-msg lose';
            startBtn.disabled = false;
            startBtn.textContent = 'Начать игру';
        } finally {
            isStartingGame = false;
        }
    }

    // ============================================================
    //  ACTIONS
    // ============================================================
    async function sendAction(action, amount = 0) {
        if (isActionInProgress || !gameId) return;
        isActionInProgress = true;
        [foldBtn, checkBtn, callBtn, raiseBtn, allinBtn].forEach(b => b.disabled = true);
        try {
            const data = await apiRequest('/poker/action', {
                method: 'POST',
                body: JSON.stringify({
                    gameId: gameId,
                    userId: userId,
                    action: action,
                    amount: amount
                })
            });
            if (data.success) {
                if (data.casino_balance !== undefined) updateBalanceUI(data.casino_balance);
                if (data.state) renderState(data.state);
                if (data.winner) {
                    // если игра завершена, обновим статус
                }
            } else {
                throw new Error(data.error || 'Ошибка действия');
            }
        } catch (e) {
            statusMsg.innerText = `❌ ${e.message}`;
            statusMsg.className = 'status-msg lose';
        } finally {
            isActionInProgress = false;
            // кнопки будут переключены в renderState при следующем обновлении
            if (gameActive) {
                // частично восстановим состояние кнопок, но лучше дождаться рендера
            }
        }
    }

    // Button handlers
    foldBtn.onclick = () => sendAction('fold');
    checkBtn.onclick = () => sendAction('check');
    callBtn.onclick = () => sendAction('call', 0);
    allinBtn.onclick = () => {
        const amount = parseInt(raiseRange.value) || 0;
        sendAction('all_in', amount);
    };
    raiseBtn.onclick = () => {
        const amount = parseInt(raiseRange.value) || 0;
        sendAction('raise', amount);
    };
    raiseRange.oninput = function() {
        raiseAmountDisplay.innerText = this.value;
    };

    // ============================================================
    //  RESTORE GAME
    // ============================================================
    async function restoreGame() {
        const savedId = localStorage.getItem('rgame_poker_game_id');
        if (!savedId || !userId) return false;
        try {
            const data = await apiRequest(`/poker/state/${savedId}?userId=${userId}`);
            if (data.success && data.state && data.state.status !== 'finished') {
                gameId = savedId;
                createSeats(data.state.players ? data.state.players.length - 1 : 3);
                lobby.style.display = 'none';
                tableArea.classList.add('active');
                renderState(data.state);
                statusMsg.innerText = 'Игра восстановлена';
                statusMsg.className = 'status-msg info';
                return true;
            } else {
                // игра завершена или не найдена
                localStorage.removeItem('rgame_poker_game_id');
                return false;
            }
        } catch (e) {
            console.warn('Не удалось восстановить игру', e);
            localStorage.removeItem('rgame_poker_game_id');
            return false;
        }
    }

    // ============================================================
    //  MODAL
    // ============================================================
    function showModal(title, text) {
        modalTitle.innerText = title;
        modalText.innerText = text;
        modalOverlay.classList.add('active');
    }
    modalBtn.onclick = function() {
        modalOverlay.classList.remove('active');
        if (!gameActive) {
            lobby.style.display = 'flex';
            tableArea.classList.remove('active');
            localStorage.removeItem('rgame_poker_game_id');
            loadBalance();
        }
    };

    // ============================================================
    //  NAVIGATION
    // ============================================================
    menuBtn.onclick = function() {
        window.location.href = 'casino.html?userId=' + encodeURIComponent(userId || '');
    };
    backBtn.onclick = function() {
        if (gameActive) {
            if (confirm('Вы уверены? Игра сохранится, вы сможете продолжить позже.')) {
                window.location.href = 'casino.html?userId=' + encodeURIComponent(userId || '');
            }
        } else {
            window.location.href = 'casino.html?userId=' + encodeURIComponent(userId || '');
        }
    };

    // Log toggle
    logToggle.onclick = function() {
        logPanel.classList.toggle('open');
        this.textContent = logPanel.classList.contains('open') ? '📜 Скрыть историю' : '📜 История раздачи';
    };

    // Quick chips
    document.querySelectorAll('.quick-chips button').forEach(btn => {
        btn.addEventListener('click', function() { betInput.value = this.dataset.amount; });
    });

    // Bot select
    document.querySelectorAll('#botSelect button').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('#botSelect button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            botCount = parseInt(this.dataset.count);
        });
    });

    // Start button
    startBtn.onclick = startGame;

    // ============================================================
    //  INIT
    // ============================================================
    async function init() {
        await loadBalance();
        const restored = await restoreGame();
        if (!restored) {
            lobby.style.display = 'flex';
            tableArea.classList.remove('active');
            statusMsg.innerText = 'Сделайте ставку и начните игру';
            statusMsg.className = 'status-msg';
        }
        // default bet
        betInput.value = '100';
        document.querySelector('#botSelect button[data-count="3"]')?.classList.add('active');
        botCount = 3;
        if (!userId) {
            statusMsg.innerText = '❌ Ошибка: userId не найден';
            statusMsg.className = 'status-msg lose';
        }
    }

    init();
})();
</script>
</body>
</html>
