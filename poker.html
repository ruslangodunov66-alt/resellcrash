<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>R-GAME POKER · Texas Hold'em</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* --------------------------------------------------------------
           1. ROOT & RESET
           -------------------------------------------------------------- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #07090d;
            --bg-elevated: #10141b;
            --felt-dark: #062d22;
            --felt-main: #0a5139;
            --felt-light: #11704d;
            --gold: #f6c95b;
            --gold-light: #ffe49a;
            --blue: #4da3ff;
            --green: #3fe38a;
            --red: #ff5964;
            --text: #f6f7fb;
            --muted: #8f98a8;
            --shadow-heavy: 0 30px 80px rgba(0, 0, 0, 0.9);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.6);
            --radius-card: 10px;
            --card-width: 64px;
            --card-height: 88px;
            --seat-size: 110px;
            --border-glow: 0 0 30px rgba(255, 215, 0, 0.15);
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            background-image: radial-gradient(circle at 20% 30%, rgba(77, 163, 255, 0.04), transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 215, 0, 0.03), transparent 50%);
        }

        /* --------------------------------------------------------------
           2. GAME WRAPPER
           -------------------------------------------------------------- */
        .game-wrapper {
            width: 100%;
            max-width: 840px;
            margin: 0 auto;
            background: var(--bg-elevated);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: var(--shadow-heavy);
            overflow: hidden;
            position: relative;
            transition: opacity 0.3s ease;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --------------------------------------------------------------
           3. HEADER
           -------------------------------------------------------------- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px 10px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }

        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(135deg, #fff, #a0c4ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 0.5px;
        }
        .brand span {
            color: var(--gold);
            -webkit-text-fill-color: var(--gold);
        }

        .balance-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.45);
            padding: 4px 16px 4px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
        }
        .balance-box .label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--muted);
            letter-spacing: 0.5px;
        }
        .balance-box .value {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 900;
            color: var(--green);
            text-shadow: 0 0 20px rgba(63, 227, 138, 0.15);
            transition: color 0.3s;
        }
        .balance-box .value.win {
            color: var(--gold);
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        .balance-box .value.lose {
            color: var(--red);
            text-shadow: 0 0 30px rgba(255, 89, 100, 0.2);
        }

        /* --------------------------------------------------------------
           4. LOBBY
           -------------------------------------------------------------- */
        .lobby {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px 40px;
            gap: 20px;
            min-height: 400px;
            background: radial-gradient(ellipse at 50% 80%, rgba(10, 81, 57, 0.15), transparent 70%);
        }

        .lobby-title {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(135deg, var(--gold), #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.1);
            letter-spacing: 1px;
        }

        .lobby-sub {
            color: var(--muted);
            font-size: 15px;
            font-weight: 500;
            text-align: center;
        }

        .lobby-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            width: 100%;
            max-width: 450px;
        }
        .lobby-row label {
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lobby-bet-input {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 10px 16px;
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            width: 140px;
            text-align: center;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border 0.2s;
        }
        .lobby-bet-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.06);
        }

        .quick-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .quick-chips button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 6px 14px;
            color: var(--muted);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .quick-chips button:hover {
            background: rgba(255, 215, 0, 0.06);
            color: #fff;
            border-color: rgba(255, 215, 0, 0.15);
        }

        .bot-select {
            display: flex;
            gap: 6px;
        }
        .bot-select button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 7px 18px;
            color: var(--muted);
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        .bot-select button.active {
            background: var(--blue);
            border-color: var(--blue);
            color: #fff;
            box-shadow: 0 0 20px rgba(77, 163, 255, 0.2);
        }

        .btn-start {
            background: linear-gradient(135deg, var(--blue), #2563eb);
            border: none;
            border-radius: 16px;
            padding: 16px 48px;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 18px;
            text-transform: uppercase;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 0 #1d4ed8, 0 8px 20px rgba(59, 130, 246, 0.25);
            transition: all 0.1s ease;
            letter-spacing: 0.5px;
            width: 100%;
            max-width: 260px;
            margin-top: 4px;
        }
        .btn-start:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1d4ed8;
        }
        .btn-start:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 0 #1d4ed8;
        }

        /* --------------------------------------------------------------
           5. TABLE AREA
           -------------------------------------------------------------- */
        .table-area {
            display: none;
            flex: 1;
            flex-direction: column;
            padding: 8px 12px 12px;
            position: relative;
            min-height: 0;
        }
        .table-area.active {
            display: flex;
        }

        /* ----- Table felt container ----- */
        .poker-table {
            position: relative;
            width: 100%;
            aspect-ratio: 1.55 / 1;
            border-radius: 48% 48% 44% 44% / 54% 54% 42% 42%;
            background: radial-gradient(ellipse at center, var(--felt-light) 0%, var(--felt-main) 55%, var(--felt-dark) 100%);
            border: 16px solid #2d1a0e;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.7), 0 12px 40px rgba(0, 0, 0, 0.6);
            margin: 0 auto;
            overflow: visible;
            flex-shrink: 0;
            min-height: 280px;
        }
        .poker-table::before {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: inherit;
            border: 1px solid rgba(255, 215, 0, 0.06);
            pointer-events: none;
        }
        .poker-table::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(ellipse at 40% 30%, rgba(255, 215, 0, 0.03), transparent 50%);
            pointer-events: none;
        }

        /* ----- Table center (community + pot) ----- */
        .table-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 2;
            pointer-events: none;
            width: 70%;
            max-width: 400px;
        }

        .community-cards {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .comm-card {
            width: var(--card-width);
            height: var(--card-height);
            border-radius: var(--radius-card);
            background: #fff;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            position: relative;
            transition: transform 0.2s;
            opacity: 0;
            transform: scale(0.8);
            animation: cardDeal 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .comm-card.show {
            opacity: 1;
            transform: scale(1);
        }
        .comm-card.red {
            color: var(--red);
        }
        .comm-card.black {
            color: #111;
        }
        .comm-card .rank {
            font-size: 16px;
            font-weight: 900;
            line-height: 1;
        }
        .comm-card .suit {
            font-size: 24px;
            line-height: 1;
        }
        .comm-card .corner {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 9px;
            font-weight: 800;
            line-height: 1;
        }
        .comm-card .corner-top {
            top: 4px;
            left: 5px;
        }
        .comm-card .corner-bottom {
            bottom: 4px;
            right: 5px;
            transform: rotate(180deg);
        }
        .comm-card .corner .suit-small {
            font-size: 9px;
        }
        .comm-card.back {
            background: repeating-linear-gradient(45deg, #1a2332, #1a2332 6px, #0d1b2a 6px, #0d1b2a 12px);
            color: transparent;
            border: 2px solid rgba(77, 163, 255, 0.15);
            box-shadow: var(--shadow-card);
        }

        @keyframes cardDeal {
            0% {
                opacity: 0;
                transform: translateY(-20px) rotateY(90deg) scale(0.6);
            }
            70% {
                opacity: 1;
                transform: translateY(4px) rotateY(-2deg) scale(1.04);
            }
            100% {
                opacity: 1;
                transform: translateY(0) rotateY(0) scale(1);
            }
        }

        /* Pot display */
        .pot-display {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 16px 4px 12px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 215, 0, 0.08);
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
            transition: transform 0.2s;
        }
        .pot-display .pot-icon {
            font-size: 20px;
        }
        .pot-display .pot-value {
            min-width: 40px;
            display: inline-block;
            transition: transform 0.3s;
        }

        .stage-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 14px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* ----- Seats ----- */
        .seat {
            position: absolute;
            width: var(--seat-size);
            height: calc(var(--seat-size) * 1.3);
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 4px 6px;
            border: 2px solid transparent;
            transition: border 0.3s, box-shadow 0.3s, transform 0.2s, opacity 0.4s;
            backdrop-filter: blur(4px);
            pointer-events: none;
            z-index: 3;
            min-width: 80px;
        }
        .seat.active-turn {
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
            transform: translate(-50%, -50%) scale(1.05);
        }
        .seat.folded {
            opacity: 0.35;
            filter: grayscale(0.8);
        }
        .seat .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
        }
        .seat .avatar svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .seat .name {
            font-size: 10px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70px;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
        }
        .seat .stack {
            font-size: 9px;
            color: var(--muted);
            font-weight: 700;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
        }
        .seat .status-badge {
            font-size: 7px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 1px 6px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
        }
        .seat .status-badge.fold {
            background: rgba(255, 89, 100, 0.2);
            color: var(--red);
        }
        .seat .status-badge.call {
            background: rgba(77, 163, 255, 0.2);
            color: var(--blue);
        }
        .seat .status-badge.raise {
            background: rgba(255, 215, 0, 0.2);
            color: var(--gold);
        }
        .seat .status-badge.allin {
            background: rgba(63, 227, 138, 0.2);
            color: var(--green);
        }

        .seat .mini-cards {
            display: flex;
            gap: 2px;
            margin-top: 2px;
        }
        .mini-card {
            width: 16px;
            height: 22px;
            background: #fff;
            border-radius: 2px;
            font-size: 7px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }
        .mini-card.red {
            color: var(--red);
        }
        .mini-card.black {
            color: #111;
        }
        .mini-card.back {
            background: repeating-linear-gradient(45deg, #1a2332, #1a2332 3px, #0d1b2a 3px, #0d1b2a 6px);
            color: transparent;
            border-color: rgba(77, 163, 255, 0.15);
        }

        /* Seat positions */
        .seat-bottom-center {
            bottom: 2%;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            background: rgba(0, 0, 0, 0.45);
            border-color: rgba(77, 163, 255, 0.15);
        }
        .seat-top-center {
            top: 3%;
            left: 50%;
            transform: translateX(-50%);
        }
        .seat-top-left {
            top: 6%;
            left: 14%;
        }
        .seat-top-right {
            top: 6%;
            right: 14%;
        }
        .seat-mid-left {
            top: 34%;
            left: 2%;
        }
        .seat-mid-right {
            top: 34%;
            right: 2%;
        }
        .seat-bottom-left {
            bottom: 8%;
            left: 10%;
        }
        .seat-bottom-right {
            bottom: 8%;
            right: 10%;
        }

        /* ----- Hero cards (player's own) ----- */
        .hero-cards {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 14px;
            z-index: 4;
            pointer-events: none;
        }

        .hero-card {
            width: 68px;
            height: 92px;
            border-radius: var(--radius-card);
            background: #fff;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            position: relative;
            opacity: 0;
            transform: scale(0.8);
            animation: cardDeal 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            border: 2px solid rgba(255, 255, 255, 0.04);
        }
        .hero-card.red {
            color: var(--red);
        }
        .hero-card.black {
            color: #111;
        }
        .hero-card .rank {
            font-size: 22px;
            font-weight: 900;
            line-height: 1;
        }
        .hero-card .suit {
            font-size: 30px;
            line-height: 1;
        }
        .hero-card .corner {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            font-weight: 800;
            line-height: 1;
        }
        .hero-card .corner-top {
            top: 5px;
            left: 6px;
        }
        .hero-card .corner-bottom {
            bottom: 5px;
            right: 6px;
            transform: rotate(180deg);
        }
        .hero-card .corner .suit-small {
            font-size: 11px;
        }
        .hero-card.back {
            background: repeating-linear-gradient(45deg, #1a2332, #1a2332 8px, #0d1b2a 8px, #0d1b2a 16px);
            color: transparent;
            border-color: rgba(77, 163, 255, 0.2);
        }

        /* --------------------------------------------------------------
           6. ACTION PANEL
           -------------------------------------------------------------- */
        .action-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            padding: 8px 0 4px;
            flex-shrink: 0;
            width: 100%;
            max-width: 540px;
            align-self: center;
        }

        .action-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .action-btn {
            border: none;
            border-radius: 12px;
            padding: 12px 16px;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            color: #fff;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
            flex: 1;
            min-width: 60px;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
            background: #1e2530;
            box-shadow: 0 4px 0 #0d121a;
        }
        .action-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.04) 100%);
            pointer-events: none;
        }
        .action-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
        }
        .action-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
        }

        .action-btn.fold {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 0 #b91c1c;
        }
        .action-btn.check {
            background: linear-gradient(135deg, #475569, #334155);
            box-shadow: 0 4px 0 #1e293b;
        }
        .action-btn.call {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 4px 0 #1d4ed8;
        }
        .action-btn.raise {
            background: linear-gradient(135deg, var(--gold), #f59e0b);
            color: #0a0e17;
            box-shadow: 0 4px 0 #b36b00;
        }
        .action-btn.allin {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 4px 0 #15803d;
        }

        .raise-control {
            display: none;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 12px;
            padding: 6px 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
        }
        .raise-control.active {
            display: flex;
        }

        .raise-control input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #1e2530;
            border-radius: 2px;
            outline: none;
        }
        .raise-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            background: radial-gradient(circle at 30% 30%, var(--gold), #d4a017);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        .raise-control span {
            font-weight: 800;
            font-size: 20px;
            min-width: 60px;
            text-align: center;
            color: #fff;
            font-family: 'Playfair Display', serif;
        }

        /* --------------------------------------------------------------

        .log-toggle {
            background: none;

        .log-panel .log-entry {

        .log-panel .log-entry .hl {

        }

        .btn-menu {
            background: rgba(255, 255, 255, 0.04);

            border-radius: 12px;

            font-size: 13px;

        .btn-menu:hover {
            background: rgba(255, 255, 255, 0.06);

        }

        /* --------------------------------------------------------------
           8. MODAL
           -------------------------------------------------------------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 7, 12, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: radial-gradient(ellipse at 50% 0%, rgba(30, 41, 59, 0.95), rgba(11, 17, 29, 0.98));
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 28px;
            max-width: 420px;
            width: 100%;
            padding: 32px 28px 28px;
            box-shadow: var(--shadow-heavy);
            text-align: center;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-box {
            transform: scale(1) translateY(0);
        }

        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 900;
            color: var(--gold);
            margin-bottom: 8px;
        }
        .modal-title.lose {
            color: var(--red);
        }
        .modal-text {
            font-size: 17px;
            color: var(--text);
            margin-bottom: 20px;
            line-height: 1.6;
            font-weight: 500;
        }
        .modal-text .highlight {
            color: var(--gold);
            font-weight: 700;
        }

        .modal-btn {
            padding: 14px 36px;
            border-radius: 14px;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: all 0.1s ease;
            text-transform: uppercase;

        }
        .modal-btn.primary {
            background: linear-gradient(135deg, var(--gold), #f59e0b);

            box-shadow: 0 4px 0 #b36b00;
        }
        .modal-btn.primary:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b36b00;
        }
        .modal-btn.secondary {
            background: rgba(255, 255, 255, 0.04);

            border: 1px solid rgba(255, 255, 255, 0.06);

        /* --------------------------------------------------------------
           9. RESPONSIVE
           -------------------------------------------------------------- */
        @media (max-width: 680px) {

            }

            }

            }

        @media (max-width: 460px) {
            :root {
                --seat-size: 66px;
                --card-width: 34px;

            }

            }
            .seat .stack {
                font-size: 7px;
            }

                width: 12px;

            }
            .hero-card {
                width: 44px;

            }
            .hero-card .rank {
                font-size: 15px;
            }
            .hero-card .suit {
                font-size: 20px;
            }
            .hero-card .corner {

            }
            .hero-card .corner .suit-small {

            }
            .comm-card {
                width: var(--card-width);
                height: var(--card-height);
            }
            .comm-card .rank {
                font-size: 11px;
            }
            .comm-card .suit {
                font-size: 14px;
            }
            .comm-card .corner {
                font-size: 6px;
            }
            .comm-card .corner .suit-small {
                font-size: 6px;
            }
            .pot-display {
                font-size: 12px;
                padding: 2px 10px;
            }
            .action-btn {
                font-size: 9px;
                padding: 8px 8px;
                min-width: 36px;
            }
            .poker-table {
                border-width: 10px;
            }
            .lobby-title {
                font-size: 24px;
            }
            .btn-start {
                font-size: 15px;
                padding: 14px 28px;
                max-width: 200px;
            }
            .seat-bottom-center {
                width: 80px;
                bottom: 1%;
            }
            .hero-cards {
                gap: 8px;
                bottom: 5%;
            }

                width: 80%;
            }

                gap: 4px;

        /* --------------------------------------------------------------
           10. UTILITIES
           -------------------------------------------------------------- */
        .hidden {
            display: none !important;
        }

        .chip-float {
            display: inline-block;
            animation: chipFloat 1.5s ease-in-out infinite;
        }
        @keyframes chipFloat {
            0%,
            100% {
                transform: translateY(0);
            }

                transform: translateY(-4px);
            }
        }

            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* --------------------------------------------------------------
           11. CARD BACK (фирменная рубашка)
           -------------------------------------------------------------- */
        .card-back-design {
            width: 100%;
            height: 100%;
            border-radius: var(--radius-card);
            background: radial-gradient(ellipse at 30% 40%, #0a2a4a, #0d1b2a);
            border: 2px solid rgba(255, 215, 0, 0.15);

        .card-back-design .pattern {
            position: absolute;

            background-image:
                repeating-linear-gradient(45deg, rgba(255, 215, 0, 0.02) 0px, rgba(255, 215, 0, 0.02) 4px, transparent 4px, transparent 8px),
                repeating-linear-gradient(-45deg, rgba(255, 215, 0, 0.02) 0px, rgba(255, 215, 0, 0.02) 4px, transparent 4px, transparent 8px);
        }
        .card-back-design .logo {
            font-family: 'Playfair Display', serif;
            font-size: 44px;
            font-weight: 900;
            font-style: italic;

            text-shadow: 0 0 30px rgba(255, 215, 0, 0.04);
            z-index: 1;
            line-height: 1;
        }
        .card-back-design .brand {
            font-size: 9px;
            font-weight: 700;

            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <!-- HEADER -->
        <div class="header">
            <div class="brand">R-<span>POKER</span></div>
            <div class="balance-box">
                <span class="label">Баланс</span>
                <span class="value" id="balanceDisplay">0 ₽</span>
            </div>
        </div>

        <!-- LOBBY -->
        <div class="lobby" id="lobby">
            <div class="lobby-title">♠️ Техасский Холдем</div>
            <div class="lobby-sub">Выберите ставку и соперников</div>
            <div class="lobby-row">
                <label>Ставка
                    <input type="text" class="lobby-bet-input" id="betInput" value="100" inputmode="numeric">
                </label>
                <div class="quick-chips">
                    <button data-amount="100">100</button>
                    <button data-amount="250">250</button>
                    <button data-amount="500">500</button>
                    <button data-amount="1000">1К</button>
                    <button data-amount="5000">5К</button>

        <!-- TABLE AREA -->
        <div class="table-area" id="tableArea">
            <div class="poker-table" id="pokerTable">
                <!-- Seats will be inserted here by JS -->
                <div id="seatsContainer"></div>

                <!-- Center -->
                <div class="table-center">
                    <div class="community-cards" id="communityCards">
                        <div class="comm-card back"></div>
                        <div class="comm-card back"></div>
                        <div class="comm-card back"></div>
                        <div class="comm-card back"></div>
                        <div class="comm-card back"></div>
                    </div>
                    <div class="pot-display">
                        <span class="pot-icon">🏆</span>
                        <span class="pot-value" id="potDisplay">0</span>

                </div>

                <!-- Hero cards (my hand) -->
                <div class="hero-cards" id="heroCards">
                    <div class="hero-card back"></div>
                    <div class="hero-card back"></div>
                </div>

            <!-- Action panel -->
            <div class="action-panel" id="actionPanel">
                <div class="action-row">
                    <button class="action-btn fold" id="foldBtn" disabled>Fold</button>

                </div>
                <div class="action-row">
                    <div class="raise-control" id="raiseControl">
                        <span class="raise-label">Raise</span>
                        <input type="range" id="raiseRange" min="0" max="1000" value="0" step="10">
                        <span id="raiseAmountDisplay">0</span>
                    </div>
                </div>
                <div class="action-row">
                    <button class="action-btn raise" id="raiseBtn" disabled>Raise</button>
                    <button class="action-btn allin" id="allinBtn" disabled>All-in</button>
                </div>

            <div class="status-msg" id="statusMsg">Ожидание хода</div>

            <button class="log-toggle" id="logToggle">📜 История раздачи</button>
            <div class="log-panel" id="logPanel"></div>

            <button class="btn-menu" id="menuBtn">🏠 В меню</button>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">🎉 Победа!</div>
            <div class="modal-text" id="modalText">Вы выиграли <span class="highlight">0 ₽</span></div>
            <div>
                <button class="modal-btn primary" id="modalBtnPrimary">Продолжить</button>
                <button class="modal-btn secondary" id="modalBtnSecondary">В меню</button>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  ПОЛНОСТЬЮ НОВЫЙ poker.html – клиентская часть
        //  Архитектура: модули, нормализация, анимации, адаптивность
        //  Серверный контракт сохранён
        // ================================================================

        (function() {
            'use strict';

            // =============================================================
            //  CONFIG
            // =============================================================
            const API_BASE = 'https://resellgame.bothost.tech';
            const TIMEOUT_MS = 15000;
            const STORAGE_KEY = 'rgame_poker_game_id';

            // =============================================================
            //  TELEGRAM / USER
            // =============================================================
            const tg = window.Telegram?.WebApp;
            if (tg) {
                tg.expand();
                tg.enableClosingConfirmation();
            }

            const urlParams = new URLSearchParams(window.location.search);
            const userId =
                urlParams.get('userId') ||
                urlParams.get('user_id') ||
                tg?.initDataUnsafe?.user?.id;

            if (!userId) {
                console.warn('⚠️ userId не найден');
            }

            // =============================================================
            //  DOM REFS
            // =============================================================
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);

            const balanceEl = document.getElementById('balanceDisplay');
            const lobby = document.getElementById('lobby');
            const tableArea = document.getElementById('tableArea');
            const seatsContainer = document.getElementById('seatsContainer');
            const communityCards = document.getElementById('communityCards');
            const heroCards = document.getElementById('heroCards');
            const potDisplay = document.getElementById('potDisplay');
            const stageLabel = document.getElementById('stageLabel');
            const statusMsg = document.getElementById('statusMsg');
            const logPanel = document.getElementById('logPanel');
            const logToggle = document.getElementById('logToggle');
            const foldBtn = document.getElementById('foldBtn');
            const checkBtn = document.getElementById('checkBtn');
            const callBtn = document.getElementById('callBtn');
            const raiseBtn = document.getElementById('raiseBtn');
            const allinBtn = document.getElementById('allinBtn');
            const raiseControl = document.getElementById('raiseControl');
            const raiseRange = document.getElementById('raiseRange');
            const raiseAmountDisplay = document.getElementById('raiseAmountDisplay');
            const startBtn = document.getElementById('startBtn');
            const betInput = document.getElementById('betInput');
            const menuBtn = document.getElementById('menuBtn');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalText = document.getElementById('modalText');
            const modalBtnPrimary = document.getElementById('modalBtnPrimary');
            const modalBtnSecondary = document.getElementById('modalBtnSecondary');

            // =============================================================
            //  STATE
            // =============================================================
            const state = {
                gameId: null,
                status: null,
                stage: 'preflop',
                pot: 0,
                communityCards: [],
                playerCards: [],
                players: [],
                currentTurn: null,
                availableActions: {},
                result: null,
                casinoBalance: 0,
                log: [],
                isActive: false,
                isFinished: false,
                isLoading: false,
            };

            let balance = 0;
            let botCount = 3;
            let bet = 100;

            // =============================================================
            //  API SERVICE
            // =============================================================
            const ApiService = {
                async requestJSON(url, options = {}, timeoutMs = TIMEOUT_MS) {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
                    try {
                        const response = await fetch(url, {
                            ...options,
                            signal: controller.signal,
                            headers: {
                                'Content-Type': 'application/json',
                                ...(options.headers || {})
                            }
                        });
                        const text = await response.text();
                        let data = {};
                        try {
                            data = text ? JSON.parse(text) : {};
                        } catch {
                            throw new Error('Сервер вернул некорректный ответ');
                        }
                        if (!response.ok || data.success === false) {
                            throw new Error(data.error || data.detail || `Ошибка сервера: ${response.status}`);
                        }
                        return data;
                    } finally {
                        clearTimeout(timeoutId);
                    }
                },

                async loadProfile(tgId) {
                    return this.requestJSON(`${API_BASE}/profile/${tgId}`, { cache: 'no-cache' });
                },

                async startGame(payload) {
                    return this.requestJSON(`${API_BASE}/poker/start`, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                },

                async sendAction(payload) {
                    return this.requestJSON(`${API_BASE}/poker/action`, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                },

                async getState(gameId, tgId) {
                    return this.requestJSON(`${API_BASE}/poker/state/${gameId}?userId=${tgId}`, { cache: 'no-cache' });
                }
            };

            // =============================================================
            //  STATE NORMALIZER
            // =============================================================
            function normalizePokerState(raw) {
                if (!raw) raw = {};
                const players = Array.isArray(raw.players) ? raw.players : [];

                // Нормализуем players: добавляем id, isActive и т.д.
                const normalizedPlayers = players.map(p => ({
                    id: p.id || p.playerId || p.tgId || null,
                    seat: p.seat || p.seat_number || 0,
                    name: p.name || 'Игрок',
                    avatar: p.avatar || '👤',
                    stack: Number(p.stack || p.chips || 0),
                    bet: Number(p.bet || p.currentBet || p.current_bet || 0),
                    isBot: !!p.isBot || !!p.is_bot,
                    isActive: !p.folded && !p.all_in, // упрощённо
                    folded: !!p.folded,
                    allIn: !!p.all_in || !!p.allIn,
                    cards: p.cards || p.hand || [],
                    statusText: p.status || ''
                }));

                const myCards = Array.isArray(raw.playerCards) ? raw.playerCards : (Array.isArray(raw.player_cards) ? raw
                    .player_cards : []);

                return {
                    gameId: raw.gameId || raw.game_id || null,
                    status: raw.status || (raw.currentStage === 'finished' ? 'finished' : 'active'),
                    stage: raw.stage || raw.currentStage || 'preflop',
                    pot: Number(raw.pot || 0),
                    communityCards: Array.isArray(raw.communityCards) ? raw.communityCards : (Array.isArray(raw
                        .community_cards) ? raw.community_cards : []),
                    playerCards: myCards,
                    players: normalizedPlayers,
                    currentTurn: raw.currentTurn || raw.current_turn || null,
                    availableActions: raw.availableActions || raw.available_actions || {},
                    result: raw.result || null,
                    casinoBalance: raw.casino_balance ?? raw.casinoBalance ?? raw.balance ?? undefined,
                    log: Array.isArray(raw.log) ? raw.log : []
                };
            }

            // =============================================================
            //  STATE MANAGER
            // =============================================================
            const StateManager = {
                update(rawState) {
                    const norm = normalizePokerState(rawState);
                    Object.assign(state, norm);
                    state.isActive = (state.status !== 'finished');
                    state.isFinished = (state.status === 'finished');
                    return state;
                },

                get() { return state; },

                getPlayerById(id) {
                    return state.players.find(p => String(p.id) === String(id));
                },

                getHero() {
                    return state.players.find(p => !p.isBot && String(p.id) === String(userId));
                },

                isMyTurn() {
                    const hero = this.getHero();
                    if (!hero) return false;
                    return state.currentTurn === hero.seat;
                }
            };

            // =============================================================
            //  RENDERER
            // =============================================================
            const Renderer = {
                render() {
                    this.renderTable();
                    this.renderPlayers();
                    this.renderCommunityCards();
                    this.renderHeroCards();
                    this.renderPot();
                    this.renderStage();
                    this.renderActions();
                    this.renderStatus();
                    this.renderLog();
                    this.renderBalance();
                },

                renderTable() {
                    // Пока ничего особенного, только классы
                },

                renderPlayers() {
                    const container = seatsContainer;
                    container.innerHTML = '';

                    const sorted = [...state.players].sort((a, b) => a.seat - b.seat);
                    // seat 0 – это hero, остальные боты
                    const hero = sorted.find(p => !p.isBot);
                    const bots = sorted.filter(p => p.isBot);

                    // Определяем позиции для мест
                    const positionMap = [
                        'seat-bottom-center', // hero
                        'seat-top-center',
                        'seat-top-left',
                        'seat-top-right',
                        'seat-mid-left',
                        'seat-mid-right',
                        'seat-bottom-left',
                        'seat-bottom-right'
                    ];

                    // Все игроки: сначала hero, потом боты
                    const allPlayers = [hero, ...bots].filter(p => p);

                    allPlayers.forEach((p, index) => {
                        const div = document.createElement('div');
                        div.className = 'seat';
                        if (index === 0) {
                            div.classList.add('seat-bottom-center');
                            div.style.borderColor = 'rgba(77,163,255,0.15)';
                        } else {
                            const pos = positionMap[index] || 'seat-top-center';
                            div.classList.add(pos);
                        }

                        if (p.seat === state.currentTurn && !p.folded) {
                            div.classList.add('active-turn');
                        }
                        if (p.folded) {
                            div.classList.add('folded');
                        }

                        // Аватар (SVG или заглушка)
                        let avatarHTML = p.avatar || '👤';
                        if (typeof avatarHTML === 'string' && avatarHTML.startsWith('<svg')) {
                            avatarHTML = `<div class="avatar">${avatarHTML}</div>`;
                        } else {
                            avatarHTML = `<div class="avatar"><span style="font-size:28px;">${avatarHTML}</span></div>`;
                        }

                        // Мини-карты
                        let miniCardsHTML = '';
                        if (p.cards && p.cards.length) {
                            miniCardsHTML = p.cards.map(c =>
                                `<span class="mini-card ${c.suit === '♥' || c.suit === '♦' ? 'red' : 'black'}">${c.rank}${c.suit}</span>`
                            ).join('');
                        } else if (!p.isBot && p === hero) {
                            // hero без карт – показываем рубашки
                            miniCardsHTML = `<span class="mini-card back"></span><span class="mini-card back"></span>`;
                        } else {
                            miniCardsHTML = `<span class="mini-card back"></span><span class="mini-card back"></span>`;
                        }

                        let statusBadge = '';
                        if (p.statusText) {
                            let cls = '';
                            if (p.statusText === 'fold') cls = 'fold';
                            else if (p.statusText === 'call') cls = 'call';
                            else if (p.statusText === 'raise') cls = 'raise';
                            else if (p.statusText === 'allin') cls = 'allin';
                            statusBadge = `<div class="status-badge ${cls}">${p.statusText}</div>`;
                        }

                        div.innerHTML = `
                            ${avatarHTML}
                            <div class="name">${p.name}</div>
                            <div class="stack">${p.stack} ₽</div>
                            ${statusBadge}
                            <div class="mini-cards">${miniCardsHTML}</div>
                        `;
                        container.appendChild(div);
                    });
                },

                renderCommunityCards() {
                    const cards = state.communityCards || [];
                    const containers = communityCards.querySelectorAll('.comm-card');
                    containers.forEach((el, i) => {
                        if (i < cards.length) {
                            const card = cards[i];
                            const isRed = (card.suit === '♥' || card.suit === '♦');
                            el.className = 'comm-card show';
                            el.classList.add(isRed ? 'red' : 'black');
                            el.innerHTML = `
                                <span class="corner corner-top"><span>${card.rank}</span><span class="suit-small">${card.suit}</span></span>
                                <span class="rank">${card.rank}</span>
                                <span class="suit">${card.suit}</span>
                                <span class="corner corner-bottom"><span>${card.rank}</span><span class="suit-small">${card.suit}</span></span>
                            `;
                        } else {
                            el.className = 'comm-card back';
                            el.innerHTML = '';
                        }
                    });
                },

                renderHeroCards() {
                    const cards = state.playerCards || [];
                    const containers = heroCards.querySelectorAll('.hero-card');
                    containers.forEach((el, i) => {
                        if (i < cards.length) {
                            const card = cards[i];
                            const isRed = (card.suit === '♥' || card.suit === '♦');
                            el.className = 'hero-card';
                            el.classList.add(isRed ? 'red' : 'black');
                            el.innerHTML = `
                                <span class="corner corner-top"><span>${card.rank}</span><span class="suit-small">${card.suit}</span></span>
                                <span class="rank">${card.rank}</span>
                                <span class="suit">${card.suit}</span>
                                <span class="corner corner-bottom"><span>${card.rank}</span><span class="suit-small">${card.suit}</span></span>
                            `;
                        } else {
                            el.className = 'hero-card back';
                            el.innerHTML = '';
                        }
                    });
                },

                renderPot() {
                    potDisplay.textContent = state.pot || 0;
                },

                renderStage() {
                    const stageMap = {
                        preflop: 'ПРЕФЛОП',
                        flop: 'ФЛОП',
                        turn: 'ТЁРН',
                        river: 'РИВЕР',
                        showdown: 'ШОУДАУН',
                        finished: 'ЗАВЕРШЕНА'
                    };
                    stageLabel.textContent = stageMap[state.stage] || state.stage.toUpperCase();
                },

                renderActions() {
                    const actions = state.availableActions || {};
                    const isMyTurn = StateManager.isMyTurn() && !state.isFinished;
                    const hero = StateManager.getHero();

                    foldBtn.disabled = !(isMyTurn && actions.fold);
                    checkBtn.disabled = !(isMyTurn && actions.check);
                    callBtn.disabled = !(isMyTurn && actions.call);
                    raiseBtn.disabled = !(isMyTurn && actions.raise);
                    allinBtn.disabled = !(isMyTurn && actions.allIn);

                    // Raise control
                    const canRaise = isMyTurn && actions.raise;
                    raiseControl.classList.toggle('active', canRaise);
                    if (canRaise && hero) {
                        const minRaise = Math.max(100, state.pot * 0.5);
                        const maxRaise = Math.min(hero.stack || 1000, 10000);
                        raiseRange.min = minRaise;
                        raiseRange.max = Math.max(minRaise, maxRaise);
                        const currentVal = parseInt(raiseRange.value) || minRaise;
                        raiseRange.value = Math.min(Math.max(currentVal, minRaise), maxRaise);
                        raiseAmountDisplay.textContent = Math.min(Math.max(currentVal, minRaise), maxRaise);
                    }
                },

                renderStatus() {
                    if (state.isFinished) {
                        if (state.result && state.result.winnerId) {
                            const isWin = String(state.result.winnerId) === String(userId);
                            if (isWin) {
                                const winAmount = state.result.winAmount || state.pot || 0;
                                statusMsg.textContent = `🎉 ВЫ ПОБЕДИЛИ! +${winAmount} ₽`;
                                statusMsg.className = 'status-msg win';
                            } else {
                                const winnerName = state.result.winnerName || 'бот';
                                statusMsg.textContent = `❌ Вы проиграли. Победитель: ${winnerName}`;
                                statusMsg.className = 'status-msg lose';
                            }
                        } else {
                            statusMsg.textContent = '♠ Раздача завершена';
                            statusMsg.className = 'status-msg';
                        }
                    } else {
                        const stageMap = { preflop: 'Префлоп', flop: 'Флоп', turn: 'Тёрн', river: 'Ривер',
                            showdown: 'Шоудаун' };
                        const stageText = stageMap[state.stage] || state.stage;
                        if (StateManager.isMyTurn() && !state.isFinished) {
                            statusMsg.textContent = `♠ Ваш ход · ${stageText}`;
                            statusMsg.className = 'status-msg info';
                        } else {
                            statusMsg.textContent = `♠ ${stageText}`;
                            statusMsg.className = 'status-msg';
                        }
                    }
                },

                renderLog() {
                    if (state.log && state.log.length) {
                        logPanel.innerHTML = state.log.map(entry =>
                            `<div class="log-entry">${entry}</div>`
                        ).join('');
                    } else {
                        logPanel.innerHTML = '';
                    }
                },

                renderBalance() {
                    if (state.casinoBalance !== undefined && state.casinoBalance !== balance) {
                        balance = state.casinoBalance;
                        balanceEl.textContent = balance.toLocaleString('ru-RU') + ' ₽';
                        // анимация
                        balanceEl.classList.remove('win', 'lose');
                        // можно добавить эффект
                    }
                },

                updateBalanceFromServer(newBalance) {
                    if (newBalance !== undefined) {
                        balance = Number(newBalance);
                        balanceEl.textContent = balance.toLocaleString('ru-RU') + ' ₽';
                        balanceEl.classList.remove('win', 'lose');
                        // если увеличилось – win, уменьшилось – lose (упрощённо)
                        // позже можно добавить логику
                    }
                }
            };

            // =============================================================
            //  ACTION CONTROLLER
            // =============================================================
            const ActionController = {
                async sendAction(action, amount = 0) {
                    if (!state.gameId) return;
                    if (state.isLoading) return;
                    state.isLoading = true;
                    try {
                        const payload = {
                            gameId: state.gameId,
                            userId: userId,
                            action: action,
                            amount: amount
                        };
                        const data = await ApiService.sendAction(payload);
                        if (data.success) {
                            if (data.casino_balance !== undefined) {
                                Renderer.updateBalanceFromServer(data.casino_balance);
                            }
                            if (data.state) {
                                StateManager.update(data.state);
                                Renderer.render();
                                if (data.winner) {
                                    // результат
                                }
                            }
                            if (data.winAmount) {
                                // если есть выигрыш, показываем модалку?
                            }
                        } else {
                            throw new Error(data.error || 'Ошибка действия');
                        }
                    } catch (err) {
                        console.error('Action error:', err);
                        statusMsg.textContent = `❌ ${err.message}`;
                        statusMsg.className = 'status-msg lose';
                    } finally {
                        state.isLoading = false;
                        Renderer.renderActions();
                    }
                }
            };

            // =============================================================
            //  MODAL CONTROLLER
            // =============================================================
            const ModalController = {
                show(title, text, isWin = true) {
                    modalTitle.textContent = title;
                    modalTitle.className = 'modal-title' + (isWin ? '' : ' lose');
                    modalText.innerHTML = text;
                    modalOverlay.classList.add('active');
                },
                hide() {
                    modalOverlay.classList.remove('active');
                }
            };

            // =============================================================
            //  GAME FLOW
            // =============================================================
            async function loadProfile() {
                if (!userId) return;
                try {
                    const data = await ApiService.loadProfile(userId);
                    if (data.casino_balance !== undefined) {
                        balance = Number(data.casino_balance);
                        balanceEl.textContent = balance.toLocaleString('ru-RU') + ' ₽';
                    }
                } catch (err) {
                    console.warn('Ошибка загрузки профиля:', err);
                }
            }

            async function startPokerGame() {
                if (state.isLoading) return;
                const rawBet = betInput.value.replace(/\s/g, '');
                const betAmount = parseInt(rawBet) || 100;
                if (betAmount < 10) {
                    statusMsg.textContent = '❌ Минимальная ставка 10 ₽';
                    statusMsg.className = 'status-msg lose';
                    return;
                }
                if (betAmount > balance) {
                    statusMsg.textContent = '❌ Недостаточно средств';
                    statusMsg.className = 'status-msg lose';
                    return;
                }

                state.isLoading = true;
                startBtn.disabled = true;
                startBtn.textContent = 'Подготавливаем стол...';
                statusMsg.textContent = '⏳ Запуск игры...';
                statusMsg.className = 'status-msg info';

                try {
                    const payload = {
                        userId: userId,
                        bet: betAmount,
                        botCount: botCount
                    };
                    const data = await ApiService.startGame(payload);
                    if (data.success) {
                        state.gameId = data.gameId || data.state?.gameId;
                        if (!state.gameId) throw new Error('Не получен gameId');
                        if (data.casino_balance !== undefined) {
                            Renderer.updateBalanceFromServer(data.casino_balance);
                        }
                        localStorage.setItem(STORAGE_KEY, state.gameId);
                        // Переключаем интерфейс
                        lobby.style.display = 'none';
                        tableArea.classList.add('active');
                        // Применяем состояние
                        if (data.state) {
                            StateManager.update(data.state);
                            Renderer.render();
                        }
                        statusMsg.textContent = '♠ Игра началась!';
                        statusMsg.className = 'status-msg info';
                    } else {
                        throw new Error(data.error || 'Неизвестная ошибка');
                    }
                } catch (err) {
                    statusMsg.textContent = `❌ ${err.message}`;
                    statusMsg.className = 'status-msg lose';
                    startBtn.disabled = false;
                    startBtn.textContent = '♠ Сесть за стол';
                } finally {
                    state.isLoading = false;
                }
            }

            async function restoreGame() {
                const savedId = localStorage.getItem(STORAGE_KEY);
                if (!savedId || !userId) return false;
                try {
                    const data = await ApiService.getState(savedId, userId);
                    if (data.success && data.state) {
                        const norm = normalizePokerState(data.state);
                        if (norm.status !== 'finished') {
                            state.gameId = savedId;
                            // Создаём места (но они уже будут созданы при рендере)
                            lobby.style.display = 'none';
                            tableArea.classList.add('active');
                            StateManager.update(data.state);
                            Renderer.render();
                            statusMsg.textContent = '♠ Игра восстановлена';
                            statusMsg.className = 'status-msg info';
                            return true;
                        } else {
                            // игра завершена – очищаем
                            localStorage.removeItem(STORAGE_KEY);
                            return false;
                        }
                    } else {
                        localStorage.removeItem(STORAGE_KEY);
                        return false;
                    }
                } catch (err) {
                    console.warn('Не удалось восстановить игру:', err);
                    localStorage.removeItem(STORAGE_KEY);
                    return false;
                }
            }

            function clearGame() {
                localStorage.removeItem(STORAGE_KEY);
                state.gameId = null;
                state.isActive = false;
                state.isFinished = true;
                lobby.style.display = 'flex';
                tableArea.classList.remove('active');
                statusMsg.textContent = 'Сделайте ставку и начните игру';
                statusMsg.className = 'status-msg';
                // Сброс карт и игроков
                StateManager.update({});
                Renderer.render();
            }

            // =============================================================
            //  EVENT BINDINGS
            // =============================================================
            // Start button
            startBtn.addEventListener('click', startPokerGame);

            // Quick chips
            document.querySelectorAll('.quick-chips button').forEach(btn => {
                btn.addEventListener('click', function() {
                    if (this.dataset.amount === 'MAX') {
                        betInput.value = balance;
                    } else {
                        betInput.value = this.dataset.amount;
                    }
                });
            });

            // Bot select
            document.querySelectorAll('#botSelect button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#botSelect button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    botCount = parseInt(this.dataset.count);
                });
            });

            // Action buttons
            foldBtn.addEventListener('click', () => ActionController.sendAction('fold'));
            checkBtn.addEventListener('click', () => ActionController.sendAction('check'));
            callBtn.addEventListener('click', () => ActionController.sendAction('call'));
            raiseBtn.addEventListener('click', () => {
                const amount = parseInt(raiseRange.value) || 0;
                ActionController.sendAction('raise', amount);
            });
            allinBtn.addEventListener('click', () => {
                const amount = parseInt(raiseRange.value) || 0;
                ActionController.sendAction('all_in', amount);
            });

            raiseRange.addEventListener('input', function() {
                raiseAmountDisplay.textContent = this.value;
            });

            // Log toggle
            logToggle.addEventListener('click', function() {
                logPanel.classList.toggle('open');
                this.textContent = logPanel.classList.contains('open') ? '📜 Скрыть историю' : '📜 История раздачи';
            });

            // Menu button (навигация)
            menuBtn.addEventListener('click', function() {
                if (state.isActive) {
                    if (confirm('Вы уверены? Игра сохранится, вы сможете продолжить позже.')) {
                        window.location.href = 'casino.html?userId=' + encodeURIComponent(userId || '');
                    }
                } else {
                    window.location.href = 'casino.html?userId=' + encodeURIComponent(userId || '');
                }
            });

            // Modal buttons
            modalBtnPrimary.addEventListener('click', function() {
                ModalController.hide();
                if (state.isFinished) {
                    clearGame();
                    loadProfile();
                }
            });

            modalBtnSecondary.addEventListener('click', function() {
                ModalController.hide();
                clearGame();
                loadProfile();
            });

            // =============================================================
            //  INIT
            // =============================================================
            async function init() {
                await loadProfile();
                const restored = await restoreGame();
                if (!restored) {
                    lobby.style.display = 'flex';
                    tableArea.classList.remove('active');
                    statusMsg.textContent = 'Сделайте ставку и начните игру';
                    statusMsg.className = 'status-msg';
                }
                betInput.value = '100';
                document.querySelector('#botSelect button[data-count="3"]')?.classList.add('active');
                botCount = 3;
                if (!userId) {
                    statusMsg.textContent = '❌ Ошибка: userId не найден';
                    statusMsg.className = 'status-msg lose';
                }
            }

            init();

        })();
    </script>
</body>
</html>
