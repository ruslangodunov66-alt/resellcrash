<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>♠️ R-GAME POKER · Texas Hold'em</title>
    <script src="https://telegram.org/js/telegram-web-app.js">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet" />
    <style>
        /* ═══════════════════════════════════════════════
           ROOT VARIABLES
           ═══════════════════════════════════════════════ */
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111927;
            --bg-panel: rgba(17, 25, 41, 0.85);
            --bg-glass: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.06);
            --border-glow: rgba(255, 215, 0, 0.12);

            --gold: #ffd700;
            --gold-dim: rgba(255, 215, 0, 0.15);
            --gold-glow: rgba(255, 215, 0, 0.25);
            --blue: #3b82f6;
            --blue-dim: rgba(59, 130, 246, 0.15);
            --green: #22c55e;
            --green-dim: rgba(34, 197, 94, 0.15);
            --red: #ef4444;
            --red-dim: rgba(239, 68, 68, 0.15);
            --purple: #8b5cf6;
            --orange: #f59e0b;

            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #475569;

            --shadow-heavy: 0 30px 80px rgba(0, 0, 0, 0.9);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 60px rgba(255, 215, 0, 0.08);

            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --radius-full: 9999px;

            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --transition-bounce: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);

            --seat-size: 100px;
            --card-width: 56px;
            --card-height: 78px;
        }

        /* ═══════════════════════════════════════════════
           RESET & BASE
           ═══════════════════════════════════════════════ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(59, 130, 246, 0.04), transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(255, 215, 0, 0.03), transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(139, 92, 246, 0.02), transparent 70%);
            overflow-x: hidden;
        }

        /* ═══════════════════════════════════════════════
           SCROLLBAR
           ═══════════════════════════════════════════════ */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gold-dim);
            border-radius: 4px;
        }

        /* ═══════════════════════════════════════════════
           WRAPPER
           ═══════════════════════════════════════════════ */
        .game-wrapper {
            max-width: 860px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* ═══════════════════════════════════════════════
           HEADER
           ═══════════════════════════════════════════════ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px 14px 4px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-back {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 7px 16px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition-fast);
            font-family: 'Inter', sans-serif;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            letter-spacing: 0.3px;
        }
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .btn-back:active {
            transform: scale(0.94);
        }

        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(135deg, #fff 40%, #93b4ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 0.5px;
            text-shadow: 0 0 40px rgba(59, 130, 246, 0.08);
        }
        .brand span {
            color: var(--gold);
            -webkit-text-fill-color: var(--gold);
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.15);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .balance-wrap {
            background: rgba(0, 0, 0, 0.45);
            border-radius: var(--radius-full);
            padding: 5px 20px 5px 16px;
            border: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: var(--transition-fast);
        }
        .balance-wrap:hover {
            border-color: rgba(255, 255, 255, 0.08);
        }

        .balance-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.8px;
        }

        .balance-value {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 900;
            color: var(--green);
            text-shadow: 0 0 30px rgba(34, 197, 94, 0.15);
            transition: color 0.4s, transform 0.3s;
        }
        .balance-value.win {
            color: var(--gold);
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
            animation: balancePulse 0.6s ease;
        }
        .balance-value.lose {
            color: var(--red);
            text-shadow: 0 0 40px rgba(239, 68, 68, 0.3);
            animation: balanceShake 0.5s ease;
        }
        @keyframes balancePulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.08);
            }
        }
        @keyframes balanceShake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-6px);
            }
            75% {
                transform: translateX(6px);
            }
        }

        .balance-icon {
            font-size: 16px;
            opacity: 0.6;
        }

        /* ═══════════════════════════════════════════════
           LOBBY
           ═══════════════════════════════════════════════ */
        .lobby {
            background: var(--bg-panel);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: var(--radius-xl);
            padding: 36px 28px 32px;
            border: 1px solid var(--border-glass);
            box-shadow: var(--shadow-heavy), inset 0 0 80px rgba(255, 215, 0, 0.02);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            margin-top: 6px;
            position: relative;
            overflow: hidden;
        }
        .lobby::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 60%;
            height: 80%;
            background: radial-gradient(ellipse, rgba(255, 215, 0, 0.03), transparent 70%);
            pointer-events: none;
        }
        .lobby::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -20%;
            width: 50%;
            height: 70%;
            background: radial-gradient(ellipse, rgba(59, 130, 246, 0.03), transparent 70%);
            pointer-events: none;
        }

        .lobby-title {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(135deg, var(--gold), #f59e0b, var(--gold));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.08);
            animation: goldShimmer 4s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }
        @keyframes goldShimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .lobby-sub {
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.3px;
            position: relative;
            z-index: 1;
        }

        .lobby-divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
            border-radius: 2px;
        }

        .lobby-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 14px;
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 1;
        }
        .lobby-row label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            font-size: 11px;
        }

        .lobby-bet-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 10px 16px;
            color: #fff;
            font-size: 22px;
            font-weight: 800;
            width: 140px;
            text-align: center;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: var(--transition-fast);
            backdrop-filter: blur(4px);
        }
        .lobby-bet-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.06);
        }
        .lobby-bet-input::-webkit-inner-spin-button,
        .lobby-bet-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
        }
        .lobby-bet-input[type="number"] {
            -moz-appearance: textfield;
        }

        .quick-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .quick-chips button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            padding: 6px 14px;
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition-fast);
            font-family: 'Inter', sans-serif;
            backdrop-filter: blur(4px);
        }
        .quick-chips button:hover {
            background: rgba(255, 215, 0, 0.06);
            color: #fff;
            border-color: rgba(255, 215, 0, 0.15);
        }
        .quick-chips button:active {
            transform: scale(0.94);
            background: rgba(255, 215, 0, 0.1);
        }

        .bot-select {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .bot-select button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            padding: 7px 18px;
            color: var(--text-secondary);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-fast);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            min-width: 44px;
            backdrop-filter: blur(4px);
        }
        .bot-select button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
        .bot-select button.active {
            background: var(--blue-dim);
            border-color: var(--blue);
            color: #fff;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.08), inset 0 0 20px rgba(59, 130, 246, 0.04);
        }

        .btn-start {
            background: linear-gradient(135deg, var(--blue), #2563eb);
            border: none;
            border-radius: var(--radius-md);
            padding: 18px 56px;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 18px;
            text-transform: uppercase;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 6px 0 #1d4ed8, 0 12px 40px rgba(59, 130, 246, 0.2);
            transition: var(--transition-fast);
            letter-spacing: 1.5px;
            width: 100%;
            max-width: 280px;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }
        .btn-start::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.04) 100%);
            pointer-events: none;
        }
        .btn-start:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #1d4ed8, 0 20px 50px rgba(59, 130, 246, 0.25);
        }
        .btn-start:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1d4ed8, 0 12px 40px rgba(59, 130, 246, 0.15);
        }
        .btn-start:disabled {
            opacity: 0.4;
            transform: none;
            box-shadow: 0 4px 0 #1d4ed8;
            cursor: not-allowed;
        }

        /* ═══════════════════════════════════════════════
           TABLE AREA
           ═══════════════════════════════════════════════ */
        .table-area {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-top: 4px;
            animation: fadeIn 0.6s ease;
        }
        .table-area.active {
            display: flex;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ═══════════════════════════════════════════════
           FELT CONTAINER
           ═══════════════════════════════════════════════ */
        .felt-container {
            position: relative;
            width: 100%;
            max-width: 780px;
            aspect-ratio: 1.55 / 1;
            border-radius: 48% 48% 44% 44% / 54% 54% 42% 42%;
            background:
                radial-gradient(ellipse at 30% 20%, #1a6e3e, #0d2a16 65%, #07180d 100%);
            border: 18px solid #2d1a0e;
            border-top-color: #3d2618;
            border-bottom-color: #1f110a;
            box-shadow:
                inset 0 0 100px rgba(0, 0, 0, 0.8),
                inset 0 0 0 4px rgba(255, 215, 0, 0.06),
                0 30px 80px rgba(0, 0, 0, 0.8),
                0 0 0 2px rgba(255, 215, 0, 0.04);
            overflow: visible;
            margin: 0 auto;
            transition: box-shadow 0.6s ease;
        }
        .felt-container::before {
            content: '';
            position: absolute;
            inset: 14px;
            border-radius: 46% 46% 42% 42% / 52% 52% 40% 40%;
            border: 1px solid rgba(255, 220, 130, 0.06);
            pointer-events: none;
            z-index: 0;
        }
        .felt-container::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background:
                radial-gradient(ellipse at 40% 30%, rgba(255, 215, 0, 0.03), transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(59, 130, 246, 0.02), transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        .felt-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-style: italic;
            font-size: clamp(26px, 5vw, 48px);
            color: rgba(255, 215, 0, 0.05);
            letter-spacing: 8px;
            text-transform: uppercase;
            pointer-events: none;
            white-space: nowrap;
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.02);
            z-index: 0;
        }

        .felt-decor {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            height: 40%;
            border-radius: 50%;
            border: 1px solid rgba(255, 215, 0, 0.03);
            pointer-events: none;
            z-index: 0;
        }
        .felt-decor:nth-child(2) {
            width: 75%;
            height: 55%;
            border-color: rgba(255, 215, 0, 0.02);
        }

        /* ═══════════════════════════════════════════════
           SEATS
           ═══════════════════════════════════════════════ */
        .seat {
            position: absolute;
            width: var(--seat-size);
            height: calc(var(--seat-size) * 1.25);
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: var(--radius-md);
            padding: 6px 6px 8px;
            border: 2px solid transparent;
            transition: border 0.4s, box-shadow 0.4s, transform 0.3s, opacity 0.4s;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            pointer-events: none;
            z-index: 2;
            min-width: 80px;
        }
        .seat.active-turn {
            border-color: var(--gold);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.15), inset 0 0 40px rgba(255, 215, 0, 0.04);
            transform: translate(-50%, -50%) scale(1.06);
        }
        .seat.folded {
            opacity: 0.35;
            filter: grayscale(0.8);
        }
        .seat .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            flex-shrink: 0;
            transition: border 0.3s;
            position: relative;
        }
        .seat.active-turn .avatar {
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
        }
        .seat .avatar svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .seat .avatar .avatar-emoji {
            font-size: 28px;
            line-height: 1;
        }
        .seat .name {
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 76px;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
            letter-spacing: 0.2px;
        }
        .seat .stack {
            font-size: 10px;
            color: var(--text-secondary);
            font-weight: 700;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
        }
        .seat .stack .chip-icon {
            display: inline-block;
            margin-right: 3px;
            font-size: 9px;
        }
        .seat .status-badge {
            font-size: 8px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.04);
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
        }
        .seat .status-badge.fold {
            background: var(--red-dim);
            color: var(--red);
        }
        .seat .status-badge.call {
            background: var(--blue-dim);
            color: var(--blue);
        }
        .seat .status-badge.raise {
            background: var(--gold-dim);
            color: var(--gold);
        }
        .seat .status-badge.allin {
            background: var(--green-dim);
            color: var(--green);
            animation: allinPulse 1s ease-in-out infinite;
        }
        @keyframes allinPulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(0.95);
            }
        }

        .seat .mini-cards {
            display: flex;
            gap: 2px;
            margin-top: 2px;
        }
        .mini-card {
            width: 18px;
            height: 26px;
            background: #fff;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
        }
        .mini-card.red {
            color: var(--red);
        }
        .mini-card.black {
            color: #111;
        }
        .mini-card.back {
            background: repeating-linear-gradient(45deg, #1a2332, #1a2332 4px, #0d1b2a 4px, #0d1b2a 8px);
            color: transparent;
            border-color: rgba(59, 130, 246, 0.15);
        }

        /* seat positions */
        .seat-bottom-center {
            bottom: 2%;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(59, 130, 246, 0.15);
        }
        .seat-top-center {
            top: 2%;
            left: 50%;
            transform: translateX(-50%);
        }
        .seat-top-left {
            top: 5%;
            left: 14%;
        }
        .seat-top-right {
            top: 5%;
            right: 14%;
        }
        .seat-mid-left {
            top: 34%;
            left: 1%;
        }
        .seat-mid-right {
            top: 34%;
            right: 1%;
        }
        .seat-bottom-left {
            bottom: 7%;
            left: 10%;
        }
        .seat-bottom-right {
            bottom: 7%;
            right: 10%;
        }

        /* ═══════════════════════════════════════════════
           COMMUNITY & POT
           ═══════════════════════════════════════════════ */
        .community-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 1;
            pointer-events: none;
        }

        .community-cards {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .comm-card {
            width: var(--card-width);
            height: var(--card-height);
            border-radius: var(--radius-sm);
            background: #fff;
            box-shadow: var(--shadow-card), 0 0 0 1px rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 900;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s;
            animation: cardDeal 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            font-family: 'Inter', sans-serif;
        }
        .comm-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: var(--shadow-card), 0 8px 40px rgba(0, 0, 0, 0.4);
        }
        .comm-card.red {
            color: var(--red);
        }
        .comm-card.black {
            color: #111;
        }
        .comm-card.back {
            background: repeating-linear-gradient(45deg, #1a2332, #1a2332 8px, #0d1b2a 8px, #0d1b2a 16px);
            color: transparent;
            border-color: rgba(59, 130, 246, 0.2);
            box-shadow: var(--shadow-card);
        }
        .comm-card .rank {
            font-size: 16px;
            line-height: 1;
            font-weight: 900;
        }
        .comm-card .suit {
            font-size: 24px;
            line-height: 1;
        }
        .comm-card .corner-top {
            position: absolute;
            top: 4px;
            left: 6px;
            font-size: 10px;
            font-weight: 800;
            line-height: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .comm-card .corner-bottom {
            position: absolute;
            bottom: 4px;
            right: 6px;
            font-size: 10px;
            font-weight: 800;
            line-height: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: rotate(180deg);
        }
        .comm-card .corner-top .suit-small,
        .comm-card .corner-bottom .suit-small {
            font-size: 10px;
        }

        @keyframes cardDeal {
            0% {
                opacity: 0;
                transform: translateY(-30px) rotateY(90deg) scale(0.6);
            }
            60% {
                opacity: 1;
                transform: translateY(4px) rotateY(-4deg) scale(1.04);
            }
            100% {
                opacity: 1;
                transform: translateY(0) rotateY(0) scale(1);
            }
        }

        .pot-display {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.15);
            text-align: center;
            padding: 4px 18px 4px 16px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: var(--radius-full);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 215, 0, 0.08);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }
        .pot-display .pot-icon {
            font-size: 16px;
            opacity: 0.7;
        }
        .pot-display #potDisplay {
            min-width: 40px;
            display: inline-block;
        }

        .stage-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.4);
            padding: 3px 16px;
            border-radius: var(--radius-full);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* ═══════════════════════════════════════════════
           MY HAND
           ═══════════════════════════════════════════════ */
        .my-hand-area {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 14px;
            z-index: 3;
            pointer-events: none;
        }

        .my-card {
            width: 68px;
            height: 92px;
            background: #fff;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-card), 0 0 0 1px rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 900;
            border: 2px solid rgba(255, 255, 255, 0.06);
            animation: cardDeal 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            font-family: 'Inter', sans-serif;
            transition: transform 0.3s;
        }
        .my-card:hover {
            transform: translateY(-6px) scale(1.03);
        }
        .my-card.red {
            color: var(--red);
        }
        .my-card.black {
            color: #111;
        }
        .my-card .rank {
            font-size: 22px;
            line-height: 1;
            font-weight: 900;
        }
        .my-card .suit {
            font-size: 30px;
            line-height: 1;
        }
        .my-card .corner-top {
            position: absolute;
            top: 5px;
            left: 7px;
            font-size: 12px;
            font-weight: 800;
            line-height: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .my-card .corner-bottom {
            position: absolute;
            bottom: 5px;
            right: 7px;
            font-size: 12px;
            font-weight: 800;
            line-height: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: rotate(180deg);
        }
        .my-card .corner-top .suit-small,
        .my-card .corner-bottom .suit-small {
            font-size: 12px;
        }
        .my-card.back {
            background: repeating-linear-gradient(45deg, #1a2332, #1a2332 10px, #0d1b2a 10px, #0d1b2a 20px);
            border-color: rgba(59, 130, 246, 0.2);
            color: transparent;
            box-shadow: var(--shadow-card);
        }
        .my-card .card-glow {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), transparent 60%);
            pointer-events: none;
        }

        /* ═══════════════════════════════════════════════
           ACTIONS PANEL
           ═══════════════════════════════════════════════ */
        .actions-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 6px;
            width: 100%;
            max-width: 540px;
        }

        .action-btn {
            border: none;
            border-radius: var(--radius-md);
            padding: 12px 20px;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            color: #fff;
            cursor: pointer;
            transition: var(--transition-fast);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
            flex: 1;
            min-width: 60px;
            background: #1e2530;
            box-shadow: 0 4px 0 #0d121a;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
        }
        .action-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.03) 100%);
            pointer-events: none;
        }
        .action-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0d121a;
        }
        .action-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 0 #0d121a;
        }
        .action-btn .icon {
            display: inline-block;
            margin-right: 6px;
            font-size: 14px;
        }

        .action-btn.fold {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            box-shadow: 0 4px 0 #991b1b;
        }
        .action-btn.fold:hover:not(:disabled) {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #991b1b;
        }
        .action-btn.fold:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #991b1b;
        }

        .action-btn.check {
            background: linear-gradient(135deg, #334155, #1e293b);
            box-shadow: 0 4px 0 #0f172a;
        }
        .action-btn.check:hover:not(:disabled) {
            background: linear-gradient(135deg, #475569, #334155);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #0f172a;
        }
        .action-btn.check:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0f172a;
        }

        .action-btn.call {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 4px 0 #1d4ed8;
        }
        .action-btn.call:hover:not(:disabled) {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #1d4ed8;
        }
        .action-btn.call:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1d4ed8;
        }

        .action-btn.raise {
            background: linear-gradient(135deg, var(--gold), #f59e0b);
            color: #0a0e17;
            box-shadow: 0 4px 0 #b36b00;
        }
        .action-btn.raise:hover:not(:disabled) {
            background: linear-gradient(135deg, #ffd700, #f59e0b);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #b36b00;
        }
        .action-btn.raise:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b36b00;
        }

        .action-btn.allin {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 4px 0 #15803d;
        }
        .action-btn.allin:hover:not(:disabled) {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #15803d;
        }
        .action-btn.allin:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #15803d;
        }

        /* ═══════════════════════════════════════════════
           RAISE PANEL
           ═══════════════════════════════════════════════ */
        .raise-panel {
            display: none;
            align-items: center;
            gap: 14px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: var(--radius-md);
            padding: 8px 16px;
            width: 100%;
            max-width: 380px;
            margin: 2px auto 0;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .raise-panel.active {
            display: flex;
        }
        .raise-panel input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #1e2530;
            border-radius: 2px;
            outline: none;
            transition: background 0.3s;
        }
        .raise-panel input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            background: radial-gradient(circle at 30% 30%, var(--gold), #d4a017);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.25), 0 2px 8px rgba(0, 0, 0, 0.4);
            transition: var(--transition-fast);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        .raise-panel input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.35);
        }
        .raise-panel input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            background: radial-gradient(circle at 30% 30%, var(--gold), #d4a017);
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.25);
        }
        .raise-panel span {
            font-weight: 800;
            font-size: 20px;
            min-width: 70px;
            text-align: center;
            color: #fff;
            font-family: 'Playfair Display', serif;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.05);
        }
        .raise-panel .raise-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ═══════════════════════════════════════════════
           STATUS MESSAGE
           ═══════════════════════════════════════════════ */
        .status-msg {
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-secondary);
            min-height: 30px;
            padding: 6px 0;
            transition: all 0.4s ease;
            letter-spacing: 0.3px;
        }
        .status-msg.win {
            color: var(--gold);
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
            animation: statusWin 0.8s ease;
        }
        .status-msg.lose {
            color: var(--red);
            text-shadow: 0 0 40px rgba(239, 68, 68, 0.15);
            animation: statusLose 0.6s ease;
        }
        .status-msg.info {
            color: var(--blue);
        }
        @keyframes statusWin {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            50% {
                transform: scale(1.06);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        @keyframes statusLose {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-8px);
            }
            75% {
                transform: translateX(8px);
            }
        }

        /* ═══════════════════════════════════════════════
           LOG
           ═══════════════════════════════════════════════ */
        .log-toggle {
            background: none;
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            padding: 5px 16px;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
            font-family: 'Inter', sans-serif;
            backdrop-filter: blur(4px);
        }
        .log-toggle:hover {
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
        }
        .log-toggle:active {
            transform: scale(0.94);
        }

        .log-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border-radius: var(--radius-md);
            padding: 0 14px;
            margin-top: 2px;
            border: 1px solid transparent;
            transition: max-height 0.5s ease, padding 0.5s ease, border-color 0.5s ease;
        }
        .log-panel.open {
            max-height: 220px;
            padding: 10px 14px;
            border-color: var(--border-glass);
            overflow-y: auto;
        }
        .log-panel .log-entry {
            font-size: 12px;
            color: var(--text-secondary);
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            font-weight: 500;
            line-height: 1.5;
        }
        .log-panel .log-entry:last-child {
            border-bottom: none;
        }
        .log-panel .log-entry .hl {
            color: var(--gold);
            font-weight: 700;
        }
        .log-panel .log-entry .hl-blue {
            color: var(--blue);
            font-weight: 700;
        }
        .log-panel .log-entry .hl-red {
            color: var(--red);
            font-weight: 700;
        }
        .log-panel .log-entry .hl-green {
            color: var(--green);
            font-weight: 700;
        }

        /* ═══════════════════════════════════════════════
           MENU BUTTON
           ═══════════════════════════════════════════════ */
        .btn-menu {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 12px 24px;
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition-fast);
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 100%;
            max-width: 180px;
            margin-top: 4px;
            backdrop-filter: blur(4px);
        }
        .btn-menu:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .btn-menu:active {
            transform: scale(0.96);
        }

        /* ═══════════════════════════════════════════════
           MODAL
           ═══════════════════════════════════════════════ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 7, 12, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: radial-gradient(ellipse at 50% 0%, rgba(30, 41, 59, 0.95), rgba(11, 17, 29, 0.98));
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            max-width: 420px;
            width: 100%;
            padding: 32px 28px 28px;
            box-shadow: var(--shadow-heavy), 0 0 80px rgba(255, 215, 0, 0.02);
            text-align: center;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        .modal-box::before {
            content: '';
            position: absolute;
            top: -30%;
            left: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(ellipse, rgba(255, 215, 0, 0.04), transparent 70%);
            pointer-events: none;
        }
        .modal-overlay.active .modal-box {
            transform: scale(1) translateY(0);
        }

        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 900;
            color: var(--gold);
            margin-bottom: 8px;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.1);
        }
        .modal-title.lose {
            color: var(--red);
            text-shadow: 0 0 40px rgba(239, 68, 68, 0.1);
        }

        .modal-text {
            font-size: 17px;
            color: var(--text-primary);
            margin-bottom: 20px;
            line-height: 1.6;
            font-weight: 500;
        }
        .modal-text .highlight {
            color: var(--gold);
            font-weight: 700;
        }

        .modal-btn {
            padding: 14px 36px;
            border-radius: var(--radius-md);
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: var(--transition-fast);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 4px;
        }
        .modal-btn.primary {
            background: linear-gradient(135deg, var(--gold), #f59e0b);
            color: #0a0e17;
            box-shadow: 0 4px 0 #b36b00;
        }
        .modal-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #b36b00;
        }
        .modal-btn.primary:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b36b00;
        }
        .modal-btn.secondary {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            border: 1px solid var(--border-glass);
        }
        .modal-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        /* ═══════════════════════════════════════════════
           CONFETTI / CELEBRATION (simple)
           ═══════════════════════════════════════════════ */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0% {
                opacity: 1;
                transform: translateY(-20px) rotate(0deg) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(110vh) rotate(720deg) scale(0.3);
            }
        }

        /* ═══════════════════════════════════════════════
           RESPONSIVE
           ═══════════════════════════════════════════════ */
        @media (max-width: 680px) {
            :root {
                --seat-size: 80px;
                --card-width: 44px;
                --card-height: 62px;
            }
            .seat .avatar {
                width: 36px;
                height: 36px;
            }
            .seat .name {
                font-size: 9px;
                max-width: 56px;
            }
            .seat .stack {
                font-size: 8px;
            }
            .seat .status-badge {
                font-size: 7px;
                padding: 1px 6px;
            }
            .seat .mini-card {
                width: 14px;
                height: 20px;
                font-size: 7px;
            }
            .comm-card {
                width: var(--card-width);
                height: var(--card-height);
                font-size: 14px;
            }
            .comm-card .rank {
                font-size: 13px;
            }
            .comm-card .suit {
                font-size: 18px;
            }
            .comm-card .corner-top,
            .comm-card .corner-bottom {
                font-size: 8px;
            }
            .comm-card .corner-top .suit-small,
            .comm-card .corner-bottom .suit-small {
                font-size: 8px;
            }
            .my-card {
                width: 54px;
                height: 74px;
                font-size: 20px;
            }
            .my-card .rank {
                font-size: 17px;
            }
            .my-card .suit {
                font-size: 24px;
            }
            .my-card .corner-top,
            .my-card .corner-bottom {
                font-size: 10px;
            }
            .my-card .corner-top .suit-small,
            .my-card .corner-bottom .suit-small {
                font-size: 10px;
            }
            .pot-display {
                font-size: 16px;
                padding: 3px 14px;
            }
            .felt-container {
                border-width: 12px;
            }
            .lobby-title {
                font-size: 28px;
            }
            .action-btn {
                font-size: 11px;
                padding: 10px 14px;

            function getBotById(id) { return BOTS.find(b => b.id === id) || BOTS[0]; }

            // ============================================================
            //  API HELPERS
            // ============================================================
            async function apiRequest(endpoint, options = {}) {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 15000);
                try {
                    const res = await fetch(`${API_BASE}${endpoint}`, {
                        ...options,
                        signal: controller.signal,
                        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
                    });
                    clearTimeout(timeout);
                    if (!res.ok) {
                        let errMsg = `HTTP ${res.status}`;
                        try { const data = await res.json();
                            errMsg = data.error || errMsg; } catch (_) {}
                        throw new Error(errMsg);
                    }
                    return await res.json();
                } catch (e) {
                    clearTimeout(timeout);
                    if (e.name === 'AbortError') throw new Error('Запрос превысил время ожидания');
                    throw e;
                }
            }

            // ============================================================
            //  BALANCE
            // ============================================================
            async function loadBalance() {
                if (!userId) return;
                try {
                    const data = await apiRequest(`/profile/${userId}`, { cache: 'no-cache' });
                    if (data.casino_balance !== undefined) {
                        casinoBalance = Number(data.casino_balance);
                        updateBalanceUI(casinoBalance);
                    }
                } catch (e) {
                    console.warn('Ошибка загрузки баланса', e);
                }
            }

            function updateBalanceUI(newBalance, animate = false) {
                casinoBalance = Number(newBalance);
                const el = balanceDisplay;
                el.classList.remove('win', 'lose');
                if (animate) {
                    if (newBalance > casinoBalance) {
                        el.classList.add('win');
                    } else if (newBalance < casinoBalance) {
                        el.classList.add('lose');
                    }
                    setTimeout(() => el.classList.remove('win', 'lose'), 1500);
                }
                el.innerText = casinoBalance.toLocaleString() + ' ₽';
                localStorage.setItem('casinoBalance', String(casinoBalance));
            }

            // ============================================================
            //  CONFETTI
            // ============================================================
            function fireConfetti(count = 80) {
                const container = confettiContainer;
                container.innerHTML = '';
                const colors = ['#ffd700', '#ff6b6b', '#4ecdc4', '#45b7d1', '#ff9f43', '#a29bfe', '#fd79a8', '#00b894'];
                for (let i = 0; i < count; i++) {
                    const el = document.createElement('div');
                    el.className = 'confetti';
                    el.style.left = Math.random() * 100 + '%';
                    el.style.top = '-10%';
                    el.style.width = (4 + Math.random() * 10) + 'px';
                    el.style.height = (4 + Math.random() * 10) + 'px';
                    el.style.background = colors[Math.floor(Math.random() * colors.length)];
                    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    el.style.animationDuration = (2 + Math.random() * 3) + 's';
                    el.style.animationDelay = (Math.random() * 1.5) + 's';
                    el.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
                    container.appendChild(el);
                }
                setTimeout(() => { container.innerHTML = ''; }, 6000);
            }

                gameActive = (state.status !== 'finished');

                // Pot
                potDisplay.innerText = state.pot || 0;

                // Stage
                const stageMap = { preflop: 'ПРЕФЛОП', flop: 'ФЛОП', turn: 'ТЁРН', river: 'РИВЕР', showdown: 'ШОУДАУН',
                    finished: 'ЗАВЕРШЕНА' };
                stageLabel.innerText = stageMap[state.stage] || state.stage.toUpperCase();

                // Community cards – улучшенный рендер с уголками
                const comm = state.communityCards || [];
                const commEls = communityCards.querySelectorAll('.comm-card');
                commEls.forEach((el, i) => {
                    if (i < comm.length) {
                        const card = comm[i];
                        const isRed = (card.suit === '♥' || card.suit === '♦');
                        el.className = 'comm-card';
                        el.classList.add(isRed ? 'red' : 'black');
                        el.innerHTML = `
                      <span class="corner-top"><span>${card.rank}</span><span class="suit-small">${card.suit}</span></span>
                      <span class="rank">${card.rank}</span>
                      <span class="suit">${card.suit}</span>
                      <span class="corner-bottom"><span>${card.rank}</span><span class="suit-small">${card.suit}</span></span>
                    `;
                    } else {
                        el.className = 'comm-card back';
                        el.innerHTML = '';
                    }
                });

                // Players / seats
                const players = state.players || [];
                const seats = seatsContainer.querySelectorAll('.seat');
                seats.forEach((seat, idx) => {
                    const p = players[idx];
                    if (!p) { seat.style.display = 'none'; return; }
                    seat.style.display = 'flex';
                    const bot = p.botId ? getBotById(p.botId) : null;
                    const avatarContent = (p.avatar && p.avatar.startsWith('<svg')) ? p.avatar :
                        (bot ? bot.svg : '<span class="avatar-emoji">👤</span>');
                    const name = p.name || 'Игрок';
                    const stack = p.stack || 0;
                    const statusText = p.status || '';
                    const isActive = p.isActive !== false;
                    const isFolded = p.folded === true;
                    const isMine = (p.id === userId || p.id === 'me');

                    seat.className = 'seat';
                    if (isActive && !isFolded && !isMine) seat.classList.add('active-turn');
                    if (isFolded) seat.classList.add('folded');
                    if (isMine) seat.style.borderColor = 'rgba(59,130,246,0.3)';

                    let statusClass = '';
                    if (statusText === 'fold') statusClass = 'fold';
                    else if (statusText === 'call') statusClass = 'call';
                    else if (statusText === 'raise') statusClass = 'raise';
                    else if (statusText === 'allin') statusClass = 'allin';

                    const cardHTML = (p.cards && p.cards.length) ?
                        p.cards.map(c =>
                            `<span class="mini-card ${c.suit === '♥' || c.suit === '♦' ? 'red' : 'black'}">${c.rank}${c.suit}</span>`
                        ).join('') :
                        (isMine ? '' :
                            '<span class="mini-card back"></span><span class="mini-card back"></span>');

                    seat.innerHTML = `
                    <div class="avatar">${avatarContent}</div>
                    <div class="name">${name}</div>
                    <div class="stack"><span class="chip-icon">🪙</span>${stack}</div>
                    ${statusText ? `<div class="status-badge ${statusClass}">${statusText}</div>` : ''}
                    <div class="mini-cards">${cardHTML}</div>
                  `;
                });

                // My hand – улучшенный рендер
                const myCards = state.playerCards || [];
                const handEls = myHandArea.querySelectorAll('.my-card');
                handEls.forEach((el, i) => {
                    if (i < myCards.length) {
                        const card = myCards[i];
                        const isRed = (card.suit === '♥' || card.suit === '♦');
                        el.className = 'my-card';
                        el.classList.add(isRed ? 'red' : 'black');
                        el.innerHTML = `
                      <span class="corner-top"><span>${card.rank}</span><span class="suit-small">${card.suit}</span></span>
                      <span class="rank">${card.rank}</span>
                      <span class="suit">${card.suit}</span>
                      <span class="corner-bottom"><span>${card.rank}</span><span class="suit-small">${card.suit}</span></span>
                      <div class="card-glow"></div>
                    `;
                    } else {
                        el.className = 'my-card back';
                        el.innerHTML = '<div class="card-glow"></div>';
                    }
                });

                // Actions
                const canAct = state.status !== 'finished' && state.players.some(p => (p.id === userId || p.id === 'me') && p
                    .isActive && !p.folded);
                foldBtn.disabled = !canAct;
                checkBtn.disabled = !canAct;
                callBtn.disabled = !canAct;
                raiseBtn.disabled = !canAct;
                allinBtn.disabled = !canAct;

                // Raise slider
                raisePanel.classList.toggle('active', canAct);
                if (canAct && state.availableActions && state.availableActions.raise) {
                    const minRaise = state.availableActions.minRaise || 100;
                    const maxRaise = Math.min(state.availableActions.maxRaise || state.stack || 1000, state.stack || 1000);
                    raiseRange.min = minRaise;
                    raiseRange.max = Math.max(minRaise, maxRaise);
                    const currentVal = parseInt(raiseRange.value) || minRaise;
                    raiseRange.value = Math.min(Math.max(currentVal, minRaise), maxRaise);
                    raiseAmountDisplay.innerText = Math.min(Math.max(currentVal, minRaise), maxRaise);
                }

                // Status message + результат
                if (state.status === 'finished') {
                    if (state.result && state.result.winnerId) {
                        const isWin = String(state.result.winnerId) === String(userId);
                        if (isWin) {
                            const winAmount = state.result.winAmount || state.pot || 0;
                            statusMsg.innerText = `🎉 ВЫ ПОБЕДИЛИ! +${winAmount} ₽`;
                            statusMsg.className = 'status-msg win';
                            feltContainer.classList.add('winner-glow');
                            if (state.casino_balance !== undefined) updateBalanceUI(state.casino_balance, true);
                            if (resultShownForGameId !== state.gameId) {
                                resultShownForGameId = state.gameId;
                                showModal('🎉 Победа!', `Вы выиграли <span class="highlight">${winAmount} ₽</span>`);
                                fireConfetti(100);
                            }
                        } else {
                            statusMsg.innerText = `❌ Вы проиграли. Победитель: ${state.result.winnerName || 'бот'}`;
                            statusMsg.className = 'status-msg lose';
                            feltContainer.classList.remove('winner-glow');
                            if (state.casino_balance !== undefined) updateBalanceUI(state.casino_balance);
                            if (resultShownForGameId !== state.gameId) {
                                resultShownForGameId = state.gameId;
                                showModal('❌ Поражение', `Победил <span class="highlight">${state.result.winnerName || 'бот'}</span>`);
                            }
                        }
                        gameActive = false;
                        localStorage.removeItem('rgame_poker_game_id');
                        [foldBtn, checkBtn, callBtn, raiseBtn, allinBtn].forEach(b => b.disabled = true);
                    }
                } else {
                    statusMsg.innerText = `♠ ${stageMap[state.stage] || state.stage.toUpperCase()}`;
                    statusMsg.className = 'status-msg info';
                    feltContainer.classList.remove('winner-glow');
                }

                // Update balance if included
                if (state.casino_balance !== undefined && state.casino_balance !== casinoBalance) {
                    updateBalanceUI(state.casino_balance);
                }

                // Log
                if (state.log && state.log.length) {
                    logPanel.innerHTML = state.log.map(entry =>
                        `<div class="log-entry">${entry}</div>`
                    ).join('');
                }
            }

            // ============================================================
            //  SEAT POSITIONS
            // ============================================================
            function createSeats(botCount) {
                const container = seatsContainer;
                container.innerHTML = '';
                const positions = [
                    { id: 'me', cls: 'seat-bottom-center' },
                    { id: 'bot0', cls: 'seat-top-center' },
                    { id: 'bot1', cls: 'seat-top-left' },
                    { id: 'bot2', cls: 'seat-top-right' },
                    { id: 'bot3', cls: 'seat-mid-left' },
                    { id: 'bot4', cls: 'seat-mid-right' },
                    { id: 'bot5', cls: 'seat-bottom-left' },
                    { id: 'bot6', cls: 'seat-bottom-right' }
                ];
                const used = positions.slice(0, 1 + botCount);
                used.forEach(pos => {
                    const div = document.createElement('div');
                    div.className = 'seat';
                    div.id = `seat-${pos.id}`;
                    div.style.cssText = `position:absolute; ${pos.cls};`;
                    container.appendChild(div);
                });
            }

            // ============================================================
            //  START GAME
            // ============================================================
            async function startGame() {
                if (isStartingGame) return;
                const bet = parseInt(betInput.value.replace(/\D/g, '')) || 100;
                if (bet < 10) { statusMsg.innerText = '❌ Минимальная ставка 10 ₽';
                    statusMsg.className = 'status-msg lose'; return; }
                if (bet > casinoBalance) { statusMsg.innerText = '❌ Недостаточно средств';
                    statusMsg.className = 'status-msg lose'; return; }
                isStartingGame = true;
                startBtn.disabled = true;
                startBtn.textContent = '♠ Создаём стол...';
                statusMsg.innerText = '⏳ Запуск игры...';
                statusMsg.className = 'status-msg info';
                try {
                    const data = await apiRequest('/poker/start', {
                        method: 'POST',
                        body: JSON.stringify({
                            userId: userId,
                            bet: bet,
                            botCount: botCount
                        })
                    });
                    if (data.success) {
                        gameId = data.state.gameId || data.gameId;
                        if (!gameId) throw new Error('Не получен gameId');
                        if (data.casino_balance !== undefined) updateBalanceUI(data.casino_balance);
                        localStorage.setItem('rgame_poker_game_id', gameId);
                        createSeats(botCount);
                        lobby.style.display = 'none';
                        tableArea.classList.add('active');
                        renderState(data.state);
                        statusMsg.innerText = '♠ Игра началась!';
                        statusMsg.className = 'status-msg info';
                    } else {
                        throw new Error(data.error || 'Неизвестная ошибка');
                    }
                } catch (e) {
                    statusMsg.innerText = `❌ ${e.message}`;
                    statusMsg.className = 'status-msg lose';
                    startBtn.disabled = false;
                    startBtn.textContent = '♠ Начать игру';
                } finally {
                    isStartingGame = false;
                }
            }

            // ============================================================
            //  ACTIONS
            // ============================================================
            async function sendAction(action, amount = 0) {
                if (isActionInProgress || !gameId) return;
                isActionInProgress = true;
                [foldBtn, checkBtn, callBtn, raiseBtn, allinBtn].forEach(b => b.disabled = true);
                try {
                    const data = await apiRequest('/poker/action', {
                        method: 'POST',
                        body: JSON.stringify({
                            gameId: gameId,
                            userId: userId,
                            action: action,
                            amount: amount
                        })
                    });
                    if (data.success) {
                        if (data.casino_balance !== undefined) updateBalanceUI(data.casino_balance);
                        if (data.state) renderState(data.state);
                    } else {
                        throw new Error(data.error || 'Ошибка действия');
                    }
                } catch (e) {
                    statusMsg.innerText = `❌ ${e.message}`;
                    statusMsg.className = 'status-msg lose';
                } finally {
                    isActionInProgress = false;
                }
            }

            // Button handlers
            foldBtn.onclick = () => sendAction('fold');
            checkBtn.onclick = () => sendAction('check');
            callBtn.onclick = () => sendAction('call', 0);
            allinBtn.onclick = () => {
                const amount = parseInt(raiseRange.value) || 0;
                sendAction('all_in', amount);
            };
            raiseBtn.onclick = () => {
                const amount = parseInt(raiseRange.value) || 0;
                sendAction('raise', amount);
            };
            raiseRange.oninput = function() {
                raiseAmountDisplay.innerText = this.value;
            };

            // ============================================================
            //  RESTORE GAME
            // ============================================================
            async function restoreGame() {
                const savedId = localStorage.getItem('rgame_poker_game_id');
                if (!savedId || !userId) return false;
                try {
                    const data = await apiRequest(`/poker/state/${savedId}?userId=${userId}`);
                    if (data.success && data.state && data.state.status !== 'finished') {
                        gameId = savedId;
                        createSeats(data.state.players ? data.state.players.length - 1 : 3);
                        lobby.style.display = 'none';
                        tableArea.classList.add('active');
                        renderState(data.state);
                        statusMsg.innerText = '♠ Игра восстановлена';
                        statusMsg.className = 'status-msg info';
                        return true;
                    } else {
                        localStorage.removeItem('rgame_poker_game_id');
                        return false;
                    }
                } catch (e) {
                    console.warn('Не удалось восстановить игру', e);
                    localStorage.removeItem('rgame_poker_game_id');
                    return false;
                }
            }

            // ============================================================
            //  MODAL
            // ============================================================
            function showModal(title, text) {
                modalTitle.innerText = title.replace(/[♠♥♦♣🎉❌]/g, '').trim();
                if (title.includes('Победа')) {
                    modalTitle.className = 'modal-title';
                } else {
                    modalTitle.className = 'modal-title lose';
                }
                modalText.innerHTML = text;
                modalOverlay.classList.add('active');
            }

            modalBtn.onclick = function() {
                modalOverlay.classList.remove('active');
                if (!gameActive) {
                    lobby.style.display = 'flex';
                    tableArea.classList.remove('active');
                    localStorage.removeItem('rgame_poker_game_id');
                    loadBalance();
                }
            };

            // ============================================================
            //  NAVIGATION
            // ============================================================
            menuBtn.onclick = function() {
                window.location.href = 'casino.html?userId=' + encodeURIComponent(userId || '');
            };
            backBtn.onclick = function() {
                if (gameActive) {
                    if (confirm('Вы уверены? Игра сохранится, вы сможете продолжить позже.')) {
                        window.location.href = 'casino.html?userId=' + encodeURIComponent(userId || '');
                    }
                } else {
                    window.location.href = 'casino.html?userId=' + encodeURIComponent(userId || '');
                }
            };

            // Log toggle
            logToggle.onclick = function() {
                logPanel.classList.toggle('open');
                this.textContent = logPanel.classList.contains('open') ? '📜 Скрыть историю' : '📜 История раздачи';
            };

            // Quick chips
            document.querySelectorAll('.quick-chips button').forEach(btn => {
                btn.addEventListener('click', function() { betInput.value = this.dataset.amount; });
            });

            // Bot select
            document.querySelectorAll('#botSelect button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#botSelect button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    botCount = parseInt(this.dataset.count);
                });
            });

            // Start button
            startBtn.onclick = startGame;

            // ============================================================
            //  INIT
            // ============================================================
            async function init() {
                await loadBalance();
                const restored = await restoreGame();
                if (!restored) {
                    lobby.style.display = 'flex';
                    tableArea.classList.remove('active');
                    statusMsg.innerText = '♠ Сделайте ставку и начните игру';
                    statusMsg.className = 'status-msg';
                }
                betInput.value = '100';
                document.querySelector('#botSelect button[data-count="3"]')?.classList.add('active');
                botCount = 3;
                if (!userId) {
                    statusMsg.innerText = '❌ Ошибка: userId не найден';
                    statusMsg.className = 'status-msg lose';
                }
            }

            init();

        })();
    </script>

</body>
</html>
