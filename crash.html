<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚡ CRASH | R-GAME PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;1,800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #03060a;
            --container-bg: #0b1017;
            --panel-bg: #111923;
            --accent-blue: #2563eb;
            --accent-blue-hover: #3b82f6;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --accent-red: #ef4444;
            --accent-orange: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            display: flex; justify-content: center;
        }

        .game-container {
            width: 100%; max-width: 800px;
            min-height: 100vh;
            background-color: var(--container-bg);
            display: flex; flex-direction: column;
            padding: 12px 12px calc(20px + var(--tg-viewport-safe-area-inset-bottom, 0px)) 12px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 4px; margin-bottom: 10px; flex-shrink: 0;
        }
        .brand { font-weight: 800; font-size: 24px; text-transform: uppercase; letter-spacing: -0.5px; font-style: italic; text-shadow: 0 0 20px rgba(37,99,235,0.4); }
        .brand span { color: var(--accent-blue); }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .info-card {
            background: var(--panel-bg); padding: 8px 14px; border-radius: 12px;
            font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .menu-btn {
            background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 8px 16px; font-weight: 700;
            font-size: 14px; color: var(--text-main); cursor: pointer;
            transition: all 0.2s; font-family: 'Montserrat', sans-serif;
        }
        .menu-btn:active { transform: scale(0.95); background: var(--accent-blue); }

        .rocket-area {
            position: relative; overflow: hidden;
            border-radius: 20px; margin-bottom: 12px;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            height: 340px; flex-shrink: 0;
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.9), 0 8px 30px rgba(0,0,0,0.5);
        }
        #crashCanvas { width: 100%; height: 100%; display: block; }
        
        .center-display {
            position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; z-index: 10; width: 100%; pointer-events: none;
        }
        .multiplier-badge {
            font-size: 64px; font-weight: 800; font-style: italic;
            text-shadow: 0 0 40px rgba(255,255,255,0.4), 0 4px 20px rgba(0,0,0,0.9);
            transition: color 0.1s ease; margin-bottom: 5px;
            letter-spacing: -1px;
        }
        .status-badge {
            font-size: 13px; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 2px;
            background: rgba(15, 23, 42, 0.75); padding: 6px 18px; border-radius: 30px;
            display: inline-block; backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .history-list {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 12px;
            scrollbar-width: none; flex-shrink: 0;
        }
        .history-list::-webkit-scrollbar { display: none; }
        .history-item {
            font-size: 13px; font-weight: 800; padding: 6px 14px; border-radius: 10px;
            font-family: 'Nunito', sans-serif; font-style: italic; flex-shrink: 0;
            transition: transform 0.2s;
        }
        .history-item:hover { transform: translateY(-2px); }
        .history-item.low { color: #ef4444; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.25); }
        .history-item.medium { color: #3b82f6; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.25); }
        .history-item.high { color: #f59e0b; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.25); }
        .history-item.epic { color: #10b981; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); box-shadow: 0 0 15px rgba(16, 185, 129, 0.25); }

        .controls-area {
            background: var(--panel-bg); padding: 16px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.04); margin-bottom: 12px; flex-shrink: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .inputs-row {
            display: flex; gap: 10px; margin-bottom: 15px; align-items: flex-end;
        }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .input-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        
        .styled-input-wrapper { position: relative; }
        .styled-input {
            width: 100%; padding: 15px; padding-left: 36px;
            background: var(--container-bg); border: 2px solid #1e293b; border-radius: 14px;
            color: #fff; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 18px;
            transition: all 0.2s; appearance: none;
        }
        .styled-input:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 20px rgba(37,99,235,0.2); }
        .styled-input-wrapper::before {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-weight: 800; font-size: 18px;
        }
        .wrapper-rub::before { content: '₽'; }
        .wrapper-x::before { content: 'x'; }

        .auto-checkbox-group {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.02);
            border-radius: 14px; padding: 12px 14px;
            border: 2px solid #1e293b; height: 56px;
            cursor: pointer;
        }
        .auto-checkbox-group input[type="checkbox"] {
            width: 20px; height: 20px; accent-color: var(--accent-blue); cursor: pointer;
        }
        .auto-checkbox-group label {
            font-size: 11px; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; user-select: none;
        }

        .action-btn {
            width: 100%; padding: 18px 12px; border: none; border-radius: 16px;
            font-weight: 800; font-size: 18px; text-transform: uppercase; cursor: pointer;
            transition: all 0.1s ease; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center; gap: 12px;
            font-family: 'Montserrat', sans-serif; position: relative; overflow: hidden;
        }
        .action-btn::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 60%);
            pointer-events: none;
        }
        .action-btn:active { transform: translateY(2px); }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .btn-bet { background: var(--accent-blue); box-shadow: 0 6px 0 #1d4ed8, 0 8px 25px rgba(37, 99, 235, 0.4); }
        .btn-bet:hover:not(:disabled) { background: var(--accent-blue-hover); }
        .btn-cancel { background: var(--accent-red); box-shadow: 0 6px 0 #b91c1c, 0 8px 25px rgba(239, 68, 68, 0.4); }
        .btn-cashout {
            background: var(--accent-green);
            box-shadow: 0 6px 0 #047857, 0 8px 25px rgba(16, 185, 129, 0.4);
            flex-direction: column; align-items: center; gap: 2px;
        }
        .btn-cashout:hover:not(:disabled) { background: var(--accent-green-hover); }
        .btn-icon { font-size: 26px; line-height: 1; }
        .btn-text { display: flex; flex-direction: column; align-items: center; }
        .btn-main { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; line-height: 1.2; }
        .btn-sub { font-size: 13px; font-weight: 700; opacity: 0.95; text-transform: none; }
        .btn-sub .win-amount { color: #fff; font-weight: 800; background: rgba(0,0,0,0.25); padding: 0 10px; border-radius: 6px; }

        .sound-btn {
            width: 100%; padding: 12px; border: none; border-radius: 14px;
            background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.06);
            color: var(--text-muted); font-family: 'Montserrat', sans-serif;
            font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px;
        }
        .sound-btn:active { transform: scale(0.98); background: var(--accent-blue); color: #fff; }
        .sound-btn.muted { opacity: 0.6; }

        .live-bets-section { flex-grow: 1; display: flex; flex-direction: column; background: var(--panel-bg); border-radius: 20px; padding: 16px; border: 1px solid rgba(255,255,255,0.04); }
        .section-title { font-size: 13px; font-weight: 800; color: var(--text-main); margin-bottom: 10px; display: flex; justify-content: space-between; text-transform: uppercase; letter-spacing: 0.5px; }
        .online-count {
            color: var(--accent-green); font-size: 12px; display: flex; align-items: center; gap: 6px;
        }
        .online-count::before {
            content: ''; display: block; width: 6px; height: 6px;
            background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 10px var(--accent-green);
        }
        
        .table-container { overflow-y: auto; max-height: 220px; scrollbar-width: thin; scrollbar-color: #1e293b transparent; }
        .table-container::-webkit-scrollbar { width: 4px; }
        .table-container::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        
        .bets-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; font-weight: 600; }
        .bets-table th { color: var(--text-muted); padding-bottom: 8px; position: sticky; top: 0; background: var(--panel-bg); z-index: 2; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #1e293b; }
        .bets-table td { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .col-user { width: 35%; color: #fff; }
        .col-bet { width: 25%; font-family: 'Nunito', sans-serif; }
        .col-multi { width: 20%; font-family: 'Nunito', sans-serif; text-align: right; }
        .col-profit { width: 20%; font-family: 'Nunito', sans-serif; text-align: right; font-weight: 800; }
        
        .row-cashed { background: rgba(16, 185, 129, 0.06); }
        .row-cashed .col-multi { color: var(--accent-green); }
        .row-cashed .col-profit { color: var(--accent-green); }
        .row-crashed { opacity: 0.4; }
        .row-crashed .col-multi { color: var(--accent-red); }
        .my-bet-row { background: rgba(37, 99, 235, 0.15) !important; border-left: 3px solid var(--accent-blue); }

        .balance-value {
            font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 800;
            color: var(--accent-green); text-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
            white-space: nowrap; display: inline-flex; align-items: center; gap: 2px;
        }

        @media (max-width: 480px) {
            .game-container { padding: 8px; }
            .rocket-area { height: 280px; }
            .multiplier-badge { font-size: 52px; }
            .action-btn { padding: 15px 10px; font-size: 16px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <div class="brand">R-<span>GAME</span></div>
        <div class="header-actions">
            <div class="info-card">Баланс: <span class="balance-value" id="balanceDisplay">Загрузка...</span></div>
            <button class="menu-btn" id="menuBtn">МЕНЮ</button>
        </div>
    </div>

    <div class="history-list" id="historyList"></div>

    <div class="rocket-area">
        <div class="center-display">
            <div class="multiplier-badge" id="multiplierDisplay">1.00x</div>
            <div class="status-badge" id="statusMsg">ОЖИДАНИЕ СТАРТА</div>
        </div>
        <canvas id="crashCanvas" width="800" height="400"></canvas>
    </div>

    <div class="controls-area">
        <div class="inputs-row">
            <div class="input-group">
                <div class="input-label">Сумма ставки</div>
                <div class="styled-input-wrapper wrapper-rub">
                    <input type="text" id="betAmount" class="styled-input" inputmode="numeric" value="100">
                </div>
            </div>
            <div class="input-group">
                <div class="input-label">Авто-вывод</div>
                <div class="styled-input-wrapper wrapper-x">
                    <input type="number" id="autoTarget" class="styled-input" step="0.1" min="1.01" max="100" value="2.00">
                </div>
            </div>
            <div class="auto-checkbox-group" onclick="document.getElementById('autoEnableCheck').click(); event.stopPropagation();">
                <input type="checkbox" id="autoEnableCheck" checked onclick="event.stopPropagation();">
                <label>Авто</label>
            </div>
        </div>

        <button id="actionBtn" class="action-btn btn-bet">
            <span class="btn-icon">🚀</span>
            <span class="btn-text">
                <span class="btn-main" id="actionMain">СДЕЛАТЬ СТАВКУ</span>
                <span class="btn-sub" id="actionSubtext">На следующий раунд</span>
            </span>
        </button>

        <button id="soundBtn" class="sound-btn">
            <span class="icon">🔇</span>
            <span class="label" id="soundLabel">ВКЛЮЧИТЬ ЗВУК</span>
        </button>
    </div>

    <div class="live-bets-section">
        <div class="section-title">
            <span>Ставки игроков</span>
            <span class="online-count" id="onlineCount">184 онлайн</span>
        </div>
        <div class="table-container">
            <table class="bets-table">
                <thead>
                    <tr>
                        <th class="col-user">Игрок</th>
                        <th class="col-bet">Ставка</th>
                        <th class="col-multi">Коэфф.</th>
                        <th class="col-profit">Выплата</th>
                    </tr>
                </thead>
                <tbody id="betsBody"></tbody>
            </table>
        </div>
    </div>
</div>

<audio id="bgMusic" loop preload="auto">
    <source src="Evgeny_Bardyuzha_-_Ant_77516793.mp3" type="audio/mpeg">
</audio>

<script>
(function(){
    const API_BASE = 'https://resellgame.bothost.tech';

    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();
    if (tg.HapticFeedback) tg.enableClosingConfirmation();

    const urlParams = new URLSearchParams(window.location.search);
    let userId = urlParams.get('userId');
    if (!userId && tg.initDataUnsafe?.user?.id) {
        userId = tg.initDataUnsafe.user.id;
    }

    let casinoBalance = 0;
    const balanceSpan = document.getElementById('balanceDisplay');

    async function loadBalance() {
        if (!userId) {
            balanceSpan.innerText = '0 ₽';
            return;
        }
        try {
            const resp = await fetch(`${API_BASE}/profile/${userId}`);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            if (data.casino_balance !== undefined) {
                casinoBalance = data.casino_balance;
                balanceSpan.innerText = casinoBalance.toLocaleString() + ' ₽';
            } else {
                balanceSpan.innerText = '0 ₽';
            }
        } catch (e) {
            balanceSpan.innerText = '0 ₽';
        }
    }

    function updateBalanceFromServer(newBalance) {
        casinoBalance = newBalance;
        balanceSpan.innerText = casinoBalance.toLocaleString() + ' ₽';
    }

    async function sendGameResult(result, bet, win) {
        if (!userId) return;
        try {
            const resp = await fetch(`${API_BASE}/game_result`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: userId, game: 'crash', result: result, bet: bet, win: win })
            });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            if (data.new_balance !== undefined) {
                updateBalanceFromServer(data.new_balance);
            }
        } catch (e) {
            console.error('Ошибка отправки результата:', e);
        }
    }

    const multiplierDisplay = document.getElementById('multiplierDisplay');
    const statusMsg = document.getElementById('statusMsg');
    const historyList = document.getElementById('historyList');
    const betInput = document.getElementById('betAmount');
    const autoInput = document.getElementById('autoTarget');
    const autoEnableCheck = document.getElementById('autoEnableCheck');
    const actionBtn = document.getElementById('actionBtn');
    const actionMain = document.getElementById('actionMain');
    const actionSubtext = document.getElementById('actionSubtext');
    const betsBody = document.getElementById('betsBody');
    const onlineCount = document.getElementById('onlineCount');
    const menuBtn = document.getElementById('menuBtn');
    const canvas = document.getElementById('crashCanvas');
    const ctx = canvas.getContext('2d');
    const soundBtn = document.getElementById('soundBtn');
    const soundLabel = document.getElementById('soundLabel');
    const soundIcon = soundBtn.querySelector('.icon');
    const bgAudio = document.getElementById('bgMusic');

    function updateProfileStats(result, bet, win) {
        let games = parseInt(localStorage.getItem('profile_games_played')) || 0;
        let wins = parseInt(localStorage.getItem('profile_wins')) || 0;
        let losses = parseInt(localStorage.getItem('profile_losses')) || 0;
        let total_bet = parseInt(localStorage.getItem('profile_total_bet')) || 0;
        let total_win = parseInt(localStorage.getItem('profile_total_win')) || 0;

        games += 1;
        total_bet += bet;
        if (result === 'win') { wins += 1; total_win += win; }
        else if (result === 'lose') { losses += 1; }

        localStorage.setItem('profile_games_played', String(games));
        localStorage.setItem('profile_wins', String(wins));
        localStorage.setItem('profile_losses', String(losses));
        localStorage.setItem('profile_total_bet', String(total_bet));
        localStorage.setItem('profile_total_win', String(total_win));
    }

    function formatNumber(num) { return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

    betInput.addEventListener('input', function() {
        let raw = this.value.replace(/\./g, '');
        let num = parseInt(raw) || 0;
        if (num < 0) num = 0;
        if (num > 1000000) num = 1000000;
        this.value = formatNumber(num);
        this.dataset.value = num;
    });

    betInput.addEventListener('blur', function() {
        let num = parseInt(this.dataset.value) || 0;
        if (num < 10) num = 10;
        if (num > 50000) num = 50000;
        this.value = formatNumber(num);
        this.dataset.value = num;
    });

    betInput.dataset.value = 100;
    betInput.value = formatNumber(100);

    function getBetValue() { return parseInt(betInput.dataset.value) || 100; }

    let history = JSON.parse(localStorage.getItem('crash_history')) || [1.42, 3.85, 1.12, 2.15, 12.4];
    function renderHistory() {
        historyList.innerHTML = '';
        history.slice(0, 15).forEach(val => {
            const el = document.createElement('div');
            el.className = 'history-item';
            el.innerText = val.toFixed(2) + 'x';
            if (val < 1.5) el.classList.add('low');
            else if (val < 3.0) el.classList.add('medium');
            else if (val < 10.0) el.classList.add('high');
            else el.classList.add('epic');
            historyList.appendChild(el);
        });
    }
    function addHistory(val) {
        history.unshift(val);
        if (history.length > 20) history.pop();
        localStorage.setItem('crash_history', JSON.stringify(history));
        renderHistory();
    }
    renderHistory();

    const prefixes = ['Alex', 'Crypto', 'Lucky', 'Pro', 'Max', 'Ivan', 'Shadow', 'Luna', 'Star', 'Sniper', 'Rich', 'Whale', 'Trader', 'Kira', 'Viper', 'Phoenix', 'Rocket', 'Nebula', 'Cosmos', 'Omega', 'Zen', 'Vortex', 'Fury', 'Blaze', 'Storm', 'Ghost', 'Titan', 'Apex', 'Nova', 'Falcon', 'Wolf', 'Panther', 'Dragon', 'Knight'];
    const suffixes = ['_99', '_King', '_Lord', '_Pro', '_X', '_Z', '_7', '_42', '_1337', '_Hero', '_God', '_Star', '_Fire', '_Ice', '_Thunder'];

    function generateBotName() {
        return prefixes[Math.floor(Math.random() * prefixes.length)] + suffixes[Math.floor(Math.random() * suffixes.length)] + (Math.random() > 0.6 ? Math.floor(Math.random()*90+10) : '');
    }

    let bots = [];
    let currentOnline = 184;
    let targetOnline = 184;

    function generateRealisticBots(count) {
        const newBots = [];
        for(let i=0; i<count; i++) {
            const betOptions = [50, 100, 150, 200, 300, 500, 750, 1000, 1500, 2500, 5000, 10000];
            const bet = betOptions[Math.floor(Math.random() * betOptions.length)];
            let target;
            const r = Math.random();
            if(r < 0.35) target = 1.05 + Math.random() * 0.4;
            else if(r < 0.65) target = 1.45 + Math.random() * 1.2;
            else if(r < 0.88) target = 2.5 + Math.random() * 4.0;
            else if(r < 0.96) target = 6.5 + Math.random() * 12.0;
            else target = 20.0 + Math.random() * 60.0;
            
            newBots.push({
                id: 'bot_' + Math.random(),
                name: generateBotName(),
                bet: bet,
                target: parseFloat(target.toFixed(2)),
                cashed: false,
                crashed: false
            });
        }
        newBots.sort((a,b) => b.bet - a.bet);
        return newBots;
    }

    bots = generateRealisticBots(16);

    function updateBotsDynamic() {
        // Удаляем случайных ботов и добавляем новых для реалистичной динамики
        const removeCount = Math.floor(Math.random() * 3);
        for(let i=0; i<removeCount && bots.length > 5; i++) {
            bots.splice(Math.floor(Math.random() * bots.length), 1);
        }
        const addCount = Math.floor(Math.random() * 4) + 1;
        const newBatch = generateRealisticBots(addCount);
        bots = bots.concat(newBatch);
        bots.sort((a,b) => b.bet - a.bet);
        targetOnline = bots.length + Math.floor(Math.random() * 120) + 120;
    }

    function updateOnlineSmoothly() {
        if (Math.abs(targetOnline - currentOnline) > 0.5) {
            currentOnline += (targetOnline - currentOnline) * 0.05;
        } else {
            currentOnline += (Math.random() - 0.5) * 0.4;
        }
        currentOnline = Math.max(50, currentOnline);
        onlineCount.innerText = Math.round(currentOnline) + ' онлайн';
    }

    function renderBetsTable() {
        betsBody.innerHTML = '';
        if (userBetQueued || userBetActive) {
            let statusHtml = '<td class="col-multi">—</td><td class="col-profit">—</td>';
            let trClass = 'my-bet-row';
            if (userBetActive && !userBetQueued) {
                const win = Math.floor(userBetAmount * currentMulti);
                statusHtml = `<td class="col-multi">${currentMulti.toFixed(2)}x</td><td class="col-profit">${win}₽</td>`;
            }
            betsBody.innerHTML += `
                <tr class="${trClass}">
                    <td class="col-user">👤 Вы</td>
                    <td class="col-bet">${userBetAmount}₽</td>
                    ${statusHtml}
                </tr>
            `;
        }
        bots.slice(0, 11).forEach(bot => {
            let statusHtml = '<td class="col-multi">—</td><td class="col-profit">—</td>';
            let rowClass = '';
            if (bot.cashed) {
                rowClass = 'row-cashed';
                statusHtml = `<td class="col-multi">${bot.target.toFixed(2)}x</td><td class="col-profit">${(bot.bet * bot.target).toFixed(0)}₽</td>`;
            } else if (bot.crashed) {
                rowClass = 'row-crashed';
                statusHtml = `<td class="col-multi">💥</td><td class="col-profit">-${bot.bet}₽</td>`;
            } else if (gameState === 'FLYING') {
                statusHtml = `<td class="col-multi" style="color:var(--text-muted)">Летит...</td><td class="col-profit" style="color:var(--text-muted)">${(bot.bet * currentMulti).toFixed(0)}₽</td>`;
            }
            betsBody.innerHTML += `
                <tr class="${rowClass}">
                    <td class="col-user">${bot.name}</td>
                    <td class="col-bet">${bot.bet}₽</td>
                    ${statusHtml}
                </tr>
            `;
        });
    }

    let gameState = 'WAITING';
    let countdown = 8.0;
    let currentMulti = 1.0;
    let crashPoint = 1.0;
    
    let userBetQueued = false;
    let userBetActive = false;
    let userBetAmount = 0;
    let userAutoCashout = 2.0;
    let autoEnabled = true;

    let rocketTilt = 0;
    let rocketBob = 0;
    let rocketShakeX = 0;
    let rocketShakeY = 0;

    function updateControls() {
        const inputsDisabled = userBetQueued || userBetActive;
        betInput.disabled = inputsDisabled;
        autoInput.disabled = inputsDisabled;
        autoEnableCheck.disabled = inputsDisabled;

        if (userBetActive) {
            actionBtn.className = 'action-btn btn-cashout';
            const win = Math.floor(userBetAmount * currentMulti);
            actionMain.textContent = win.toLocaleString() + ' ₽';
            actionSubtext.innerHTML = `ЗАБРАТЬ <span class="win-amount">${currentMulti.toFixed(2)}x</span>`;
            actionBtn.disabled = (gameState !== 'FLYING');
        } else if (userBetQueued) {
            if (gameState === 'WAITING') {
                actionBtn.className = 'action-btn btn-cancel';
                actionMain.textContent = 'ОТМЕНИТЬ';
                actionSubtext.textContent = `Ставка ${userBetAmount}₽`;
                actionBtn.disabled = false;
            } else {
                actionBtn.className = 'action-btn btn-bet';
                actionMain.textContent = 'ОЖИДАЙТЕ';
                actionSubtext.textContent = 'Ставка на след. раунд';
                actionBtn.disabled = true;
            }
        } else {
            actionBtn.className = 'action-btn btn-bet';
            actionMain.textContent = 'СДЕЛАТЬ СТАВКУ';
            actionSubtext.textContent = gameState === 'WAITING' ? 'На следующий раунд' : 'Будет поставлена после раунда';
            const amt = getBetValue();
            actionBtn.disabled = (casinoBalance < amt || amt < 10);
        }
    }

    actionBtn.onclick = () => {
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        if (userBetActive && gameState === 'FLYING') {
            cashoutUser();
            return;
        }
        if (userBetQueued && gameState === 'WAITING') {
            userBetQueued = false;
            loadBalance();
            updateControls();
            renderBetsTable();
            return;
        }
        if (!userBetQueued && !userBetActive) {
            let amt = getBetValue();
            if (isNaN(amt) || amt < 10 || amt > casinoBalance) return;
            userBetAmount = amt;
            userAutoCashout = parseFloat(autoInput.value) || 2.0;
            autoEnabled = autoEnableCheck.checked;
            userBetQueued = true;
            updateControls();
            renderBetsTable();
        }
    };

    function cashoutUser() {
        if (!userBetActive) return;
        userBetActive = false;
        let winAmount = Math.floor(userBetAmount * currentMulti);
        sendGameResult('win', userBetAmount, winAmount);
        updateProfileStats('win', userBetAmount, winAmount);
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        updateControls();
        renderBetsTable();
    }

    function generateCrash() {
        const r = Math.random();
        if (r < 0.04) return 1.00;
        if (r < 0.38) return 1.01 + Math.random() * 0.98;
        if (r < 0.68) return 2.00 + Math.random() * 3.50;
        if (r < 0.88) return 5.50 + Math.random() * 6.00;
        return 12.0 + Math.random() * 50.0;
    }

    let lastTime = performance.now();
    
    function setWaitingPhase() {
        gameState = 'WAITING';
        countdown = 7.0;
        currentMulti = 1.0;
        multiplierDisplay.innerText = countdown.toFixed(1) + 's';
        multiplierDisplay.style.color = 'var(--text-main)';
        statusMsg.innerText = 'Прием ставок';
        statusMsg.style.color = 'var(--text-muted)';
        rocketTilt = 0;
        rocketBob = 0;
        rocketShakeX = 0;
        rocketShakeY = 0;
        updateBotsDynamic();
        renderBetsTable();
        updateControls();
        rocketY = 300;
        explosionAlpha = 0;
        particles = [];
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function startFlight() {
        gameState = 'FLYING';
        crashPoint = generateCrash();
        currentMulti = 1.0;
        statusMsg.innerText = 'Ракета в полете';
        statusMsg.style.color = 'var(--accent-blue)';
        if (userBetQueued) {
            userBetActive = true;
            userBetQueued = false;
        }
        updateControls();
    }

    function handleCrash() {
        gameState = 'CRASHED';
        multiplierDisplay.style.color = 'var(--accent-red)';
        statusMsg.innerText = 'ВЗОРВАЛАСЬ НА ' + currentMulti.toFixed(2) + 'x';
        statusMsg.style.color = 'var(--accent-red)';
        if (userBetActive) {
            userBetActive = false;
            updateProfileStats('lose', userBetAmount, 0);
            sendGameResult('lose', userBetAmount, 0);
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        }
        bots.forEach(b => { if (!b.cashed) b.crashed = true; });
        addHistory(currentMulti);
        triggerExplosion();
        updateControls();
        renderBetsTable();
        setTimeout(setWaitingPhase, 3200);
    }

    function gameLoop(now) {
        let dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        updateOnlineSmoothly();

        if (gameState === 'WAITING') {
            countdown -= dt;
            multiplierDisplay.innerText = Math.max(0, countdown).toFixed(1) + 's';
            if (countdown <= 0) startFlight();
        } 
        else if (gameState === 'FLYING') {
            let increment = dt * (0.08 + (currentMulti - 1) * 0.12);
            currentMulti += increment;
            let tableNeedsUpdate = false;
            bots.forEach(b => {
                if (!b.cashed && !b.crashed && currentMulti >= b.target) {
                    b.cashed = true;
                    tableNeedsUpdate = true;
                }
            });
            if (autoEnabled && userBetActive && currentMulti >= userAutoCashout) {
                cashoutUser();
                tableNeedsUpdate = true;
            }
            multiplierDisplay.innerText = currentMulti.toFixed(2) + 'x';
            if (currentMulti < 2) multiplierDisplay.style.color = '#fff';
            else if (currentMulti < 5) multiplierDisplay.style.color = 'var(--accent-blue)';
            else if (currentMulti < 10) multiplierDisplay.style.color = 'var(--accent-orange)';
            else multiplierDisplay.style.color = 'var(--accent-green)';
            if (tableNeedsUpdate) renderBetsTable();
            updateControls();
            if (currentMulti >= crashPoint) {
                currentMulti = crashPoint;
                multiplierDisplay.innerText = currentMulti.toFixed(2) + 'x';
                handleCrash();
            }

            rocketTilt = Math.sin(now / 250) * 0.06 + (Math.random() - 0.5) * 0.015;
            rocketBob = Math.sin(now / 350) * 6 + (Math.random() - 0.5) * 2;
            rocketShakeX = (Math.random() - 0.5) * 1.5;
            rocketShakeY = (Math.random() - 0.5) * 1.5;
        }
        drawFrame(dt);
        requestAnimationFrame(gameLoop);
    }

    let stars = Array.from({length: 140}, () => ({
        x: Math.random() * 800, y: Math.random() * 400,
        s: Math.random() * 2.2 + 0.5, spd: Math.random() * 2 + 0.5
    }));
    let particles = [];
    let rocketY = 290;
    let explosionAlpha = 0;
    let bgOffset = 0;

    function triggerExplosion() {
        explosionAlpha = 1.0;
        for(let i=0; i<350; i++) {
            let a = Math.random() * Math.PI * 2;
            let v = Math.random() * 50 + 25;
            let size = Math.random() * 32 + 6;
            let colors = ['#ef4444', '#f59e0b', '#fbbf24', '#f97316', '#dc2626', '#ffedd5'];
            particles.push({
                x: canvas.width/2, y: rocketY,
                vx: Math.cos(a)*v, vy: Math.sin(a)*v - 6,
                life: 1.0, color: colors[Math.floor(Math.random()*colors.length)],
                size: size, decay: 0.006 + Math.random() * 0.015
            });
        }
    }

    function drawRocket(ctx, x, y, tilt, scale) {
        const s = scale || 1.35;
        const w = 75 * s;
        const h = 145 * s;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(tilt || 0);

        // Корпус ракеты с изысканным градиентом
        ctx.shadowBlur = 20;
        ctx.shadowColor = 'rgba(37, 99, 235, 0.6)';
        const hullGrad = ctx.createLinearGradient(-w/2, 0, w/2, 0);
        hullGrad.addColorStop(0, '#0f172a');
        hullGrad.addColorStop(0.3, '#334155');
        hullGrad.addColorStop(0.5, '#94a3b8');
        hullGrad.addColorStop(0.7, '#334155');
        hullGrad.addColorStop(1, '#0f172a');
        ctx.fillStyle = hullGrad;

        ctx.beginPath();
        ctx.moveTo(0, -h/2);
        ctx.bezierCurveTo(w/2, -h/3, w/2.2, h/3, w/3, h/2);
        ctx.lineTo(-w/3, h/2);
        ctx.bezierCurveTo(-w/2.2, h/3, -w/2, -h/3, 0, -h/2);
        ctx.closePath();
        ctx.fill();

        // Крылья (стабилизаторы)
        const finGrad = ctx.createLinearGradient(-w, 0, w, 0);
        finGrad.addColorStop(0, '#1e293b');
        finGrad.addColorStop(0.5, '#475569');
        finGrad.addColorStop(1, '#1e293b');
        ctx.fillStyle = finGrad;
        
        ctx.beginPath();
        ctx.moveTo(-w/3, h/6);
        ctx.quadraticCurveTo(-w*1.2, h/3, -w*1.4, h/1.6);
        ctx.lineTo(-w/2.5, h/2);
        ctx.closePath();
        ctx.fill();
        
        ctx.beginPath();
        ctx.moveTo(w/3, h/6);
        ctx.quadraticCurveTo(w*1.2, h/3, w*1.4, h/1.6);
        ctx.lineTo(w/2.5, h/2);
        ctx.closePath();
        ctx.fill();

        // Иллюминатор
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#38bdf8';
        const glassGrad = ctx.createRadialGradient(0, -h/5, 2, 0, -h/5, w/4);
        glassGrad.addColorStop(0, '#7dd3fc');
        glassGrad.addColorStop(0.7, '#0284c7');
        glassGrad.addColorStop(1, '#0f172a');
        ctx.fillStyle = glassGrad;
        ctx.beginPath();
        ctx.arc(0, -h/5, w/4.5, 0, Math.PI*2);
        ctx.fill();

        // Блик иллюминатора
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.beginPath();
        ctx.arc(-w/12, -h/5 - w/12, w/12, 0, Math.PI*2);
        ctx.fill();

        // Брендинг на ракете "R-GAME"
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `italic 900 ${16*s}px 'Montserrat', sans-serif`;
        
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'rgba(255,255,255,0.9)';
        ctx.fillStyle = '#ffffff';
        ctx.fillText("R-", -10*s, h/5);
        ctx.fillStyle = '#3b82f6';
        ctx.fillText("GAME", 12*s, h/5);

        ctx.restore();
    }

    function drawFrame(dt) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        let speed = gameState === 'FLYING' ? (1 + currentMulti * 0.45) : 0.25;
        bgOffset += speed * 60 * dt;
        
        let grad = ctx.createRadialGradient(400, 200, 50, 400, 200, 500);
        grad.addColorStop(0, '#0a1424');
        grad.addColorStop(1, '#020617');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 800, 400);

        // Космическая сетка
        ctx.strokeStyle = 'rgba(255,255,255,0.025)';
        ctx.lineWidth = 1;
        for(let i=0; i<800; i+=80) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,400); ctx.stroke(); }
        for(let i=(bgOffset%80)-80; i<400; i+=80) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(800,i); ctx.stroke(); }
        
        ctx.strokeStyle = 'rgba(255,255,255,0.06)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, 380); ctx.lineTo(800, 380); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(50, 0); ctx.lineTo(50, 400); ctx.stroke();

        // Звезды
        ctx.fillStyle = '#fff';
        stars.forEach(s => {
            s.y += s.spd * speed * 60 * dt;
            if(s.y > 400) { s.y = -10; s.x = Math.random()*800; }
            ctx.globalAlpha = Math.random() * 0.5 + 0.3;
            ctx.fillRect(s.x, s.y, s.s, s.s);
        });
        ctx.globalAlpha = 1.0;

        // Кривая полета
        if (gameState === 'FLYING') {
            let progress = Math.min((currentMulti - 1) / 10, 1.0);
            ctx.strokeStyle = 'var(--accent-blue)';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 30;
            ctx.shadowColor = 'rgba(37,99,235,0.6)';
            ctx.beginPath();
            ctx.moveTo(50, 380);
            for(let t=0; t<=progress; t+=0.01) {
                let px = 50 + t * 700;
                let py = 380 - Math.pow(t, 0.8) * 280;
                ctx.lineTo(px, py);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        // Отрисовка частиц взрыва и огня
        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i];
            p.x += p.vx * dt * 1.5;
            p.y += p.vy * dt * 1.5;
            p.life -= p.decay || 0.01;
            p.size *= 0.98;
            if(p.life <= 0 || p.size < 0.5) particles.splice(i, 1);
            else {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 20;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, Math.max(p.size, 0.5), 0, Math.PI*2);
                ctx.fill();
            }
        }
        ctx.globalAlpha = 1.0;
        ctx.shadowBlur = 0;

        if (gameState !== 'CRASHED') {
            const cx = canvas.width/2;
            const cy = rocketY;

            const tilt = rocketTilt || 0;
            const bobY = rocketBob || 0;
            const shakeX = rocketShakeX || 0;
            const shakeY = rocketShakeY || 0;

            if (gameState === 'FLYING') {
                ctx.save();
                ctx.translate(cx + shakeX, cy + bobY + shakeY);
                ctx.rotate(tilt);

                // Огненный шлейф двигателей
                const flameLen = 80 + Math.random() * 40 + currentMulti * 15;
                const baseY = (145 / 2 + 10) * 1.35;
                
                const gradFire = ctx.createRadialGradient(0, baseY, 8, 0, baseY + flameLen, flameLen);
                gradFire.addColorStop(0, '#ffffff');
                gradFire.addColorStop(0.3, '#38bdf8');
                gradFire.addColorStop(0.7, '#2563eb');
                gradFire.addColorStop(1, 'rgba(37, 99, 235, 0)');
                ctx.fillStyle = gradFire;
                
                ctx.beginPath();
                ctx.moveTo(-16, baseY);
                ctx.quadraticCurveTo(-30, baseY + flameLen * 0.7, 0, baseY + flameLen);
                ctx.quadraticCurveTo(30, baseY + flameLen * 0.7, 16, baseY);
                ctx.fill();

                // Спавн мелких искр шлейфа
                if (Math.random() < 0.6) {
                    for (let i=0; i<4; i++) {
                        let angle = -Math.PI/2 + (Math.random()-0.5)*1.0;
                        let speed = 5 + Math.random() * 10;
                        particles.push({
                            x: cx + shakeX + (Math.random()-0.5)*15,
                            y: cy + bobY + shakeY + baseY + 5,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed - 5,
                            life: 0.8,
                            color: '#60a5fa',
                            size: 3 + Math.random() * 5,
                            decay: 0.03 + Math.random() * 0.03
                        });
                    }
                }
                ctx.restore();
            }

            drawRocket(ctx, cx + shakeX, cy + bobY + shakeY, tilt, 1.35);
        }

        if (explosionAlpha > 0) {
            ctx.fillStyle = `rgba(239, 68, 68, ${explosionAlpha * 0.35})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.shadowBlur = 100;
            ctx.shadowColor = 'var(--accent-red)';
            ctx.strokeStyle = `rgba(239, 68, 68, ${explosionAlpha})`;
            ctx.lineWidth = 18 * explosionAlpha;
            ctx.beginPath();
            ctx.arc(canvas.width/2, rocketY, (1 - explosionAlpha) * 300 + 100, 0, Math.PI * 2);
            ctx.stroke();
            explosionAlpha -= dt * 0.8;
            if(explosionAlpha < 0) explosionAlpha = 0;
            ctx.shadowBlur = 0;
        }
    }

    menuBtn.onclick = () => {
        window.location.href = 'casino.html?userId=' + userId;
    };

    let isSoundOn = false;
    function updateSoundButton() {
        if (isSoundOn) {
            soundIcon.textContent = '🔊';
            soundLabel.textContent = 'ВЫКЛЮЧИТЬ ЗВУК';
            soundBtn.classList.remove('muted');
        } else {
            soundIcon.textContent = '🔇';
            soundLabel.textContent = 'ВКЛЮЧИТЬ ЗВУК';
            soundBtn.classList.add('muted');
        }
    }

    function toggleSound() {
        if (isSoundOn) {
            bgAudio.pause();
            isSoundOn = false;
        } else {
            bgAudio.volume = 0.3;
            bgAudio.play().then(() => {
                isSoundOn = true;
                updateSoundButton();
            }).catch(() => {});
        }
        updateSoundButton();
    }

    soundBtn.addEventListener('click', toggleSound);

    document.addEventListener('DOMContentLoaded', function() {
        loadBalance();
        setWaitingPhase();
        requestAnimationFrame(gameLoop);
    });
})();
</script>
</body>
</html>
