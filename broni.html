<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Тихий Дон</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');
:root{--bg:#f7f7f5;--card:#fff;--txt:#1d2623;--muted:#7c8581;--line:#e7e9e6;--green:#294940;--soft:#edf2ef;--danger:#b34b43}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,Arial,sans-serif}.app{max-width:1160px;margin:auto;padding:18px 18px 105px}.top{height:55px;display:flex;align-items:center;justify-content:space-between}.brand{text-align:center}.brand b{font:600 21px "Playfair Display",serif}.brand small{display:block;color:var(--muted);font-size:9px}.ico{border:0;background:transparent;font-size:22px;cursor:pointer}.screen{display:none}.screen.on{display:block}.hero{height:520px;border-radius:30px;overflow:hidden;position:relative}.hero img{width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.75))}.heroText{position:absolute;z-index:2;bottom:30px;left:28px;color:#fff}.heroText h1{font:600 36px/1.05 "Playfair Display",serif;margin:0 0 10px}.heroText p{max-width:450px;font-size:13px;line-height:1.5}.btn{border:0;border-radius:15px;min-height:48px;padding:13px 17px;font-weight:600;cursor:pointer}.primary{background:var(--green);color:#fff}.ghost{background:var(--soft);color:var(--green)}.danger{background:#fff0ee;color:var(--danger)}.wide{width:100%}.light{background:#f4f6f5;color:var(--txt);border:1px solid var(--line)}.head{display:flex;gap:10px;align-items:center;margin:8px 0 15px}.head h2{font:600 28px "Playfair Display",serif;margin:0}.grow{flex:1}.back{border:0;background:transparent;font-size:26px}.search{display:flex;gap:9px;padding:12px 14px;border-radius:15px;background:#f0f1ef;margin-bottom:10px}.search input{border:0;background:transparent;outline:0;width:100%}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:12px}.chip{border:0;background:#fff;border-radius:18px;padding:10px 15px;white-space:nowrap}.chip.on{background:#202624;color:#fff}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}.pic{height:190px;position:relative;background:#dce4df}.pic img{width:100%;height:100%;object-fit:cover}.heart{position:absolute;right:9px;top:9px;border:0;background:#fff;width:38px;height:38px;border-radius:50%}.body{padding:14px}.facts{color:var(--muted);font-size:11px;line-height:1.7}.price{font-weight:700;margin-top:6px}.detailpic{height:410px;border-radius:26px;overflow:hidden;position:relative}.detailpic img{width:100%;height:100%;object-fit:cover}.detail h1{font:600 32px "Playfair Display",serif}.amen{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.amen div{text-align:center;font-size:10px;color:#555}.amen b{display:block;font-size:18px;margin-bottom:4px}.box,.profile{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:14px}.dates{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{border:1px solid var(--line);border-radius:14px;padding:10px 12px}.field label{font-size:9px;color:var(--muted);display:block;margin-bottom:4px}.field input,.field textarea,.field select{border:0;outline:0;width:100%;background:transparent}.total{display:flex;justify-content:space-between;padding:15px 0}.bottom{position:fixed;z-index:30;bottom:12px;left:50%;transform:translateX(-50%);width:min(680px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;padding:7px;box-shadow:0 10px 35px #0001}.nav{border:0;background:transparent;color:var(--muted);border-radius:14px;padding:8px 2px;font-size:10px}.nav.on{background:var(--soft);color:var(--green);font-weight:700}.nav span{display:block;font-size:18px;margin-bottom:3px}.empty{text-align:center;color:var(--muted);padding:55px 20px}.modal{display:none;position:fixed;z-index:50;inset:0;background:#0007;align-items:flex-end}.modal.on{display:flex}.sheet{background:#fff;width:min(680px,100%);border-radius:28px 28px 0 0;padding:22px;max-height:92vh;overflow:auto}.close{float:right;border:0;background:#f0f1ef;width:38px;height:38px;border-radius:50%}.adminstats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:var(--soft);border-radius:16px;padding:13px}.stat b{font-size:22px;display:block}.stat small{color:var(--muted)}.adminrow{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}.adminrow img{width:90px;height:70px;object-fit:cover;border-radius:12px}.toast{position:fixed;z-index:100;top:16px;left:50%;transform:translate(-50%,-20px);opacity:0;background:#202624;color:#fff;border-radius:14px;padding:11px 15px;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){.list{grid-template-columns:1fr}.hero{height:500px}.pic{height:220px}.detailpic{height:340px}.adminstats{grid-template-columns:1fr 1fr}.adminrow{grid-template-columns:72px 1fr}.adminrow .actions{grid-column:2}.adminrow img{width:72px;height:60px}}@media(min-width:900px){.bottom{position:static;transform:none;margin-top:20px}.app{padding-bottom:20px}.list{grid-template-columns:repeat(3,1fr)}}

/* ===== ТИХИЙ ДОН — PROFESSIONAL UI OVERRIDES ===== */
:root{
 --bg:#f5f6f3;--card:#ffffff;--txt:#17201d;--muted:#78817d;
 --line:#e2e7e3;--green:#244c40;--green2:#315f51;--soft:#edf3ef;
 --danger:#a94c45;--shadow:0 18px 55px rgba(22,35,30,.09);
}
body{background:radial-gradient(circle at 50% -10%,#eef5f0 0,#f5f6f3 38%,#f5f6f3 100%);letter-spacing:-.01em}
.app{max-width:1180px;padding:22px 20px 118px}
.top{height:64px;margin-bottom:8px}
.brand b{font-size:24px;letter-spacing:-.03em}
.brand small{font-size:9px;letter-spacing:.18em;text-transform:uppercase}
.ico{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.72);box-shadow:0 5px 20px #17201d0b;transition:.2s}
.ico:hover{transform:translateY(-1px);background:#fff}
.hero{height:590px;border-radius:34px;box-shadow:var(--shadow)}
.hero img{transition:transform .8s ease}
.hero:hover img{transform:scale(1.015)}
.hero:after{background:linear-gradient(180deg,transparent 35%,rgba(9,18,15,.78) 100%)}
.heroText{left:38px;bottom:38px;max-width:600px}
.heroText h1{font-size:46px;line-height:1.02;letter-spacing:-.045em}
.heroText p{font-size:14px;opacity:.92}
.btn{min-height:50px;border-radius:16px;transition:transform .18s,box-shadow .18s,background .18s}
.btn:hover{transform:translateY(-1px)}
.primary{background:linear-gradient(135deg,var(--green),var(--green2));box-shadow:0 9px 22px rgba(36,76,64,.18)}
.ghost{background:#eef3f0}
.head{margin:14px 0 20px}
.head h2{font-size:32px;letter-spacing:-.035em}
.search{border:1px solid var(--line);background:#fff;box-shadow:0 8px 25px #17201d08;padding:14px 16px}
.search input{font-size:14px}
.chips{gap:8px}
.chip{border:1px solid var(--line);box-shadow:0 3px 12px #17201d05}
.chip.on{background:var(--green)}
.list{gap:18px}
.card{border:1px solid var(--line);border-radius:25px;box-shadow:0 9px 30px #17201d08;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 42px #17201d12}
.pic{height:215px}
.pic img,.detailpic img{background:#e9eeeb}
.heart{box-shadow:0 5px 18px #17201d16;transition:.2s}
.heart:hover{transform:scale(1.05)}
.body{padding:17px}
.body>b{font-size:15px}
.facts{font-size:11px;line-height:1.8}
.price{font-size:15px}
.detailpic{height:520px;border-radius:30px;box-shadow:var(--shadow)}
.detail h1{font-size:38px;letter-spacing:-.04em}
.amen{gap:12px}
.amen div{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px 8px}
.amen b{color:var(--green)}
.box,.profile{border-radius:24px;box-shadow:0 10px 34px #17201d08}
.field{background:#fbfcfb;transition:.2s}
.field:focus-within{border-color:#9bb8ad;box-shadow:0 0 0 4px #dceae4}
.field input,.field textarea,.field select{font-size:14px}
.total{font-size:15px}
.total b{font-size:20px;color:var(--green)}
.bottom{border-radius:25px;padding:8px;box-shadow:0 18px 50px rgba(22,35,30,.14)}
.nav{padding:10px 4px;font-size:10px;transition:.18s}
.nav.on{background:#e7f0eb}
.nav span{font-size:19px}
.modal{backdrop-filter:blur(7px)}
.sheet{border-radius:30px 30px 0 0;box-shadow:0 -18px 55px #0002}
.close{cursor:pointer}
.stat{border:1px solid #dfe9e3;background:#f0f5f2}
.adminrow{padding:15px 0}
.toast{box-shadow:0 10px 30px #0003}
.empty{font-size:14px}
@media(max-width:700px){
 .app{padding:14px 14px 112px}
 .hero{height:510px;border-radius:28px}
 .heroText{left:24px;bottom:26px}
 .heroText h1{font-size:35px}
 .pic{height:225px}
 .detailpic{height:360px;border-radius:25px}
 .detail h1{font-size:30px}
}
@media(min-width:900px){
 .hero{height:620px}
 .list{grid-template-columns:repeat(3,1fr)}
 .card .pic{height:225px}
}

</style></head><body><div class="app">
<header class="top"><button class="ico" onclick="toast('Меню')">☰</button><div class="brand"><b>Тихий Дон</b><small>место для вашего отдыха</small></div><button class="ico" onclick="toast('Уведомлений пока нет')">♧</button></header>
<section id="home" class="screen on"><div class="hero"><img id="hero"><div class="heroText"><h1>Отдых,<br>который вы заслужили</h1><p>Комфортные дома на берегу природы для вашего идеального отдыха.</p></div></div><button class="btn primary wide" style="margin-top:14px" onclick="go('houses')">▣ &nbsp; Забронировать</button></section>
<section id="houses" class="screen"><div class="head"><button class="back" onclick="go('home')">←</button><h2>Наши дома</h2></div><div class="search">⌕ <input id="q" placeholder="Поиск дома" oninput="loadHouses()"></div><div class="chips"><button class="chip on" onclick="filter('',this)">Все</button><button class="chip" onclick="filter('Баня',this)">С баней</button><button class="chip" onclick="filter('Чан',this)">С чаном</button><button class="chip" onclick="filter('Терраса',this)">С террасой</button></div><div id="housesList" class="list"><div class="empty">Загружаем дома…</div></div></section>
<section id="detail" class="screen"><div id="detail"></div></section>
<section id="bookings" class="screen"><div class="head"><h2>Бронирование</h2></div><div id="bookingList"><div class="empty">Загружаем бронирования…</div></div></section>
<section id="favorites" class="screen"><div class="head"><h2>Избранное</h2></div><div id="favList" class="list"><div class="empty">Загружаем избранное…</div></div></section>
<section id="profile" class="screen"><div class="head"><h2>Профиль</h2></div><div id="profile"></div></section>
<section id="admin" class="screen"><div class="head"><h2>Админ-панель</h2><div class="grow"></div><button class="btn ghost" onclick="logout()">Выйти</button></div><div id="admin"></div></section>
<nav class="bottom"><button class="nav on" data-s="home" onclick="go('home')"><span>⌂</span>Главная</button><button class="nav" data-s="bookings" onclick="go('bookings')"><span>▣</span>Бронь</button><button class="nav" data-s="favorites" onclick="go('favorites')"><span>♡</span>Избранное</button><button class="nav" data-s="profile" onclick="go('profile')"><span>♙</span>Профиль</button></nav></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div><div id="toast" class="toast"></div>
<script>
const S={user:null,houses:[],fav:new Set(),filter:'',house:null};
const $=x=>document.querySelector(x), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>new Intl.NumberFormat('ru-RU').format(n||0);
const DEFAULT_API_BASE='https://tihiiidon.bothost.tech';const API_BASE=(()=>{const q=new URLSearchParams(location.search).get('api');const same=location.protocol.startsWith('http')?location.origin:'';return (q||((same && /(^|\.)tihiiidon\.bothost\.tech$/i.test(location.hostname))?same:DEFAULT_API_BASE)).replace(/\/$/,'')})();try{localStorage.setItem('broni_api_base',API_BASE)}catch(_){}
async function api(u,o={}){const url=u.startsWith('http')?u:API_BASE+u;let r;try{r=await fetch(url,{credentials:'include',...o})}catch(err){throw Error('Не удалось соединиться с сервером. Проверьте адрес API и запущен ли bot.py.')}let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||d.message||('Ошибка запроса: HTTP '+r.status));return d}

function toast(t){let x=$('#toast');if(!x)return;x.textContent=t;x.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('on'),2400)}
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('on',x.dataset.s===id));if(id==='houses')loadHouses();if(id==='bookings')loadBookings();if(id==='favorites')loadFav();if(id==='profile')renderProfile();if(id==='admin')loadAdmin();scrollTo(0,0)}
function openM(x){$('#sheet').innerHTML=x;$('#modal').classList.add('on')}function closeModal(){$('#modal').classList.remove('on')}
function img(h){return h?.images?.[0]||'https://images.unsplash.com/photo-1449157291145-7efd050a4d0e?auto=format&fit=crop&w=1200&q=80'}
function filter(v,e){S.filter=v;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));e.classList.add('on');loadHouses()}
async function loadHouses(){try{let d=await api('/api/houses?search='+encodeURIComponent($('#q').value||'')+'&amenity='+encodeURIComponent(S.filter));S.houses=d.houses;renderHouses()}catch(e){toast(e.message)}}
function renderHouses(){$('#housesList').innerHTML=S.houses.length?S.houses.map(h=>`<article class="card" onclick="openHouse(${h.id})"><div class="pic"><img src="${esc(img(h))}"><button class="heart" onclick="event.stopPropagation();fav(${h.id})">${S.fav.has(h.id)?'♥':'♡'}</button></div><div class="body"><b>${esc(h.title)}</b><div class="facts">♙ ${h.guests} гостей　▣ ${h.bedrooms} спальн.　♧ ${h.bathrooms} сан.</div><div class="price">от ${fmt(h.price)} ₽ / сутки</div></div></article>`).join(''):'<div class="empty">Подходящих домов не найдено</div>'}
async function openHouse(id){try{S.house=(await api('/api/houses/'+id)).house;renderDetail();go('detail')}catch(e){toast(e.message)}}
function renderDetail(){let h=S.house,im=h.images?.length?h.images:[img(h)];$('#detail').innerHTML=`<div class="head"><button class="back" onclick="go('houses')">←</button><div class="grow"></div><button class="ico" onclick="fav(${h.id})">${S.fav.has(h.id)?'♥':'♡'}</button></div><div class="detailpic"><img src="${esc(im[0])}"><span style="position:absolute;right:12px;bottom:12px;background:#0009;color:#fff;padding:7px 10px;border-radius:12px;font-size:11px">1/${im.length}</span></div><div class="detail"><h1>${esc(h.title)}</h1><div class="facts">♙ ${h.guests} гостей　▣ ${h.bedrooms} спальни　♧ ${h.bathrooms} санузла　⌂ ${h.area||'—'} м²</div><p class="facts">${esc(h.description)}</p><div class="amen">${h.amenities.map(a=>`<div><b>•</b>${esc(a)}</div>`).join('')}</div><div class="box"><b>Выберите даты</b><div class="dates" style="margin-top:12px"><div class="field"><label>ЗАЕЗД</label><input id="di" type="date" min="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>ВЫЕЗД</label><input id="do" type="date" min="${new Date().toISOString().slice(0,10)}"></div></div><div class="field" style="margin-top:9px"><label>ГОСТИ</label><select id="dg">${Array.from({length:h.guests},(_,i)=>`<option>${i+1}</option>`).join('')}</select></div><div class="total"><span>Итого</span><b id="dt">—</b></div><button class="btn primary wide" onclick="book()">Забронировать</button></div></div>`;['di','do'].forEach(x=>$('#'+x).onchange=calc)}
function calc(){let a=$('#di').value,b=$('#do').value;if(a&&b){let n=(new Date(b)-new Date(a))/86400000;$('#dt').textContent=n>0?fmt(n*S.house.price)+' ₽':'—'}}
async function book(){if(!S.user){auth();return}let a=$('#di').value,b=$('#do').value;if(!a||!b)return toast('Выберите даты');try{await api('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({house_id:S.house.id,check_in:a,check_out:b,guests:+$('#dg').value})});toast('Бронирование подтверждено');go('bookings')}catch(e){toast(e.message)}}
async function fav(id){if(!S.user)return auth();try{let d=await api('/api/favorites/'+id,{method:'POST'});d.favorite?S.fav.add(id):S.fav.delete(id);renderHouses();if(S.house?.id===id)renderDetail()}catch(e){toast(e.message)}}
async function loadFav(){if(!S.user){$('#favList').innerHTML='<div class="empty">Войдите, чтобы сохранять дома</div>';return}try{let all=(await api('/api/houses')).houses;let f=(await api('/api/favorites')).favorites;S.fav=new Set(f);let a=all.filter(x=>S.fav.has(x.id));$('#favList').innerHTML=a.length?a.map(h=>`<article class="card" onclick="openHouse(${h.id})"><div class="pic"><img src="${esc(img(h))}"></div><div class="body"><b>${esc(h.title)}</b><div class="price">от ${fmt(h.price)} ₽ / сутки</div></div></article>`).join(''):'<div class="empty">Избранное пока пусто</div>'}catch(e){toast(e.message)}}
async function loadBookings(){if(!S.user){$('#bookingList').innerHTML='<div class="empty">Войдите, чтобы увидеть бронирования</div>';return}try{let d=await api('/api/bookings');$('#bookingList').innerHTML=d.bookings.length?d.bookings.map(b=>`<div class="profile"><div style="display:flex;gap:12px"><img src="${esc(b.images?.[0]||img({}))}" style="width:90px;height:75px;object-fit:cover;border-radius:14px"><div><b>${esc(b.title)}</b><div class="facts">${b.check_in} — ${b.check_out} · ${b.guests} гост.</div><b>${fmt(b.total)} ₽</b></div></div>${b.status==='confirmed'?`<button class="btn danger wide" style="margin-top:12px" onclick="cancelB(${b.id})">Отменить</button>`:''}</div>`).join(''):'<div class="empty">Бронирований пока нет</div>'}catch(e){toast(e.message)}}
async function cancelB(id){if(!confirm('Отменить бронирование?'))return;try{await api('/api/bookings/'+id+'/cancel',{method:'POST'});loadBookings()}catch(e){toast(e.message)}}
function auth(){openM(`<button class="close" onclick="closeModal()">×</button><h2>Вход</h2><div class="field"><label>ИМЯ</label><input id="ln"></div><div class="field" style="margin-top:8px"><label>ПАРОЛЬ</label><input id="lp" type="password"></div><button class="btn primary wide" style="margin-top:12px" onclick="login()">Войти</button><button class="btn ghost wide" style="margin-top:8px" onclick="reg()">Регистрация</button>`)}
function reg(){openM(`<button class="close" onclick="closeModal()">×</button><h2>Регистрация</h2><div class="field"><label>ИМЯ</label><input id="rn"></div><div class="field" style="margin-top:8px"><label>ТЕЛЕФОН</label><input id="rp"></div><div class="field" style="margin-top:8px"><label>ПАРОЛЬ</label><input id="rx" type="password"></div><button class="btn primary wide" style="margin-top:12px" onclick="register()">Создать аккаунт</button>`)}
async function login(){try{let d=await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#ln').value,password:$('#lp').value})});S.user=d.user;closeModal();renderProfile();toast('Вход выполнен')}catch(e){toast(e.message)}}
async function register(){try{let d=await api('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#rn').value,phone:$('#rp').value,password:$('#rx').value})});S.user=d.user;closeModal();toast('Регистрация завершена')}catch(e){toast(e.message)}}
async function logout(){await api('/api/auth/logout',{method:'POST'});S.user=null;go('home')}
function renderProfile(){if(!S.user){$('#profile').innerHTML='<div class="profile"><h3>Ваш профиль</h3><p class="facts">Войдите, чтобы бронировать дома и обращаться к администратору.</p><button class="btn primary wide" onclick="auth()">Войти</button><button class="btn ghost wide" style="margin-top:8px" onclick="reg()">Регистрация</button><button class="btn light wide" style="margin-top:8px" onclick="adminAuth()">Вход администратора</button></div>';return}$('#profile').innerHTML=`<div class="profile"><b style="font-size:20px">${esc(S.user.name)}</b><p class="facts">${esc(S.user.phone||'')}</p><button class="btn light wide" onclick="problem()">Сообщить о проблеме</button>${S.user.role==='admin'?'<button class="btn primary wide" style="margin-top:8px" onclick="go(\'admin\')">Админ-панель</button>':''}<button class="btn danger wide" style="margin-top:8px" onclick="logout()">Выйти</button></div>`}
function problem(){openM(`<button class="close" onclick="closeModal()">×</button><h2>Проблема в номере</h2><p class="facts">Сообщение сразу сохранится в системе и уйдёт администратору.</p><div class="field"><label>КАТЕГОРИЯ</label><select id="pc"><option>Проблема в номере</option><option>Уборка</option><option>Техника</option><option>Заселение</option><option>Другое</option></select></div><div class="field" style="margin-top:8px"><label>СООБЩЕНИЕ</label><textarea id="pm" rows="5" placeholder="Опишите проблему"></textarea></div><button class="btn primary wide" style="margin-top:12px" onclick="sendProblem()">Отправить</button>`)}
async function sendProblem(){try{await api('/api/reports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:$('#pc').value,message:$('#pm').value,house_id:S.house?.id||null})});closeModal();toast('Администратор получил сообщение')}catch(e){toast(e.message)}}
function adminAuth(){openM(`<button class="close" onclick="closeModal()">×</button><h2>Администратор</h2><div class="field"><label>ЛОГИН</label><input id="an"></div><div class="field" style="margin-top:8px"><label>ПАРОЛЬ</label><input id="ax" type="password"></div><button class="btn primary wide" style="margin-top:12px" onclick="adminLogin()">Войти</button>`)}
async function adminLogin(){try{let d=await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#an').value,password:$('#ax').value})});S.user=d.user;closeModal();go('admin')}catch(e){toast(e.message)}}
async function loadAdmin(){try{let d=await api('/api/admin/dashboard'),h=(await api('/api/admin/houses')).houses;$('#admin').innerHTML=`<div class="adminstats"><div class="stat"><b>${d.counts.active}</b><small>Активных домов</small></div><div class="stat"><b>${d.counts.bookings}</b><small>Броней</small></div><div class="stat"><b>${d.counts.reports}</b><small>Проблем</small></div><div class="stat"><b>${d.counts.houses}</b><small>Всего домов</small></div></div><div class="profile"><div style="display:flex;justify-content:space-between"><h3>Объявления</h3><button class="btn primary" onclick="newHouse()">+ Дом</button></div>${h.map(x=>`<div class="adminrow"><img src="${esc(img(x))}"><div><b>${esc(x.title)}</b><div class="facts">${fmt(x.price)} ₽ / сутки · ${x.guests} гостей</div></div><div class="actions"><button class="btn ghost" onclick="photos(${x.id})">Фото</button><button class="btn danger" onclick="hideH(${x.id})">Скрыть</button></div></div>`).join('')}</div><div class="profile"><h3>Обращения</h3>${d.reports.length?d.reports.map(r=>`<div style="border-bottom:1px solid var(--line);padding:12px 0"><b>#${r.id} · ${esc(r.category)}</b><div>${esc(r.message)}</div><div class="facts">${esc(r.name)} · ${r.created_at}</div>${r.status==='new'?`<button class="btn ghost" style="margin-top:7px" onclick="closeR(${r.id})">Закрыть</button>`:''}</div>`).join(''):'<div class="facts">Новых обращений нет</div>'}</div><div class="profile"><h3>Тема</h3><button class="btn ghost" onclick="saveTheme('light')">Светлая</button> <button class="btn ghost" onclick="saveTheme('dark')">Тёмная</button></div>`}catch(e){toast(e.message)}}
function newHouse(){openM(`<button class="close" onclick="closeModal()">×</button><h2>Новое объявление</h2><form id="hf"><div class="field"><label>НАЗВАНИЕ</label><input name="title" required placeholder="Дом №5"></div><div class="field" style="margin-top:8px"><label>ОПИСАНИЕ</label><textarea name="description"></textarea></div><div class="dates" style="margin-top:8px"><div class="field"><label>ЦЕНА</label><input name="price" type="number" required></div><div class="field"><label>ГОСТИ</label><input name="guests" type="number" value="4"></div></div><div class="dates" style="margin-top:8px"><div class="field"><label>СПАЛЬНИ</label><input name="bedrooms" type="number" value="1"></div><div class="field"><label>САНУЗЛЫ</label><input name="bathrooms" type="number" value="1"></div></div><div class="field" style="margin-top:8px"><label>УДОБСТВА ЧЕРЕЗ ЗАПЯТУЮ</label><input name="amenities" value="Wi‑Fi,Кухня,Парковка"></div><div class="field" style="margin-top:8px"><label>ФОТО</label><input name="images" type="file" multiple accept="image/jpeg,image/png,image/webp"></div><button class="btn primary wide" style="margin-top:12px">Опубликовать</button></form>`);$('#hf').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);f.set('amenities',JSON.stringify(f.get('amenities').split(',').map(x=>x.trim()).filter(Boolean)));try{await api('/api/admin/houses',{method:'POST',body:f});closeModal();loadAdmin();toast('Объявление опубликовано')}catch(e){toast(e.message)}}}
function photos(id){openM(`<button class="close" onclick="closeModal()">×</button><h2>Фотографии дома</h2><p class="facts">Первая фотография будет обложкой.</p><input id="pf" type="file" multiple accept="image/jpeg,image/png,image/webp"><button class="btn primary wide" style="margin-top:12px" onclick="uploadPhotos(${id})">Загрузить</button>`)}
async function uploadPhotos(id){let f=new FormData();for(let x of $('#pf').files)f.append('images',x);try{await api('/api/admin/houses/'+id+'/images',{method:'POST',body:f});closeModal();loadAdmin();toast('Фото добавлены')}catch(e){toast(e.message)}}
async function hideH(id){if(!confirm('Скрыть объявление?'))return;await api('/api/admin/houses/'+id,{method:'DELETE'});loadAdmin()}
async function closeR(id){await api('/api/admin/reports/'+id+'/close',{method:'POST'});loadAdmin()}
async function saveTheme(t){try{await api('/api/admin/settings/theme',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({theme:t})});applyTheme(t)}catch(e){toast(e.message)}}
function applyTheme(t){if(t==='dark'){document.documentElement.style.setProperty('--bg','#101513');document.documentElement.style.setProperty('--card','#171d1b');document.documentElement.style.setProperty('--txt','#f3f5f3');document.documentElement.style.setProperty('--line','#2b3430');document.documentElement.style.setProperty('--soft','#202a26')}else{location.reload()}}
async function boot(){try{let c=await api('/api/config');applyTheme(c.theme);let m=await api('/api/auth/me');S.user=m.user;if(S.user){try{S.fav=new Set((await api('/api/favorites')).favorites)}catch{}}S.houses=(await api('/api/houses')).houses;$('#hero').src=img(S.houses[0]||{});renderHouses();renderProfile()}catch(e){toast(e.message)}}
boot();
</script></body></html>
