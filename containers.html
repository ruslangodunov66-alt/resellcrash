<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CONTAINERS | RESSELL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;1,800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           1. ROOT & RESET
           ========================================================================== */
        :root {
            --bg-dark: #050608;
            --bg-grid: rgba(255, 255, 255, 0.02);
            --container-bg: #0a0b0d;
            --panel-bg: rgba(15, 16, 18, 0.78);
            --panel-border: rgba(255, 255, 255, 0.05);
            --accent-blue: #dce7f2;
            --accent-blue-glow: rgba(220, 231, 242, 0.16);
            --accent-green: #1bd15d;
            --accent-red: #f03043;
            --accent-orange: #ff9800;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --gold: #FFD34E;
            --gold-glow: rgba(255, 211, 78, 0.3);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(var(--bg-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-main);
            overflow-x: hidden;
            display: flex; justify-content: center;
            margin: 0;
            min-height: 100vh;
        }

        .game-container {
            width: 100%; max-width: 600px;
            min-height: 100vh;
            display: flex; flex-direction: column;
            padding: 12px 12px calc(24px + var(--tg-viewport-safe-area-inset-bottom, 0px)) 12px;
            position: relative;
            z-index: 1;
        }

        .game-container::before {
            content: ''; position: fixed; top: 10%; left: 50%; width: 600px; height: 600px;
            background: radial-gradient(circle, var(--accent-blue-glow) 0%, transparent 60%);
            transform: translateX(-50%); opacity: 0.3; pointer-events: none; z-index: -1;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 4px; margin-bottom: 16px; flex-shrink: 0;
        }
        .brand { display:flex; align-items:center; gap:9px; min-width:0; font-family:'Montserrat',sans-serif; font-weight:900; font-size:18px; line-height:1; letter-spacing:.5px; font-style:italic; text-shadow:0 4px 15px rgba(0,0,0,.5); }
        .brand-mark { width:30px; height:30px; border-radius:10px; display:grid; place-items:center; flex:none; background:#fff; color:#000; box-shadow:0 0 0 1px rgba(255,255,255,.15),0 8px 24px rgba(255,255,255,.10); font:900 13px/1 'Montserrat',sans-serif; }
        .brand span { color:#fff; }
        .header-actions { display:flex; gap:8px; align-items:center; }
        
        .info-card {
            background: var(--panel-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 8px 14px; border-radius: 14px; font-weight: 800; font-size: 15px;
            border: 1px solid var(--panel-border); box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            display: flex; align-items: center; gap: 6px;
        }
        .balance-value {
            font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 900;
            color: #fff; text-shadow: 0 0 16px rgba(255,255,255,.12);
            cursor: pointer; transition: 0.2s;
        }
        .balance-value:active { transform: scale(0.93); }
        
        .back-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--panel-border);
            border-radius: 12px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 18px; color: var(--text-main); cursor: pointer; transition: all 0.2s;
            backdrop-filter: blur(8px);
        }
        .back-btn:active { transform: scale(0.9); background: var(--accent-blue); border-color: var(--accent-blue); }

        /* ---------- СЕЛЕКТОР КЕЙСОВ (улучшенный) ---------- */
        .case-selector {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 8px 4px 16px 4px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            flex-shrink: 0;
        }
        .case-selector::-webkit-scrollbar { display: none; }
        .case-option {
            flex: 0 0 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(145deg, rgba(21, 29, 41, 0.8), rgba(13, 19, 31, 0.9));
            border: 2px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 16px 10px 14px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(8px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .case-option::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(24,130,255,0.1), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .case-option:hover::before { opacity: 1; }
        .case-option.active {
            border-color: var(--accent-blue);
            background: rgba(24, 130, 255, 0.12);
            box-shadow: 0 0 30px var(--accent-blue-glow), 0 8px 20px rgba(0,0,0,0.5);
            transform: translateY(-4px) scale(1.02);
        }
        .case-option.active::after {
            content: '★';
            position: absolute;
            top: 6px;
            right: 10px;
            font-size: 16px;
            color: var(--gold);
            text-shadow: 0 0 12px var(--gold-glow);
        }
        .case-option img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
            margin-bottom: 8px;
            transition: transform 0.3s;
        }
        .case-option.active img { transform: scale(1.08) rotate(-2deg); }
        .case-option .label {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 0.3px;
            margin-bottom: 2px;
        }
        .case-option .price {
            font-size: 13px;
            font-weight: 800;
            color: var(--gold);
            background: rgba(255, 211, 78, 0.12);
            padding: 2px 12px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 2px;
            border: 1px solid rgba(255, 211, 78, 0.15);
        }
        .case-option .count-badge {
            font-size: 12px;
            font-weight: 800;
            background: rgba(255,255,255,0.06);
            padding: 4px 12px;
            border-radius: 30px;
            color: var(--text-muted);
            margin-top: 8px;
            border: 1px solid rgba(255,255,255,0.04);
            min-width: 40px;
        }
        .case-option.active .count-badge {
            background: rgba(24,130,255,0.15);
            color: #fff;
            border-color: rgba(24,130,255,0.3);
        }

        /* ---------- ОСНОВНОЙ БЛОК КЕЙСА ---------- */
        .case-block {
            display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(180deg, rgba(24,130,255,0.05) 0%, rgba(13,19,31,0.8) 100%);
            border-radius: 24px; padding: 24px 20px 24px; margin-bottom: 20px;
            border: 1px solid rgba(24,130,255,0.15);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 2px 20px rgba(24,130,255,0.05);
            position: relative; overflow: hidden; backdrop-filter: blur(10px);
        }
        .case-block::before {
            content: ''; position: absolute; top: -50%; left: 50%; width: 200%; height: 200%;
            background: radial-gradient(circle at center, rgba(24,130,255,0.1) 0%, transparent 60%);
            transform: translateX(-50%); pointer-events: none;
        }

        .case-image-wrap {
            width: 160px; height: 160px; cursor: pointer;
            animation: floatCase 4s ease-in-out infinite; transition: 0.2s; position: relative; z-index: 2;
        }
        .case-image-wrap:active { transform: scale(0.9); }
        .case-image-wrap img {
            width: 100%; height: 100%; object-fit: contain;
            filter: drop-shadow(0 20px 25px rgba(0,0,0,0.6)) drop-shadow(0 0 15px rgba(78, 163, 255, 0.4));
            pointer-events: none;
        }
        @keyframes floatCase {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(2deg); filter: drop-shadow(0 0 25px rgba(78, 163, 255, 0.6)); }
        }

        .single-open-btn{
            width:100%;max-width:300px;height:52px;margin:0 auto 7px;
            border:1px solid rgba(255,255,255,.24);border-radius:15px;
            background:linear-gradient(180deg,#f5f7f9 0%,#c9d0d7 48%,#8e979f 100%);
            color:#090b0e;font:900 13px/1 'Montserrat',sans-serif;letter-spacing:1.25px;
            box-shadow:0 10px 26px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.8),0 3px 0 rgba(55,61,67,.95);
            cursor:pointer;transition:transform .16s,filter .16s,box-shadow .16s;position:relative;z-index:3;overflow:hidden;
        }
        .single-open-btn::before{content:'';position:absolute;top:0;left:-35%;width:28%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-18deg);animation:openShine 3.2s ease-in-out infinite;}
        .single-open-btn:active{transform:translateY(2px);box-shadow:0 5px 16px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5),0 1px 0 rgba(55,61,67,.9);}
        .single-open-btn:disabled{opacity:.42;filter:grayscale(.55);cursor:default;box-shadow:none;transform:none;}
        .single-open-btn.loading{pointer-events:none;}
        .single-open-btn.loading .open-label{opacity:0;}
        .single-open-btn.loading::after{content:'';position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border:2px solid rgba(0,0,0,.18);border-top-color:#090b0e;border-radius:50%;animation:spin .75s linear infinite;}
        .owned-line{text-align:center;min-height:16px;margin:0 0 3px;color:rgba(220,231,242,.48);font:800 10px/1 'Nunito',sans-serif;letter-spacing:.35px;}
        @keyframes openShine{0%,55%{left:-35%;opacity:0}65%{opacity:1}85%,100%{left:125%;opacity:0}}

        .case-info { text-align: center; margin-top: 15px; z-index: 2; }
        .case-title {
            font-family: 'Montserrat', sans-serif; font-size: 26px; font-weight: 900; letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff, #8ca8c9); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 10px rgba(0,0,0,0.4); margin-bottom: 4px;
        }
        .case-price { font-size: 22px; font-weight: 900; color: var(--gold); text-shadow: 0 0 15px rgba(255,211,78,0.4); margin-bottom: 12px; }
        
        .buy-btn {
            background: linear-gradient(180deg,#ffffff 0%,#d9dee3 52%,#aab2b9 100%);
            border: 1px solid rgba(255,255,255,.28); border-radius: 16px;
            padding: 16px 36px; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 18px;
            color: #080a0d; cursor: pointer; transition: 0.2s;
            box-shadow: 0 6px 0 #4b535b, 0 12px 25px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.85);
            text-transform: uppercase; letter-spacing: 1px; width: 100%; max-width: 280px; position: relative; z-index: 2;
        }
        .buy-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #4b535b, 0 5px 10px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.55); }
        .buy-btn:disabled { opacity: 0.6; pointer-events: none; filter: grayscale(1); box-shadow: none; transform: translateY(6px); }
        .buy-btn.loading .btn-text { visibility: hidden; }
        .buy-btn.loading::after {
            content: ''; position: absolute; width: 24px; height: 24px;
            border: 3px solid rgba(0,0,0,0.16); border-top: 3px solid #080a0d; border-radius: 50%;
            animation: spin 0.8s linear infinite; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

        .section-title {
            font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 800; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; padding-left: 4px;
        }
        
        .reward-carousel {
            background: var(--panel-bg); backdrop-filter: blur(10px); border-radius: 20px;
            padding: 12px; border: 1px solid var(--panel-border); display: flex; align-items: center; gap: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); margin-bottom: 20px; transition: 0.3s;
        }
        .reward-image {
            width: 70px; height: 70px; flex-shrink: 0; border-radius: 14px;
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .reward-image img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.4s ease; }
        .reward-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .reward-name { font-weight: 800; font-size: 17px; }
        .reward-rarity { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; opacity: 0.9; }
        .reward-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-left: auto; box-shadow: 0 0 12px currentColor; margin-right: 8px; }

        .history-section {
            flex: 1; display: flex; flex-direction: column;
            background: var(--panel-bg); backdrop-filter: blur(10px); border-radius: 20px;
            padding: 16px; border: 1px solid var(--panel-border); box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .history-list-vertical {
            max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 6px;
        }
        .history-list-vertical::-webkit-scrollbar { width: 4px; }
        .history-list-vertical::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        
        .history-item-vert {
            display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.2);
            padding: 8px 12px; border-radius: 16px; font-size: 14px;
            border: 1px solid rgba(255,255,255,0.03); border-left: 4px solid transparent; transition: background 0.2s;
        }
        .history-item-vert:hover { background: rgba(255,255,255,0.05); }
        .h-icon { width: 36px; height: 36px; border-radius: 10px; overflow: hidden; flex-shrink: 0; }
        .h-icon img { width: 100%; height: 100%; object-fit: cover; }
        .h-name { flex: 1; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .h-rarity { font-size: 10px; font-weight: 800; text-transform: uppercase; opacity: 0.8; letter-spacing: 0.5px; }

        .overlay {
            position: fixed; inset: 0; z-index: 1000;
            background:
                radial-gradient(circle at 50% 42%, rgba(255,255,255,.055), transparent 26%),
                radial-gradient(circle at 50% 55%, rgba(176,196,216,.045), transparent 48%),
                rgba(3,4,6,.965);
            backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; width: 100%; height: 100%; overflow:hidden;
        }
        .overlay::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.22;background:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:100% 4px;mix-blend-mode:screen;}
        .overlay::after{content:'';position:absolute;left:50%;top:48%;width:70vw;height:70vw;max-width:620px;max-height:620px;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.035);border-radius:50%;box-shadow:0 0 100px rgba(255,255,255,.025),inset 0 0 80px rgba(255,255,255,.02);pointer-events:none;}

        .overlay.active { display: flex; }
        
        .overlay-content { width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; position:relative; z-index:3; }
        .spin-kicker{font:900 9px/1 'Montserrat',sans-serif;letter-spacing:3px;color:rgba(255,255,255,.42);margin-bottom:11px;text-transform:uppercase;}
        .spin-status{height:18px;font:800 10px/1 'Nunito',sans-serif;letter-spacing:1.8px;color:rgba(255,255,255,.72);text-transform:uppercase;margin-top:2px;transition:opacity .2s;}
        .spin-status strong{color:#fff;}
        .spin-energy{position:absolute;inset:-30px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.09),transparent 58%);filter:blur(20px);opacity:.5;animation:energyBreath 1.8s ease-in-out infinite;}
        @keyframes energyBreath{0%,100%{transform:scale(.9);opacity:.28}50%{transform:scale(1.08);opacity:.62}}


        .slot-container {
            width: 100%; height: 218px; overflow: hidden; border-radius: 24px;
            background: linear-gradient(180deg,#090b0e,#050608);
            border: 1px solid rgba(255,255,255,.12);
            box-shadow: inset 0 0 80px rgba(0,0,0,.95), 0 25px 90px rgba(0,0,0,.62), 0 0 55px rgba(255,255,255,.045);
            position: relative; margin-bottom: 16px;
        }
        .slot-container::before{content:'';position:absolute;inset:1px;border-radius:23px;border:1px solid rgba(255,255,255,.035);pointer-events:none;z-index:16;}
        .slot-container.impact{animation:slotImpact .68s cubic-bezier(.2,.8,.2,1);}
        @keyframes slotImpact{0%{transform:scale(1);box-shadow:inset 0 0 80px rgba(0,0,0,.95),0 25px 90px rgba(0,0,0,.62),0 0 55px rgba(255,255,255,.045)}35%{transform:scale(1.018);box-shadow:inset 0 0 90px rgba(255,255,255,.08),0 0 70px rgba(255,255,255,.16)}100%{transform:scale(1);box-shadow:inset 0 0 80px rgba(0,0,0,.95),0 25px 90px rgba(0,0,0,.62),0 0 55px rgba(255,255,255,.045)}}
        .slot-container::after {
            content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 15;
            background: linear-gradient(90deg, #050608 0%, rgba(5,6,8,.74) 7%, transparent 22%, transparent 78%, rgba(5,6,8,.74) 93%, #050608 100%);
        }
        #slotSpinCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5; opacity: 0; transition: opacity 0.3s;
        }

        .slot-track {
            display: flex; height: 100%; will-change: transform; position: relative; z-index: 10;
        }
        .slot-item {
            flex: 0 0 160px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px; background: linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.008)); border-right: 1px solid rgba(255,255,255,.045);
            color: #fff; font-weight: 700; font-size: 14px; text-align: center;
        }
        .slot-item img {
            width: 90px; height: 90px; object-fit: contain; border-radius: 14px;
            background: rgba(0,0,0,0.4); margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 12px 28px rgba(0,0,0,.58), inset 0 1px 0 rgba(255,255,255,.05);
        }
        .slot-item .item-name { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
        .slot-item .item-rarity { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.8; font-weight: 800;}
        
        .slot-pointer {
            position: absolute; top: -1px; left: 50%; transform: translateX(-50%);
            width: 4px; height: 100%; background: linear-gradient(180deg,#fff,#bfc9d3,#fff);
            box-shadow: 0 0 20px rgba(255,255,255,.45), 0 0 5px #fff; z-index: 20; pointer-events: none;
        }
        .slot-pointer::before, .slot-pointer::after {
            content: '▼'; position: absolute; left: 50%; transform: translateX(-50%);
            color: #fff; font-size: 22px; text-shadow: 0 0 14px rgba(255,255,255,.8);
        }
        .slot-pointer::before { top: -8px; }
        .slot-pointer::after { bottom: -8px; content: '▲'; }

        .single-spin-shell{width:min(100%,520px);display:flex;flex-direction:column;align-items:center;gap:12px;}
        .single-spin-title{font:900 11px/1 'Montserrat',sans-serif;letter-spacing:2px;text-transform:uppercase;color:rgba(220,231,242,.58);}
        .single-spin-case{width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 12px 28px rgba(0,0,0,.55));animation:spinCaseFloat 1.8s ease-in-out infinite;}
        @keyframes spinCaseFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
        .single-slot-frame{width:100%;position:relative;padding:9px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));border:1px solid rgba(112,157,205,.2);box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.055);}
        .single-slot-frame::before{content:'';position:absolute;inset:0;border-radius:20px;background:linear-gradient(90deg,transparent,rgba(102,158,220,.07),transparent);pointer-events:none;}
        .single-slot-frame .slot-container{height:190px;border-radius:14px;}
        .single-slot-frame .slot-item{flex-basis:170px;}
        .single-slot-frame .slot-item img{width:92px;height:92px;}
        .single-spin-status{min-height:16px;font:900 10px/1 'Montserrat',sans-serif;letter-spacing:1.7px;color:rgba(220,231,242,.56);text-transform:uppercase;}
        .single-win-glow{animation:singleWinGlow 1.2s ease-in-out infinite alternate;}
        @keyframes singleWinGlow{from{box-shadow:0 0 20px currentColor,inset 0 0 18px rgba(255,255,255,.03)}to{box-shadow:0 0 55px currentColor,inset 0 0 25px rgba(255,255,255,.06)}}

        .result-display { width: 100%; text-align: center; min-height: 165px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 10px 0; }
        .result-item { display: flex; flex-direction: column; align-items: center; animation: resultPop 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; transform: scale(0.5); opacity: 0; }
        
        .result-item-img-wrap { position: relative; margin-bottom: 10px; }
        .result-item-img-wrap::before {

<script>
(function() {
    'use strict';

    const API_BASE = 'https://resellgame.bothost.tech';
    const RESSELL_SESSION_KEY = 'resell_server_session_v4';
    let telegramInitData = '';
    let userId = String(new URLSearchParams(location.search).get('userId') || window.Telegram?.WebApp?.initDataUnsafe?.user?.id || '');

    function encodeBase64UrlUtf8(value){
        try{
            const bytes=new TextEncoder().encode(String(value||''));
            let bin=''; for(const b of bytes) bin+=String.fromCharCode(b);
            return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
        }catch(_){return '';}
    }
    function sessionUid(token){
        try{const v=String(token||'').replace(/^Bearer\s+/i,'');const uid=v.split('.')[0]||'';return /^\d+$/.test(uid)?uid:'';}catch(_){return '';}
    }
    function getLaunchSession(){
        try{return String(new URLSearchParams(location.search).get('resell_session')||'').trim();}
        catch(_){return '';}
    }
    function getStoredSession(){
        try{return String(getLaunchSession()||sessionStorage.getItem(RESSELL_SESSION_KEY)||localStorage.getItem(RESSELL_SESSION_KEY)||'').trim();}
        catch(_){return '';}
    }
    function storeSession(token){try{sessionStorage.setItem(RESSELL_SESSION_KEY,token);}catch(_){} try{localStorage.setItem(RESSELL_SESSION_KEY,token);}catch(_){} }
    function clearSession(){try{sessionStorage.removeItem(RESSELL_SESSION_KEY);}catch(_){} try{localStorage.removeItem(RESSELL_SESSION_KEY);}catch(_){} }
    function getInitData(){return String(window.Telegram?.WebApp?.initData||telegramInitData||'').trim();}

    async function ensureResellSession(){
        const launch=getLaunchSession();
        const init=getInitData();
        const wanted=String(userId||'').trim();
        const existing=getStoredSession();

        // 1. RESSELL itself passes a server-signed session. This is the
        // authoritative link to the same players.balance account.
        if(launch && sessionUid(launch)){
            const uid=sessionUid(launch);
            if(!wanted || uid===wanted){ userId=uid; storeSession(launch); return launch; }
        }

        // 2. Reuse a session already issued for this exact Telegram account.
        if(existing && sessionUid(existing)){
            const uid=sessionUid(existing);
            if(!wanted || uid===wanted){ userId=uid; storeSession(existing); return existing; }
            clearSession();
        }

        // 3. Normal Telegram Mini App bootstrap.
        if(init){
            try{

        try{

    // API
    async function apiFetch(url, options = {}, timeout = 10000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeout);
        try {
            try { window.Telegram?.WebApp?.ready?.(); window.Telegram?.WebApp?.expand?.(); } catch(_) {}
            telegramInitData = getInitData();
            const uidFromInit = (()=>{try{const q=new URLSearchParams(telegramInitData);const u=JSON.parse(q.get('user')||'{}');return String(u?.id||'');}catch(_){return '';}})();
            if(uidFromInit) userId=uidFromInit;

            const headers = new Headers(options.headers || {});
            headers.set('Accept','application/json');
            headers.set('Cache-Control','no-cache');
            headers.delete('X-Telegram-Init-Data'); headers.delete('Authorization'); headers.delete('X-Resell-Session');

            let session=getStoredSession();
            const launchSession=getLaunchSession();
            if(launchSession && sessionUid(launchSession)){
                session=launchSession;
                userId=sessionUid(launchSession);
                storeSession(session);
            }else if(session && userId && sessionUid(session) && sessionUid(session)!==String(userId)){
                clearSession(); session='';
            }
            if(!session && userId) session=await ensureResellSession();
            if(session){
                const sid=sessionUid(session);
                if(sid) userId=sid;
                headers.set('X-Resell-Session',session);
                headers.set('Authorization','Bearer '+session);
            }else if(telegramInitData){
                headers.set('X-Telegram-Init-Data',telegramInitData);
                headers.set('Authorization','tma '+telegramInitData);
            }

            let requestUrl=String(url);
            if(telegramInitData){
                try{const u=new URL(requestUrl,location.href); const enc=encodeBase64UrlUtf8(telegramInitData); if(enc)u.searchParams.set('tg_auth_b64',enc); requestUrl=u.href;}catch(_){}
            }
            if(userId){
                try{const u=new URL(requestUrl,location.href);u.searchParams.set('tg_id',String(userId));requestUrl=u.href;}catch(_){}
            }
            if(!userId) throw new Error('Не удалось определить Telegram ID. Открой RESSELL через Telegram.');

            const response=await fetch(requestUrl,{...options,cache:'no-store',headers,signal:controller.signal});
            const text=await response.text(); let data={};
            try{data=text?JSON.parse(text):{};}catch(_){throw new Error('Некорректный ответ сервера');}
            if(!response.ok){
                if(response.status===401 && telegramInitData && session){ clearSession(); return await apiFetch(url,options,timeout); }
                throw new Error(data.error||`HTTP ${response.status}`);
            }
            return data;
        } catch(error){
            if(error.name==='AbortError') throw new Error('Превышено время ожидания сервера');
            throw error;
        } finally { clearTimeout(timer); }
    }

    async function loadBalance() {
        if (balanceLoading) return;
        try {
            // В Telegram WebView userId иногда появляется только после первого обращения к WebApp.
            telegramInitData = getInitData();
            if (!userId) {
                userId = String(window.Telegram?.WebApp?.initDataUnsafe?.user?.id || '');
            }
            if (!userId && telegramInitData) {
                try {
                    const q = new URLSearchParams(telegramInitData);
                    const u = JSON.parse(q.get('user') || '{}');
                    userId = String(u?.id || '');
                } catch (_) {}
            }
            if (!userId) return;

            balanceLoading = true;

            // Единственный источник отображаемого баланса — players.balance через RESSELL /profile.
            // /wheel/case/state нужен только для восстановления незавершённого кейса.
            let loaded = false;
            try {
                const data = await apiFetch(`${API_BASE}/profile/${userId}`);
                if (data && data.balance !== undefined && data.balance !== null) {
                    balance = Number(data.balance) || 0;
                    loaded = true;
                }
            } catch (profileError) {
                console.warn('Профиль RESSELL не загрузил баланс:', profileError);
            }

            try {
                const state = await apiFetch(`${API_BASE}/wheel/case/state?userId=${encodeURIComponent(userId)}`);
                if (state?.pending?.round_id) {
                    const caseId = state.pending.case_id && CASE_TYPES[state.pending.case_id] ? state.pending.case_id : selectedCaseId;
                    pendingRounds[caseId] = [state.pending.round_id];
                    caseInventory[caseId] = 1;
                }
                // Только если /profile действительно не ответил, используем тот же
                // players.balance, возвращаемый case/state, как резервный источник.
                if (!loaded && state && state.balance !== undefined && state.balance !== null) {
                    balance = Number(state.balance) || 0;
                    loaded = true;
                }
            } catch (stateError) {
                console.warn('Состояние контейнеров не загрузило состояние:', stateError);
            }

            if (loaded) updateUI();
            else balanceDisplay.textContent = '—';
        } catch (error) {
            console.error('Не удалось синхронизировать баланс RESSELL:', error);
            balanceDisplay.textContent = '—';
        } finally {
            balanceLoading = false;
        }
    }

        const caseData = CASE_TYPES[caseType];
        if (!caseData) return { ...CASE_ITEMS[CASE_ITEMS.length - 1], value: 1000, name: '💰 1 000 ₽', displayName: '💰 ДЕНЬГИ', type: 'money' };

        const prob = caseData.probabilities;
        const ranges = caseData.moneyRanges;
        const r = Math.random();
        let cum = 0;
        for (const item of CASE_ITEMS) {
            cum += prob[item.id] || 0;
            if (r <= cum) {
                const result = { ...item };
                if (item.type === 'money') {
                    let range;
                    if (item.id === 'money_legend') range = ranges.legend;
                    else if (item.id === 'money_rare') range = ranges.rare;
                    else range = ranges.common;
                    result.value = getRandomInt(range[0], range[1]);

                    result.displayName = '💰 ДЕНЬГИ';

        fallback.value = 1000;
        fallback.name = '💰 1 000 ₽';
        fallback.displayName = '💰 ДЕНЬГИ';

    // АУДИО
    let audioCtx = null;
    function initAudio() { if (!audioCtx && window.AudioContext) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } }
    function playTone(freq, dur, vol = 0.08, type = 'sine') {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.value = freq;
            gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + dur);
        } catch(e) {}
    }
    function soundTick(step = 0) {
        initAudio();
        if (!audioCtx) return;
        const f = Math.min(980, 560 + (step % 7) * 48);
        playTone(f, 0.026, 0.045, 'square');
        try {
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(f * 1.55, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.028, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.045);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.045);
        } catch(e) {}
    }
    function soundHit() {
        initAudio();

                    if (item.round_id) pendingRounds[caseId].push(item.round_id);
                });
                caseInventory.rare = pendingRounds.rare.length;
                caseInventory.legendary = pendingRounds.legendary.length;
            } else if (state.pending?.round_id) {
                const caseId = state.pending.case_id && CASE_TYPES[state.pending.case_id] ? state.pending.case_id : selectedCaseId;

    async function buyMultipleCases() {
        const caseData = CASE_TYPES[selectedCaseId];

        const total = caseData.price * purchaseQuantity;
        if (balance < total) {
            alert('❌ Недостаточно R-Coin на основном балансе RESSELL');
            return;
        }
        buyBtn.classList.add('loading');
        buyBtn.disabled = true;
        qtyMinus.disabled = true;
        qtyPlus.disabled = true;
        try {
            const requestId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
            const result = await apiFetch(`${API_BASE}/wheel/case/buy-many`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body:JSON.stringify({userId, case_id:selectedCaseId, quantity:purchaseQuantity, request_id:requestId})
            });
            balance = result.balance ?? balance;
            const ids = Array.isArray(result.round_ids) ? result.round_ids.filter(Boolean) : [];

            const base=CASE_ITEMS.find(x=>x.id===serverItem.id);
            const item=base ? {...base,...serverItem,rarityColor:serverItem.rarityColor||base.rarityColor}
                : {...serverItem,type:serverItem.type||(serverItem.id==='brabus'?'car':'money'),rarityColor:serverItem.rarityColor||'#95a5a6'};
            if(item.type==='money'){item.name=serverItem.name;item.value=Number(serverItem.value||0);item.displayName='💰 ДЕНЬГИ';}

            pendingRounds[selectedCaseId]=(pendingRounds[selectedCaseId]||[]).filter(id=>id!==roundId);
            caseInventory[selectedCaseId]=pendingRounds[selectedCaseId].length;
            updateUI();
            overlay.classList.add('active');
            closeBtn.style.display='none';
            await startSingleSlotMachine({item,roundId},selectedCaseId);
        }catch(e){
            alert('❌ '+e.message);
            await syncWheelState();
            isOpening=false;
            updateUI();
        }
    }

    caseOpenTrigger.addEventListener('click',()=>{
        const owned = Number(caseInventory[selectedCaseId] || 0);
        if(owned > 0) openSelectedCase();
        else {
            try { buyBtn.scrollIntoView({behavior:'smooth',block:'center'}); } catch(_) {}
        }
    });
    singleOpenBtn.addEventListener('click',()=>openSelectedCase());

    let spinSparkAnimFrame;
    function visualItemForSpin(item, caseType){ return item || getVisualItem(caseType); }

    function buildSpinTrack(container,winItem,caseType,itemWidth){
        const totalItems=70,winPos=60,trackItems=[];
        const doBait=Math.random()<0.35;
        const baitPool=CASE_ITEMS.filter(i=>i.rarity==='мифическая'||i.rarity==='легендарная');
        for(let i=0;i<totalItems;i++){
            if(i===winPos){trackItems.push({...winItem});continue;}
            if(doBait&&(i===winPos-1||i===winPos+1)&&baitPool.length&&Math.random()>.5){trackItems.push({...baitPool[Math.floor(Math.random()*baitPool.length)]});continue;}
            trackItems.push(visualItemForSpin(null,caseType));
        }
        if(baitPool.length){for(let b=0;b<3;b++){let pos=getRandomInt(5,totalItems-5),attempts=0;while(pos>=winPos-2&&pos<=winPos+2&&attempts++<20)pos=getRandomInt(5,totalItems-5);if(pos!==winPos)trackItems[pos]={...baitPool[Math.floor(Math.random()*baitPool.length)]};}}
        const track=document.createElement('div');track.className='slot-track';track.style.width=(totalItems*itemWidth)+'px';
        trackItems.forEach(item=>{const d=document.createElement('div');d.className='slot-item';d.innerHTML=`<img src="${item.image}" alt=""><div class="item-name">${item.displayName||item.name}</div><div class="item-rarity" style="color:${item.rarityColor}">${item.rarity}</div>`;track.appendChild(d);});
        container.appendChild(track);
        return {track,winPos,totalItems,doBait};
    }

    async function startSingleSlotMachine(win,caseType){
        const itemWidth=170;
        animContainer.innerHTML=`<div class="single-spin-shell">
            <div class="single-spin-title">${CASE_TYPES[caseType]?.name || 'Кейс'}</div>
            <img class="single-spin-case" src="${CASE_TYPES[caseType]?.image || ''}" alt="">
            <div class="single-slot-frame"><div class="slot-container" id="singleSlot"><div class="spin-energy"></div><div class="slot-pointer"></div></div></div>
            <div class="single-spin-status" id="singleSpinStatus">ОТКРЫТИЕ...</div>
            <div class="result-display" id="resultDisplay"></div>
        </div>`;
        const slot=document.getElementById('singleSlot');
        const built=buildSpinTrack(slot,win.item,caseType,itemWidth);
        await new Promise(r=>requestAnimationFrame(r));
        const cw=slot.clientWidth;
        const centerOffset=(cw/2)-(itemWidth/2);
        let targetPx=(built.winPos*itemWidth)-centerOffset;
        targetPx+=(Math.random()-.5)*itemWidth*.18;
        const durationSec=5.2+Math.random()*.9;
        built.track.style.transition=`transform ${durationSec}s cubic-bezier(.08,.82,.16,1)`;
        built.track.style.transform=`translateX(-${targetPx}px)`;
        // Звук привязан к реальному пересечению границ предметов указателем.
        // Никакого таймера: пока рулетка движется, каждый новый предмет даёт один click.
        let crossedIndex = Math.floor((targetPx + centerOffset) / itemWidth);
        let rafId = 0;
        const watchCrossings = () => {
            if (!isOpening) return;
            const tr = getComputedStyle(built.track).transform;
            let x = 0;
            if (tr && tr !== 'none') {
                try { x = new DOMMatrixReadOnly(tr).m41; } catch(e) {
                    const m = tr.match(/matrix\(([^)]+)\)/);
                    if (m) { const a=m[1].split(','); x=parseFloat(a[4])||0; }
                }
            }
            const pointerX = slot.clientWidth / 2;
            const currentIndex = Math.floor((pointerX - x) / itemWidth);
            if (currentIndex !== crossedIndex) {
                const dir = currentIndex > crossedIndex ? 1 : -1;
                let guard = 0;
                while (crossedIndex !== currentIndex && guard++ < 8) {
                    crossedIndex += dir;
                    soundTick(crossedIndex);
                    vibrate('light');
                }
            }
            rafId = requestAnimationFrame(watchCrossings);
        };
        rafId = requestAnimationFrame(watchCrossings);
        await new Promise(r=>setTimeout(r,durationSec*1000+250));
        cancelAnimationFrame(rafId);
        slot.classList.add('impact');
        sfx.stop();vibrate('heavy');
        const status=document.getElementById('singleSpinStatus');
        if(status) status.textContent='ДРОП ПОЛУЧЕН';
        await new Promise(r=>setTimeout(r,550));
        showSingleResult(win);
    }

    function showSingleResult(win){
        const resDisplay=document.getElementById('resultDisplay');
        if(!resDisplay) return;
        resDisplay.innerHTML=`<div class="result-item" style="color:${win.item.rarityColor}">
            <div class="result-item-img-wrap"><img class="single-win-glow" src="${win.item.image}" alt=""></div>
            <div class="result-name">${win.item.name}</div>
            <div class="result-rarity" style="color:${win.item.rarityColor}">${win.item.rarity}</div>
            <button class="btn-claim" id="claimAllBtn">ЗАБРАТЬ ПРИЗ</button>
        </div>`;
        spawnConfetti(win.item.rarityColor);sfx.win();vibrate('heavy');
        document.getElementById('claimAllBtn').addEventListener('click',async function(){
            this.disabled=true;this.textContent='ПОЛУЧЕНИЕ...';
            try{
                const result=await apiFetch(`${API_BASE}/wheel/case/claim`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId,round_id:win.roundId})});
                balance=result.balance??balance;
                history.unshift({name:win.item.name,rarity:win.item.rarity,rarityColor:win.item.rarityColor,image:win.item.image,time:Date.now()});
                if(history.length>30)history=history.slice(0,30);
                updateUI();overlay.classList.remove('active');animContainer.innerHTML='';stopConfetti();isOpening=false;vibrate('success');
            }catch(e){alert('❌ Ошибка: '+e.message);this.disabled=false;this.textContent='ЗАБРАТЬ ПРИЗ';await syncWheelState();}
        });
    }

    // CONFETTI
    const cCanvas = document.getElementById('confettiCanvas');
    const cCtx = cCanvas.getContext('2d');
    let confettis = []; let confettiAnim;
    
    function spawnConfetti(color) {
        cCanvas.style.display = 'block';
        cCanvas.width = window.innerWidth; cCanvas.height = window.innerHeight;
        confettis = [];
        const colors = [color, '#ffffff', '#FFD34E'];
        for(let i=0; i<80; i++) {
            confettis.push({
                x: cCanvas.width/2, y: cCanvas.height/2 + 100,
                vx: (Math.random()-0.5)*25, vy: -(Math.random()*15 + 10),
                size: Math.random()*8 + 4, color: colors[Math.floor(Math.random()*colors.length)],
                rot: Math.random()*360, rotSpeed: (Math.random()-0.5)*10
            });
        }
        function drawC() {
            cCtx.clearRect(0,0, cCanvas.width, cCanvas.height);
            let alive = false;
            confettis.forEach(c => {
                c.x += c.vx; c.y += c.vy; c.vy += 0.5; c.rot += c.rotSpeed;
                if (c.y < cCanvas.height) alive = true;
                cCtx.save(); cCtx.translate(c.x, c.y); cCtx.rotate(c.rot * Math.PI/180);
                cCtx.fillStyle = c.color; cCtx.shadowColor = c.color; cCtx.shadowBlur = 10;
                cCtx.fillRect(-c.size/2, -c.size/2, c.size, c.size);
                cCtx.restore();
            });
            if(alive) confettiAnim = requestAnimationFrame(drawC); else stopConfetti();
        }
        drawC();
    }
    function stopConfetti() { cancelAnimationFrame(confettiAnim); cCanvas.style.display = 'none'; cCtx.clearRect(0,0,cCanvas.width,cCanvas.height); }

    // КАРУСЕЛЬ
    let cIndex = 0;
    setInterval(() => {
        const item = CASE_ITEMS[cIndex];
        const img = document.getElementById('carouselImage');
        img.style.opacity = '0';
        setTimeout(() => {
            img.src = item.image; img.style.opacity = '1';
            document.getElementById('carouselName').textContent = item.name;
            const r = document.getElementById('carouselRarity');
            r.textContent = item.rarity; r.style.color = item.rarityColor;
            document.querySelector('.reward-dot').style.color = item.rarityColor;
        }, 300);
        cIndex = (cIndex + 1) % CASE_ITEMS.length;
    }, 3000);

    document.getElementById('backBtn').addEventListener('click', () => { vibrate('light'); window.location.replace('resell.html'); });

    // СТАРТ
    loadCaseCounts();
    loadSelectedCase();
    loadBalance();
    syncWheelState();
    updateUI();
})();
</script>
</body>
