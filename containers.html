<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CONTAINERS | RESSELL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;1,800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           1. ROOT & RESET
           ========================================================================== */
        :root {
            --bg-dark: #050608;
            --bg-grid: rgba(255, 255, 255, 0.02);
            --container-bg: #0a0b0d;
            --panel-bg: rgba(15, 16, 18, 0.78);
            --panel-border: rgba(255, 255, 255, 0.05);
            --accent-blue: #dce7f2;
            --accent-blue-glow: rgba(220, 231, 242, 0.16);
            --accent-green: #1bd15d;
            --accent-red: #f03043;
            --accent-orange: #ff9800;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --gold: #FFD34E;
            --gold-glow: rgba(255, 211, 78, 0.3);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(var(--bg-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-main);
            overflow-x: hidden;
            display: flex; justify-content: center;
            margin: 0;
            min-height: 100vh;
        }

        .game-container {
            width: 100%; max-width: 600px;
            min-height: 100vh;
            display: flex; flex-direction: column;
            padding: 12px 12px calc(24px + var(--tg-viewport-safe-area-inset-bottom, 0px)) 12px;
            position: relative;
            z-index: 1;
        }

        .game-container::before {
            content: ''; position: fixed; top: 10%; left: 50%; width: 600px; height: 600px;
            background: radial-gradient(circle, var(--accent-blue-glow) 0%, transparent 60%);
            transform: translateX(-50%); opacity: 0.3; pointer-events: none; z-index: -1;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 4px; margin-bottom: 16px; flex-shrink: 0;
        }
        .brand { display:flex; align-items:center; gap:9px; min-width:0; font-family:'Montserrat',sans-serif; font-weight:900; font-size:18px; line-height:1; letter-spacing:.5px; font-style:italic; text-shadow:0 4px 15px rgba(0,0,0,.5); }
        .brand-mark { width:30px; height:30px; border-radius:10px; display:grid; place-items:center; flex:none; background:#fff; color:#000; box-shadow:0 0 0 1px rgba(255,255,255,.15),0 8px 24px rgba(255,255,255,.10); font:900 13px/1 'Montserrat',sans-serif; }
        .brand span { color:#fff; }
        .header-actions { display:flex; gap:8px; align-items:center; }
        
        .info-card {
            background: var(--panel-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 8px 14px; border-radius: 14px; font-weight: 800; font-size: 15px;
            border: 1px solid var(--panel-border); box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            display: flex; align-items: center; gap: 6px;
        }
        .balance-value {
            font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 900;
            color: #fff; text-shadow: 0 0 16px rgba(255,255,255,.12);
            cursor: pointer; transition: 0.2s;
        }
        .balance-value:active { transform: scale(0.93); }
        
        .back-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--panel-border);
            border-radius: 12px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 18px; color: var(--text-main); cursor: pointer; transition: all 0.2s;
            backdrop-filter: blur(8px);
        }
        .back-btn:active { transform: scale(0.9); background: var(--accent-blue); border-color: var(--accent-blue); }

        /* ---------- СЕЛЕКТОР КЕЙСОВ (улучшенный) ---------- */
        .case-selector {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 8px 4px 16px 4px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            flex-shrink: 0;
        }
        .case-selector::-webkit-scrollbar { display: none; }
        .case-option {
            flex: 0 0 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(145deg, rgba(21, 29, 41, 0.8), rgba(13, 19, 31, 0.9));
            border: 2px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 16px 10px 14px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(8px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .case-option::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(24,130,255,0.1), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .case-option:hover::before { opacity: 1; }
        .case-option.active {
            border-color: var(--accent-blue);
            background: rgba(24, 130, 255, 0.12);
            box-shadow: 0 0 30px var(--accent-blue-glow), 0 8px 20px rgba(0,0,0,0.5);
            transform: translateY(-4px) scale(1.02);
        }
        .case-option.active::after {
            content: '★';
            position: absolute;
            top: 6px;
            right: 10px;
            font-size: 16px;
            color: var(--gold);
            text-shadow: 0 0 12px var(--gold-glow);
        }
        .case-option img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
            margin-bottom: 8px;
            transition: transform 0.3s;
        }
        .case-option.active img { transform: scale(1.08) rotate(-2deg); }
        .case-option .label {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 0.3px;
            margin-bottom: 2px;
        }
        .case-option .price {
            font-size: 13px;
            font-weight: 800;
            color: var(--gold);
            background: rgba(255, 211, 78, 0.12);
            padding: 2px 12px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 2px;
            border: 1px solid rgba(255, 211, 78, 0.15);
        }
        .case-option .count-badge {
            font-size: 12px;
            font-weight: 800;
            background: rgba(255,255,255,0.06);
            padding: 4px 12px;
            border-radius: 30px;
            color: var(--text-muted);
            margin-top: 8px;
            border: 1px solid rgba(255,255,255,0.04);
            min-width: 40px;
        }
        .case-option.active .count-badge {
            background: rgba(24,130,255,0.15);
            color: #fff;
            border-color: rgba(24,130,255,0.3);
        }

        /* ---------- ОСНОВНОЙ БЛОК КЕЙСА ---------- */
        .case-block {
            display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(180deg, rgba(24,130,255,0.05) 0%, rgba(13,19,31,0.8) 100%);
            border-radius: 24px; padding: 24px 20px 24px; margin-bottom: 20px;
            border: 1px solid rgba(24,130,255,0.15);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 2px 20px rgba(24,130,255,0.05);
            position: relative; overflow: hidden; backdrop-filter: blur(10px);
        }
        .case-block::before {
            content: ''; position: absolute; top: -50%; left: 50%; width: 200%; height: 200%;
            background: radial-gradient(circle at center, rgba(24,130,255,0.1) 0%, transparent 60%);
            transform: translateX(-50%); pointer-events: none;
        }

        .case-image-wrap {
            width: 160px; height: 160px; cursor: pointer;
            animation: floatCase 4s ease-in-out infinite; transition: 0.2s; position: relative; z-index: 2;
        }
        .case-image-wrap:active { transform: scale(0.9); }
        .case-image-wrap img {
            width: 100%; height: 100%; object-fit: contain;
            filter: drop-shadow(0 20px 25px rgba(0,0,0,0.6)) drop-shadow(0 0 15px rgba(78, 163, 255, 0.4));
            pointer-events: none;
        }
        @keyframes floatCase {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(2deg); filter: drop-shadow(0 0 25px rgba(78, 163, 255, 0.6)); }
        }

        .case-info { text-align: center; margin-top: 15px; z-index: 2; }
        .case-title {
            font-family: 'Montserrat', sans-serif; font-size: 26px; font-weight: 900; letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff, #8ca8c9); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 10px rgba(0,0,0,0.4); margin-bottom: 4px;
        }
        .case-price { font-size: 22px; font-weight: 900; color: var(--gold); text-shadow: 0 0 15px rgba(255,211,78,0.4); margin-bottom: 12px; }
        
        .buy-btn {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 16px;
            padding: 16px 36px; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 18px;
            color: #fff; cursor: pointer; transition: 0.2s;
            box-shadow: 0 6px 0 #b35900, 0 12px 25px rgba(255, 152, 0, 0.4);
            text-transform: uppercase; letter-spacing: 1px; width: 100%; max-width: 280px; position: relative; z-index: 2;
        }
        .buy-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b35900, 0 5px 10px rgba(255, 152, 0, 0.4); }
        .buy-btn:disabled { opacity: 0.6; pointer-events: none; filter: grayscale(1); box-shadow: none; transform: translateY(6px); }
        .buy-btn.loading .btn-text { visibility: hidden; }
        .buy-btn.loading::after {
            content: ''; position: absolute; width: 24px; height: 24px;
            border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid #fff; border-radius: 50%;
            animation: spin 0.8s linear infinite; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

        .section-title {
            font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 800; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; padding-left: 4px;
        }
        
        .reward-carousel {
            background: var(--panel-bg); backdrop-filter: blur(10px); border-radius: 20px;
            padding: 12px; border: 1px solid var(--panel-border); display: flex; align-items: center; gap: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); margin-bottom: 20px; transition: 0.3s;
        }
        .reward-image {
            width: 70px; height: 70px; flex-shrink: 0; border-radius: 14px;
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .reward-image img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.4s ease; }
        .reward-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .reward-name { font-weight: 800; font-size: 17px; }
        .reward-rarity { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; opacity: 0.9; }
        .reward-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-left: auto; box-shadow: 0 0 12px currentColor; margin-right: 8px; }

        .history-section {
            flex: 1; display: flex; flex-direction: column;
            background: var(--panel-bg); backdrop-filter: blur(10px); border-radius: 20px;
            padding: 16px; border: 1px solid var(--panel-border); box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .history-list-vertical {
            max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 6px;
        }
        .history-list-vertical::-webkit-scrollbar { width: 4px; }
        .history-list-vertical::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        
        .history-item-vert {
            display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.2);
            padding: 8px 12px; border-radius: 16px; font-size: 14px;
            border: 1px solid rgba(255,255,255,0.03); border-left: 4px solid transparent; transition: background 0.2s;
        }
        .history-item-vert:hover { background: rgba(255,255,255,0.05); }
        .h-icon { width: 36px; height: 36px; border-radius: 10px; overflow: hidden; flex-shrink: 0; }
        .h-icon img { width: 100%; height: 100%; object-fit: cover; }
        .h-name { flex: 1; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .h-rarity { font-size: 10px; font-weight: 800; text-transform: uppercase; opacity: 0.8; letter-spacing: 0.5px; }

        .overlay {
            position: fixed; inset: 0; z-index: 1000;
            background:
                radial-gradient(circle at 50% 42%, rgba(255,255,255,.055), transparent 26%),
                radial-gradient(circle at 50% 55%, rgba(176,196,216,.045), transparent 48%),
                rgba(3,4,6,.965);
            backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; width: 100%; height: 100%; overflow:hidden;
        }
        .overlay::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.22;background:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:100% 4px;mix-blend-mode:screen;}
        .overlay::after{content:'';position:absolute;left:50%;top:48%;width:70vw;height:70vw;max-width:620px;max-height:620px;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.035);border-radius:50%;box-shadow:0 0 100px rgba(255,255,255,.025),inset 0 0 80px rgba(255,255,255,.02);pointer-events:none;}

        .overlay.active { display: flex; }
        
        .overlay-content { width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; position:relative; z-index:3; }
        .spin-kicker{font:900 9px/1 'Montserrat',sans-serif;letter-spacing:3px;color:rgba(255,255,255,.42);margin-bottom:11px;text-transform:uppercase;}
        .spin-status{height:18px;font:800 10px/1 'Nunito',sans-serif;letter-spacing:1.8px;color:rgba(255,255,255,.72);text-transform:uppercase;margin-top:2px;transition:opacity .2s;}
        .spin-status strong{color:#fff;}
        .spin-energy{position:absolute;inset:-30px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.09),transparent 58%);filter:blur(20px);opacity:.5;animation:energyBreath 1.8s ease-in-out infinite;}
        @keyframes energyBreath{0%,100%{transform:scale(.9);opacity:.28}50%{transform:scale(1.08);opacity:.62}}


        .slot-container {
            width: 100%; height: 218px; overflow: hidden; border-radius: 24px;
            background: linear-gradient(180deg,#090b0e,#050608);
            border: 1px solid rgba(255,255,255,.12);
            box-shadow: inset 0 0 80px rgba(0,0,0,.95), 0 25px 90px rgba(0,0,0,.62), 0 0 55px rgba(255,255,255,.045);
            position: relative; margin-bottom: 16px;
        }
        .slot-container::before{content:'';position:absolute;inset:1px;border-radius:23px;border:1px solid rgba(255,255,255,.035);pointer-events:none;z-index:16;}
        .slot-container.impact{animation:slotImpact .68s cubic-bezier(.2,.8,.2,1);}
        @keyframes slotImpact{0%{transform:scale(1);box-shadow:inset 0 0 80px rgba(0,0,0,.95),0 25px 90px rgba(0,0,0,.62),0 0 55px rgba(255,255,255,.045)}35%{transform:scale(1.018);box-shadow:inset 0 0 90px rgba(255,255,255,.08),0 0 70px rgba(255,255,255,.16)}100%{transform:scale(1);box-shadow:inset 0 0 80px rgba(0,0,0,.95),0 25px 90px rgba(0,0,0,.62),0 0 55px rgba(255,255,255,.045)}}
        .slot-container::after {
            content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 15;
            background: linear-gradient(90deg, #050608 0%, rgba(5,6,8,.74) 7%, transparent 22%, transparent 78%, rgba(5,6,8,.74) 93%, #050608 100%);
        }
        #slotSpinCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5; opacity: 0; transition: opacity 0.3s;
        }

        .slot-track {
            display: flex; height: 100%; will-change: transform; position: relative; z-index: 10;
        }
        .slot-item {
            flex: 0 0 160px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px; background: linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.008)); border-right: 1px solid rgba(255,255,255,.045);
            color: #fff; font-weight: 700; font-size: 14px; text-align: center;
        }
        .slot-item img {
            width: 90px; height: 90px; object-fit: contain; border-radius: 14px;
            background: rgba(0,0,0,0.4); margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 12px 28px rgba(0,0,0,.58), inset 0 1px 0 rgba(255,255,255,.05);
        }
        .slot-item .item-name { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
        .slot-item .item-rarity { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.8; font-weight: 800;}
        
        .slot-pointer {
            position: absolute; top: -1px; left: 50%; transform: translateX(-50%);
            width: 4px; height: 100%; background: linear-gradient(180deg,#fff,#bfc9d3,#fff);
            box-shadow: 0 0 20px rgba(255,255,255,.45), 0 0 5px #fff; z-index: 20; pointer-events: none;
        }
        .slot-pointer::before, .slot-pointer::after {
            content: '▼'; position: absolute; left: 50%; transform: translateX(-50%);
            color: #fff; font-size: 22px; text-shadow: 0 0 14px rgba(255,255,255,.8);
        }
        .slot-pointer::before { top: -8px; }
        .slot-pointer::after { bottom: -8px; content: '▲'; }

        .result-display { width: 100%; text-align: center; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
        .result-item { display: flex; flex-direction: column; align-items: center; animation: resultPop 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; transform: scale(0.5); opacity: 0; }
        
        .result-item-img-wrap { position: relative; margin-bottom: 16px; }
        .result-item-img-wrap::before {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 150%; height: 150%; background: radial-gradient(circle, currentColor 0%, transparent 60%);
            opacity: 0.2; z-index: -1; animation: pulseGlow 2s infinite alternate;
        }
        .result-item img {
            width: 140px; height: 140px; object-fit: contain; border-radius: 20px;
            background: rgba(0,0,0,0.5); border: 2px solid currentColor; box-shadow: 0 0 40px currentColor;
        }
        .result-name { font-family: 'Montserrat', sans-serif; font-size: 28px; font-weight: 900; letter-spacing: 0.5px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); margin-bottom: 4px; }
        .result-rarity { font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        
        @keyframes resultPop {
            0% { transform: scale(0.5) translateY(40px); opacity: 0; filter: blur(10px); }
            100% { transform: scale(1) translateY(0); opacity: 1; filter: blur(0); }
        }
        @keyframes pulseGlow { 0% { opacity: 0.1; transform: translate(-50%, -50%) scale(0.9); } 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1.1); } }

        .btn-claim {
            background: linear-gradient(135deg, #1bd15d, #129e43);
            border: 1px solid rgba(255,255,255,0.2); color: #fff; font-family: 'Montserrat', sans-serif; font-weight: 900;
            font-size: 18px; padding: 18px 50px; border-radius: 20px; cursor: pointer; transition: 0.2s;
            box-shadow: 0 6px 0 #0d6e30, 0 15px 30px rgba(27, 209, 93, 0.4);
            margin-top: 10px; width: 100%; max-width: 320px; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-claim:active { transform: translateY(4px); box-shadow: 0 2px 0 #0d6e30; }

        .btn-close-overlay {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted); padding: 12px 30px; border-radius: 14px; font-weight: 800;
            cursor: pointer; transition: 0.2s; margin-top: 20px; font-family: 'Nunito', sans-serif; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-close-overlay:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
        
        #confettiCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 1001; display: none; }
        
        .case-animation-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 300px;}
        .case-animation-stage .case-image-wrap { width: 220px; height: 220px; }
        .case-falling { animation: caseFall 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes caseFall {
            0% { transform: translateY(-300px) scale(0.5) rotate(-15deg); opacity: 0; }
            100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
        }
        .case-open-flash { animation: flashOpen 0.4s ease forwards; }
        @keyframes flashOpen {
            0% { filter: brightness(1) drop-shadow(0 0 20px rgba(78, 163, 255, 0.5)); transform: scale(1); }
            50% { filter: brightness(2) drop-shadow(0 0 100px #fff); transform: scale(1.15); }
            100% { filter: brightness(0); transform: scale(0.5); opacity: 0; }
        }

        .skin-bonus {
            background: linear-gradient(135deg, #2a1a3a, #4a2a5a);
            border: 2px solid #e74c3c;
            border-radius: 16px;
            padding: 12px 16px;
            margin: 12px 0;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 0 30px rgba(231, 76, 60, 0.5);
            text-align: left;
            width: 100%;
            max-width: 320px;
        }
        .skin-bonus img {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid #e74c3c;
            background: #222;
            object-fit: cover;
            flex-shrink: 0;
        }
        .skin-bonus .info .name {
            color: #e74c3c;
            font-weight: 900;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(231, 76, 60, 0.6);
        }
        .skin-bonus .info .desc {
            color: #ccc;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .case-option { flex: 0 0 120px; padding: 12px 6px; }
            .case-option img { width: 56px; height: 56px; }
            .case-option .label { font-size: 12px; }
            .case-option .price { font-size: 11px; }
            .case-option .count-badge { font-size: 10px; padding: 2px 8px; }
        }
    
.premium-glow{position:absolute;inset:10%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 62%);filter:blur(18px);pointer-events:none;animation:premiumPulse 1.1s ease-in-out infinite alternate;}
@keyframes premiumPulse{from{opacity:.35;transform:scale(.92)}to{opacity:.9;transform:scale(1.08)}}
</style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <div class="brand"><div class="brand-mark">R</div><div>RE<span>SELL</span></div></div>
        <div class="header-actions">
            <div class="info-card">
                <span style="font-weight:900; margin-right:2px;">₽</span>
                <span class="balance-value" id="balanceDisplay">...</span>
            </div>
            <button class="back-btn" id="backBtn">←</button>
        </div>
    </div>

    <!-- СЕЛЕКТОР КЕЙСОВ -->
    <div class="case-selector" id="caseSelector"></div>

    <div class="case-block">
        <div class="case-image-wrap" id="caseOpenTrigger">
            <img id="caseMainImage" src="case/case.PNG" alt="Case">
        </div>
        <div class="case-info">
            <div class="case-title" id="caseMainTitle">Редкий кейс</div>
            <div class="case-price" id="caseMainPrice">₽ 45 000</div>
        </div>
        <button class="buy-btn" id="buyCaseBtn"><span class="btn-text">КУПИТЬ КЕЙС</span></button>
    </div>

    <div class="rewards-section">
        <div class="section-title">СОДЕРЖИМОЕ</div>
        <div class="reward-carousel" id="rewardCarousel">
            <div class="reward-image" id="carouselImageContainer">
                <img id="carouselImage" src="case/photo_2026-07-20_19-22-03.jpg" alt="Приз">
            </div>
            <div class="reward-info">
                <span class="reward-name" id="carouselName">Гелик Мансури</span>
                <span class="reward-rarity" id="carouselRarity" style="color:#e74c3c;">мифическая</span>
            </div>
            <div class="reward-dot" style="background:#e74c3c; color:#e74c3c;"></div>
        </div>
    </div>

    <div class="history-section">
        <div class="section-title">ИСТОРИЯ ДРОПОВ</div>
        <div class="history-list-vertical" id="historyVertical"></div>
    </div>
</div>

<div class="overlay" id="overlay">
    <div class="overlay-content" id="animationContainer"></div>
    <button class="btn-close-overlay" id="closeOverlayBtn" style="display:none;">✕ ЗАВЕРШИТЬ</button>
</div>
<canvas id="confettiCanvas"></canvas>

<script>
(function() {
    'use strict';

    const API_BASE = 'https://resellgame.bothost.tech';

    // БАЗОВЫЕ ПРИЗЫ
    const CASE_ITEMS = [
        { id: 'brabus', name: 'Гелик Мансури', rarity: 'мифическая', rarityColor: '#e74c3c', image: 'case/photo_2026-07-20_19-22-03.jpg', value: 0, type: 'car' },
        { id: 'money_legend', name: 'Деньги (легенд.)', rarity: 'легендарная', rarityColor: '#f39c12', image: 'case/photo_2026-07-20_19-22-10.jpg', value: 0, type: 'money' },
        { id: 'money_rare', name: 'Деньги (редкие)', rarity: 'редкая', rarityColor: '#2980b9', image: 'case/photo_2026-07-20_19-22-14.jpg', value: 0, type: 'money' },
        { id: 'money_common', name: 'Деньги (обычные)', rarity: 'обычная', rarityColor: '#95a5a6', image: 'case/photo_2026-07-20_19-22-17.jpg', value: 0, type: 'money' }
    ];

    // ОПРЕДЕЛЕНИЕ ТИПОВ КЕЙСОВ
    const CASE_TYPES = {
        rare: {
            id: 'rare',
            name: 'Редкий кейс',
            price: 45000,
            image: 'case/case.PNG',
            probabilities: {
                henri: 0.005,
                brabus: 0.005,
                money_legend: 0.04,
                money_rare: 0.15,
                money_common: 0.80
            },
            visualProbabilities: {
                henri: 0.025,
                brabus: 0.025,
                money_legend: 0.10,
                money_rare: 0.20,
                money_common: 0.65
            },
            moneyRanges: {
                common: [100, 25000],
                rare: [25000, 250000],
                legend: [250000, 750000]
            }
        },
        legendary: {
            id: 'legendary',
            name: 'Легендарный кейс',
            price: 550000,
            image: 'https://raw.githubusercontent.com/ruslangodunov66-alt/resellcrash/main/IMG_0853.png',
            probabilities: {
                henri: 0.01,
                brabus: 0.02,
                money_legend: 0.25,
                money_rare: 0.30,
                money_common: 0.42
            },
            visualProbabilities: {
                henri: 0.06,
                brabus: 0.08,
                money_legend: 0.25,
                money_rare: 0.35,
                money_common: 0.26
            },
            moneyRanges: {
                common: [1000, 100000],
                rare: [100000, 500000],
                legend: [500000, 2000000]
            }
        }
    };

    // СОСТОЯНИЕ
    let balance = 0;
    let caseInventory = { rare: 0, legendary: 0 };
    let selectedCaseId = 'rare';
    let history = JSON.parse(localStorage.getItem('case_history')) || [];
    let balanceLoading = false;

    // DOM
    const balanceDisplay = document.getElementById('balanceDisplay');
    const historyListVert = document.getElementById('historyVertical');
    const buyBtn = document.getElementById('buyCaseBtn');
    const caseOpenTrigger = document.getElementById('caseOpenTrigger');
    const overlay = document.getElementById('overlay');
    const animContainer = document.getElementById('animationContainer');
    const closeBtn = document.getElementById('closeOverlayBtn');
    const caseSelector = document.getElementById('caseSelector');
    const caseMainImage = document.getElementById('caseMainImage');
    const caseMainTitle = document.getElementById('caseMainTitle');
    const caseMainPrice = document.getElementById('caseMainPrice');

    // СОСТОЯНИЕ КОНТЕЙНЕРОВ — ИСТОЧНИК ИСТИНЫ: RESSELL SERVER
    function loadCaseCounts() {
        caseInventory = { rare: 0, legendary: 0 };
    }

    function saveCaseCounts() { /* inventory хранится на сервере */ }

    function loadSelectedCase() {
        const saved = localStorage.getItem('selected_case_id');
        selectedCaseId = saved && CASE_TYPES[saved] ? saved : 'rare';
    }

    function saveSelectedCase() {
        localStorage.setItem('selected_case_id', selectedCaseId);
    }

    // ОБНОВЛЕНИЕ UI
    function updateUI() {
        balanceDisplay.textContent = balance.toLocaleString('ru-RU');
        renderHistoryVertical();
        renderCaseSelector();
        updateMainCaseDisplay();
        saveCaseCounts();
        saveSelectedCase();
        localStorage.setItem('case_history', JSON.stringify(history));
    }

    function updateMainCaseDisplay() {
        const caseData = CASE_TYPES[selectedCaseId];
        if (!caseData) return;
        caseMainImage.src = caseData.image;
        caseMainTitle.textContent = caseData.name;
        caseMainPrice.textContent = '₽ ' + caseData.price.toLocaleString('ru-RU');
        buyBtn.disabled = (balance < caseData.price);
        buyBtn.querySelector('.btn-text').textContent = 'КУПИТЬ КЕЙС';
        buyBtn.classList.remove('loading');
    }

    function renderCaseSelector() {
        caseSelector.innerHTML = '';
        Object.keys(CASE_TYPES).forEach(key => {
            const caseData = CASE_TYPES[key];
            const div = document.createElement('div');
            div.className = 'case-option' + (key === selectedCaseId ? ' active' : '');
            div.dataset.caseId = key;
            div.innerHTML = `
                <img src="${caseData.image}" alt="${caseData.name}" onerror="this.src='case/case.PNG'">
                <div class="label">${caseData.name}</div>
                <div class="price">₽ ${caseData.price.toLocaleString('ru-RU')}</div>
                <div class="count-badge">${caseInventory[key] || 0} шт.</div>
            `;
            div.addEventListener('click', () => {
                selectedCaseId = key;
                updateUI();
            });
            caseSelector.appendChild(div);
        });
    }

    function renderHistoryVertical() {
        historyListVert.innerHTML = '';
        if (history.length === 0) {
            historyListVert.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:20px; font-weight:800; font-size:14px; opacity:0.5;">ИСТОРИЯ ПУСТА</div>';
            return;
        }
        history.forEach(h => {
            const div = document.createElement('div');
            div.className = 'history-item-vert';
            div.style.borderLeftColor = h.rarityColor;
            div.innerHTML = `
                <div class="h-icon"><img src="${h.image}" alt=""></div>
                <div class="h-name">${h.name}</div>
                <div style="display:flex; flex-direction:column; align-items:flex-end;">
                    <div class="h-rarity" style="color:${h.rarityColor}">${h.rarity}</div>
                    <div style="font-size:9px; color:var(--text-muted);">${new Date(h.time).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})}</div>
                </div>`;
            historyListVert.appendChild(div);
        });
    }

    // API
    async function apiFetch(url, options = {}, timeout = 10000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeout);
        const headers = new Headers(options.headers || {});
        headers.set('Accept', 'application/json');
        const session = localStorage.getItem('resell_server_session_v4') || localStorage.getItem('resell_session_v2') || new URLSearchParams(location.search).get('resell_session') || '';
        const initData = window.Telegram?.WebApp?.initData || '';
        if (session) { headers.set('X-Resell-Session', session); headers.set('Authorization', 'Bearer ' + session); }
        else if (initData) { headers.set('X-Telegram-Init-Data', initData); headers.set('Authorization', 'tma ' + initData); }
        try {
            const response = await fetch(url, { ...options, headers, signal: controller.signal });
            clearTimeout(timer);
            const text = await response.text();
            let data;
            try { data = text ? JSON.parse(text) : {}; } 
            catch { throw new Error('Некорректный ответ сервера'); }
            if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
            return data;
        } catch (error) {
            clearTimeout(timer);
            if (error.name === 'AbortError') throw new Error('Превышено время ожидания сервера');
            throw error;
        }
    }

    const userId = new URLSearchParams(window.location.search).get('userId') || window.Telegram?.WebApp?.initDataUnsafe?.user?.id || '';
    
    async function loadBalance() {
        if (balanceLoading || !userId) return;
        balanceLoading = true;
        try {
            const data = await apiFetch(`${API_BASE}/profile/${userId}`);
            balance = data.balance ?? data.casino_balance ?? 0;
            updateUI();
        } catch (error) {
            console.error('Не удалось получить баланс RESSELL:', error);
            balanceDisplay.textContent = '—';
        } finally {
            balanceLoading = false;
        }
    }

    // ЛОГИКА ВЫПАДЕНИЯ
    function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function rollItem(caseType) {
        const caseData = CASE_TYPES[caseType];
        if (!caseData) return { ...CASE_ITEMS[CASE_ITEMS.length - 1], value: 1000, name: '💰 1 000 ₽', displayName: '💰 ДЕНЬГИ', type: 'money' };

        const prob = caseData.probabilities;
        const ranges = caseData.moneyRanges;
        const r = Math.random();
        let cum = 0;
        for (const item of CASE_ITEMS) {
            cum += prob[item.id] || 0;
            if (r <= cum) {
                const result = { ...item };
                if (item.type === 'money') {
                    let range;
                    if (item.id === 'money_legend') range = ranges.legend;
                    else if (item.id === 'money_rare') range = ranges.rare;
                    else range = ranges.common;
                    result.value = getRandomInt(range[0], range[1]);
                    result.name = `💰 ${result.value.toLocaleString('ru-RU')} ₽`;
                    result.displayName = '💰 ДЕНЬГИ';
                } else {
                    result.displayName = result.name;
                }
                return result;
            }
        }
        const fallback = { ...CASE_ITEMS[CASE_ITEMS.length - 1] };
        fallback.value = 1000;
        fallback.name = '💰 1 000 ₽';
        fallback.displayName = '💰 ДЕНЬГИ';
        fallback.type = 'money';
        return fallback;
    }

    function getVisualItem(caseType) {
        const caseData = CASE_TYPES[caseType];
        if (!caseData) return { ...CASE_ITEMS[CASE_ITEMS.length - 1] };
        const vis = caseData.visualProbabilities;
        const r = Math.random();
        let cum = 0;
        for (const item of CASE_ITEMS) {
            cum += vis[item.id] || 0;
            if (r <= cum) {
                const copy = { ...item };
                copy.displayName = copy.name;
                return copy;
            }
        }
        return { ...CASE_ITEMS[CASE_ITEMS.length - 1] };
    }

    // ВИБРАЦИЯ
    function vibrate(style = 'light') {
        if (!window.Telegram?.WebApp?.HapticFeedback) return;
        const haptic = window.Telegram.WebApp.HapticFeedback;
        if (style === 'success' || style === 'error' || style === 'warning') {
            try { haptic.notificationOccurred(style); } catch(e) {}
        } else {
            try { haptic.impactOccurred(style); } catch(e) {}
        }
    }

    // АУДИО
    let audioCtx = null;
    function initAudio() { if (!audioCtx && window.AudioContext) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } }
    function playTone(freq, dur, vol = 0.08, type = 'sine') {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.value = freq;
            gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + dur);
        } catch(e) {}
    }
    function soundTick() { initAudio(); playTone(700, 0.03, 0.06, 'sine'); }
    function soundHit() { initAudio(); playTone(200, 0.12, 0.15, 'square'); setTimeout(()=>playTone(150, 0.1, 0.1, 'square'), 80); }

    const sfx = {
        spin: () => { initAudio(); playTone(400, 0.05, 0.05, 'triangle'); },
        stop: () => { initAudio(); playTone(800, 0.1, 0.1, 'sine'); },
        win: () => { initAudio(); playTone(523, 0.15, 0.1); setTimeout(()=>playTone(659, 0.15, 0.1), 150); setTimeout(()=>playTone(784, 0.25, 0.1), 300); },
        lose: () => { initAudio(); playTone(200, 0.3, 0.1, 'sawtooth'); },
        buy: () => { initAudio(); playTone(600, 0.1, 0.1); setTimeout(()=>playTone(800, 0.1, 0.1), 100); }
    };

    // ПОКУПКА / ОТКРЫТИЕ — сервер RESSELL является единственным источником истины.
    let pendingRounds = { rare: null, legendary: null };

    async function syncWheelState() {
        if (!userId) return;
        try {
            const state = await apiFetch(`${API_BASE}/wheel/case/state?userId=${encodeURIComponent(userId)}`);
            balance = Number(state.balance || 0);
            pendingRounds = { rare: null, legendary: null };
            if (state.pending?.round_id) {
                const caseId = state.pending.case_id && CASE_TYPES[state.pending.case_id] ? state.pending.case_id : selectedCaseId;
                pendingRounds[caseId] = state.pending.round_id;
                caseInventory[caseId] = 1;
            }
            updateUI();
        } catch (e) {
            console.error('Не удалось синхронизировать состояние контейнеров:', e);
        }
    }

    buyBtn.addEventListener('click', async () => {
        const caseData = CASE_TYPES[selectedCaseId];
        if (!caseData || isOpening) return;
        if (balance < caseData.price) {
            alert('❌ Недостаточно R-Coin на основном балансе RESSELL');
            return;
        }
        buyBtn.classList.add('loading');
        buyBtn.disabled = true;
        try {
            const requestId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
            const result = await apiFetch(`${API_BASE}/wheel/case/buy`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({userId, case_id:selectedCaseId, request_id:requestId})
            });
            balance = result.balance ?? balance;
            pendingRounds[selectedCaseId] = result.round_id || pendingRounds[selectedCaseId];
            caseInventory[selectedCaseId] = 1;
            sfx.buy(); vibrate('medium'); updateUI();
        } catch (e) {
            alert('❌ ' + e.message);
            await loadBalance();
        } finally {
            buyBtn.classList.remove('loading'); buyBtn.disabled = false; updateUI();
        }
    });

    let isOpening = false;
    caseOpenTrigger.addEventListener('click', async () => {
        if (isOpening) return;
        const roundId = pendingRounds[selectedCaseId];
        if (!roundId) {
            alert('❌ Сначала купите этот кейс');
            return;
        }
        isOpening = true;
        closeBtn.style.display = 'none';
        try {
            const open = await apiFetch(`${API_BASE}/wheel/case/open`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body:JSON.stringify({userId, round_id:roundId})
            });
            const serverItem = open.result;
            const winItem = CASE_ITEMS.find(x => x.id === serverItem.id)
                ? {...CASE_ITEMS.find(x => x.id === serverItem.id), ...serverItem, rarityColor: serverItem.rarityColor || CASE_ITEMS.find(x=>x.id===serverItem.id).rarityColor}
                : {...serverItem, type: serverItem.type || (serverItem.id === 'brabus' ? 'car' : 'money'), rarityColor: serverItem.rarityColor || '#95a5a6'};
            if (winItem.type === 'money') {
                winItem.name = serverItem.name;
                winItem.value = Number(serverItem.value || 0);
                winItem.displayName = '💰 ДЕНЬГИ';
            }
            pendingRounds[selectedCaseId] = null;
            caseInventory[selectedCaseId] = 0;
            updateUI();

            overlay.classList.add('active');
            animContainer.innerHTML = `
                <div class="case-animation-stage">
                    <div class="case-image-wrap case-falling" id="caseAnim"><img src="${CASE_TYPES[selectedCaseId].image}" alt="Case"></div>
                    <div class="premium-glow"></div>
                </div>`;
            setTimeout(() => {
                const c = document.getElementById('caseAnim');
                if (!c) return;
                c.className = 'case-image-wrap case-open-flash';
                vibrate('heavy'); sfx.stop();
                setTimeout(() => startSlotMachine(winItem, selectedCaseId, roundId), 400);
            }, 800);
        } catch (e) {
            isOpening = false;
            alert('❌ ' + e.message);
            await loadBalance();
        }
    });

    // СЛОТ-МАШИНА
    let spinSparkAnimFrame;
    function startSlotMachine(winItem, caseType, roundId) {
        animContainer.innerHTML = `
            <div class="spin-kicker">RESSELL / CONTAINER OPENING</div>
            <div class="slot-container" id="slotContainer">
                <div class="spin-energy"></div>
                <canvas id="slotSpinCanvas"></canvas>
                <div class="slot-pointer"></div>
                <div class="slot-track" id="slotTrack"></div>
            </div>
            <div class="spin-status" id="spinStatus">СИСТЕМА ПОДГОТОВКИ <strong>•</strong></div>
            <div class="result-display" id="resultDisplay"></div>
        `;

        const slotTrack = document.getElementById('slotTrack');
        const slotCanvas = document.getElementById('slotSpinCanvas');
        const totalItems = 70; const trackItems = [];
        const winPos = 60;

        const doBait = Math.random() < 0.35; 
        const baitPool = CASE_ITEMS.filter(i => i.rarity === 'мифическая' || i.rarity === 'легендарная');

        for (let i = 0; i < totalItems; i++) {
            if (i === winPos) { 
                trackItems.push({ ...winItem }); 
                continue; 
            }
            if (doBait && (i === winPos - 1 || i === winPos + 1) && baitPool.length > 0) {
                if(Math.random() > 0.5) { 
                    trackItems.push({...baitPool[Math.floor(Math.random()*baitPool.length)]}); 
                    continue; 
                }
            }
            trackItems.push(getVisualItem(caseType));
        }

        if (baitPool.length > 0) {
            const extraBaitCount = getRandomInt(2, 4);
            for (let b = 0; b < extraBaitCount; b++) {
                let pos;
                let attempts = 0;
                do {
                    pos = getRandomInt(5, totalItems - 5);
                    attempts++;
                } while ((pos === winPos || (pos >= winPos - 2 && pos <= winPos + 2)) && attempts < 20);
                if (pos >= 0 && pos < totalItems && pos !== winPos) {
                    const baitItem = baitPool[Math.floor(Math.random() * baitPool.length)];
                    trackItems[pos] = { ...baitItem };
                }
            }
        }

        trackItems.forEach(item => {
            const div = document.createElement('div');
            div.className = 'slot-item';
            div.innerHTML = `
                <img src="${item.image}" alt="">
                <div class="item-name">${item.displayName || item.name}</div>
                <div class="item-rarity" style="color:${item.rarityColor}">${item.rarity}</div>
            `;
            slotTrack.appendChild(div);
        });

        const itemWidth = 160;
        const containerWidth = document.getElementById('slotContainer').offsetWidth;
        const centerOffset = (containerWidth / 2) - (itemWidth / 2);
        let targetPx = (winPos * itemWidth) - centerOffset;

        let randomShift;
        if (doBait) {
            const dir = Math.random() > 0.5 ? 1 : -1;
            randomShift = dir * (itemWidth * 0.4); 
        } else {
            randomShift = (Math.random() - 0.5) * (itemWidth * 0.5);
        }
        targetPx += randomShift;
        
        const durationSec = 6.5 + Math.random();
        const durationMs = durationSec * 1000;
        const startTime = performance.now();

        slotTrack.style.transition = `transform ${durationSec}s cubic-bezier(0.1, 0.9, 0.2, 1)`;
        slotTrack.style.transform = `translateX(-${targetPx}px)`;

        let lines = [];
        function initSparks() {
            const ctx = slotCanvas.getContext('2d');
            slotCanvas.width = slotCanvas.offsetWidth * Math.min(window.devicePixelRatio || 1, 2);
            slotCanvas.height = slotCanvas.offsetHeight * Math.min(window.devicePixelRatio || 1, 2);
            ctx.setTransform(Math.min(window.devicePixelRatio || 1, 2),0,0,Math.min(window.devicePixelRatio || 1, 2),0,0);
            lines = [];
            for(let i=0;i<46;i++) lines.push({
                x: Math.random()*slotCanvas.offsetWidth,
                y: Math.random()*slotCanvas.offsetHeight,
                len: 18+Math.random()*72,
                alpha: .12+Math.random()*.55,
                width: .6+Math.random()*1.6,
                phase: Math.random()*Math.PI*2
            });
            return ctx;
        }
        const ctx = initSparks();
        slotCanvas.style.opacity = '1';

        let prevIndex=-1, hitSoundPlayed=false, lastPx=0, visualSpeed=0, lastFrame=startTime;
        const statusEl=document.getElementById('spinStatus');
        let lastTickAt=0;

        function updateSlot(){
            const now=performance.now();
            const elapsed=now-startTime;
            const progress=Math.min(elapsed/durationMs,1);
            const style=getComputedStyle(slotTrack);
            const transform=style.transform;
            let currentPx=0;
            if(transform && transform!=='none'){
                const matrix=transform.match(/matrix.*\((.+)\)/);
                if(matrix){ const values=matrix[1].split(/,\s*/).map(Number); currentPx=values[4]||0; }
            }
            const frameDt=Math.max(8,now-lastFrame);
            const rawSpeed=Math.abs(currentPx-lastPx)/(frameDt/16.67);
            visualSpeed += (Math.min(rawSpeed/10,1)-visualSpeed)*.22;
            lastPx=currentPx; lastFrame=now;

            const absPx=Math.abs(currentPx);
            const pointerPos=containerWidth/2;
            const index=Math.floor((absPx+pointerPos-centerOffset)/itemWidth);
            const clampedIndex=Math.min(Math.max(index,0),totalItems-1);
            if(clampedIndex!==prevIndex && clampedIndex>=0 && clampedIndex<totalItems){
                prevIndex=clampedIndex;
                if(progress<.985 && now-lastTickAt>42){ soundTick(); vibrate('light'); lastTickAt=now; }
            }

            const easeOut=Math.pow(1-progress,1.65);
            const streakSpeed=visualSpeed*2.2*easeOut;
            ctx.clearRect(0,0,slotCanvas.offsetWidth,slotCanvas.offsetHeight);
            lines.forEach((l,i)=>{
                l.x -= streakSpeed*(1.0+(i%3)*.16);
                if(l.x < -l.len) l.x=slotCanvas.offsetWidth + Math.random()*40;
                const shimmer=.55+.45*Math.sin(now*.006+l.phase);
                ctx.globalAlpha=l.alpha*visualSpeed*shimmer;
                ctx.fillStyle=i%7===0?'#ffffff':'#b9c7d5';
                ctx.fillRect(l.x,l.y,l.len*(.35+visualSpeed*1.1),l.width);
            });

            const stage=Math.floor(progress*4);
            statusEl.innerHTML = stage===0 ? 'СИСТЕМА ПОДГОТОВКИ <strong>•</strong>' : stage===1 ? 'ПОИСК АКТИВА <strong>•</strong>' : stage===2 ? 'ФИКСАЦИЯ ДРОПА <strong>•</strong>' : 'ЗАВЕРШЕНИЕ <strong>•</strong>';

            if(progress>=1){
                if(!hitSoundPlayed){
                    hitSoundPlayed=true;
                    visualSpeed=0;
                    ctx.clearRect(0,0,slotCanvas.offsetWidth,slotCanvas.offsetHeight);
                    soundHit(); sfx.stop(); vibrate('heavy');
                    slotTrack.style.transition='transform 220ms cubic-bezier(.2,.9,.3,1)';
                    slotTrack.style.transform=`translateX(${currentPx-2}px)`;
                    statusEl.innerHTML='ДРОП ЗАФИКСИРОВАН <strong>✓</strong>';
                    slotContainerPulse(document.getElementById('slotContainer'));
                }
                slotCanvas.style.opacity='0';
                cancelAnimationFrame(spinSparkAnimFrame);
                setTimeout(()=>showResult(winItem),520);
                return;
            }
            spinSparkAnimFrame=requestAnimationFrame(updateSlot);
        }

        function slotContainerPulse(el){
            if(!el)return;
            el.classList.remove('impact'); void el.offsetWidth; el.classList.add('impact');
            setTimeout(()=>el.classList.remove('impact'),700);
        }

        updateSlot();
    }

    // ПОКАЗ РЕЗУЛЬТАТА
    function showResult(winItem) {
        const resDisplay = document.getElementById('resultDisplay');
        let extraHtml = '';
        if (winItem.type === 'skin' || winItem.type === 'car') {
            extraHtml = `
                <div class="skin-bonus">
                    <img src="${winItem.image}" alt="${winItem.name}" onerror="this.style.display='none'">
                    <div class="info">
                        <div class="name">${winItem.name}</div>
                        <div class="desc">${winItem.type === 'skin' ? 'Мифический скин' : 'Эксклюзивный автомобиль'} выдан!</div>
                    </div>
                </div>
            `;
        }
        resDisplay.innerHTML = `
            <div class="result-item" style="color: ${winItem.rarityColor}">
                <div class="result-item-img-wrap"><img src="${winItem.image}" alt=""></div>
                <div class="result-name">${winItem.name}</div>
                <div class="result-rarity">${winItem.rarity}</div>
                ${extraHtml}
                <button class="btn-claim" id="claimRewardBtn">ЗАБРАТЬ В ИНВЕНТАРЬ</button>
            </div>
        `;

        sfx.win(); vibrate('heavy');
        spawnConfetti(winItem.rarityColor);

        document.getElementById('claimRewardBtn').addEventListener('click', async function() {
            this.disabled = true; this.textContent = 'ПОЛУЧЕНИЕ...';
            try {
                const res = await apiFetch(`${API_BASE}/wheel/case/claim`, {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({userId, round_id:roundId})
                });
                balance = res.balance ?? balance;
                
                history.unshift({ name: winItem.name, rarity: winItem.rarity, rarityColor: winItem.rarityColor, image: winItem.image, time: Date.now() });
                if(history.length > 30) history.pop();
                
                updateUI();
                overlay.classList.remove('active'); isOpening = false; animContainer.innerHTML = ''; stopConfetti();
                vibrate('success');
            } catch(e) {
                alert('❌ Ошибка: ' + e.message);
                this.disabled = false; this.textContent = 'ЗАБРАТЬ';
            }
        });
    }

    // CONFETTI
    const cCanvas = document.getElementById('confettiCanvas');
    const cCtx = cCanvas.getContext('2d');
    let confettis = []; let confettiAnim;
    
    function spawnConfetti(color) {
        cCanvas.style.display = 'block';
        cCanvas.width = window.innerWidth; cCanvas.height = window.innerHeight;
        confettis = [];
        const colors = [color, '#ffffff', '#FFD34E'];
        for(let i=0; i<80; i++) {
            confettis.push({
                x: cCanvas.width/2, y: cCanvas.height/2 + 100,
                vx: (Math.random()-0.5)*25, vy: -(Math.random()*15 + 10),
                size: Math.random()*8 + 4, color: colors[Math.floor(Math.random()*colors.length)],
                rot: Math.random()*360, rotSpeed: (Math.random()-0.5)*10
            });
        }
        function drawC() {
            cCtx.clearRect(0,0, cCanvas.width, cCanvas.height);
            let alive = false;
            confettis.forEach(c => {
                c.x += c.vx; c.y += c.vy; c.vy += 0.5; c.rot += c.rotSpeed;
                if (c.y < cCanvas.height) alive = true;
                cCtx.save(); cCtx.translate(c.x, c.y); cCtx.rotate(c.rot * Math.PI/180);
                cCtx.fillStyle = c.color; cCtx.shadowColor = c.color; cCtx.shadowBlur = 10;
                cCtx.fillRect(-c.size/2, -c.size/2, c.size, c.size);
                cCtx.restore();
            });
            if(alive) confettiAnim = requestAnimationFrame(drawC); else stopConfetti();
        }
        drawC();
    }
    function stopConfetti() { cancelAnimationFrame(confettiAnim); cCanvas.style.display = 'none'; cCtx.clearRect(0,0,cCanvas.width,cCanvas.height); }

    // КАРУСЕЛЬ
    let cIndex = 0;
    setInterval(() => {
        const item = CASE_ITEMS[cIndex];
        const img = document.getElementById('carouselImage');
        img.style.opacity = '0';
        setTimeout(() => {
            img.src = item.image; img.style.opacity = '1';
            document.getElementById('carouselName').textContent = item.name;
            const r = document.getElementById('carouselRarity');
            r.textContent = item.rarity; r.style.color = item.rarityColor;
            document.querySelector('.reward-dot').style.color = item.rarityColor;
        }, 300);
        cIndex = (cIndex + 1) % CASE_ITEMS.length;
    }, 3000);

    document.getElementById('backBtn').addEventListener('click', () => { vibrate('light'); window.location.href = 'resell.html?userId=' + userId; });

    // СТАРТ
    loadCaseCounts();
    loadSelectedCase();
    loadBalance();
    syncWheelState();
    updateUI();
})();
</script>
</body>
</html>
