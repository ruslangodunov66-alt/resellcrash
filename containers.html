<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>R-Game · Контейнеры</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--panel:#101010;--panel2:#151515;--line:rgba(255,255,255,.09);--muted:#777;--muted2:#505050;--text:#f5f5f5;--green:#b7ff6a;--green2:rgba(183,255,106,.12);--red:#ff6678;--gold:#ffd76a;--blue:#79a8ff;--violet:#c58cff;--nav:76px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{min-height:100%;background:var(--bg)}body{font-family:Nunito,system-ui,sans-serif;color:var(--text);padding:12px 12px calc(var(--nav) + 28px);overflow-x:hidden}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}button:disabled{opacity:.45;cursor:default}.app{max-width:620px;margin:auto}.glass{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.035);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.header{position:sticky;top:4px;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px;margin-bottom:12px;border-radius:23px}.brand{display:flex;align-items:center;gap:9px;font:900 17px/1 Montserrat;letter-spacing:.4px;font-style:italic}.mark{width:29px;height:29px;border-radius:9px;background:#fff;color:#000;display:grid;place-items:center;font:900 13px/1 Montserrat}.head-right{display:flex;align-items:center;gap:7px}.balance-mini{padding:9px 11px;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid var(--line-soft,#555);font:900 12px/1 Montserrat;white-space:nowrap}.balance-mini span{color:#888;font-size:9px;margin-left:3px}.icon{width:38px;height:38px;border-radius:13px;background:rgba(255,255,255,.045);border:1px solid var(--line);display:grid;place-items:center;color:#bbb}.icon:active{transform:scale(.94)}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:23px 20px;margin-bottom:14px;min-height:168px;background:radial-gradient(circle at 88% 12%,rgba(183,255,106,.11),transparent 27%),linear-gradient(135deg,#171717,#090909 62%,#111);border:1px solid var(--line)}.hero:after{content:"";position:absolute;width:230px;height:230px;right:-80px;bottom:-110px;border:1px solid rgba(255,255,255,.11);border-radius:50%;box-shadow:0 0 0 24px rgba(255,255,255,.018),0 0 0 48px rgba(255,255,255,.012)}.kicker{font:900 9px/1 Montserrat;letter-spacing:2px;color:#6f6f6f}.hero h1{margin-top:9px;font:900 clamp(28px,8vw,43px)/.98 Montserrat;letter-spacing:-1.8px}.hero p{max-width:75%;margin-top:10px;color:#858585;font-size:11px;line-height:1.45;font-weight:800}.hero-status{position:absolute;right:18px;top:18px;display:flex;align-items:center;gap:6px;color:#777;font:900 8px/1 Montserrat;letter-spacing:1px}.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(183,255,106,.65)}
.section{margin-bottom:16px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:0 5px 9px}.section-title{font:900 12px/1 Montserrat;letter-spacing:1px}.section-meta{color:#666;font:800 9px/1 Montserrat;letter-spacing:.7px;text-transform:uppercase}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{position:relative;overflow:hidden;border-radius:23px;padding:12px;background:linear-gradient(180deg,#151515,#0c0c0c);border:1px solid var(--line);box-shadow:0 17px 40px rgba(0,0,0,.38);transition:.2s}.card:active{transform:scale(.975)}.art{height:155px;border-radius:18px;background:radial-gradient(circle at 50% 25%,rgba(255,255,255,.11),transparent 34%),linear-gradient(145deg,#1b1b1b,#070707);border:1px solid rgba(255,255,255,.06);display:grid;place-items:center;position:relative;overflow:hidden}.art:before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(183,255,106,.14),transparent 66%);filter:blur(6px)}.crate{position:relative;width:86px;height:72px;border:2px solid rgba(255,255,255,.75);border-radius:10px;transform:skewY(-5deg) rotate(-4deg);background:linear-gradient(135deg,#202020,#0b0b0b);box-shadow:0 0 35px rgba(255,255,255,.08),inset 0 0 22px rgba(255,255,255,.035)}.crate:before,.crate:after{content:"";position:absolute;left:10px;right:10px;height:2px;background:rgba(183,255,106,.75);box-shadow:0 0 12px rgba(183,255,106,.35)}.crate:before{top:18px}.crate:after{bottom:18px}.crate i{position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.2);transform:translateX(-50%)}.card:nth-child(2) .crate{width:96px;height:78px;box-shadow:0 0 45px rgba(255,255,255,.12),0 0 35px rgba(183,255,106,.06)}.card:nth-child(2) .art:before{background:radial-gradient(circle,rgba(183,255,106,.20),transparent 66%)}.tag{position:absolute;top:9px;left:9px;padding:5px 7px;border-radius:999px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);font:900 7px/1 Montserrat;letter-spacing:.8px}.card h3{margin:11px 2px 3px;font:900 13px/1.1 Montserrat;letter-spacing:.3px}.price{color:#bbb;font:900 11px/1 Montserrat}.price b{color:#fff}.card-sub{margin-top:6px;color:#666;font-size:9px;font-weight:800}.buy{width:100%;margin-top:11px;padding:11px 10px;border-radius:13px;background:#fff;color:#000;font:900 9px/1 Montserrat;letter-spacing:.8px}.buy:active{transform:scale(.98)}.buy.green{background:var(--green)}
.info{padding:14px 15px;border-radius:21px}.info-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:10px}.info-row:last-child{border-bottom:0}.info-row span{color:#707070;font-weight:800}.info-row b{font:900 10px Montserrat}.tiny-btn{padding:8px 10px;border-radius:11px;background:rgba(255,255,255,.045);border:1px solid var(--line);font:900 8px Montserrat;letter-spacing:.6px}.tiny-btn:active{transform:scale(.97)}
.inventory{display:grid;gap:8px}.item{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:17px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.055)}.item-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#0a0a0a;border:1px solid rgba(255,255,255,.08);font-size:20px}.item-main{min-width:0;flex:1}.item-name{font:900 10px/1.2 Montserrat;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-rarity{margin-top:4px;font:800 8px/1 Montserrat;color:#777;letter-spacing:.6px}.item-value{font:900 10px/1 Montserrat;text-align:right;white-space:nowrap}.sell{margin-top:5px;padding:6px 8px;border-radius:9px;background:rgba(183,255,106,.08);border:1px solid rgba(183,255,106,.16);color:var(--green);font:900 7px/1 Montserrat;letter-spacing:.6px}.empty{padding:20px;text-align:center;border-radius:18px;background:rgba(255,255,255,.025);border:1px dashed rgba(255,255,255,.08);color:#5f5f5f;font-size:10px;font-weight:800}
.quests{display:grid;gap:8px}.quest{padding:11px 12px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.055);display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.quest-name{font:900 9px/1.2 Montserrat}.quest-prog{margin-top:5px;color:#666;font-size:8px;font-weight:800}.claim{padding:8px 9px;border-radius:10px;background:rgba(183,255,106,.09);border:1px solid rgba(183,255,106,.15);color:var(--green);font:900 7px/1 Montserrat}.claimed{color:#555;font:900 7px/1 Montserrat;letter-spacing:.6px}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:none;align-items:center;justify-content:center;padding:18px}.overlay.show{display:flex}.modal{width:min(560px,100%);max-height:calc(100dvh - 30px);overflow:auto;border-radius:28px;background:linear-gradient(180deg,#151515,#080808);border:1px solid rgba(255,255,255,.11);box-shadow:0 30px 100px rgba(0,0,0,.7);padding:16px}.modal-head{display:flex;align-items:center;justify-content:space-between}.modal-head h2{font:900 14px Montserrat;letter-spacing:.7px}.close{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.05);color:#aaa;font-size:20px}.open-stage{margin-top:14px;height:285px;border-radius:23px;background:radial-gradient(circle at 50% 48%,rgba(183,255,106,.12),transparent 31%),linear-gradient(145deg,#171717,#070707);border:1px solid rgba(255,255,255,.07);display:grid;place-items:center;position:relative;overflow:hidden}.stage-crate{width:135px;height:105px;border:2px solid rgba(255,255,255,.7);border-radius:15px;background:linear-gradient(135deg,#222,#090909);box-shadow:0 0 55px rgba(183,255,106,.10);position:relative}.stage-crate:before,.stage-crate:after{content:"";position:absolute;left:13px;right:13px;height:3px;background:var(--green);box-shadow:0 0 18px rgba(183,255,106,.6)}.stage-crate:before{top:27px}.stage-crate:after{bottom:27px}.stage-crate i{position:absolute;left:50%;top:0;bottom:0;width:3px;background:rgba(255,255,255,.22)}.stage-crate.opening{animation:openCrate .9s cubic-bezier(.2,.9,.2,1) forwards}@keyframes openCrate{0%{transform:translateY(0) scale(1) rotate(0);filter:brightness(1)}45%{transform:translateY(-10px) scale(1.08) rotate(-3deg);filter:brightness(1.8)}100%{transform:translateY(0) scale(.78) rotate(3deg);opacity:.05;filter:brightness(3)}}.result{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.result.show{display:flex}.result-icon{font-size:60px;filter:drop-shadow(0 0 28px rgba(255,255,255,.2));animation:resultIn .55s cubic-bezier(.2,1.4,.3,1) forwards}@keyframes resultIn{from{opacity:0;transform:scale(.35) translateY(12px)}to{opacity:1;transform:none}}.result-rarity{margin-top:8px;font:900 9px Montserrat;letter-spacing:1.4px;color:#777}.result-name{margin-top:6px;font:900 22px Montserrat;letter-spacing:-.7px}.result-value{margin-top:8px;color:var(--green);font:900 15px Montserrat}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.modal-actions button{padding:13px;border-radius:14px;font:900 9px Montserrat;letter-spacing:.8px}.sell-main{background:var(--green);color:#050505}.keep-main{background:rgba(255,255,255,.05);border:1px solid var(--line)}.notice{margin-top:10px;min-height:18px;color:#777;text-align:center;font-size:9px;font-weight:800}.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:22px;z-index:150;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:11px 14px;border-radius:13px;background:#151515;border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 45px rgba(0,0,0,.55);font:900 9px Montserrat;transition:.22s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:430px){body{padding-left:9px;padding-right:9px}.cards{gap:8px}.card{padding:9px}.art{height:136px}.hero{min-height:155px}.balance-mini{font-size:10px}.modal{padding:12px}.open-stage{height:250px}}
</style>
</head>
<body>
<div class="app">
  <header class="header glass">
    <div class="brand"><span class="mark">R</span><span>R-GAME</span></div>
    <div class="head-right"><div class="balance-mini" id="balance">— <span>R-COIN</span></div><button class="icon" id="refresh" aria-label="Обновить">↻</button></div>
  </header>

  <section class="hero">
    <div class="hero-status"><i class="dot"></i>LIVE</div>
    <div class="kicker">RESSELL · IMPORT ZONE</div>
    <h1>КОНТЕЙНЕРЫ</h1>
    <p>Покупай поставку, открывай её и решай — оставить предмет или сразу реализовать его за R-Coin.</p>
  </section>

  <section class="section">
    <div class="section-head"><div class="section-title">Доступная поставка</div><div class="section-meta">2 контейнера</div></div>
    <div class="cards" id="cards"></div>
  </section>

  <section class="section">
    <div class="section-head"><div class="section-title">Что может выпасть</div><button class="tiny-btn" id="oddsBtn">ШАНСЫ</button></div>
    <div class="info glass" id="odds" style="display:none"></div>
  </section>

  <section class="section">
    <div class="section-head"><div class="section-title">Мои предметы</div><div class="section-meta" id="itemCount">0</div></div>
    <div class="inventory" id="inventory"></div>
  </section>

  <section class="section">
    <div class="section-head"><div class="section-title">Ежедневные задания</div><div class="section-meta">12:00</div></div>
    <div class="quests" id="quests"></div>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle">ОТКРЫТИЕ</h2><button class="close" id="close">×</button></div>
    <div class="open-stage"><div class="stage-crate" id="stageCrate"><i></i></div><div class="result" id="result"><div class="result-icon" id="resultIcon">📦</div><div class="result-rarity" id="resultRarity">COMMON</div><div class="result-name" id="resultName">—</div><div class="result-value" id="resultValue">—</div></div></div>
    <div class="modal-actions" id="resultActions" style="display:none"><button class="sell-main" id="sellResult">ПРОДАТЬ</button><button class="keep-main" id="keepResult">ОСТАВИТЬ</button></div>
    <div class="notice" id="notice"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';
  const TG = window.Telegram?.WebApp;
  try{TG?.ready();TG?.expand();}catch(e){}
  const API_BASE = location.hostname.includes('bothost.tech') ? '' : 'https://resellgame.bothost.tech';
  const params = new URLSearchParams(location.search);
  let tgId = Number(params.get('userId') || TG?.initDataUnsafe?.user?.id || 0);
  let session = params.get('resell_session') || '';
  let state = {balance:0, items:[], quests:[]};
  let currentPurchase = null;
  let currentItem = null;
  let busy = false;

  const CONTAINERS = [
    {id:'small_bag',name:'SMALL BAG',price:5000,label:'БАЗОВАЯ ПОСТАВКА',icon:'🎒'},
    {id:'delivery_box',name:'DELIVERY BOX',price:15000,label:'РАСШИРЕННАЯ ПОСТАВКА',icon:'📦'}
  ];
  const LOOT = [
    ['USB-C Cable','🔌','COMMON',35],['Wireless Mouse','🖱️','COMMON',28],['AirPods','🎧','UNCOMMON',16],['Smart Watch','⌚','UNCOMMON',10],['Gaming GPU','🎮','RARE',6],['iPhone Box','📱','RARE',3],['MacBook','💻','EPIC',1.2],['Luxury Watch','⌚','LEGENDARY',.6],['Rare Car Key','🔑','LEGENDARY',.12],['Prototype Device','🧿','MYTHIC',.03]
  ];
  const rarityColor={COMMON:'#888',UNCOMMON:'#79a8ff',RARE:'#65d3ff',EPIC:'#c58cff',LEGENDARY:'#ffd76a',MYTHIC:'#ff6678'};
  const $=s=>document.querySelector(s);
  const money=n=>Number(n||0).toLocaleString('ru-RU').replace(/\u00a0/g,' ');
  const rid=()=>crypto?.randomUUID?.() || ('r'+Date.now()+Math.random().toString(16).slice(2));
  function h(type='light'){try{TG?.HapticFeedback?.impactOccurred(type)}catch(e){}}
  function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1900)}
  function authHeaders(){const x={'Content-Type':'application/json'};if(session)x['X-Resell-Session']=session;else if(TG?.initData)x['X-Telegram-Init-Data']=TG.initData;return x}
  async function auth(){
    if(session && tgId)return true;
    if(!TG?.initData || !tgId)return false;
    try{const r=await fetch(API_BASE+'/auth/resell/session',{method:'POST',headers:{'X-Telegram-Init-Data':TG.initData}});const d=await r.json();if(d.success&&d.session){session=d.session;tgId=Number(d.tg_id||tgId);return true}}catch(e){}
    return false;
  }
  async function getJson(url,opts={}){const r=await fetch(API_BASE+url,opts);let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||'Ошибка сервера');return d}
  async function load(){
    const ok=await auth();
    if(!ok){toast('Открой Контейнеры из Telegram');return}
    try{
      const [inv,st]=await Promise.all([getJson('/container/inventory?tg_id='+tgId,{headers:authHeaders()}),getJson('/container/state?tg_id='+tgId)]);
      state.balance=Number(inv.balance ?? st.balance ?? 0);
      state.items=Array.isArray(inv.items)?inv.items.filter(x=>!Number(x.sold)):[];
      state.quests=Array.isArray(st.daily_quests)?st.daily_quests:[];
      render();
    }catch(e){toast(e.message)}
  }
  function render(){
    $('#balance').innerHTML=money(state.balance)+' <span>R-COIN</span>';
    $('#cards').innerHTML=CONTAINERS.map(c=>`<article class="card"><div class="art"><span class="tag">${c.label}</span><div class="crate"><i></i></div></div><h3>${c.name}</h3><div class="price"><b>${money(c.price)}</b> R-COIN</div><div class="card-sub">Открытие сразу после покупки</div><button class="buy ${state.balance>=c.price?'green':''}" data-buy="${c.id}" ${state.balance<c.price?'disabled':''}>${state.balance>=c.price?'КУПИТЬ И ОТКРЫТЬ':'НЕДОСТАТОЧНО R-COIN'}</button></article>`).join('');
    $('#inventory').innerHTML=state.items.length?state.items.map(i=>`<div class="item"><div class="item-icon">${iconFor(i.name)}</div><div class="item-main"><div class="item-name">${esc(i.name)}</div><div class="item-rarity" style="color:${rarityColor[i.rarity]||'#777'}">${esc(i.rarity)}</div></div><div><div class="item-value">${money(i.value)} R</div><button class="sell" data-sell="${i.id}">ПРОДАТЬ</button></div></div>`).join(''):'<div class="empty">Пока пусто. Открой контейнер и получи первый предмет.</div>';
    $('#itemCount').textContent=String(state.items.length);
    $('#quests').innerHTML=state.quests.length?state.quests.map(q=>`<div class="quest"><div><div class="quest-name">${esc(q.name)}</div><div class="quest-prog">${q.progress}/${q.target} · +${money(q.reward)} R-COIN</div></div>${q.claimed?'<div class="claimed">ПОЛУЧЕНО</div>':(q.progress>=q.target?`<button class="claim" data-claim="${q.id}">ЗАБРАТЬ</button>`:'<div class="claimed">В ПРОЦЕССЕ</div>')}</div>`).join(''):'<div class="empty">Задания появятся после загрузки.</div>';
  }
  function iconFor(name){return ({'USB-C Cable':'🔌','Wireless Mouse':'🖱️','AirPods':'🎧','Smart Watch':'⌚','Gaming GPU':'🎮','iPhone Box':'📱','MacBook':'💻','Luxury Watch':'⌚','Rare Car Key':'🔑','Prototype Device':'🧿'})[name]||'📦'}
  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function renderOdds(){
    $('#odds').innerHTML=LOOT.map(x=>`<div class="info-row"><span>${x[1]} ${x[0]}</span><b style="color:${rarityColor[x[2]]||'#fff'}">${x[3]}%</b></div>`).join('');
  }
  async function buy(id){
    if(busy)return; const c=CONTAINERS.find(x=>x.id===id);if(!c)return;if(state.balance<c.price){toast('Недостаточно R-Coin');h('medium');return}
    busy=true;h('medium');$('#notice').textContent='';$('#modalTitle').textContent=c.name;$('#stageCrate').classList.remove('opening');$('#result').classList.remove('show');$('#resultActions').style.display='none';$('#overlay').classList.add('show');
    try{
      const d=await getJson('/container/buy',{method:'POST',headers:authHeaders(),body:JSON.stringify({tg_id:tgId,container_id:id,request_id:rid()})});
      currentPurchase=d.purchase_id;state.balance=Number(d.balance);render();
      await new Promise(r=>setTimeout(r,260));$('#stageCrate').classList.add('opening');h('heavy');
      await new Promise(r=>setTimeout(r,720));
      const o=await getJson('/container/open',{method:'POST',headers:authHeaders(),body:JSON.stringify({tg_id:tgId,purchase_id:currentPurchase})});
      state.balance=Number(o.balance);currentItem=o.item||null;showResult(currentItem);render();
    }catch(e){$('#overlay').classList.remove('show');toast(e.message)}finally{busy=false}
  }
  function showResult(item){
    $('#resultIcon').textContent=item?.icon||iconFor(item?.name);$('#resultRarity').textContent=item?.rarity||'COMMON';$('#resultRarity').style.color=rarityColor[item?.rarity]||'#888';$('#resultName').textContent=item?.name||'—';$('#resultValue').textContent=money(item?.value||0)+' R-COIN';$('#result').classList.add('show');$('#resultActions').style.display='grid';h('heavy');
  }
  async function sellItem(id,fromResult=false){
    if(busy)return;busy=true;try{const d=await getJson('/container/sell',{method:'POST',headers:authHeaders(),body:JSON.stringify({tg_id:tgId,item_id:id,request_id:rid()})});state.balance=Number(d.balance);state.items=state.items.filter(x=>String(x.id)!==String(id));if(fromResult){currentItem=null;$('#resultActions').style.display='none';$('#notice').textContent='Предмет продан · баланс обновлён';setTimeout(()=>$('#overlay').classList.remove('show'),650)}render();toast('Продано за '+money(d.value)+' R-COIN');h('medium')}catch(e){toast(e.message)}finally{busy=false}}
  async function claim(id){try{const d=await getJson('/container/quests/claim',{method:'POST',headers:authHeaders(),body:JSON.stringify({tg_id:tgId,quest_id:id})});state.balance=Number(d.balance);toast('Награда +'+money(d.reward)+' R-COIN');await load()}catch(e){toast(e.message)}}

  $('#cards').addEventListener('click',e=>{const b=e.target.closest('[data-buy]');if(b)buy(b.dataset.buy)});
  $('#inventory').addEventListener('click',e=>{const b=e.target.closest('[data-sell]');if(b)sellItem(b.dataset.sell)});
  $('#quests').addEventListener('click',e=>{const b=e.target.closest('[data-claim]');if(b)claim(b.dataset.claim)});
  $('#refresh').onclick=()=>load();
  $('#oddsBtn').onclick=()=>{const el=$('#odds');const open=el.style.display!=='none';el.style.display=open?'none':'block';if(!open)renderOdds()};
  $('#close').onclick=()=>{if(!busy){$('#overlay').classList.remove('show');currentPurchase=null;currentItem=null}};
  $('#keepResult').onclick=()=>{if(!currentItem)return;$('#resultActions').style.display='none';$('#notice').textContent='Предмет сохранён в твоём инвентаре';currentItem=null;setTimeout(()=>$('#overlay').classList.remove('show'),550)};
  $('#sellResult').onclick=()=>{if(currentItem)sellItem(currentItem.id,true)};
  $('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay'&&!busy)$('#overlay').classList.remove('show')});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
  renderOdds();load();
})();
</script>
</body>
</html>
