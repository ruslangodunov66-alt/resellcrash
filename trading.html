<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0e14">
    <title>R-TRADE PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;0,900;1,800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        /* ==========================================================================
           1. СТИЛИ И ТЕМАТИКА КРИПТОБИРЖИ
           ========================================================================== */
        :root {
            --bg-dark: #0b0e14;
            --bg-panel: #121721;
            --bg-card: #18202c;
            --border-color: rgba(255, 255, 255, 0.07);
            --accent-blue: #2f88ff;
            --accent-green: #0ead69;
            --accent-green-bg: rgba(14, 173, 105, 0.15);
            --accent-red: #fa4d56;
            --accent-red-bg: rgba(250, 77, 86, 0.15);
            --accent-gold: #f0b90b;
            --text-main: #f1f5f9;
            --text-muted: #848e9c;
        }

        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            padding: 0;
        }

        .trade-app {
            max-width: 480px;
            width: 100%;
            min-height: 100vh;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 70px;
        }

        /* ===== ШАПКА БИРЖИ ===== */
        .top-header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            font-weight: 900;
            font-style: italic;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .brand-logo span { color: var(--accent-gold); }

        .balance-badge {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 6px 12px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .balance-label { font-size: 9px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
        .balance-value { font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 900; color: var(--accent-green); }

        /* ===== СЕЛЕКТОР ПАРЫ И ТАЙМФРЕЙМОВ ===== */
        .ticker-bar {
            background: var(--bg-panel);
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .pair-info { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .pair-symbol { font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 900; }
        .pair-price { font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 900; transition: color 0.2s; }
        .pair-change { font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
        .pair-change.up { color: var(--accent-green); background: var(--accent-green-bg); }
        .pair-change.down { color: var(--accent-red); background: var(--accent-red-bg); }

        .pair-chips {
            display: flex; gap: 4px; overflow-x: auto; padding: 8px 12px;
            background: var(--bg-dark); border-bottom: 1px solid var(--border-color);
        }
        .pair-chips::-webkit-scrollbar { display: none; }
        .chip {
            background: var(--bg-panel); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 5px 10px; font-size: 11px; font-weight: 800;
            color: var(--text-muted); white-space: nowrap; cursor: pointer;
        }
        .chip.active { background: rgba(47, 136, 255, 0.15); border-color: var(--accent-blue); color: #fff; }

        .tf-bar {
            display: flex; gap: 4px; padding: 6px 12px; background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
        }
        .tf-btn {
            background: transparent; border: none; color: var(--text-muted);
            font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 4px; cursor: pointer;
        }
        .tf-btn.active { color: var(--accent-gold); background: rgba(240, 185, 11, 0.1); }

        /* ===== ГРАФИК ===== */
        .chart-box {
            position: relative;
            width: 100%;
            height: 280px;
            background: var(--bg-dark);
            border-bottom: 1px solid var(--border-color);
        }
        #tvchart { width: 100%; height: 100%; }

        .connection-status {
            position: absolute; top: 8px; right: 12px; font-size: 9px; font-weight: 800;
            display: flex; align-items: center; gap: 4px; z-index: 10;
        }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #999; }
        .status-dot.online { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

        /* ===== СЕКЦИЯ АКТИВНЫХ СДЕЛОК ===== */
        .trades-container {
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .active-card {
            background: var(--bg-panel);
            border-left: 4px solid var(--accent-blue);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }
        .active-card.long { border-left-color: var(--accent-green); }
        .active-card.short { border-left-color: var(--accent-red); }

        .card-left { display: flex; flex-direction: column; gap: 2px; }
        .card-dir { font-size: 11px; font-weight: 900; text-transform: uppercase; }
        .card-details { font-size: 10px; color: var(--text-muted); font-weight: 700; }
        .card-right { text-align: right; }
        .card-timer { font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 900; color: var(--accent-gold); }
        .card-pnl { font-size: 11px; font-weight: 800; }

        /* ===== ТОРГОВАЯ ПАНЕЛЬ И СТАКАН ===== */
        .trading-area {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 8px;
            padding: 8px 12px;
        }

        .orderbook {
            background: var(--bg-panel);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 8px;
            display: flex;
            flex-direction: column;
            font-size: 10px;
        }

        .ob-title { font-size: 9px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .ob-list { display: flex; flex-direction: column; gap: 2px; }
        .ob-row { display: flex; justify-content: space-between; font-weight: 800; position: relative; padding: 1px 0; z-index: 1; }
        .ob-row.ask { color: var(--accent-red); }
        .ob-row.bid { color: var(--accent-green); }
        .ob-row .vol { color: var(--text-main); opacity: 0.8; }
        .ob-bg { position: absolute; top:0; right:0; height:100%; opacity: 0.12; z-index: -1; border-radius: 2px; }
        .ob-row.ask .ob-bg { background: var(--accent-red); }
        .ob-row.bid .ob-bg { background: var(--accent-green); }
        .ob-divider { height: 1px; background: var(--border-color); margin: 4px 0; }

        .order-form {
            background: var(--bg-panel);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .field-group { margin-bottom: 8px; }
        .field-label { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; display: block; }
        .field-input {
            background: var(--bg-dark); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 6px 8px; display: flex; align-items: center; justify-content: space-between;
        }
        .field-input input {
            background: none; border: none; outline: none; color: #fff;
            font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 13px; width: 100%;
        }
        .field-input span { font-size: 10px; font-weight: 800; color: var(--text-muted); }

        .quick-bets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 4px; }
        .qb-btn {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border-color);
            border-radius: 4px; padding: 3px 0; font-size: 9px; font-weight: 800;
            color: var(--text-main); text-align: center; cursor: pointer;
        }
        .qb-btn:active { background: rgba(240, 185, 11, 0.2); }

        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
        .btn-trade {
            border: none; border-radius: 10px; padding: 12px 0;
            font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 12px;
            color: #fff; cursor: pointer; text-transform: uppercase; transition: transform 0.1s;
        }
        .btn-trade:active { transform: scale(0.96); }
        .btn-trade.up { background: var(--accent-green); box-shadow: 0 4px 12px var(--accent-green-bg); }
        .btn-trade.down { background: var(--accent-red); box-shadow: 0 4px 12px var(--accent-red-bg); }

        /* ===== НИЖНЯЯ НАВИГАЦИЯ ===== */
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            max-width: 480px; width: 100%; background: var(--bg-panel);
            border-top: 1px solid var(--border-color); display: flex;
            justify-content: space-around; padding: 8px 0; z-index: 100;
        }

        .nav-tab {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            font-size: 10px; font-weight: 800; color: var(--text-muted); cursor: pointer;
        }
        .nav-tab.active { color: var(--accent-gold); }
        .nav-tab .icon { font-size: 16px; }

        /* ===== СЕКЦИЯ ПРОФИЛЯ / ИСТОРИИ ===== */
        .view-section { display: none; flex-direction: column; }
        .view-section.active { display: flex; }

        .profile-box { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .user-card {
            background: var(--bg-panel); border: 1px solid var(--border-color);
            border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 12px;
        }
        .user-avatar {
            width: 48px; height: 48px; border-radius: 50%; background: var(--accent-gold);
            color: #000; font-family: 'Montserrat', sans-serif; font-weight: 900;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
        }

        .history-list { display: flex; flex-direction: column; gap: 6px; }
        .history-item {
            background: var(--bg-panel); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 10px; display: flex; justify-content: space-between; align-items: center;
        }

        /* TOAST */
        .toast {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            background: var(--bg-panel); border: 1px solid var(--accent-blue);
            border-radius: 10px; padding: 8px 16px; color: #fff; font-weight: 800;
            font-size: 12px; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="toast" id="toastMsg">Сообщение</div>

    <div class="trade-app">
        <!-- ШАПКА -->
        <div class="top-header">
            <div class="brand-logo">R-<span>TRADE</span></div>
            <div class="balance-badge">
                <span class="balance-label">Баланс</span>
                <span class="balance-value" id="balanceDisplay">0 ₽</span>
            </div>
        </div>

        <!-- ТОРГОВЫЙ ИНТЕРФЕЙС -->
        <div id="viewTrade" class="view-section active">
            <!-- ЧИПСЫ ВЫБОРА ВАЛЮТНОЙ ПАРЫ -->
            <div class="pair-chips" id="pairChips">
                <div class="chip active" data-pair="BTCUSDT">BTC/USDT</div>
                <div class="chip" data-pair="ETHUSDT">ETH/USDT</div>
                <div class="chip" data-pair="SOLUSDT">SOL/USDT</div>
                <div class="chip" data-pair="TONUSDT">TON/USDT</div>
            </div>

            <!-- ИНФОРМАЦИОННАЯ ПАНЕЛЬ ТИКЕРА -->
            <div class="ticker-bar">
                <div class="pair-info">
                    <span class="pair-symbol" id="pairSymbolDisplay">BTC/USDT</span>
                    <span class="pair-price" id="priceDisplay">0.00</span>
                </div>
                <span class="pair-change" id="changeDisplay">+0.00%</span>
            </div>

            <!-- ТАЙМФРЕЙМЫ -->
            <div class="tf-bar" id="tfBar">
                <button class="tf-btn" data-tf="1m">1m</button>
                <button class="tf-btn active" data-tf="5m">5m</button>
                <button class="tf-btn" data-tf="15m">15m</button>
                <button class="tf-btn" data-tf="1h">1H</button>
            </div>

            <!-- ГРАФИК -->
            <div class="chart-box">
                <div class="connection-status">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">LIVE</span>
                </div>
                <div id="tvchart"></div>
            </div>

            <!-- СПИСОК АКТИВНЫХ СДЕЛОК -->
            <div class="trades-container" id="activeTradesContainer"></div>

            <!-- ТОРГОВАЯ СЕТКА (СТАКАН И ФОРМА СТАВКИ) -->
            <div class="trading-area">
                <!-- СТАКАН ОРДЕРОВ -->
                <div class="orderbook">
                    <div class="ob-title"><span>Цена</span><span>Объем</span></div>
                    <div class="ob-list" id="obAsks"></div>
                    <div class="ob-divider"></div>
                    <div class="ob-list" id="obBids"></div>
                </div>

                <!-- ФОРМА ТОРГОВЛИ -->
                <div class="order-form">
                    <div>
                        <div class="field-group">
                            <span class="field-label">Время (Сек)</span>
                            <div class="field-input">
                                <input type="number" id="tradeDuration" value="10" min="5" max="300">
                                <span>Сек</span>
                            </div>
                        </div>

                        <div class="field-group">
                            <span class="field-label">Ставка (₽)</span>
                            <div class="field-input">
                                <input type="text" id="tradeAmount" value="5 000">
                                <span>₽</span>
                            </div>
                            <div class="quick-bets">
                                <div class="qb-btn" data-amt="1000">1K</div>
                                <div class="qb-btn" data-amt="5000">5K</div>
                                <div class="qb-btn" data-amt="25000">25K</div>
                            </div>
                        </div>
                    </div>

                    <div class="action-btns">
                        <button class="btn-trade up" id="btnLong">ВВЕРХ ⬆</button>
                        <button class="btn-trade down" id="btnShort">ВНИЗ ⬇</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- СЕКЦИЯ ПРОФИЛЯ И ИСТОРИИ -->
        <div id="viewProfile" class="view-section">
            <div class="profile-box">
                <div class="user-card">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div>
                        <div style="font-weight:900; font-size:16px;" id="userName">Трейдер</div>
                        <div style="font-size:11px; color:var(--text-muted);" id="userUid">ID: ---</div>
                    </div>
                </div>

                <div style="font-size:12px; font-weight:900; color:var(--text-muted); text-transform:uppercase;">История сделок</div>
                <div class="history-list" id="historyList"></div>
            </div>
        </div>

        <!-- НИЖНЯЯ НАВИГАЦИЯ -->
        <div class="bottom-nav">
            <div class="nav-tab active" data-target="viewTrade">
                <div class="icon">📈</div>
                <span>Торговля</span>
            </div>
            <div class="nav-tab" data-target="viewProfile">
                <div class="icon">📊</div>
                <span>История</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const tg = window.Telegram?.WebApp;
            if (tg) { tg.expand(); tg.ready(); }

            const API_BASE = 'https://resellgame.bothost.tech';
            let userId = null;
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('userId')) userId = urlParams.get('userId');
            else if (urlParams.has('user_id')) userId = urlParams.get('user_id');
            else if (tg?.initDataUnsafe?.user?.id) userId = tg.initDataUnsafe.user.id;

            // DOM
            const balanceEl = document.getElementById('balanceDisplay');
            const toastEl = document.getElementById('toastMsg');
            const priceEl = document.getElementById('priceDisplay');
            const changeEl = document.getElementById('changeDisplay');
            const pairSymbolEl = document.getElementById('pairSymbolDisplay');
            const tradeAmountInput = document.getElementById('tradeAmount');
            const tradeDurationInput = document.getElementById('tradeDuration');
            const activeTradesContainer = document.getElementById('activeTradesContainer');
            const statusDot = document.getElementById('statusDot');
            const historyList = document.getElementById('historyList');

            let casinoBalance = 0;
            let currentPair = 'BTCUSDT';
            let currentInterval = '5m';
            let realPrice = 0;
            let activeTrades = [];
            let tradeHistory = [];
            let ws = null;

            // ЗВУК И ВИБРАЦИЯ
            let audioCtx = null;
            function initAudio() { if (!audioCtx && window.AudioContext) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            function playSound(freq, dur = 0.1, type = 'sine') {
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type; osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + dur);
                } catch(e) {}
            }

            function vibrate(type = 'light') {
                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred(type);
            }

            function showToast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                setTimeout(() => toastEl.classList.remove('show'), 2200);
            }

            function formatNumber(n) { return (n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
            function parseNumber(s) { return parseInt(s.toString().replace(/\s/g, '')) || 0; }

            // БАЛАНС И СЕРВЕР (СИНХРОНИЗАЦИЯ С ПОКЕРОМ)
            function loadBalanceFromServer() {
                if (!userId) { balanceEl.innerText = 'Ошибка ID'; return; }
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);

                fetch(`${API_BASE}/profile/${encodeURIComponent(userId)}`, { signal: controller.signal })
                    .then(res => { clearTimeout(timeoutId); if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
                    .then(data => {
                        const bal = Number(data.casino_balance ?? data.balance ?? 0);
                        casinoBalance = bal;
                        localStorage.setItem('casinoBalance', String(casinoBalance));
                        balanceEl.innerText = formatNumber(casinoBalance) + ' ₽';
                        if (data.username || data.first_name) {
                            document.getElementById('userName').textContent = data.username || data.first_name;
                        }
                    })
                    .catch(() => {
                        clearTimeout(timeoutId);
                        const saved = parseInt(localStorage.getItem('casinoBalance')) || 0;
                        casinoBalance = saved;
                        balanceEl.innerText = formatNumber(casinoBalance) + ' ₽';
                    });
            }

            function sendGameResult(result, bet, win) {
                return new Promise((resolve, reject) => {
                    if (!userId) { reject(new Error('Нет userId')); return; }
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 8000);

                    fetch(`${API_BASE}/game_result`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        signal: controller.signal,
                        body: JSON.stringify({ userId: userId, game: 'trading', result: result, bet: bet, win: win })
                    })
                    .then(res => { clearTimeout(timeoutId); if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
                    .then(data => {
                        if (data.new_balance !== undefined) resolve(data.new_balance);
                        else reject(new Error('Ошибка баланса'));
                    })
                    .catch(err => { clearTimeout(timeoutId); reject(err); });
                });
            }

            // ГРАФИК LIGHTWEIGHT CHARTS
            const chartContainer = document.getElementById('tvchart');
            const chart = LightweightCharts.createChart(chartContainer, {
                layout: { background: { type: 'solid', color: '#0b0e14' }, textColor: '#848e9c' },
                grid: { vertLines: { color: 'rgba(255,255,255,0.03)' }, horzLines: { color: 'rgba(255,255,255,0.03)' } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                rightPriceScale: { borderVisible: false },
                timeScale: { borderVisible: false, timeVisible: true }
            });

            const candleSeries = chart.addCandlestickSeries({
                upColor: '#0ead69', downColor: '#fa4d56',
                borderVisible: false, wickUpColor: '#0ead69', wickDownColor: '#fa4d56'
            });

            // ЗАГРУЗКА НАСТОЯЩИХ СВЕЧЕЙ С BINANCE API
            async function fetchBinanceKlines(symbol, interval) {
                try {
                    const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=100`);
                    const data = await res.json();
                    const formattedData = data.map(d => ({
                        time: Math.floor(d[0] / 1000),
                        open: parseFloat(d[1]),
                        high: parseFloat(d[2]),
                        low: parseFloat(d[3]),
                        close: parseFloat(d[4])
                    }));
                    candleSeries.setData(formattedData);
                    
                    if(formattedData.length > 0) {
                        const last = formattedData[formattedData.length - 1];
                        const first = formattedData[0];
                        realPrice = last.close;
                        updateTickerUI(last.close, ((last.close - first.open) / first.open) * 100);
                    }
                } catch(e) {
                    console.error("Ошибка загрузки свечей:", e);
                }
            }

            function updateTickerUI(price, change) {
                priceEl.textContent = price.toFixed(2);
                changeEl.textContent = (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
                changeEl.className = 'pair-change ' + (change >= 0 ? 'up' : 'down');
                priceEl.style.color = change >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';
                updateOrderbook(price);
            }

            function updateOrderbook(price) {
                const asksContainer = document.getElementById('obAsks');
                const bidsContainer = document.getElementById('obBids');
                let asksHTML = '', bidsHTML = '';

                for(let i=3; i>=1; i--) {
                    let p = (price + i * (price * 0.00015)).toFixed(2);
                    let v = (Math.random() * 1.2 + 0.05).toFixed(3);
                    let w = Math.floor(Math.random() * 60 + 10);
                    asksHTML += `<div class="ob-row ask"><span>${p}</span><span class="vol">${v}</span><div class="ob-bg" style="width:${w}%"></div></div>`;
                }
                for(let i=1; i<=3; i++) {
                    let p = (price - i * (price * 0.00015)).toFixed(2);
                    let v = (Math.random() * 1.2 + 0.05).toFixed(3);
                    let w = Math.floor(Math.random() * 60 + 10);
                    bidsHTML += `<div class="ob-row bid"><span>${p}</span><span class="vol">${v}</span><div class="ob-bg" style="width:${w}%"></div></div>`;
                }
                asksContainer.innerHTML = asksHTML;
                bidsContainer.innerHTML = bidsHTML;
            }

            // РЕАЛЬНЫЙ WEBSOCKET ДЛЯ ПОЛУЧЕНИЯ ТИКОВ В РЕАЛЬНОМ ВРЕМЕНИ
            function connectWebSocket(symbol) {
                if (ws) { ws.close(); }
                const streamName = symbol.toLowerCase() + '@kline_' + currentInterval;
                ws = new WebSocket(`wss://stream.binance.com:9443/ws/${streamName}`);

                ws.onopen = () => {
                    statusDot.classList.add('online');
                };

                ws.onmessage = (event) => {
                    const message = JSON.parse(event.data);
                    if (message.e === 'kline') {
                        const k = message.k;
                        const klineData = {
                            time: Math.floor(k.t / 1000),
                            open: parseFloat(k.o),
                            high: parseFloat(k.h),
                            low: parseFloat(k.l),
                            close: parseFloat(k.c)
                        };
                        candleSeries.update(klineData);
                        realPrice = parseFloat(k.c);
                        updateTickerUI(realPrice, parseFloat(k.P || 0));
                    }
                };

                ws.onclose = () => {
                    statusDot.classList.remove('online');
                    setTimeout(() => connectWebSocket(symbol), 3000);
                };
            }

            // ТОРГОВАЯ ЛОГИКА И ИСПРАВЛЕНИЕ БАГА
            function placeTrade(dir) {
                initAudio(); playSound(600); vibrate('medium');
                let bet = parseNumber(tradeAmountInput.value);
                let duration = parseInt(tradeDurationInput.value) || 10;

                if (bet < 100) { showToast('Мин. ставка 100 ₽'); return; }
                if (bet > casinoBalance) { showToast('Недостаточно средств!'); return; }

                casinoBalance -= bet;
                balanceEl.textContent = formatNumber(casinoBalance) + ' ₽';

                let trade = {
                    id: Date.now(),
                    pair: currentPair,
                    dir: dir,
                    entryPrice: realPrice,
                    bet: bet,
                    endTime: Date.now() + duration * 1000,
                    processed: false
                };

                activeTrades.push(trade);
                renderActiveTrades();
                showToast(`Сделка ${dir.toUpperCase()} открыта!`);
            }

            // ТАЙМЕР И ИСПРАВЛЕНИЕ ЗАВИСАНИЯ СДЕЛОК
            setInterval(() => {
                let now = Date.now();
                let remainingTrades = [];

                for (let i = 0; i < activeTrades.length; i++) {
                    let t = activeTrades[i];

                    if (now >= t.endTime && !t.processed) {
                        t.processed = true; // Защита от двойного срабатывания

                        let isWin = (t.dir === 'long' && realPrice > t.entryPrice) || (t.dir === 'short' && realPrice < t.entryPrice);
                        let winAmount = isWin ? Math.floor(t.bet * 1.85) : 0;

                        // Запрос результатов на сервер
                        sendGameResult(isWin ? 'win' : 'lose', t.bet, winAmount)
                            .then(newBal => {
                                casinoBalance = Number(newBal);
                                balanceEl.textContent = formatNumber(casinoBalance) + ' ₽';
                            })
                            .catch(() => {});

                        // Добавление в историю
                        tradeHistory.unshift({
                            pair: t.pair,
                            dir: t.dir,
                            win: isWin,
                            amount: isWin ? winAmount : t.bet
                        });
                        renderHistory();

                        if (isWin) {
                            playSound(880, 0.2, 'sine'); vibrate('success');
                            showToast(`🎉 ВЫИГРЫШ +${formatNumber(winAmount)} ₽!`);
                        } else {
                            playSound(200, 0.2, 'sawtooth'); vibrate('error');
                            showToast(`❌ Сделка в минус`);
                        }
                    } else if (!t.processed) {
                        remainingTrades.push(t);
                    }
                }

                activeTrades = remainingTrades;
                renderActiveTrades();
            }, 500);

            function renderActiveTrades() {
                let now = Date.now();
                let html = '';
                for (let t of activeTrades) {
                    let secLeft = Math.max(0, Math.ceil((t.endTime - now) / 1000));
                    let isProfitable = (t.dir === 'long' && realPrice >= t.entryPrice) || (t.dir === 'short' && realPrice <= t.entryPrice);
                    
                    html += `
                        <div class="active-card ${t.dir}">
                            <div class="card-left">
                                <span class="card-dir" style="color:${t.dir==='long'?'var(--accent-green)':'var(--accent-red)'}">${t.dir.toUpperCase()} • ${t.pair}</span>
                                <span class="card-details">Вход: ${t.entryPrice.toFixed(2)} | Тек: ${realPrice.toFixed(2)}</span>
                            </div>
                            <div class="card-right">
                                <div class="card-timer">⏱ ${secLeft}s</div>
                                <div class="card-pnl" style="color:${isProfitable?'var(--accent-green)':'var(--accent-red)'}">
                                    ${isProfitable ? '+85%' : '-100%'}
                                </div>
                            </div>
                        </div>
                    `;
                }
                activeTradesContainer.innerHTML = html;
            }

            function renderHistory() {
                let html = '';
                for(let item of tradeHistory) {
                    html += `
                        <div class="history-item">
                            <div>
                                <div style="font-weight:900; font-size:12px; color:${item.dir==='long'?'var(--accent-green)':'var(--accent-red)'}">
                                    ${item.dir.toUpperCase()} ${item.pair}
                                </div>
                            </div>
                            <div style="font-weight:900; font-size:13px; color:${item.win?'var(--accent-green)':'var(--accent-red)'}">
                                ${item.win ? '+' : '-'}${formatNumber(item.amount)} ₽
                            </div>
                        </div>
                    `;
                }
                historyList.innerHTML = html;
            }

            // СОБЫТИЯ И КНОПКИ
            document.getElementById('btnLong').addEventListener('click', () => placeTrade('long'));
            document.getElementById('btnShort').addEventListener('click', () => placeTrade('short'));

            document.querySelectorAll('#pairChips .chip').forEach(chip => {
                chip.addEventListener('click', function() {
                    initAudio(); playSound(500); vibrate('light');
                    document.querySelectorAll('#pairChips .chip').forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    currentPair = this.dataset.pair;
                    pairSymbolEl.textContent = this.textContent;
                    fetchBinanceKlines(currentPair, currentInterval);
                    connectWebSocket(currentPair);
                });
            });

            document.querySelectorAll('#tfBar .tf-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    initAudio(); playSound(450); vibrate('light');
                    document.querySelectorAll('#tfBar .tf-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentInterval = this.dataset.tf;
                    fetchBinanceKlines(currentPair, currentInterval);
                    connectWebSocket(currentPair);
                });
            });

            document.querySelectorAll('.qb-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    initAudio(); playSound(400); vibrate('light');
                    tradeAmountInput.value = formatNumber(parseInt(this.dataset.amt));
                });
            });

            tradeAmountInput.addEventListener('input', function() {
                this.value = formatNumber(parseNumber(this.value));
            });

            document.querySelectorAll('.bottom-nav .nav-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    initAudio(); playSound(450); vibrate('light');
                    document.querySelectorAll('.bottom-nav .nav-tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
                    this.classList.add('active');
                    document.getElementById(this.dataset.target).classList.add('active');
                });
            });

            // ИНИЦИАЛИЗАЦИЯ ПРИ СТАРТЕ
            if (userId) document.getElementById('userUid').textContent = 'ID: ' + userId;
            loadBalanceFromServer();
            fetchBinanceKlines(currentPair, currentInterval);
            connectWebSocket(currentPair);

            window.addEventListener('resize', () => {
                chart.resize(chartContainer.clientWidth, 280);
            });
        })();
    </script>
</body>
</html>
