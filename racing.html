<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Resell Racing</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,900&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(15, 23, 42, 0.96);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-gold: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background: #000;
            font-family: 'Nunito', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-wrapper {
            max-width: 500px;
            width: 100%;
            height: 100vh;
            max-height: 900px;
            background: #1e293b;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
        }

        /* ===== МЕНЮ ===== */
        .menu-screen {
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.98) 0%, rgba(2, 6, 23, 0.96) 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 20px; z-index: 100; overflow-y: auto;
        }

        .logo {
            font-family: 'Montserrat', sans-serif; font-size: 34px; font-weight: 900; font-style: italic;
            text-transform: uppercase; color: #fff; text-shadow: 0 4px 15px rgba(59, 130, 246, 0.6);
            margin-top: 10px; margin-bottom: 16px; text-align: center; line-height: 1.1;
        }
        .logo span { color: var(--accent-gold); display: block; font-size: 18px; letter-spacing: 3px; }

        .menu-card {
            width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 14px; margin-bottom: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
        }

        .section-title { font-size: 11px; font-weight: 900; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }

        /* Карусель машин */
        .car-carousel {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory;
        }
        .car-carousel::-webkit-scrollbar { height: 4px; }
        .car-carousel::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 4px; }
        
        .car-card {
            min-width: 130px; background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 8px; text-align: center; cursor: pointer; transition: all 0.2s;
            scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .car-card.active { background: rgba(245, 158, 11, 0.15); border-color: var(--accent-gold); transform: scale(1.02); }
        .car-card .c-name { font-size: 12px; font-weight: 900; white-space: nowrap; }
        .car-card .c-stats { font-size: 9px; color: var(--accent-green); font-weight: 800; background: rgba(16,185,129,0.15); padding: 2px 6px; border-radius: 6px; }

        .car-preview { width: 90px; height: 40px; }

        .btn {
            width: 100%; height: 50px; border: none; border-radius: 12px;
            font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 14px;
            color: #fff; cursor: pointer; text-transform: uppercase; transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-green { background: linear-gradient(135deg, #10b981, #047857); box-shadow: 0 4px 15px rgba(16,185,129,0.4); }
        .btn-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); box-shadow: 0 4px 15px rgba(59,130,246,0.4); }
        .btn-gold { background: linear-gradient(135deg, #f59e0b, #b45309); box-shadow: 0 4px 15px rgba(245,158,11,0.4); }
        
        .flex-row { display: flex; gap: 8px; }
        .flex-row .btn { flex: 1; }

        /* ===== МОДАЛЬНЫЕ ОКНА ВВОДА СТАВКИ / КОМНАТЫ ===== */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box {
            background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 20px;
            padding: 20px; width: 90%; max-width: 360px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }
        .modal-title { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 900; color: var(--accent-gold); margin-bottom: 12px; text-transform: uppercase; }
        .styled-input {
            width: 100%; height: 48px; background: rgba(0,0,0,0.6); border: 2px solid var(--border-color);
            border-radius: 12px; color: #fff; font-family: 'Montserrat', sans-serif; font-weight: 900;
            font-size: 18px; text-align: center; outline: none; margin-bottom: 12px;
        }

        /* ===== HUD ИГРЫ (ВЕРХ И НИЗ РАЗНЕСЕНЫ, ЧТОБЫ НЕ ПЕРЕКРЫВАТЬ МАШИНЫ) ===== */
        .hud {
            position: absolute; top: 12px; left: 12px; right: 12px;
            display: flex; justify-content: space-between; align-items: center; z-index: 50; pointer-events: none;
        }
        .hud-badge {
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border: 1px solid var(--border-color);
            padding: 6px 12px; border-radius: 10px; font-size: 12px; font-weight: 800; color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .hud-badge span { color: var(--accent-gold); font-family: 'Montserrat', sans-serif; font-weight: 900; }

        .tachometer {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            background: rgba(0,0,0,0.7); padding: 6px 10px; border-radius: 10px; border: 1px solid var(--border-color);
        }
        .rpm-bar { width: 90px; height: 8px; background: #334155; border-radius: 4px; overflow: hidden; }
        .rpm-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444); }
        .gear-text { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 14px; color: #fff; }

        /* УПРАВЛЕНИЕ ВНИЗУ (НЕ МЕШАЕТ ВИДИМОСТИ МАШИН) */
        .controls {
            position: absolute; bottom: 16px; left: 16px; right: 16px;
            display: flex; justify-content: space-between; align-items: flex-end; z-index: 50;
        }
        .ctrl-group { display: flex; gap: 8px; align-items: flex-end; }
        
        .pedal {
            border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: 'Montserrat', sans-serif; font-weight: 900; color: #fff;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6); cursor: pointer; transition: transform 0.05s;
            border: 2px solid rgba(255,255,255,0.25); user-select: none;
        }
        .btn-shift { width: 55px; height: 55px; background: rgba(30, 41, 59, 0.9); font-size: 20px; border-radius: 14px; }
        .btn-shift:active { background: rgba(59, 130, 246, 0.8); transform: scale(0.92); }

        .pedal.nitro { background: linear-gradient(135deg, #3b82f6, #1d4ed8); width: 65px; height: 65px; border-radius: 50%; font-size: 14px; }
        .pedal.nitro:active { transform: scale(0.9); box-shadow: 0 0 15px #3b82f6; }
        
        .pedal.brake { background: linear-gradient(135deg, #ef4444, #b91c1c); width: 55px; height: 55px; }
        .pedal.brake:active { transform: scale(0.92); }

        .pedal.gas { background: linear-gradient(180deg, #10b981, #047857); width: 75px; height: 95px; font-size: 14px; }
        .pedal.gas:active { transform: scale(0.95); box-shadow: 0 0 20px #10b981; }

        canvas#gameCanvas { width: 100%; height: 100%; display: block; }
        .hidden { display: none !important; }
        
        .toast {
            position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95); border: 2px solid var(--accent-gold); color: #fff;
            padding: 10px 20px; font-weight: 900; border-radius: 12px; z-index: 100;
            display: none; white-space: nowrap; text-transform: uppercase; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div class="game-wrapper" id="appContainer">
        <div class="toast" id="toastMsg">Уведомление</div>

        <!-- ИГРОВОЙ HUD -->
        <div class="hud hidden" id="gameHud">
            <div class="hud-badge">🏁 <span id="hudRoom">СИНГЛ</span></div>
            <div class="tachometer">
                <div class="rpm-bar"><div class="rpm-fill" id="rpmFill"></div></div>
                <div class="gear-text" id="hudGear">GEAR 1</div>
            </div>
            <div class="hud-badge">⚡ <span id="hudSpeed">0</span> KM/H</div>
        </div>

        <!-- ГЛАВНОЕ МЕНЮ -->
        <div class="menu-screen" id="mainMenu">
            <div class="logo">RESELL <span>RACING</span></div>

            <div class="menu-card">
                <div class="section-title">ВЫБОР АВТОМОБИЛЯ ИЗ ГАРАЖА</div>
                <div class="car-carousel" id="carSelector"></div>
            </div>

            <button class="btn btn-green" id="btnSingle" style="margin-bottom: 12px; height: 52px; font-size: 15px;">🚗 ОДИНОЧНАЯ ИГРА</button>

            <div class="menu-card">
                <div class="section-title">МУЛЬТИПЛЕЕР С ДРУГОМ</div>
                <div class="flex-row">
                    <button class="btn btn-blue" id="btnCreateRoom">СОЗДАТЬ КОМНАТУ</button>
                    <button class="btn btn-gold" id="btnJoinRoom">ВОЙТИ ПО КОДУ</button>
                </div>
            </div>
        </div>

        <!-- МОДАЛКА ВВОДА СТАВКИ -->
        <div class="modal-overlay" id="betModal">
            <div class="modal-box">
                <div class="modal-title" id="betModalTitle">Ставка на заезд</div>
                <div style="font-size:12px; color:#94a3b8; font-weight:800; margin-bottom:8px;">БАЛАНС: <span id="modalBalance" style="color:var(--accent-gold);">0</span> ₽</div>
                <input type="text" class="styled-input" id="modalBetInput" value="10 000">
                <div class="flex-row" style="margin-bottom: 12px;">
                    <button class="btn btn-gold" style="height:36px; font-size:12px;" data-amt="5000">5K</button>
                    <button class="btn btn-gold" style="height:36px; font-size:12px;" data-amt="10000">10K</button>
                    <button class="btn btn-gold" style="height:36px; font-size:12px;" data-amt="25000">25K</button>
                </div>
                <div class="flex-row">
                    <button class="btn btn-blue" id="modalBtnCancel">ОТМЕНА</button>
                    <button class="btn btn-green" id="modalBtnConfirm">СТАРТ</button>
                </div>
            </div>
        </div>

        <!-- МОДАЛКА ВВОДА КОДА КОМНАТЫ -->
        <div class="modal-overlay" id="roomModal">
            <div class="modal-box">
                <div class="modal-title">Вход в комнату</div>
                <input type="text" class="styled-input" id="modalRoomInput" placeholder="Введите код (6 цифр)" maxlength="6">
                <div class="flex-row">
                    <button class="btn btn-blue" id="roomBtnCancel">ОТМЕНА</button>
                    <button class="btn btn-green" id="roomBtnConfirm">ДАЛЕЕ</button>
                </div>
            </div>
        </div>

        <!-- КАНВАС ИГРЫ -->
        <canvas id="gameCanvas"></canvas>

        <!-- ОВЕРЛЕЙ УПРАВЛЕНИЯ -->
        <div class="controls hidden" id="controlsLayer">
            <div class="ctrl-group">
                <div class="pedal btn-shift" id="btnShiftDown">◄</div>
                <div class="pedal btn-shift" id="btnShiftUp">►</div>
                <div class="pedal nitro" id="btnNitro">N2O</div>
            </div>
            <div class="ctrl-group">
                <div class="pedal brake" id="btnBrake">▼</div>
                <div class="pedal gas" id="btnGas"><span style="font-size: 20px;">▲</span>ГАЗ</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const tg = window.Telegram?.WebApp;
            if (tg) { tg.expand(); tg.ready(); }

            const API_BASE = 'https://resellgame.bothost.tech';
            let userId = null;
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('userId')) userId = urlParams.get('userId');
            else if (tg?.initDataUnsafe?.user?.id) userId = tg.initDataUnsafe.user.id;

            // ==========================================================================
            // БАЗА 14 МАШИН ИЗ bot.py СО СВОИМИ МОДЕЛЯМИ
            // ==========================================================================
            const CARS_DB = [
                { id: "zhiguli", name: "ВАЗ-2106", speed_bonus: 10, price: 15000, color: '#e74c3c', type: 'box' },
                { id: "granta", name: "Лада Гранта", speed_bonus: 15, price: 35000, color: '#95a5a6', type: 'sedan' },
                { id: "w140", name: "Mercedes W140", speed_bonus: 28, price: 90000, color: '#1e293b', type: 'luxury' },
                { id: "mustang", name: "Ford Mustang", speed_bonus: 30, price: 120000, color: '#3b82f6', type: 'muscle' },
                { id: "cclass", name: "Mercedes C-Class", speed_bonus: 35, price: 160000, color: '#cbd5e1', type: 'sedan' },
                { id: "bmwm4", name: "BMW M4", speed_bonus: 45, price: 180000, color: '#f59e0b', type: 'sport' },
                { id: "challenger", name: "Dodge Challenger", speed_bonus: 55, price: 300000, color: '#8b5cf6', type: 'muscle' },
                { id: "ramtrx", name: "Dodge Ram TRX", speed_bonus: 60, price: 350000, color: '#0f172a', type: 'truck' },
                { id: "bmwm5", name: "BMW M5 F90", speed_bonus: 70, price: 450000, color: '#2563eb', type: 'sport' },
                { id: "sclass", name: "Mercedes S-Class", speed_bonus: 75, price: 650000, color: '#000000', type: 'luxury' },
                { id: "bmwx7", name: "BMW X7", speed_bonus: 70, price: 850000, color: '#ffffff', type: 'suv' },
                { id: "rollsroyce", name: "Rolls-Royce", speed_bonus: 95, price: 1800000, color: '#334155', type: 'luxury' },
                { id: "aventador", name: "Lamborghini", speed_bonus: 98, price: 5000000, color: '#10b981', type: 'supercar' },
                { id: "brabus", name: "Brabus Mansory", speed_bonus: 99, price: 20000000, color: '#111111', type: 'suv' }
            ];

            let selectedCar = CARS_DB[3]; 
            let casinoBalance = 0;
            let raceBet = 10000;
            let socket = null;
            let isMultiplayer = false;
            let pendingAction = null; // 'single', 'create', 'join'
            let targetRoomCode = null;

            // DOM
            const mainMenu = document.getElementById('mainMenu');
            const gameHud = document.getElementById('gameHud');
            const controlsLayer = document.getElementById('controlsLayer');
            const toastMsg = document.getElementById('toastMsg');
            const hudSpeed = document.getElementById('hudSpeed');
            const hudGear = document.getElementById('hudGear');
            const rpmFill = document.getElementById('rpmFill');

            // Модалки
            const betModal = document.getElementById('betModal');
            const roomModal = document.getElementById('roomModal');
            const modalBetInput = document.getElementById('modalBetInput');
            const modalBalance = document.getElementById('modalBalance');
            const modalRoomInput = document.getElementById('modalRoomInput');

            // Canvas
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            let cw = window.innerWidth; let ch = window.innerHeight;
            canvas.width = cw; canvas.height = ch;

            // Состояние гонки
            const TRACK_DIST = 10000;
            let gameActive = false;
            let lastTime = 0;
            let bgScrollX = 0;
            let screenShake = 0;
            let countdown = -1;
            let countdownTimer = 0;

            class PlayerState {
                constructor(carDef) {
                    this.car = carDef;
                    this.dist = 0; this.speed = 0; 
                    this.gear = 1; this.maxGear = 6;
                    this.rpm = 0; 
                    this.nitroAmount = 100;
                    this.isGas = false; this.isNitro = false; this.isBrake = false;
                    this.baseAccel = 45 + carDef.speed_bonus * 1.5;
                    this.topSpeed = 190 + carDef.speed_bonus * 2.2; 
                }
            }

            let player = new PlayerState(selectedCar);
            let enemy = new PlayerState(CARS_DB[1]);

            function showToast(msg) {
                toastMsg.textContent = msg; toastMsg.style.display = 'block';
                setTimeout(() => toastMsg.style.display = 'none', 3000);
            }

            function formatNumber(n) { return (n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
            function parseNumber(s) { return parseInt(s.toString().replace(/\s/g, '')) || 0; }

            async function loadBalance() {
                if (!userId) return;
                try {
                    const resp = await fetch(`${API_BASE}/profile/${encodeURIComponent(userId)}`);
                    const data = await resp.json();
                    casinoBalance = Number(data.casino_balance ?? data.balance ?? 0);
                } catch(e) {}
            }

            function sendGameResult(result, bet, win) {
                if (!userId) return Promise.reject();
                return fetch(`${API_BASE}/game_result`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, game: 'racing', result: result, bet: bet, win: win })
                }).then(r => r.json());
            }

            // ==========================================================================
            // ОТРИСОВКА МАШИН (14 МОДЕЛЕЙ)
            // ==========================================================================
            function drawCar2D(x, y, pState, isPlayer) {
                ctx.save(); ctx.translate(x, y);

                if (isPlayer && screenShake > 0) ctx.translate(0, (Math.random()-0.5)*screenShake);

                let color = pState.car.color; let type = pState.car.type;

                // Тень
                ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.ellipse(0, 16, 60, 7, 0, 0, Math.PI*2); ctx.fill();

                // Нитро факел
                if (isPlayer && pState.isNitro && pState.nitroAmount > 0 && countdown >= 4) {
                    ctx.fillStyle = '#3b82f6'; ctx.beginPath(); ctx.moveTo(-52, 4); ctx.lineTo(-85-Math.random()*25, 7); ctx.lineTo(-52, 10); ctx.fill();
                    ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.moveTo(-52, 5); ctx.lineTo(-70-Math.random()*15, 7); ctx.lineTo(-52, 9); ctx.fill();
                }

                ctx.fillStyle = color;
                if (type === 'suv' || type === 'luxury' && pState.car.id === 'brabus') {
                    ctx.fillRect(-52, -20, 104, 30);
                    ctx.fillStyle = '#0f172a'; ctx.fillRect(-28, -18, 56, 14); 
                } else if (type === 'supercar') {
                    ctx.beginPath(); ctx.moveTo(-50, 8); ctx.lineTo(-45, -4); ctx.lineTo(-10, -14); ctx.lineTo(25, -12); ctx.lineTo(55, 2); ctx.lineTo(55, 8); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.moveTo(-10, -12); ctx.lineTo(20, -10); ctx.lineTo(35, 0); ctx.lineTo(-5, 0); ctx.fill();
                } else if (type === 'muscle') {
                    ctx.beginPath(); ctx.moveTo(-52, 8); ctx.lineTo(-50, -2); ctx.lineTo(-20, -6); ctx.lineTo(-10, -16); ctx.lineTo(20, -16); ctx.lineTo(40, -4); ctx.lineTo(56, 0); ctx.lineTo(56, 8); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.moveTo(-8, -14); ctx.lineTo(18, -14); ctx.lineTo(32, -4); ctx.lineTo(-5, -4); ctx.fill();
                } else {
                    ctx.beginPath(); ctx.moveTo(-50, 8); ctx.lineTo(-48, -2); ctx.lineTo(-28, -4); ctx.lineTo(-12, -16); ctx.lineTo(15, -16); ctx.lineTo(32, -4); ctx.lineTo(50, 0); ctx.lineTo(50, 8); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.moveTo(-10, -14); ctx.lineTo(12, -14); ctx.lineTo(25, -4); ctx.lineTo(-6, -4); ctx.fill();
                }

                // Колеса
                let wheelRot = (pState.dist * 0.15) % (Math.PI * 2);
                [-32, 32].forEach(wx => {
                    ctx.save(); ctx.translate(wx, 8); ctx.rotate(wheelRot);
                    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill();
                    ctx.restore();
                });

                ctx.restore();
            }

            function drawScene() {
                // Небо
                let grad = ctx.createLinearGradient(0, 0, 0, ch * 0.6);
                grad.addColorStop(0, '#1e3a8a'); grad.addColorStop(0.5, '#ea580c'); grad.addColorStop(1, '#fde047');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, cw, ch);

                // Горы (Параллакс)
                ctx.fillStyle = '#7c2d12'; ctx.beginPath();
                let m1X = -(bgScrollX * 0.15) % cw;
                ctx.moveTo(m1X-cw, ch*0.6); ctx.lineTo(m1X-cw*0.5, ch*0.3); ctx.lineTo(m1X, ch*0.6);
                ctx.lineTo(m1X+cw*0.5, ch*0.35); ctx.lineTo(m1X+cw, ch*0.6); ctx.lineTo(cw*2, ch*0.6); ctx.fill();

                // Дорога
                let roadY = ch * 0.6; let roadH = ch * 0.4;
                ctx.fillStyle = '#d97706'; ctx.fillRect(0, roadY, cw, 20); // Обочина
                
                let ashY = roadY + 20; let ashH = roadH - 20;
                ctx.fillStyle = '#334155'; ctx.fillRect(0, ashY, cw, ashH); // Асфальт

                // Отбойник
                ctx.fillStyle = '#cbd5e1'; ctx.fillRect(0, ashY - 6, cw, 6);
                ctx.fillStyle = '#94a3b8';
                let pX = -(bgScrollX * 1.5) % 100;
                for(let i = -100; i < cw + 100; i+= 100) ctx.fillRect(pX+i, ashY - 10, 6, 10);

                // Разметка
                ctx.fillStyle = '#ffffff';
                let lX = -(bgScrollX * 1.5) % 80;
                for(let i = -80; i < cw + 80; i+= 80) {
                    ctx.fillRect(lX+i, ashY + ashH/2 - 3, 35, 6);
                }

                if (player.dist < 800) drawCheckers(150 - player.dist, ashY, ashH);
                if (player.dist > TRACK_DIST - cw - 200) drawCheckers(150 + (TRACK_DIST - player.dist), ashY, ashH);
            }

            function drawCheckers(x, y, h) {
                if(x < -50 || x > cw+50) return;
                let sq = 10;
                for(let i=0; i < h/sq; i++) {
                    ctx.fillStyle = (i%2===0) ? '#fff' : '#000'; ctx.fillRect(x, y+i*sq, sq, sq);
                    ctx.fillStyle = (i%2===0) ? '#000' : '#fff'; ctx.fillRect(x+sq, y+i*sq, sq, sq);
                }
            }

            function drawTrafficLight() {
                if (countdown < 0 || countdown >= 4) return;
                let lx = cw/2 - 35; let ly = 20;
                ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.roundRect(lx, ly, 70, 150, 10); ctx.fill();
                ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 3; ctx.stroke();

                let cols = ['#ef4444', '#ef4444', '#f59e0b', '#10b981'];
                for(let i=0; i<4; i++) {
                    ctx.fillStyle = (countdown === i) ? cols[i] : '#334155';
                    ctx.beginPath(); ctx.arc(cw/2, ly + 25 + i*35, 11, 0, Math.PI*2); ctx.fill();
                }
            }

            // ==========================================================================
            // ИГРОВОЙ ЦИКЛ
            // ==========================================================================
            function render() {
                ctx.clearRect(0, 0, cw, ch);
                drawScene();

                let roadY = ch * 0.6 + 20;
                let laneH = (ch * 0.4 - 20) / 2;

                // Соперник (Верх)
                let enemyX = 150 + (enemy.dist - player.dist) * 1.2;
                ctx.save(); ctx.translate(enemyX, roadY + laneH/2 - 5); ctx.scale(0.85, 0.85);
                drawCar2D(0, 0, enemy, false);
                ctx.restore();

                // Игрок (Низ)
                ctx.save(); ctx.translate(150, roadY + laneH + laneH/2 - 5);
                drawCar2D(0, 0, player, true);
                ctx.restore();

                drawTrafficLight();
            }

            function update(dt) {
                if (!gameActive) return;

                if (countdown < 4) {
                    countdownTimer += dt;
                    if (countdownTimer >= 1.0) {
                        countdown++; countdownTimer = 0;
                        if (countdown === 4) showToast("🚀 СТАРТ!");
                    }
                    return;
                }

                // Физика Игрока
                let pBaseSpeed = 160 + player.car.speed_bonus * 2.2;
                let pAccel = 50 + player.car.speed_bonus * 1.4;

                if (player.isGas) {
                    player.rpm += dt * 1.6;
                    if (player.isNitro && player.nitroAmount > 0) {
                        player.rpm += dt * 2.0; pBaseSpeed += 180;
                        player.nitroAmount -= 35 * dt; screenShake = 6;
                    }
                    player.speed += pAccel * dt;
                } else {
                    player.rpm -= dt * 0.6;
                    player.speed -= 80 * dt;
                }

                if (player.rpm > 1.0) player.rpm = 1.0;
                if (player.rpm < 0.0) player.rpm = 0.0;

                let maxSpdForGear = (player.topSpeed / player.maxGear) * player.gear;
                if (player.speed > maxSpdForGear) player.speed = maxSpdForGear;
                
                player.dist += (player.speed * 0.35) * dt;
                bgScrollX = player.dist; // Движение фона завязано напрямую на пройденную дистанцию

                // ИИ Оппонента
                if (!isMultiplayer) {
                    let eMaxS = (enemy.topSpeed / enemy.maxGear) * enemy.gear;
                    enemy.rpm += dt * 1.5;
                    if(enemy.rpm >= 0.95 && enemy.gear < enemy.maxGear) { enemy.gear++; enemy.rpm = 0.4; }
                    if (enemy.speed < eMaxS) enemy.speed += enemy.baseAccel * enemy.rpm * dt;
                    enemy.dist += (enemy.speed * 0.35) * dt;
                }

                hudSpeed.textContent = Math.round(player.speed);
                hudGear.textContent = `GEAR ${player.gear}`;
                rpmFill.style.width = `${player.rpm * 100}%`;

                if (player.dist >= TRACK_DIST || enemy.dist >= TRACK_DIST) {
                    gameActive = false;
                    let isWin = player.dist >= enemy.dist;
                    if (isMultiplayer && socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({ type: 'finish', senderId: userId }));
                    } else {
                        finishRace(isWin);
                    }
                }

                if (isMultiplayer && socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: 'move', senderId: userId, dist: player.dist }));
                }
            }

            function gameLoop(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = (timestamp - lastTime) / 1000;
                lastTime = timestamp;
                update(dt);
                render();
                if (gameActive) requestAnimationFrame(gameLoop);
            }

            // ==========================================================================
            // МЕНЮ И МОДАЛЬНЫЕ ОКНА
            // ==========================================================================
            async function finishRace(isWin) {
                let winAmt = isWin ? Math.floor(raceBet * 1.85) : 0;
                try {
                    const res = await sendGameResult(isWin ? 'win' : 'lose', raceBet, winAmt);
                } catch(e) {}
                alert(isWin ? `🏆 ФИНИШ! ВЫИГРЫШ: ${formatNumber(winAmt)} ₽` : `❌ ПРОИГРЫШ! СОПЕРНИК ВПЕРЕДИ.`);
                location.reload();
            }

            function initCarSelectorUI() {
                const selector = document.getElementById('carSelector');
                selector.innerHTML = '';
                CARS_DB.forEach(car => {
                    const card = document.createElement('div');
                    card.className = `car-card ${car.id === selectedCar.id ? 'active' : ''}`;
                    
                    const cv = document.createElement('canvas'); cv.className = 'car-preview';
                    cv.width = 90; cv.height = 40; const cctx = cv.getContext('2d');
                    cctx.translate(45, 20); cctx.scale(0.45, 0.45);
                    
                    // Временный объект для превью
                    drawCar2D(0, 0, {car: car, dist: 0}, false);

                    card.appendChild(cv);
                    card.innerHTML += `<div class="c-name">${car.name}</div><div class="c-stats">⚡ +${car.speed_bonus}%</div>`;
                    
                    card.onclick = () => {
                        document.querySelectorAll('.car-card').forEach(el => el.classList.remove('active'));
                        card.classList.add('active');
                        selectedCar = car;
                        player.car = car;
                    };
                    selector.appendChild(card);
                });
            }

            function startDragRace() {
                mainMenu.classList.add('hidden');
                gameHud.classList.remove('hidden');
                controlsLayer.classList.remove('hidden');
                player = new PlayerState(selectedCar);
                enemy = new PlayerState(isMultiplayer ? CARS_DB[0] : CARS_DB[Math.floor(Math.random() * CARS_DB.length)]);
                countdown = 0; countdownTimer = 0; bgScrollX = 0;
                gameActive = true; lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }

            function connectWebSocket(code) {
                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                socket = new WebSocket(`${wsProtocol}//resellgame.bothost.tech/ws/race/${code}?userId=${userId}`);
                socket.onopen = () => {
                    showToast(`Ожидание в комнате ${code}...`);
                    document.getElementById('hudRoom').textContent = code;
                    socket.send(JSON.stringify({ type: 'join', senderId: userId, carId: selectedCar.id }));
                    setTimeout(() => startDragRace(), 2000);
                };
                socket.onmessage = (e) => {
                    try {
                        const data = JSON.parse(e.data);
                        if (data.type === 'join' && data.senderId !== userId) {
                            let eCar = CARS_DB.find(c => c.id === data.carId);
                            if (eCar) enemy.car = eCar;
                        }
                        if (data.type === 'move' && data.senderId !== userId) enemy.dist = data.dist;
                        if (data.type === 'game_over') { gameActive = false; finishRace(data.winnerId === userId); }
                    } catch(err) {}
                };
                socket.onerror = () => { showToast("Сбой сети. Одиночный режим."); startDragRace(); };
            }

            // Логика модалки ставки
            function openBetModal(action) {
                pendingAction = action;
                modalBalance.textContent = formatNumber(casinoBalance);
                betModal.classList.add('active');
            }

            document.getElementById('btnSingle').onclick = () => openBetModal('single');
            document.getElementById('btnCreateRoom').onclick = () => openBetModal('create');
            document.getElementById('btnJoinRoom').onclick = () => {
                roomModal.classList.add('active');
            };

            document.getElementById('modalBtnCancel').onclick = () => betModal.classList.remove('active');
            document.getElementById('roomBtnCancel').onclick = () => roomModal.classList.remove('active');

            document.getElementById('roomBtnConfirm').onclick = () => {
                let code = modalRoomInput.value.trim();
                if (!code) { showToast('Введите код комнаты!'); return; }
                targetRoomCode = code;
                roomModal.classList.remove('active');
                openBetModal('join');
            };

            document.getElementById('modalBtnConfirm').onclick = async () => {
                raceBet = parseNumber(modalBetInput.value);
                if (raceBet < 100) { showToast('Мин. ставка 100 ₽'); return; }
                if (raceBet > casinoBalance) { showToast('Недостаточно средств!'); return; }

                betModal.classList.remove('active');

                if (pendingAction === 'single') {
                    isMultiplayer = false;
                    document.getElementById('hudRoom').textContent = "СИНГЛ";
                    startDragRace();
                } else if (pendingAction === 'create') {
                    isMultiplayer = true;
                    let code = Math.floor(1000 + Math.random() * 9000).toString();
                    connectWebSocket(code);
                } else if (pendingAction === 'join') {
                    isMultiplayer = true;
                    connectWebSocket(targetRoomCode);
                }
            };

            // Управление КПП и газом
            function shiftGearUp() { if (player.gear < player.maxGear) { player.gear++; player.rpm *= 0.5; } }
            function shiftGearDown() { if (player.gear > 1) { player.gear--; player.rpm = Math.min(1.0, player.rpm * 1.3); } }

            const bindBtn = (id, onStart, onEnd) => {
                const el = document.getElementById(id);
                if(!el) return;
                const press = (e) => { e.preventDefault(); onStart(); el.classList.add('active'); };
                const release = (e) => { e.preventDefault(); if(onEnd) onEnd(); el.classList.remove('active'); };
                el.addEventListener('touchstart', press); el.addEventListener('mousedown', press);
                el.addEventListener('touchend', release); el.addEventListener('mouseup', release);
                el.addEventListener('mouseleave', release);
            };

            bindBtn('btnGas', () => player.isGas = true, () => player.isGas = false);
            bindBtn('btnBrake', () => player.isBrake = true, () => player.isBrake = false);
            bindBtn('btnNitro', () => player.isNitro = true, () => player.isNitro = false);
            bindBtn('btnShiftUp', () => shiftGearUp());
            bindBtn('btnShiftDown', () => shiftGearDown());

            document.querySelectorAll('[data-amt]').forEach(b => b.onclick = () => modalBetInput.value = formatNumber(parseInt(b.dataset.amt)));
            modalBetInput.addEventListener('input', function() { this.value = formatNumber(parseNumber(this.value)); });

            window.addEventListener('resize', () => { cw = window.innerWidth; ch = window.innerHeight; canvas.width = cw; canvas.height = ch; if(!gameActive) render(); });

            initCarSelectorUI();
            loadBalance();
            render();

        })();
    </script>
</body>
</html>
