<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>R-RACE | STREET DRAG 2D</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,900&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           1. СТИЛИ ИНТЕРФЕЙСА (СОВРЕМЕННЫЙ DRAG RACING)
           ========================================================================== */
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(15, 23, 42, 0.95);
            --border-color: rgba(255, 255, 255, 0.15);
            --accent-gold: #fbbf24;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background: #000;
            font-family: 'Nunito', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-wrapper {
            max-width: 800px;
            width: 100%;
            height: 100vh;
            max-height: 900px;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* ===== МЕНЮ ГАРАЖА ===== */
        .menu-screen {
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(2, 6, 23, 0.98) 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 20px; z-index: 100; overflow-y: auto;
        }

        .logo {
            font-family: 'Montserrat', sans-serif; font-size: 34px; font-weight: 900; font-style: italic;
            text-transform: uppercase; color: #fff; text-shadow: 0 4px 15px rgba(59, 130, 246, 0.5);
            margin-bottom: 12px; margin-top: 10px; letter-spacing: -1px;
        }
        .logo span { color: var(--accent-gold); }

        .menu-card {
            width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 16px; margin-bottom: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .section-title { font-size: 11px; font-weight: 900; color: #94a3b8; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }

        /* Карусель машин */
        .car-carousel {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x mandatory;
        }
        .car-carousel::-webkit-scrollbar { height: 6px; }
        .car-carousel::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 4px; }
        
        .car-card {
            min-width: 150px; background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: all 0.2s;
            scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px;
        }
        .car-card.active { background: rgba(245, 158, 11, 0.15); border-color: var(--accent-gold); transform: scale(1.02); }
        .car-card .c-name { font-size: 13px; font-weight: 900; }
        .car-card .c-stats { font-size: 10px; color: var(--accent-green); font-weight: 800; background: rgba(16,185,129,0.15); padding: 2px 6px; border-radius: 6px; }
        .car-card .c-price { font-size: 11px; font-weight: 800; color: #94a3b8; }

        /* Превью машины (Канвас внутри карточки) */
        .car-preview { width: 120px; height: 50px; }

        input.styled-input {
            width: 100%; height: 46px; background: rgba(0,0,0,0.6); border: 2px solid var(--border-color);
            border-radius: 12px; color: #fff; font-family: 'Montserrat', sans-serif; font-weight: 900;
            font-size: 16px; text-align: center; outline: none; margin-bottom: 10px; transition: 0.2s;
        }
        input.styled-input:focus { border-color: var(--accent-blue); }

        .btn {
            width: 100%; height: 48px; border: none; border-radius: 12px;
            font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 14px;
            color: #fff; cursor: pointer; text-transform: uppercase; transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); box-shadow: 0 4px 15px rgba(59,130,246,0.3); }
        .btn-green { background: linear-gradient(135deg, #10b981, #047857); box-shadow: 0 4px 15px rgba(16,185,129,0.3); }
        .btn-gold { background: linear-gradient(135deg, #f59e0b, #b45309); box-shadow: 0 4px 15px rgba(245,158,11,0.3); }
        
        .flex-row { display: flex; gap: 8px; }
        .flex-row .btn { flex: 1; }

        /* ===== HUD ИГРЫ ===== */
        .hud {
            position: absolute; top: 16px; left: 16px; right: 16px;
            display: flex; justify-content: space-between; z-index: 50; pointer-events: none;
        }
        .hud-badge {
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border: 1px solid var(--border-color);
            padding: 8px 14px; border-radius: 12px; font-size: 13px; font-weight: 800; color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .hud-badge span { color: var(--accent-gold); font-family: 'Montserrat', sans-serif; font-weight: 900; }

        /* ===== ПЕДАЛИ ===== */
        .controls {
            position: absolute; bottom: 30px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: flex-end; z-index: 50;
        }
        .pedal {
            width: 100px; height: 100px; border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 16px; color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); cursor: pointer; transition: transform 0.05s;
            border: 3px solid rgba(255,255,255,0.2); backdrop-filter: blur(4px);
        }
        .pedal.nitro { background: linear-gradient(180deg, rgba(59,130,246,0.8), rgba(29,78,216,0.9)); width: 85px; height: 85px; border-radius: 50%; }
        .pedal.nitro:active, .pedal.nitro.active { transform: scale(0.9); background: #3b82f6; border-color: #fff; box-shadow: 0 0 25px #3b82f6; }
        .pedal.gas { background: linear-gradient(180deg, rgba(16,185,129,0.8), rgba(4,120,87,0.9)); height: 120px; }
        .pedal.gas:active, .pedal.gas.active { transform: scale(0.95); background: #10b981; border-color: #fff; box-shadow: 0 0 25px #10b981; }

        canvas#gameCanvas { width: 100%; height: 100%; display: block; }
        .hidden { display: none !important; }
        
        .toast {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95); border: 2px solid var(--accent-gold); color: #fff;
            padding: 12px 24px; font-weight: 900; border-radius: 12px; z-index: 100;
            display: none; white-space: nowrap; text-transform: uppercase; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div class="game-wrapper" id="appContainer">
        <div class="toast" id="toastMsg">Уведомление</div>

        <!-- ИГРОВОЙ ХУД -->
        <div class="hud hidden" id="gameHud">
            <div class="hud-badge">🏁 <span id="hudRoom">СИНГЛ</span></div>
            <div class="hud-badge">⚡ <span id="hudSpeed">0 KM/H</span></div>
        </div>

        <!-- ГЛАВНОЕ МЕНЮ (ГАРАЖ) -->
        <div class="menu-screen" id="mainMenu">
            <div class="logo">STREET <span>DRAG</span></div>

            <div class="menu-card">
                <div class="section-title">АВТОМОБИЛИ (ИЗ ГАРАЖА)</div>
                <div class="car-carousel" id="carSelector">
                    <!-- Заполняется JS (Только 14 уникальных авто) -->
                </div>
            </div>

            <div class="menu-card">
                <div class="section-title">Ставка (Баланс: <span id="balanceDisplay">0</span>₽)</div>
                <input type="text" class="styled-input" id="betInput" value="10 000">
                <div class="flex-row">
                    <button class="btn btn-gold" data-amt="5000">5K</button>
                    <button class="btn btn-gold" data-amt="10000">10K</button>
                    <button class="btn btn-gold" data-amt="25000">25K</button>
                </div>
            </div>

            <button class="btn btn-green" id="btnSingle" style="margin-bottom: 12px; height: 54px;">🚗 ТЕСТОВЫЙ ЗАЕЗД (ИИ)</button>

            <div class="menu-card">
                <div class="section-title">Мультиплеер (с другом)</div>
                <input type="text" class="styled-input" id="roomCodeInput" placeholder="ВВЕДИ КОД КОМНАТЫ" maxlength="6">
                <div class="flex-row">
                    <button class="btn btn-blue" id="btnCreateRoom">СОЗДАТЬ</button>
                    <button class="btn btn-gold" id="btnJoinRoom">ВОЙТИ</button>
                </div>
            </div>
        </div>

        <!-- КАНВАС ИГРЫ -->
        <canvas id="gameCanvas"></canvas>

        <!-- ПЕДАЛИ -->
        <div class="controls hidden" id="controlsLayer">
            <div class="pedal nitro" id="btnNitro">N2O</div>
            <div class="pedal gas" id="btnGas">
                <span style="font-size:24px;">▲</span>
                <span>ГАЗ</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const tg = window.Telegram?.WebApp;
            if (tg) { tg.expand(); tg.ready(); }

            const API_BASE = 'https://resellgame.bothost.tech';
            let userId = null;
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('userId')) userId = urlParams.get('userId');
            else if (tg?.initDataUnsafe?.user?.id) userId = tg.initDataUnsafe.user.id;

            // ==========================================================================
            // БАЗА МАШИН С 14 УНИКАЛЬНЫМИ 2D МОДЕЛЯМИ
            // ==========================================================================
            // Для каждой машины заданы специфичные функции отрисовки и позиции колес.
            const CARS_DB = [
                { id: "zhiguli", name: "ВАЗ-2106 Жигули", speed_bonus: 10, price: 15000, color: '#e74c3c', draw: drawZhiguli, w: [-30, 28] },
                { id: "granta", name: "Лада Гранта", speed_bonus: 15, price: 35000, color: '#95a5a6', draw: drawGranta, w: [-32, 32] },
                { id: "mustang", name: "Ford Mustang", speed_bonus: 30, price: 120000, color: '#3b82f6', draw: drawMustang, w: [-35, 38] },
                { id: "w140", name: "Mercedes W140", speed_bonus: 28, price: 90000, color: '#1e293b', draw: drawW140, w: [-38, 38] },
                { id: "cclass", name: "Mercedes C-Class", speed_bonus: 35, price: 160000, color: '#cbd5e1', draw: drawCClass, w: [-35, 35] },
                { id: "bmwm4", name: "BMW M4", speed_bonus: 45, price: 180000, color: '#f59e0b', draw: drawM4, w: [-36, 36] },
                { id: "challenger", name: "Dodge Challenger", speed_bonus: 55, price: 300000, color: '#8b5cf6', draw: drawChallenger, w: [-38, 38] },
                { id: "ramtrx", name: "Dodge Ram TRX", speed_bonus: 60, price: 350000, color: '#0f172a', draw: drawRamTRX, w: [-40, 42], yOffset: -5, wSize: 14 },
                { id: "bmwm5", name: "BMW M5 F90", speed_bonus: 70, price: 450000, color: '#2563eb', draw: drawM5, w: [-36, 36] },
                { id: "sclass", name: "Mercedes S-Class", speed_bonus: 75, price: 650000, color: '#000000', draw: drawSClass, w: [-40, 40] },
                { id: "bmwx7", name: "BMW X7", speed_bonus: 70, price: 850000, color: '#ffffff', draw: drawX7, w: [-40, 40], yOffset: -3, wSize: 13 },
                { id: "rollsroyce", name: "Rolls-Royce Phantom", speed_bonus: 95, price: 1800000, color: '#334155', draw: drawRollsRoyce, w: [-45, 45], wSize: 13 },
                { id: "aventador", name: "Lamborghini Aventador", speed_bonus: 98, price: 5000000, color: '#10b981', draw: drawAventador, w: [-35, 38], yOffset: 5, wSize: 11 },
                { id: "brabus", name: "Brabus Mansory", speed_bonus: 99, price: 20000000, color: '#111111', draw: drawBrabus, w: [-38, 38], yOffset: -6, wSize: 15 }
            ];

            let selectedCar = CARS_DB[3]; // W140 или Mustang по умолчанию
            let casinoBalance = 0;
            let raceBet = 10000;
            let socket = null;
            let isMultiplayer = false;

            // DOM
            const mainMenu = document.getElementById('mainMenu');
            const gameHud = document.getElementById('gameHud');
            const controlsLayer = document.getElementById('controlsLayer');
            const toastMsg = document.getElementById('toastMsg');
            const balanceDisplay = document.getElementById('balanceDisplay');
            const hudSpeed = document.getElementById('hudSpeed');
            const hudRoom = document.getElementById('hudRoom');

            // Canvas
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            let cw = window.innerWidth;
            let ch = window.innerHeight;
            canvas.width = cw;
            canvas.height = ch;

            // Логика игры
            const TRACK_DIST = 10000;
            let gameActive = false;
            let lastTime = 0;
            let bgScrollX = 0;
            let screenShake = 0;
            let countdown = -1; // -1 меню, 0-3 светофор, 4 старт
            let countdownTimer = 0;

            let player = { dist: 0, speed: 0, maxSpeed: 280, accel: 50, nitro: 100, isGas: false, isNitro: false, car: selectedCar };
            let enemy = { dist: 0, speed: 0, maxSpeed: 270, accel: 45, car: CARS_DB[1] };

            function showToast(msg) {
                toastMsg.textContent = msg;
                toastMsg.style.display = 'block';
                setTimeout(() => toastMsg.style.display = 'none', 3500);
            }

            function formatNumber(n) { return (n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
            function parseNumber(s) { return parseInt(s.toString().replace(/\s/g, '')) || 0; }

            async function loadBalance() {
                if (!userId) return;
                try {
                    const resp = await fetch(`${API_BASE}/profile/${encodeURIComponent(userId)}`);
                    const data = await resp.json();
                    casinoBalance = Number(data.casino_balance ?? data.balance ?? 0);
                    balanceDisplay.textContent = formatNumber(casinoBalance);
                } catch(e) {}
            }

            function sendGameResult(result, bet, win) {
                if (!userId) return Promise.reject();
                return fetch(`${API_BASE}/game_result`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, game: 'racing', result: result, bet: bet, win: win })
                }).then(r => r.json());
            }

            // ==========================================================================
            // ПРОРИСОВКА АВТОМОБИЛЕЙ (14 УНИКАЛЬНЫХ МОДЕЛЕЙ)
            // ==========================================================================
            // Общая функция окна
            function drawPoly(ctx, points, color) {
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.moveTo(points[0][0], points[0][1]);
                for(let i=1; i<points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
                ctx.closePath();
                ctx.fill();
            }

            function drawZhiguli(ctx, color) {
                drawPoly(ctx, [[-45, 8], [-45, -2], [-28, -4], [-15, -16], [10, -16], [28, -4], [48, -2], [48, 8]], color);
                drawPoly(ctx, [[-12, -14], [8, -14], [22, -4], [-24, -4]], '#0f172a'); // Стекла
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(46, 2, 2, 0, Math.PI*2); ctx.arc(46, -2, 2, 0, Math.PI*2); ctx.fill(); // Круглые фары
            }
            function drawGranta(ctx, color) {
                drawPoly(ctx, [[-48, 8], [-48, -2], [-30, -5], [-12, -18], [15, -18], [32, -6], [50, -2], [50, 8]], color);
                drawPoly(ctx, [[-10, -16], [12, -16], [26, -6], [-24, -6]], '#0f172a');
            }
            function drawMustang(ctx, color) {
                drawPoly(ctx, [[-50, 8], [-50, -2], [-25, -6], [-10, -16], [18, -16], [38, -6], [55, -2], [55, 8]], color);
                drawPoly(ctx, [[-8, -14], [15, -14], [30, -6], [-20, -6]], '#0f172a');
                ctx.fillStyle = '#111'; ctx.fillRect(52, -2, 4, 8); // Решетка
            }
            function drawW140(ctx, color) {
                drawPoly(ctx, [[-55, 8], [-55, -4], [-35, -4], [-15, -18], [15, -18], [35, -4], [55, -4], [55, 8]], color);
                drawPoly(ctx, [[-12, -16], [12, -16], [28, -4], [-30, -4]], '#0f172a');
            }
            function drawCClass(ctx, color) {
                drawPoly(ctx, [[-50, 8], [-50, -2], [-28, -5], [-12, -18], [16, -18], [35, -6], [52, -2], [52, 8]], color);
                drawPoly(ctx, [[-10, -16], [14, -16], [28, -6], [-22, -6]], '#0f172a');
            }
            function drawM4(ctx, color) {
                drawPoly(ctx, [[-52, 8], [-52, -2], [-25, -6], [-8, -18], [18, -18], [38, -6], [55, -2], [55, 8]], color);
                drawPoly(ctx, [[-5, -16], [15, -16], [30, -6], [-20, -6]], '#0f172a');
                ctx.fillStyle = '#000'; ctx.fillRect(-52, -6, 4, 2); // Спойлер
            }
            function drawChallenger(ctx, color) {
                drawPoly(ctx, [[-52, 8], [-52, -4], [-25, -4], [-10, -14], [20, -14], [35, -4], [55, -4], [55, 8]], color);
                drawPoly(ctx, [[-8, -12], [18, -12], [30, -4], [-20, -4]], '#0f172a');
            }
            function drawRamTRX(ctx, color) {
                drawPoly(ctx, [[-60, 8], [-60, -6], [-20, -6], [-15, -24], [20, -24], [30, -6], [60, -6], [60, 8]], color);
                drawPoly(ctx, [[-12, -22], [18, -22], [26, -6], [-18, -6]], '#0f172a');
                ctx.fillStyle = '#1e293b'; ctx.fillRect(-60, -16, 40, 10); // Кузов
            }
            function drawM5(ctx, color) {
                drawPoly(ctx, [[-52, 8], [-52, -2], [-30, -4], [-12, -18], [18, -18], [36, -6], [55, -2], [55, 8]], color);
                drawPoly(ctx, [[-10, -16], [15, -16], [30, -6], [-24, -6]], '#0f172a');
            }
            function drawSClass(ctx, color) {
                drawPoly(ctx, [[-58, 8], [-58, -4], [-35, -5], [-15, -18], [20, -18], [40, -5], [58, -4], [58, 8]], color);
                drawPoly(ctx, [[-12, -16], [18, -16], [32, -5], [-28, -5]], '#0f172a');
            }
            function drawX7(ctx, color) {
                drawPoly(ctx, [[-55, 8], [-55, -20], [25, -20], [35, -6], [55, -4], [55, 8]], color);
                drawPoly(ctx, [[-52, -18], [22, -18], [30, -6], [-52, -6]], '#0f172a');
            }
            function drawRollsRoyce(ctx, color) {
                drawPoly(ctx, [[-60, 8], [-60, -4], [-35, -4], [-20, -18], [15, -18], [40, -4], [60, -4], [60, 8]], color);
                drawPoly(ctx, [[-16, -16], [12, -16], [32, -4], [-30, -4]], '#0f172a');
                ctx.fillStyle = '#fff'; ctx.fillRect(58, -8, 2, 8); // Решетка
            }
            function drawAventador(ctx, color) {
                drawPoly(ctx, [[-50, 8], [-45, -4], [-25, -10], [-5, -20], [20, -18], [45, -6], [55, 2], [55, 8]], color);
                drawPoly(ctx, [[-5, -18], [15, -16], [35, -6], [-20, -10]], '#0f172a');
                ctx.fillStyle = '#000'; drawPoly(ctx, [[-20, 2], [-10, -4], [-5, 2]], '#111'); // Воздухозаборник
            }
            function drawBrabus(ctx, color) {
                drawPoly(ctx, [[-50, 8], [-50, -22], [20, -22], [35, -6], [50, -4], [50, 8]], color);
                drawPoly(ctx, [[-45, -20], [18, -20], [28, -6], [-45, -6]], '#0f172a');
                ctx.fillStyle = '#111'; ctx.fillRect(-54, -10, 4, 14); // Запаска
            }

            // Мастер отрисовки машины
            function drawCarMaster(x, y, carConfig, isPlayer) {
                ctx.save();
                ctx.translate(x, y);
                
                let yOff = carConfig.car.yOffset || 0;
                ctx.translate(0, yOff);

                // Тряска от скорости
                if (gameActive && countdown >= 4 && carConfig.speed > 20) {
                    ctx.translate(0, Math.sin(Date.now() / 30) * 1.0);
                }

                // Тень
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.beginPath(); ctx.ellipse(0, 15, 60, 6, 0, 0, Math.PI*2); ctx.fill();

                // Огонь (Нитро)
                if (isPlayer && player.isNitro && player.nitroAmount > 0 && countdown >= 4) {
                    ctx.fillStyle = '#3b82f6';
                    ctx.beginPath(); ctx.moveTo(-50, 2); ctx.lineTo(-80 - Math.random()*30, 4); ctx.lineTo(-50, 8); ctx.fill();
                    ctx.fillStyle = '#fef08a';
                    ctx.beginPath(); ctx.moveTo(-50, 4); ctx.lineTo(-70 - Math.random()*15, 5); ctx.lineTo(-50, 6); ctx.fill();
                }

                // Рисуем саму модель
                if(carConfig.car.draw) {
                    carConfig.car.draw(ctx, carConfig.car.color);
                } else {
                    drawMustang(ctx, carConfig.car.color); // Фолбэк
                }

                // Колеса
                let wheelRot = (carConfig.dist * 0.15) % (Math.PI * 2);
                let wSize = carConfig.car.wSize || 11;
                let wPos = carConfig.car.w || [-35, 35];

                wPos.forEach(wx => {
                    ctx.save(); ctx.translate(wx, 8); ctx.rotate(wheelRot);
                    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0, 0, wSize, 0, Math.PI*2); ctx.fill(); // Шина
                    ctx.fillStyle = '#cbd5e1'; ctx.beginPath(); ctx.arc(0, 0, wSize*0.6, 0, Math.PI*2); ctx.fill(); // Диск
                    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(-wSize*0.6, 0); ctx.lineTo(wSize*0.6, 0); ctx.moveTo(0, -wSize*0.6); ctx.lineTo(0, wSize*0.6); ctx.stroke();
                    ctx.restore();
                });

                ctx.restore();
            }

            // ==========================================================================
            // ФОН И СВЕТОФОР
            // ==========================================================================
            function drawScene() {
                // Небо и градиент
                let grad = ctx.createLinearGradient(0, 0, 0, ch * 0.6);
                grad.addColorStop(0, '#0f172a');
                grad.addColorStop(1, '#f59e0b');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, cw, ch);

                // Горы (Параллакс)
                ctx.fillStyle = '#78350f';
                ctx.beginPath();
                let m1 = -(bgScrollX * 0.1) % cw;
                ctx.moveTo(m1 - cw, ch * 0.6); ctx.lineTo(m1 - cw*0.5, ch * 0.3); ctx.lineTo(m1, ch * 0.6);
                ctx.lineTo(m1 + cw*0.5, ch * 0.35); ctx.lineTo(m1 + cw, ch * 0.6); ctx.lineTo(m1 + cw*1.5, ch * 0.25);
                ctx.lineTo(cw*2, ch * 0.6); ctx.fill();

                // Кактусы и кусты
                ctx.fillStyle = '#064e3b';
                let cX = -(bgScrollX * 0.4) % 600;
                for(let i = -600; i < cw + 600; i+= 600) {
                    ctx.fillRect(cX + i, ch * 0.52, 10, 50);
                    ctx.fillRect(cX + i - 15, ch * 0.55, 15, 8);
                }

                // Дорога
                let rY = ch * 0.6;
                let rH = ch * 0.4;
                ctx.fillStyle = '#1e293b'; // Асфальт
                ctx.fillRect(0, rY, cw, rH);

                // Бордюры
                ctx.fillStyle = '#94a3b8';
                ctx.fillRect(0, rY, cw, 10);
                ctx.fillRect(0, rY + rH - 10, cw, 10);

                // Разметка (2D Perspective)
                ctx.fillStyle = '#ffffff';
                let offset = (player.dist * 12) % 80;
                for(let i = -offset; i < cw; i+= 80) {
                    ctx.fillRect(i, rY + rH/2 - 4, 40, 8);
                }

                // Старт/Финиш
                if (player.dist < 600) {
                    let stX = 150 - player.dist;
                    drawCheckers(stX, rY, rH);
                }
                if (player.dist > TRACK_DIST - cw) {
                    let fnX = 150 + (TRACK_DIST - player.dist);
                    drawCheckers(fnX, rY, rH);
                }
            }

            function drawCheckers(x, y, h) {
                if(x < -50 || x > cw+50) return;
                let sq = 12;
                for(let i=0; i < h/sq; i++) {
                    ctx.fillStyle = (i%2===0) ? '#fff' : '#000'; ctx.fillRect(x, y + i*sq, sq, sq);
                    ctx.fillStyle = (i%2===0) ? '#000' : '#fff'; ctx.fillRect(x+sq, y + i*sq, sq, sq);
                }
            }

            function drawTrafficLight() {
                if (countdown < 0 || countdown >= 4) return;
                let lx = cw/2 - 50; let ly = 30;
                ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.roundRect(lx, ly, 100, 200, 10); ctx.fill();
                ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 4; ctx.stroke();

                let cols = ['#ef4444', '#ef4444', '#f59e0b', '#10b981'];
                for(let i=0; i<4; i++) {
                    ctx.fillStyle = (countdown === i || (countdown >= 4 && i===3)) ? cols[i] : '#334155';
                    ctx.beginPath(); ctx.arc(cw/2, ly + 35 + i*45, 14, 0, Math.PI*2); ctx.fill();
                }
            }

            // ==========================================================================
            // ИГРОВОЙ ЦИКЛ
            // ==========================================================================
            function render() {
                bgScrollX = player.dist;
                
                ctx.save();
                if (screenShake > 0) {
                    ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
                    screenShake *= 0.9;
                }

                drawScene();

                let roadY = ch * 0.6;
                let laneH = (ch * 0.4) / 2;

                // Соперник (верхняя полоса)
                let enemyScale = 0.85;
                let enemyX = 150 + (enemy.dist - player.dist) * 1.2;
                ctx.save(); ctx.translate(enemyX, roadY + laneH/2); ctx.scale(enemyScale, enemyScale);
                drawCarMaster(0, 0, enemy, false);
                ctx.restore();

                // Игрок (нижняя полоса)
                ctx.save(); ctx.translate(150, roadY + laneH + laneH/2 - 10);
                drawCarMaster(0, 0, player, true);
                ctx.restore();

                drawTrafficLight();
                ctx.restore();
            }

            function update(dt) {
                if (!gameActive) return;

                if (countdown < 4) {
                    countdownTimer += dt;
                    if (countdownTimer >= 1.0) {
                        countdown++; countdownTimer = 0;
                        if (countdown === 4) showToast("🚀 СТАРТ!");
                    }
                    return;
                }

                // Физика Игрока
                let pBaseSpeed = 150 + player.car.speed_bonus * 2.5;
                let pAccel = 60 + player.car.speed_bonus * 1.5;

                if (player.isGas) {
                    let curAccel = pAccel;
                    if (player.isNitro && player.nitroAmount > 0) {
                        curAccel *= 2.8; pBaseSpeed += 200;
                        player.nitroAmount -= 40 * dt; screenShake = 8;
                    }
                    player.speed += curAccel * dt;
                } else {
                    player.speed -= 100 * dt;
                }

                player.speed = Math.max(0, Math.min(player.speed, pBaseSpeed));
                player.dist += (player.speed * 0.35) * dt;

                // Физика ИИ
                if (!isMultiplayer) {
                    let eBaseSpeed = 150 + enemy.car.speed_bonus * 2.5;
                    let eAccel = 60 + enemy.car.speed_bonus * 1.5;
                    enemy.speed += eAccel * dt;
                    if (enemy.dist > TRACK_DIST * 0.4 && enemy.dist < TRACK_DIST * 0.7) {
                        enemy.speed += eAccel * 1.2 * dt; eBaseSpeed += 120; // ИИ жмет нитро
                    }
                    enemy.speed = Math.max(0, Math.min(enemy.speed, eBaseSpeed));
                    enemy.dist += (enemy.speed * 0.35) * dt;
                }

                hudSpeed.textContent = Math.round(player.speed) + ' KM/H';

                // Финиш
                if (player.dist >= TRACK_DIST || enemy.dist >= TRACK_DIST) {
                    gameActive = false;
                    let isWin = player.dist >= enemy.dist;
                    if (isMultiplayer && socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({ type: 'finish', senderId: userId }));
                    } else {
                        finishRace(isWin);
                    }
                }

                // Сеть
                if (isMultiplayer && socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: 'move', senderId: userId, dist: player.dist }));
                }
            }

            function gameLoop(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = (timestamp - lastTime) / 1000;
                lastTime = timestamp;
                update(dt);
                render();
                if (gameActive) requestAnimationFrame(gameLoop);
            }

            // ==========================================================================
            // ЛОГИКА МЕНЮ, ГАРАЖА И СЕТИ
            // ==========================================================================
            async function finishRace(isWin) {
                let winAmt = isWin ? Math.floor(raceBet * 1.9) : 0;
                try {
                    const res = await sendGameResult(isWin ? 'win' : 'lose', raceBet, winAmt);
                    if (res.new_balance !== undefined) {
                        casinoBalance = Number(res.new_balance);
                        hudBalance.textContent = formatNumber(casinoBalance) + ' ₽';
                    }
                } catch(e) {}
                alert(isWin ? `🏆 ПОБЕДА! ВЫИГРЫШ: ${formatNumber(winAmt)} ₽` : `❌ ПРОИГРЫШ! СОПЕРНИК ОБОГНАЛ.`);
                location.reload();
            }

            function initCarSelectorUI() {
                const container = document.getElementById('carSelector');
                container.innerHTML = '';
                // Рисуем карточки для всех машин из CARS_DB
                CARS_DB.forEach(car => {
                    const card = document.createElement('div');
                    card.className = `car-card ${car.id === selectedCar.id ? 'active' : ''}`;
                    
                    // Создаем мини-канвас для превью машины
                    const cPreview = document.createElement('canvas');
                    cPreview.className = 'car-preview';
                    cPreview.width = 120; cPreview.height = 50;
                    const ctxP = cPreview.getContext('2d');
                    
                    // Рисуем превью (уменьшенно)
                    ctxP.translate(60, 25);
                    ctxP.scale(0.6, 0.6);
                    if(car.draw) car.draw(ctxP, car.color);
                    else drawMustang(ctxP, car.color);
                    // Колеса статика
                    let wSize = car.wSize || 11;
                    let wPos = car.w || [-35, 35];
                    wPos.forEach(wx => {
                        ctxP.save(); ctxP.translate(wx, 8);
                        ctxP.fillStyle='#111'; ctxP.beginPath(); ctxP.arc(0,0,wSize,0,Math.PI*2); ctxP.fill();
                        ctxP.fillStyle='#cbd5e1'; ctxP.beginPath(); ctxP.arc(0,0,wSize*0.6,0,Math.PI*2); ctxP.fill();
                        ctxP.restore();
                    });

                    card.appendChild(cPreview);
                    card.innerHTML += `<div class="c-name">${car.name}</div><div class="c-price">${formatNumber(car.price)} ₽</div><div class="c-stats">⚡ +${car.speed_bonus}%</div>`;
                    
                    card.onclick = () => {
                        document.querySelectorAll('.car-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                        selectedCar = car;
                        player.car = car;
                    };
                    container.appendChild(card);
                });
            }

            function startDragRace() {
                document.getElementById('mainMenu').classList.add('hidden');
                document.getElementById('gameHud').classList.remove('hidden');
                document.getElementById('controlsLayer').classList.remove('hidden');
                player.dist = 0; player.speed = 0; player.nitroAmount = 100;
                enemy.dist = 0; enemy.speed = 0;
                countdown = 0; countdownTimer = 0;
                gameActive = true;
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }

            function connectWebSocket(code) {
                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                socket = new WebSocket(`${wsProtocol}//resellgame.bothost.tech/ws/race/${code}?userId=${userId}`);
                socket.onopen = () => {
                    showToast(`Ожидание в комнате ${code}...`);
                    hudRoom.textContent = code;
                    socket.send(JSON.stringify({ type: 'join', senderId: userId, carId: selectedCar.id }));
                    setTimeout(() => startDragRace(), 2000);
                };
                socket.onmessage = (e) => {
                    try {
                        const data = JSON.parse(e.data);
                        if (data.type === 'join' && data.senderId !== userId) {
                            let eCar = CARS_DB.find(c => c.id === data.carId);
                            if (eCar) enemy.car = eCar;
                        }
                        if (data.type === 'move' && data.senderId !== userId) enemy.dist = data.dist;
                        if (data.type === 'game_over') { gameActive = false; finishRace(data.winnerId === userId); }
                    } catch(err) {}
                };
                socket.onerror = () => {
                    showToast("Сбой сети. Запуск Сингла.");
                    startDragRace();
                };
            }

            // Управление (API Проверки)
            async function tryStartGame(isMulti, code = null) {
                raceBet = parseNumber(document.getElementById('betInput').value);
                if (raceBet < 100) { showToast('Мин. ставка 100 ₽'); return; }
                if (raceBet > casinoBalance) { showToast('Недостаточно средств!'); return; }

                // Проверка: есть ли выбранная машина в гараже пользователя через REST API
                if(userId) {
                    try {
                        const req = await fetch(`${API_BASE}/race/create`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userId: userId, carId: selectedCar.id, bet: raceBet })
                        });
                        const res = await req.json();
                        // Сервер возвращает ошибку, если машины нет в коллекции
                        if (!res.success && res.error === "Этой машины нет в гараже!") {
                            showToast('Этой машины нет у тебя в гараже!');
                            return; 
                        }
                    } catch(e) {}
                }

                isMultiplayer = isMulti;
                if (!isMulti) {
                    hudRoom.textContent = "СИНГЛ";
                    enemy.car = CARS_DB[Math.floor(Math.random() * CARS_DB.length)];
                    startDragRace();
                } else {
                    connectWebSocket(code || Math.floor(1000 + Math.random() * 9000).toString());
                }
            }

            document.getElementById('btnSingle').onclick = () => tryStartGame(false);
            document.getElementById('btnCreateRoom').onclick = () => tryStartGame(true);
            document.getElementById('btnJoinRoom').onclick = () => {
                let code = document.getElementById('roomCodeInput').value.trim();
                if (!code) { showToast('Введите код комнаты!'); return; }
                tryStartGame(true, code);
            };

            const bindBtn = (el, prop) => {
                const press = (e) => { e.preventDefault(); player[prop] = true; el.classList.add('active'); };
                const release = (e) => { e.preventDefault(); player[prop] = false; el.classList.remove('active'); };
                el.addEventListener('touchstart', press); el.addEventListener('mousedown', press);
                el.addEventListener('touchend', release); el.addEventListener('mouseup', release);
                el.addEventListener('mouseleave', release);
            };
            bindBtn(document.getElementById('btnGas'), 'isGas');
            bindBtn(document.getElementById('btnNitro'), 'isNitro');

            document.querySelectorAll('[data-amt]').forEach(b => b.onclick = () => document.getElementById('betInput').value = formatNumber(parseInt(b.dataset.amt)));
            document.getElementById('betInput').addEventListener('input', function() { this.value = formatNumber(parseNumber(this.value)); });

            window.addEventListener('resize', () => {
                cw = window.innerWidth; ch = window.innerHeight;
                canvas.width = cw; canvas.height = ch;
                if(!gameActive) render();
            });

            initCarSelectorUI();
            loadBalance();
            render();

        })();
    </script>
</body>
</html>
