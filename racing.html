<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>R-RACE 2D | STREET RACING</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,900&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           1. ОСНОВНЫЕ СТИЛИ
           ========================================================================== */
        :root {
            --bg-dark: #0a0d14;
            --panel-bg: rgba(16, 22, 34, 0.92);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-gold: #ffc700;
            --accent-blue: #2563eb;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
        }

        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-dark);
            font-family: 'Nunito', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-wrapper {
            max-width: 500px;
            width: 100%;
            height: 100vh;
            max-height: 900px;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            border: 1px solid var(--border-color);
        }

        /* ===== ГЛАВНОЕ МЕНЮ ===== */
        .menu-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 30%, rgba(37, 99, 235, 0.25), transparent 70%),
                        linear-gradient(180deg, rgba(10, 13, 20, 0.85) 0%, rgba(10, 13, 20, 0.98) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .logo-box { text-align: center; margin-bottom: 24px; }
        .logo-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 38px; font-weight: 900; font-style: italic;
            background: linear-gradient(135deg, #ffffff 0%, #a0c4ff 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            text-transform: uppercase; letter-spacing: -1px;
        }
        .logo-title span { color: var(--accent-gold); -webkit-text-fill-color: var(--accent-gold); }

        .logo-sub {
            font-size: 12px; font-weight: 900; color: #94a3b8;
            letter-spacing: 4px; text-transform: uppercase; margin-top: -4px;
        }

        .menu-card {
            width: 100%; background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px; padding: 18px; margin-bottom: 12px;
            display: flex; flex-direction: column; gap: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-label {
            font-size: 11px; font-weight: 800; color: #94a3b8;
            text-transform: uppercase; letter-spacing: 1px;
        }

        input.custom-input {
            width: 100%; height: 48px; background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color); border-radius: 12px;
            color: #fff; font-family: 'Montserrat', sans-serif;
            font-weight: 800; font-size: 18px; text-align: center; outline: none;
        }
        input.custom-input:focus { border-color: var(--accent-blue); }

        .btn-group { display: flex; gap: 8px; }

        button.btn-ui {
            width: 100%; height: 50px; border: none; border-radius: 12px;
            font-family: 'Montserrat', sans-serif; font-weight: 900;
            font-size: 14px; color: #fff; cursor: pointer;
            text-transform: uppercase; letter-spacing: 0.5px;
            transition: all 0.15s; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        button.btn-ui:active { transform: scale(0.96); }

        .btn-gold { background: linear-gradient(135deg, #ffc700, #d99b00); color: #000; }
        .btn-blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .btn-green { background: linear-gradient(135deg, #10b981, #047857); color: #000; }

        /* ===== ХУД ===== */
        .hud-top {
            position: absolute; top: 12px; left: 12px; right: 12px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 50; pointer-events: none;
        }

        .hud-card {
            background: rgba(10, 13, 20, 0.85); border: 1px solid var(--border-color);
            backdrop-filter: blur(8px); border-radius: 12px; padding: 6px 12px;
            font-size: 12px; font-weight: 800; color: #fff;
            display: flex; align-items: center; gap: 6px;
        }
        .hud-card span { color: var(--accent-gold); font-family: 'Montserrat', sans-serif; font-weight: 900; }

        /* ===== УПРАВЛЕНИЕ ДРАГ-РЕЙСИНГОМ ===== */
        .controls-layer {
            position: absolute; bottom: 20px; left: 16px; right: 16px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 50;
        }

        .pedal-btn {
            width: 100px; height: 100px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.8), rgba(5, 150, 105, 0.9));
            border: 3px solid #fff; border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff; font-family: 'Montserrat', sans-serif; font-weight: 900;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5); cursor: pointer;
        }
        .pedal-btn:active { transform: scale(0.92); background: #10b981; }

        .nitro-btn {
            width: 90px; height: 90px;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.8), rgba(29, 78, 216, 0.9));
            border: 3px solid #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 900;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5); cursor: pointer;
        }
        .nitro-btn:active { transform: scale(0.92); }

        canvas#gameCanvas { width: 100%; height: 100%; display: block; }

        .toast-popup {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 13, 20, 0.95); border: 1px solid var(--accent-blue);
            color: #fff; padding: 10px 20px; font-weight: 800; font-size: 13px;
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 60;
            display: none; white-space: nowrap; text-transform: uppercase;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="toast-popup" id="toastMsg">Уведомление</div>

        <!-- ИГРОВОЙ ХУД -->
        <div class="hud-top hidden" id="gameHud">
            <div class="hud-card">🏁 <span id="hudRoom">СИНГЛ</span></div>
            <div class="hud-card">💰 <span id="hudBalance">0 ₽</span></div>
            <div class="hud-card">⚡ <span id="hudSpeed">0 KM/H</span></div>
        </div>

        <!-- ГЛАВНОЕ МЕНЮ -->
        <div class="menu-overlay" id="mainMenu">
            <div class="logo-box">
                <div class="logo-title">R-<span>RACE</span> 2D</div>
                <div class="logo-sub">STREET DRAG RACING</div>
            </div>

            <div class="menu-card">
                <span class="card-label">Ставка на заезд</span>
                <input type="text" class="custom-input" id="betInput" value="10 000">
                <div class="btn-group" style="margin-top: 6px;">
                    <button class="btn-ui btn-gold" style="height:36px; font-size:12px;" data-amt="5000">5K</button>
                    <button class="btn-ui btn-gold" style="height:36px; font-size:12px;" data-amt="10000">10K</button>
                    <button class="btn-ui btn-gold" style="height:36px; font-size:12px;" data-amt="25000">25K</button>
                </div>
            </div>

            <button class="btn-ui btn-gold" id="btnSingle">🚗 ОДИНОЧНЫЙ ДРАГ (ИИ)</button>

            <div class="menu-card" style="margin-top: 12px;">
                <span class="card-label">Мультиплеер (с другом)</span>
                <input type="text" class="custom-input" id="roomCodeInput" placeholder="КОД КОМНАТЫ" maxlength="6">
                <div class="btn-group" style="margin-top: 6px;">
                    <button class="btn-ui btn-blue" id="btnCreateRoom">СОЗДАТЬ</button>
                    <button class="btn-ui btn-green" id="btnJoinRoom">ВОЙТИ</button>
                </div>
            </div>
        </div>

        <!-- КАНВАС 2D ИГРЫ -->
        <canvas id="gameCanvas"></canvas>

        <!-- КНОПКИ УПРАВЛЕНИЯ НА ЭКРАНЕ -->
        <div class="controls-layer hidden" id="controlsLayer">
            <div class="nitro-btn" id="btnNitro">NOS 🚀</div>
            <div class="pedal-btn" id="btnGas">
                <span style="font-size:24px;">▲</span>
                <span>ГАЗ</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const tg = window.Telegram?.WebApp;
            if (tg) { tg.expand(); tg.ready(); }

            const API_BASE = 'https://resellgame.bothost.tech';
            let userId = null;
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('userId')) userId = urlParams.get('userId');
            else if (urlParams.has('user_id')) userId = urlParams.get('user_id');
            else if (tg?.initDataUnsafe?.user?.id) userId = tg.initDataUnsafe.user.id;

            // DOM
            const mainMenu = document.getElementById('mainMenu');
            const gameHud = document.getElementById('gameHud');
            const controlsLayer = document.getElementById('controlsLayer');
            const hudBalance = document.getElementById('hudBalance');
            const hudSpeed = document.getElementById('hudSpeed');
            const hudRoom = document.getElementById('hudRoom');
            const toastMsg = document.getElementById('toastMsg');
            const betInput = document.getElementById('betInput');
            const roomCodeInput = document.getElementById('roomCodeInput');

            let casinoBalance = 0;
            let raceBet = 10000;
            let socket = null;
            let isMultiplayer = false;

            // 2D Canvas Движок
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            let cw = window.innerWidth;
            let ch = window.innerHeight;
            canvas.width = cw;
            canvas.height = ch;

            // Состояние Драг-заезда
            const TRACK_DIST = 1000; // Дистанция в метрах
            let gameActive = false;
            let countdownState = -1; // -1: Меню, 0..3: Светофор, 4: СТАРТ!
            let countdownTimer = 0;

            // Игрок и ИИ/Соперник
            let player = { dist: 0, speed: 0, maxSpeed: 280, accel: 60, nitro: 100, isGas: false, isNitro: false };
            let enemy = { dist: 0, speed: 0, maxSpeed: 265, accel: 52 };

            function showToast(msg) {
                toastMsg.textContent = msg;
                toastMsg.style.display = 'block';
                setTimeout(() => toastMsg.style.display = 'none', 2500);
            }

            function formatNumber(n) { return (n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
            function parseNumber(s) { return parseInt(s.toString().replace(/\s/g, '')) || 0; }

            // Баланс
            async function loadBalance() {
                if (!userId) return;
                try {
                    const resp = await fetch(`${API_BASE}/profile/${encodeURIComponent(userId)}`);
                    const data = await resp.json();
                    casinoBalance = Number(data.casino_balance ?? data.balance ?? 0);
                    hudBalance.textContent = formatNumber(casinoBalance) + ' ₽';
                } catch(e) {}
            }

            function sendGameResult(result, bet, win) {
                if (!userId) return Promise.reject();
                return fetch(`${API_BASE}/game_result`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, game: 'racing', result: result, bet: bet, win: win })
                }).then(r => r.json());
            }

            // ==========================================================================
            // 2D ОТРИСОВКА СБОКУ (SIDE-VIEW) И ПАРАЛЛАКС ФОН
            // ==========================================================================
            let bgScrollX = 0;

            function drawSkyAndMountains() {
                // Небо (Пустынный Закат)
                let grad = ctx.createLinearGradient(0, 0, 0, ch * 0.55);
                grad.addColorStop(0, '#f97316');
                grad.addColorStop(0.5, '#fb923c');
                grad.addColorStop(1, '#fef08a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, cw, ch * 0.55);

                // Солнце
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(cw * 0.75, ch * 0.25, 45, 0, Math.PI * 2);
                ctx.fill();

                // Далекие горы (Параллакс)
                ctx.fillStyle = '#c2410c';
                ctx.beginPath();
                let mX = -(bgScrollX * 0.1) % cw;
                ctx.moveTo(mX - cw, ch * 0.55);
                ctx.lineTo(mX - cw * 0.6, ch * 0.3);
                ctx.lineTo(mX - cw * 0.2, ch * 0.55);
                ctx.lineTo(mX + cw * 0.2, ch * 0.35);
                ctx.lineTo(mX + cw * 0.7, ch * 0.55);
                ctx.lineTo(mX + cw * 1.3, ch * 0.28);
                ctx.lineTo(mX + cw * 2.0, ch * 0.55);
                ctx.lineTo(cw * 2, ch * 0.55);
                ctx.lineTo(-cw, ch * 0.55);
                ctx.fill();

                // Ближний песчаный холм
                ctx.fillStyle = '#ea580c';
                ctx.beginPath();
                let hX = -(bgScrollX * 0.3) % cw;
                ctx.moveTo(hX - cw, ch * 0.55);
                ctx.lineTo(hX - cw * 0.5, ch * 0.45);
                ctx.lineTo(hX, ch * 0.55);
                ctx.lineTo(hX + cw * 0.5, ch * 0.42);
                ctx.lineTo(hX + cw, ch * 0.55);
                ctx.lineTo(hX + cw * 1.5, ch * 0.45);
                ctx.lineTo(cw * 2, ch * 0.55);
                ctx.lineTo(-cw, ch * 0.55);
                ctx.fill();
            }

            function drawRoadAndTrack() {
                let roadY = ch * 0.55;
                let roadH = ch * 0.45;

                // Песок снизу
                ctx.fillStyle = '#d97706';
                ctx.fillRect(0, roadY, cw, roadH);

                // Асфальт
                let asphaltY = roadY + 30;
                let asphaltH = 140;
                ctx.fillStyle = '#334155';
                ctx.fillRect(0, asphaltY, cw, asphaltH);

                // Бордюр (Поребрик верхний)
                ctx.fillStyle = '#e2e8f0';
                ctx.fillRect(0, asphaltY - 8, cw, 8);

                // Белая прерывистая разметка по центру дороги
                ctx.fillStyle = '#ffffff';
                let stripeW = 40;
                let gap = 30;
                let offset = (player.dist * 10) % (stripeW + gap);
                for (let x = -offset; x < cw; x += stripeW + gap) {
                    ctx.fillRect(x, asphaltY + asphaltH / 2 - 3, stripeW, 6);
                }

                // Бордюр нижний
                ctx.fillStyle = '#e2e8f0';
                ctx.fillRect(0, asphaltY + asphaltH, cw, 8);
            }

            // Отрисовка детализированной 2D машины (Сбоку)
            function drawCarSide(x, y, colorHex, isPlayer) {
                ctx.save();
                ctx.translate(x, y);

                // Тень машины
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath();
                ctx.ellipse(0, 12, 65, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                // Нитро-выхлоп (Огонь)
                if (isPlayer && player.isNitro && player.nitro > 0) {
                    ctx.fillStyle = '#3b82f6';
                    ctx.beginPath();
                    ctx.moveTo(-60, -2);
                    ctx.lineTo(-85 - Math.random() * 20, 2);
                    ctx.lineTo(-60, 6);
                    ctx.fill();

                    ctx.fillStyle = '#fef08a';
                    ctx.beginPath();
                    ctx.moveTo(-60, 0);
                    ctx.lineTo(-75, 2);
                    ctx.lineTo(-60, 4);
                    ctx.fill();
                }

                // Кузов
                ctx.fillStyle = colorHex;
                ctx.beginPath();
                ctx.moveTo(-55, 8);
                ctx.lineTo(-55, -8);
                ctx.lineTo(-40, -14);
                ctx.lineTo(-20, -22); // Лобовое стекло начало
                ctx.lineTo(15, -22);  // Крыша
                ctx.lineTo(35, -10);  // Капот
                ctx.lineTo(58, -6);
                ctx.lineTo(60, 8);
                ctx.closePath();
                ctx.fill();

                // Виниловые полосы (GTA Style)
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(-50, -4);
                ctx.lineTo(20, -18);
                ctx.lineTo(30, -12);
                ctx.lineTo(-40, 2);
                ctx.closePath();
                ctx.fill();

                // Стекла
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.moveTo(-16, -20);
                ctx.lineTo(10, -20);
                ctx.lineTo(25, -12);
                ctx.lineTo(-12, -12);
                ctx.closePath();
                ctx.fill();

                // Спойлер
                ctx.fillStyle = '#000000';
                ctx.fillRect(-56, -18, 4, 10);
                ctx.fillRect(-58, -20, 12, 3);

                // Фара передняя
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(52, -5, 6, 4);

                // Колеса
                let wheelRot = (player.dist * 0.2) % (Math.PI * 2);
                const drawWheel = (wx) => {
                    ctx.save();
                    ctx.translate(wx, 8);
                    ctx.rotate(wheelRot);

                    // Шина
                    ctx.fillStyle = '#1e293b';
                    ctx.beginPath();
                    ctx.arc(0, 0, 13, 0, Math.PI * 2);
                    ctx.fill();

                    // Диск
                    ctx.fillStyle = '#94a3b8';
                    ctx.beginPath();
                    ctx.arc(0, 0, 8, 0, Math.PI * 2);
                    ctx.fill();

                    // Спицы
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-8, 0); ctx.lineTo(8, 0);
                    ctx.moveTo(0, -8); ctx.lineTo(0, 8);
                    ctx.stroke();

                    ctx.restore();
                };

                drawWheel(-35); // Заднее колесо
                drawWheel(35);  // Переднее колесо

                ctx.restore();
            }

            // Отрисовка Драг-Светофора
            function drawTrafficLight() {
                if (countdownState < 0 || countdownState >= 4) return;

                let startX = cw / 2 - 35;
                let startY = ch * 0.2;

                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(startX, startY, 70, 160, 10);
                ctx.fill();
                ctx.stroke();

                let colors = ['#ef4444', '#ef4444', '#f59e0b', '#10b981'];
                for (let i = 0; i < 4; i++) {
                    ctx.fillStyle = (i === countdownState) ? colors[i] : '#334155';
                    ctx.beginPath();
                    ctx.arc(cw / 2, startY + 25 + i * 35, 12, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Главная процедура рендера
            function render() {
                bgScrollX = player.dist * 2;
                drawSkyAndMountains();
                drawRoadAndTrack();

                let roadY = ch * 0.55 + 30;

                // Игрок находится на нижней полосе
                let playerScreenX = 120;
                let playerScreenY = roadY + 100;

                // Расчет X-координаты соперника на верхней полосе
                let distDiff = enemy.dist - player.dist;
                let enemyScreenX = playerScreenX + distDiff * 3; // Масштаб отображения отрыва
                let enemyScreenY = roadY + 40;

                // Отрисовка Машин
                drawCarSide(enemyScreenX, enemyScreenY, enemy.color || '#ef4444', false);
                drawCarSide(playerScreenX, playerScreenY, '#2563eb', true);

                // Светофор
                drawTrafficLight();
            }

            // Физический расчет заезда
            let lastTimestamp = 0;
            function update(dt) {
                if (!gameActive) return;

                // Отсчет светофора
                if (countdownState < 4) {
                    countdownTimer += dt;
                    if (countdownTimer >= 1.0) {
                        countdownState++;
                        countdownTimer = 0;
                        if (countdownState === 4) {
                            showToast("🚀 СТАРТ!");
                        }
                    }
                    return; // Ждем зеленого сигнала
                }

                // Газ и Нитро игрока
                if (player.isGas) {
                    let curAccel = player.accel;
                    if (player.isNitro && player.nitro > 0) {
                        curAccel *= 2.2;
                        player.nitro -= 25 * dt;
                    }
                    player.speed += curAccel * dt;
                } else {
                    player.speed -= 30 * dt; // Трение
                }

                player.speed = Math.max(0, Math.min(player.speed, player.maxSpeed));
                player.dist += (player.speed * 0.28) * dt;

                // ИИ соперника в одиночном режиме
                if (!isMultiplayer) {
                    enemy.speed += enemy.accel * dt;
                    enemy.speed = Math.min(enemy.speed, enemy.maxSpeed);
                    enemy.dist += (enemy.speed * 0.28) * dt;
                }

                // HUD
                hudSpeed.textContent = Math.round(player.speed) + ' KM/H';

                // Пересечение Финиша
                if (player.dist >= TRACK_DIST || enemy.dist >= TRACK_DIST) {
                    gameActive = false;
                    let isWin = player.dist >= enemy.dist;

                    if (isMultiplayer && socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({ type: 'finish', senderId: userId }));
                    } else {
                        finishRace(isWin);
                    }
                }

                // Сетевая синхронизация
                if (isMultiplayer && socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        type: 'move',
                        senderId: userId,
                        dist: player.dist,
                        speed: player.speed
                    }));
                }
            }

            function gameLoop(timestamp) {
                if (!lastTimestamp) lastTimestamp = timestamp;
                let dt = (timestamp - lastTimestamp) / 1000;
                lastTimestamp = timestamp;

                update(dt);
                render();

                if (gameActive) requestAnimationFrame(gameLoop);
            }

            // ==========================================================================
            // ФИНАЛИЗАЦИЯ И МУЛЬТИПЛЕЕР
            // ==========================================================================
            async function finishRace(isWin) {
                gameActive = false;
                let winAmt = isWin ? Math.floor(raceBet * 1.85) : 0;

                try {
                    const res = await sendGameResult(isWin ? 'win' : 'lose', raceBet, winAmt);
                    if (res.new_balance !== undefined) {
                        casinoBalance = Number(res.new_balance);
                        hudBalance.textContent = formatNumber(casinoBalance) + ' ₽';
                    }
                } catch(e) {}

                alert(isWin ? `🏆 ПОБЕДА В ДРАГЕ! ВЫИГРЫШ: ${formatNumber(winAmt)} ₽` : `❌ СОПЕРНИК ПЕРЕХИТРИЛ ВАС НА ФИНИШЕ!`);
                location.reload();
            }

            function startDragRace() {
                mainMenu.classList.add('hidden');
                gameHud.classList.remove('hidden');
                controlsLayer.classList.remove('hidden');

                player = { dist: 0, speed: 0, maxSpeed: 280, accel: 65, nitro: 100, isGas: false, isNitro: false };
                enemy = { dist: 0, speed: 0, maxSpeed: 265, accel: 55 };

                countdownState = 0;
                countdownTimer = 0;
                gameActive = true;
                lastTimestamp = performance.now();
                requestAnimationFrame(gameLoop);
            }

            function initWebSocket(roomCode) {
                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${wsProtocol}//resellgame.bothost.tech/ws/race/${roomCode}?userId=${userId}`;
                socket = new WebSocket(wsUrl);

                socket.onopen = () => {
                    showToast(`КОМНАТА ${roomCode} ГОТОВА!`);
                    hudRoom.textContent = roomCode;
                    startDragRace();
                };

                socket.onmessage = (e) => {
                    try {
                        const data = JSON.parse(e.data);
                        if (data.type === 'move' && data.senderId !== userId) {
                            enemy.dist = data.dist;
                            enemy.speed = data.speed;
                        }
                        if (data.type === 'game_over') {
                            finishRace(data.winnerId === userId);
                        }
                    } catch(err) {}
                };

                socket.onerror = () => {
                    showToast("Сбой WebSocket. Включаем Сингл.");
                    startSingleGame();
                };
            }

            function startSingleGame() {
                isMultiplayer = false;
                hudRoom.textContent = "СИНГЛ";
                startDragRace();
            }

            // Управление сенсором
            const btnGas = document.getElementById('btnGas');
            const btnNitro = document.getElementById('btnNitro');

            const bindTouch = (el, onStart, onEnd) => {
                el.addEventListener('touchstart', (e) => { e.preventDefault(); onStart(); });
                el.addEventListener('touchend', (e) => { e.preventDefault(); onEnd(); });
                el.addEventListener('mousedown', () => onStart());
                el.addEventListener('mouseup', () => onEnd());
            };

            bindTouch(btnGas, () => player.isGas = true, () => player.isGas = false);
            bindTouch(btnNitro, () => player.isNitro = true, () => player.isNitro = false);

            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'Ц') player.isGas = true;
                if (e.key === 'Shift' || e.key === ' ') player.isNitro = true;
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'Ц') player.isGas = false;
                if (e.key === 'Shift' || e.key === ' ') player.isNitro = false;
            });

            // Кнопки меню
            document.getElementById('btnSingle').onclick = () => {
                raceBet = parseNumber(betInput.value);
                if (raceBet > casinoBalance) { showToast('Недостаточно средств!'); return; }
                startSingleGame();
            };

            document.getElementById('btnCreateRoom').onclick = () => {
                raceBet = parseNumber(betInput.value);
                if (raceBet > casinoBalance) { showToast('Недостаточно средств!'); return; }
                isMultiplayer = true;
                let code = Math.floor(1000 + Math.random() * 9000).toString();
                initWebSocket(code);
            };

            document.getElementById('btnJoinRoom').onclick = () => {
                raceBet = parseNumber(betInput.value);
                if (raceBet > casinoBalance) { showToast('Недостаточно средств!'); return; }
                let code = roomCodeInput.value.trim();
                if (!code) { showToast('Введите код комнаты!'); return; }
                isMultiplayer = true;
                initWebSocket(code);
            };

            document.querySelectorAll('[data-amt]').forEach(btn => {
                btn.onclick = () => betInput.value = formatNumber(parseInt(btn.dataset.amt));
            });

            betInput.addEventListener('input', function() {
                this.value = formatNumber(parseNumber(this.value));
            });

            window.addEventListener('resize', () => {
                cw = window.innerWidth;
                ch = window.innerHeight;
                canvas.width = cw;
                canvas.height = ch;
            });

            loadBalance();
            render();

        })();
    </script>
</body>
</html>
