<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>R-RACE 2D | STREET DRAG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,900&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           1. UI И МЕНЮ (СОВРЕМЕННЫЙ АВТОСИМУЛЯТОР)
           ========================================================================== */
        :root {
            --bg-main: #0f172a;
            --panel-bg: rgba(15, 23, 42, 0.95);
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-gold: #f59e0b;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg-main);
            font-family: 'Nunito', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            max-width: 800px; /* Сделали чуть шире для горизонтальной ориентации */
            width: 100%;
            height: 100vh;
            max-height: 900px;
            background: #4ab8f2; /* Цвет дневного неба */
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* ===== МЕНЮ ===== */
        .menu-screen {
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.98) 0%, rgba(30, 41, 59, 0.95) 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 20px; z-index: 100; overflow-y: auto;
        }

        .logo {
            font-family: 'Montserrat', sans-serif; font-size: 36px; font-weight: 900; font-style: italic;
            text-transform: uppercase; color: #fff; text-shadow: 0 4px 10px rgba(59, 130, 246, 0.6);
            margin-bottom: 20px; margin-top: 10px;
        }
        .logo span { color: var(--accent-gold); }

        .menu-card {
            width: 100%; background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 16px; margin-bottom: 16px;
        }

        .section-title { font-size: 12px; font-weight: 900; color: #94a3b8; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }

        /* Карусель машин */
        .car-carousel {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px;
        }
        .car-carousel::-webkit-scrollbar { display: none; }
        
        .car-card {
            min-width: 140px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: all 0.2s;
        }
        .car-card.active { background: rgba(245, 158, 11, 0.2); border-color: var(--accent-gold); transform: scale(1.05); }
        .car-card .c-name { font-size: 13px; font-weight: 900; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .car-card .c-stats { font-size: 10px; color: var(--accent-green); font-weight: 800; }

        input.styled-input {
            width: 100%; height: 46px; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px; color: #fff; font-family: 'Montserrat', sans-serif; font-weight: 900;
            font-size: 16px; text-align: center; outline: none; margin-bottom: 10px;
        }
        input.styled-input:focus { border-color: var(--accent-blue); }

        .btn {
            width: 100%; height: 50px; border: none; border-radius: 12px;
            font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 14px;
            color: #fff; cursor: pointer; text-transform: uppercase; transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-blue { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .btn-green { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-gold { background: linear-gradient(135deg, #f59e0b, #d97706); }
        
        .flex-row { display: flex; gap: 10px; }
        .flex-row .btn { flex: 1; }

        /* ===== HUD ИГРЫ ===== */
        .hud {
            position: absolute; top: 16px; left: 16px; right: 16px;
            display: flex; justify-content: space-between; z-index: 50; pointer-events: none;
        }
        .hud-badge {
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); border: 2px solid rgba(255,255,255,0.15);
            padding: 8px 12px; border-radius: 12px; font-size: 14px; font-weight: 900; color: #fff;
        }
        .hud-badge span { color: var(--accent-gold); }

        /* ===== ПЕДАЛИ ===== */
        .controls {
            position: absolute; bottom: 30px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: flex-end; z-index: 50;
        }
        .pedal {
            width: 90px; height: 110px; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 16px; color: #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6); cursor: pointer; transition: transform 0.05s;
            border: 3px solid rgba(255,255,255,0.3);
        }
        .pedal.nitro { background: linear-gradient(180deg, #3b82f6, #1d4ed8); width: 80px; height: 80px; border-radius: 50%; }
        .pedal.nitro:active, .pedal.nitro.active { transform: scale(0.9); background: #2563eb; border-color: #fff; box-shadow: 0 0 20px #3b82f6; }
        .pedal.gas { background: linear-gradient(180deg, #10b981, #047857); }
        .pedal.gas:active, .pedal.gas.active { transform: scale(0.95); background: #10b981; border-color: #fff; box-shadow: 0 0 20px #10b981; }

        canvas#gameCanvas { width: 100%; height: 100%; display: block; }
        .hidden { display: none !important; }
        
        .toast {
            position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); border: 2px solid var(--accent-gold); color: #fff;
            padding: 10px 20px; font-weight: 900; border-radius: 12px; z-index: 100;
            display: none; white-space: nowrap; text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <div class="toast" id="toastMsg">Уведомление</div>

        <!-- ИГРОВОЙ ХУД -->
        <div class="hud hidden" id="gameHud">
            <div class="hud-badge">🏁 <span id="hudRoom">СИНГЛ</span></div>
            <div class="hud-badge">⚡ <span id="hudSpeed">0 KM/H</span></div>
        </div>

        <!-- ГЛАВНОЕ МЕНЮ -->
        <div class="menu-screen" id="mainMenu">
            <div class="logo">STREET <span>DRAG</span></div>

            <div class="menu-card">
                <div class="section-title">АВТОМОБИЛЬ</div>
                <div class="car-carousel" id="carSelector">
                    <!-- Заполняется JS -->
                </div>
            </div>

            <div class="menu-card">
                <div class="section-title">Ставка (Баланс: <span id="balanceDisplay">0</span>₽)</div>
                <input type="text" class="styled-input" id="betInput" value="10 000">
                <div class="flex-row">
                    <button class="btn btn-gold" data-amt="5000">5K</button>
                    <button class="btn btn-gold" data-amt="10000">10K</button>
                    <button class="btn btn-gold" data-amt="25000">25K</button>
                </div>
            </div>

            <button class="btn btn-blue" id="btnSingle" style="margin-bottom: 12px;">🚗 ОДИНОЧНАЯ (ИИ)</button>

            <div class="menu-card">
                <div class="section-title">Мультиплеер (с другом)</div>
                <input type="text" class="styled-input" id="roomCodeInput" placeholder="КОД КОМНАТЫ" maxlength="6">
                <div class="flex-row">
                    <button class="btn btn-green" id="btnCreateRoom">СОЗДАТЬ</button>
                    <button class="btn btn-gold" id="btnJoinRoom">ВОЙТИ</button>
                </div>
            </div>
        </div>

        <!-- КАНВАС ИГРЫ -->
        <canvas id="gameCanvas"></canvas>

        <!-- ПЕДАЛИ -->
        <div class="controls hidden" id="controlsLayer">
            <div class="pedal nitro" id="btnNitro">N2O</div>
            <div class="pedal gas" id="btnGas">GAS</div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const tg = window.Telegram?.WebApp;
            if (tg) { tg.expand(); tg.ready(); }

            const API_BASE = 'https://resellgame.bothost.tech';
            let userId = null;
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('userId')) userId = urlParams.get('userId');
            else if (tg?.initDataUnsafe?.user?.id) userId = tg.initDataUnsafe.user.id;

            // БАЗА МАШИН (Из bot 2.py)
            const CARS_DB = [
                { id: "zhiguli", name: "Жигули", speed_bonus: 10, color: '#e74c3c', shape: 'box' },
                { id: "granta", name: "Лада Гранта", speed_bonus: 15, color: '#95a5a6', shape: 'sedan' },
                { id: "cclass", name: "C-Class", speed_bonus: 35, color: '#cbd5e1', shape: 'sedan' },
                { id: "mustang", name: "Mustang", speed_bonus: 30, color: '#3b82f6', shape: 'muscle' },
                { id: "w140", name: "W140", speed_bonus: 28, color: '#1e293b', shape: 'box' },
                { id: "bmwm4", name: "BMW M4", speed_bonus: 45, color: '#f59e0b', shape: 'sport' },
                { id: "challenger", name: "Challenger", speed_bonus: 55, color: '#8b5cf6', shape: 'muscle' },
                { id: "ramtrx", name: "Ram TRX", speed_bonus: 60, color: '#0f172a', shape: 'truck' },
                { id: "bmwm5", name: "BMW M5", speed_bonus: 70, color: '#2563eb', shape: 'sedan' },
                { id: "sclass", name: "S-Class", speed_bonus: 75, color: '#000000', shape: 'sedan' },
                { id: "bmwx7", name: "BMW X7", speed_bonus: 70, color: '#ffffff', shape: 'suv' },
                { id: "rollsroyce", name: "Rolls-Royce", speed_bonus: 95, color: '#334155', shape: 'luxury' },
                { id: "aventador", name: "Aventador", speed_bonus: 98, color: '#10b981', shape: 'supercar' },
                { id: "brabus", name: "Brabus", speed_bonus: 99, color: '#111111', shape: 'suv' }
            ];

            let selectedCar = CARS_DB[3]; // Mustang по умолчанию
            let casinoBalance = 0;
            let raceBet = 10000;
            let socket = null;
            let isMultiplayer = false;

            // DOM Elements
            const mainMenu = document.getElementById('mainMenu');
            const gameHud = document.getElementById('gameHud');
            const controlsLayer = document.getElementById('controlsLayer');
            const toastMsg = document.getElementById('toastMsg');
            const balanceDisplay = document.getElementById('balanceDisplay');
            const hudSpeed = document.getElementById('hudSpeed');
            const hudRoom = document.getElementById('hudRoom');
            const appContainer = document.getElementById('appContainer');

            // Canvas Setup
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            let cw = window.innerWidth;
            let ch = window.innerHeight;
            canvas.width = cw;
            canvas.height = ch;

            // Состояние Игры
            const TRACK_LENGTH = 15000; // Дистанция в "пикселях"
            let gameActive = false;
            let lastTime = 0;
            let bgScrollX = 0;
            let screenShake = 0;
            
            // Светофор: 0 - подготовка, 1..3 - красные, 4 - зеленый (СТАРТ)
            let countdown = 0; 
            let countdownTimer = 0;

            // Сущности
            let player = { dist: 0, speed: 0, car: selectedCar, isGas: false, isNitro: false, nitroAmount: 100 };
            let enemy = { dist: 0, speed: 0, car: CARS_DB[5] };

            function showToast(msg) {
                toastMsg.textContent = msg;
                toastMsg.style.display = 'block';
                setTimeout(() => toastMsg.style.display = 'none', 3000);
            }

            function formatNumber(n) { return (n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
            function parseNumber(s) { return parseInt(s.toString().replace(/\s/g, '')) || 0; }

            // Инициализация Меню Машин
            function initCarSelector() {
                const container = document.getElementById('carSelector');
                container.innerHTML = '';
                CARS_DB.forEach(car => {
                    const card = document.createElement('div');
                    card.className = `car-card ${car.id === selectedCar.id ? 'active' : ''}`;
                    card.innerHTML = `<div class="c-name">${car.name}</div><div class="c-stats">⚡ ${car.speed_bonus}</div>`;
                    card.onclick = () => {
                        document.querySelectorAll('.car-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                        selectedCar = car;
                    };
                    container.appendChild(card);
                });
            }

            // Загрузка баланса
            async function loadBalance() {
                if (!userId) return;
                try {
                    const resp = await fetch(`${API_BASE}/profile/${encodeURIComponent(userId)}`);
                    const data = await resp.json();
                    casinoBalance = Number(data.casino_balance ?? data.balance ?? 0);
                    balanceDisplay.textContent = formatNumber(casinoBalance);
                } catch(e) {}
            }

            // ==========================================================================
            // 2D ГРАФИКА: ФОН И ПАРАЛЛАКС
            // ==========================================================================
            function drawBackground() {
                // Небо
                let grad = ctx.createLinearGradient(0, 0, 0, ch * 0.6);
                grad.addColorStop(0, '#38bdf8'); // Голубое небо
                grad.addColorStop(1, '#fef08a'); // Песочный горизонт
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, cw, ch);

                // Дальние горы (параллакс 0.1)
                ctx.fillStyle = '#b45309';
                ctx.beginPath();
                let m1X = -(bgScrollX * 0.1) % cw;
                ctx.moveTo(m1X - cw, ch * 0.6);
                ctx.lineTo(m1X - cw * 0.6, ch * 0.3);
                ctx.lineTo(m1X - cw * 0.2, ch * 0.6);
                ctx.lineTo(m1X + cw * 0.2, ch * 0.4);
                ctx.lineTo(m1X + cw * 0.7, ch * 0.6);
                ctx.lineTo(m1X + cw * 1.3, ch * 0.35);
                ctx.lineTo(cw * 2, ch * 0.6);
                ctx.fill();

                // Ближние песчаные дюны (параллакс 0.3)
                ctx.fillStyle = '#d97706';
                ctx.beginPath();
                let m2X = -(bgScrollX * 0.3) % cw;
                ctx.moveTo(m2X - cw, ch * 0.6);
                ctx.lineTo(m2X - cw * 0.5, ch * 0.5);
                ctx.lineTo(m2X, ch * 0.6);
                ctx.lineTo(m2X + cw * 0.5, ch * 0.48);
                ctx.lineTo(m2X + cw, ch * 0.6);
                ctx.lineTo(m2X + cw * 1.5, ch * 0.52);
                ctx.lineTo(cw * 2, ch * 0.6);
                ctx.fill();

                // Кактусы (параллакс 0.5)
                ctx.fillStyle = '#15803d';
                let cX = -(bgScrollX * 0.5) % (cw * 2);
                for(let i = 0; i < 5; i++) {
                    let cx_pos = cX + i * 400 - cw;
                    if(cx_pos > -50 && cx_pos < cw + 50) {
                        ctx.fillRect(cx_pos, ch * 0.5, 12, 60);
                        ctx.fillRect(cx_pos - 15, ch * 0.54, 15, 8);
                        ctx.fillRect(cx_pos - 15, ch * 0.5, 8, 12);
                        ctx.fillRect(cx_pos + 12, ch * 0.56, 15, 8);
                        ctx.fillRect(cx_pos + 19, ch * 0.52, 8, 12);
                    }
                }

                // Дорога
                let roadY = ch * 0.6;
                let roadH = ch * 0.4;
                
                // Песок у обочины
                ctx.fillStyle = '#b45309';
                ctx.fillRect(0, roadY, cw, 20);

                // Асфальт
                ctx.fillStyle = '#334155';
                ctx.fillRect(0, roadY + 20, cw, roadH - 20);

                // Верхний отбойник
                ctx.fillStyle = '#cbd5e1';
                ctx.fillRect(0, roadY + 15, cw, 10);
                // Столбики отбойника
                ctx.fillStyle = '#94a3b8';
                let fenceX = -(bgScrollX * 1.0) % 100;
                for(let i = -100; i < cw + 100; i+= 100) {
                    ctx.fillRect(fenceX + i, roadY + 5, 8, 15);
                }

                // Разделительная белая полоса
                ctx.fillStyle = '#ffffff';
                let lineX = -(bgScrollX * 1.0) % 80;
                for(let i = -80; i < cw + 80; i+= 80) {
                    ctx.fillRect(lineX + i, roadY + 20 + (roadH - 20)/2 - 3, 40, 6);
                }

                // Линия Старта / Финиша
                if (player.dist < 500) {
                    let startLineX = 150 - player.dist;
                    drawCheckeredLine(startLineX, roadY + 20, roadH - 20);
                }
                if (player.dist > TRACK_LENGTH - cw) {
                    let finishLineX = 150 + (TRACK_LENGTH - player.dist);
                    drawCheckeredLine(finishLineX, roadY + 20, roadH - 20);
                }
            }

            function drawCheckeredLine(x, y, h) {
                if (x < -50 || x > cw + 50) return;
                let sq = 10;
                for (let i = 0; i < h / sq; i++) {
                    ctx.fillStyle = (i % 2 === 0) ? '#fff' : '#000';
                    ctx.fillRect(x, y + i * sq, sq, sq);
                    ctx.fillStyle = (i % 2 === 0) ? '#000' : '#fff';
                    ctx.fillRect(x + sq, y + i * sq, sq, sq);
                }
            }

            // ==========================================================================
            // ПРОЦЕДУРНАЯ ГЕНЕРАЦИЯ 2D МАШИН
            // ==========================================================================
            function drawCar(x, y, carConfig, isPlayer) {
                ctx.save();
                ctx.translate(x, y);
                
                // Легкое покачивание на скорости
                if (gameActive && countdown >= 4 && carConfig.speed > 10) {
                    ctx.translate(0, Math.sin(Date.now() / 50) * 1.5);
                }

                let color = carConfig.car.color || '#ff0000';
                let shape = carConfig.car.shape || 'sedan';

                // Тень
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.beginPath();
                ctx.ellipse(0, 15, 60, 8, 0, 0, Math.PI*2);
                ctx.fill();

                // Огонь из выхлопа (Нитро)
                if (isPlayer && player.isNitro && player.nitroAmount > 0 && countdown >= 4) {
                    ctx.fillStyle = '#3b82f6';
                    ctx.beginPath(); ctx.moveTo(-60, 5); ctx.lineTo(-90 - Math.random()*30, 8); ctx.lineTo(-60, 11); ctx.fill();
                    ctx.fillStyle = '#fef08a';
                    ctx.beginPath(); ctx.moveTo(-60, 7); ctx.lineTo(-80 - Math.random()*15, 8); ctx.lineTo(-60, 9); ctx.fill();
                }

                // Базовый кузов
                ctx.fillStyle = color;
                
                if (shape === 'supercar') {
                    // Клиновидная форма
                    ctx.beginPath(); ctx.moveTo(-50, 8); ctx.lineTo(-50, -2); ctx.lineTo(-10, -14); 
                    ctx.lineTo(20, -12); ctx.lineTo(55, 0); ctx.lineTo(55, 8); ctx.closePath(); ctx.fill();
                    // Спойлер
                    ctx.fillStyle = '#000'; ctx.fillRect(-48, -12, 4, 10); ctx.fillRect(-52, -14, 12, 3);
                } else if (shape === 'truck') {
                    // Высокий пикап
                    ctx.fillRect(-55, -5, 110, 10); // База
                    ctx.fillRect(-10, -25, 45, 20); // Кабина
                    // Кузов сзади
                    ctx.fillStyle = '#1e293b'; ctx.fillRect(-55, -15, 45, 10);
                } else if (shape === 'muscle') {
                    // Длинный капот
                    ctx.beginPath(); ctx.moveTo(-50, 8); ctx.lineTo(-50, 0); ctx.lineTo(-20, -4);
                    ctx.lineTo(-10, -16); ctx.lineTo(20, -16); ctx.lineTo(35, -4); ctx.lineTo(55, -2);
                    ctx.lineTo(55, 8); ctx.closePath(); ctx.fill();
                    // Полоски
                    ctx.fillStyle = '#fff'; ctx.fillRect(35, -4, 20, 3);
                } else {
                    // Стандартный седан / коробка
                    ctx.beginPath(); ctx.moveTo(-50, 8); ctx.lineTo(-50, -2); ctx.lineTo(-30, -4);
                    ctx.lineTo(-15, -18); ctx.lineTo(15, -18); ctx.lineTo(30, -4); ctx.lineTo(50, -2);
                    ctx.lineTo(50, 8); ctx.closePath(); ctx.fill();
                }

                // Стекла (Тонировка)
                ctx.fillStyle = '#0f172a';
                if (shape === 'supercar') {
                    ctx.beginPath(); ctx.moveTo(-8, -12); ctx.lineTo(15, -10); ctx.lineTo(30, 0); ctx.lineTo(-5, 0); ctx.fill();
                } else if (shape === 'truck') {
                    ctx.fillRect(-5, -20, 35, 15);
                } else {
                    ctx.beginPath(); ctx.moveTo(-10, -16); ctx.lineTo(10, -16); ctx.lineTo(20, -4); ctx.lineTo(-20, -4); ctx.fill();
                }

                // Колеса
                let wheelRot = (carConfig.dist * 0.1) % (Math.PI * 2);
                const drawWheel = (wx, wy, size) => {
                    ctx.save(); ctx.translate(wx, wy); ctx.rotate(wheelRot);
                    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI*2); ctx.fill(); // Шина
                    ctx.fillStyle = '#cbd5e1'; ctx.beginPath(); ctx.arc(0, 0, size*0.6, 0, Math.PI*2); ctx.fill(); // Диск
                    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(-size*0.6, 0); ctx.lineTo(size*0.6, 0); ctx.moveTo(0, -size*0.6); ctx.lineTo(0, size*0.6); ctx.stroke();
                    ctx.restore();
                };

                let wSize = shape === 'truck' ? 14 : 11;
                drawWheel(-30, 8, wSize);
                drawWheel(30, 8, wSize);

                ctx.restore();
            }

            function drawTrafficLight() {
                if (countdown < 0 || countdown >= 4) return;
                
                let startX = cw / 2 - 40;
                let startY = 40;
                
                ctx.fillStyle = '#1e293b';
                ctx.beginPath(); ctx.roundRect(startX, startY, 80, 180, 10); ctx.fill();
                ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 3; ctx.stroke();

                let colors = ['#ef4444', '#ef4444', '#f59e0b', '#10b981'];
                for(let i = 0; i < 4; i++) {
                    ctx.fillStyle = (countdown === i) ? colors[i] : '#334155';
                    if (countdown >= 4 && i === 3) ctx.fillStyle = '#10b981'; // Горит зеленый при старте
                    
                    ctx.beginPath();
                    ctx.arc(cw / 2, startY + 30 + i * 40, 12, 0, Math.PI*2);
                    ctx.fill();
                }
            }

            // ==========================================================================
            // ИГРОВОЙ ЦИКЛ И ФИЗИКА
            // ==========================================================================
            function render() {
                // Если игрок трясется от нитро
                ctx.save();
                if (screenShake > 0) {
                    let dx = (Math.random() - 0.5) * screenShake;
                    let dy = (Math.random() - 0.5) * screenShake;
                    ctx.translate(dx, dy);
                    screenShake *= 0.9; // Затухание
                }

                drawBackground();

                let roadY = ch * 0.6 + 20;
                let laneH = (ch * 0.4 - 20) / 2;

                // Рисуем машины
                // Оппонент - Дальняя полоса (сверху)
                let enemyScale = 0.8;
                let enemyScreenX = 150 + (enemy.dist - player.dist) * 1.5; // Относительная позиция
                if (enemyScreenX > -100 && enemyScreenX < cw + 100) {
                    ctx.save();
                    ctx.translate(enemyScreenX, roadY + laneH / 2 - 10);
                    ctx.scale(enemyScale, enemyScale);
                    drawCar(0, 0, enemy, false);
                    ctx.restore();
                }

                // Игрок - Ближняя полоса (снизу)
                let playerScale = 1.0;
                ctx.save();
                ctx.translate(150, roadY + laneH + laneH / 2 - 10);
                ctx.scale(playerScale, playerScale);
                drawCar(0, 0, player, true);
                ctx.restore();

                drawTrafficLight();

                ctx.restore();
            }

            function update(dt) {
                if (!gameActive) return;

                // 1. Светофор
                if (countdown < 4) {
                    countdownTimer += dt;
                    if (countdownTimer >= 1.0) {
                        countdown++;
                        countdownTimer = 0;
                        if (countdown === 4) showToast("🚀 СТАРТ!");
                    }
                    // Фальстарт не делаем для простоты, ждем зеленого
                    return; 
                }

                // 2. Физика Игрока
                let pBaseSpeed = 150 + player.car.speed_bonus * 2;
                let pAccel = 80 + player.car.speed_bonus * 1.5;

                if (player.isGas) {
                    let currentAccel = pAccel;
                    if (player.isNitro && player.nitroAmount > 0) {
                        currentAccel *= 2.5; // Жесткий буст
                        pBaseSpeed += 150;
                        player.nitroAmount -= 30 * dt;
                        screenShake = 5; // Тряска экрана
                    }
                    player.speed += currentAccel * dt;
                } else {
                    player.speed -= 100 * dt; // Трение
                }

                player.speed = Math.max(0, Math.min(player.speed, pBaseSpeed));
                player.dist += player.speed * dt;
                bgScrollX = player.dist; // Двигаем фон

                // 3. Физика Оппонента (ИИ в синглплеере)
                if (!isMultiplayer) {
                    let eBaseSpeed = 150 + enemy.car.speed_bonus * 2;
                    let eAccel = 80 + enemy.car.speed_bonus * 1.5;
                    
                    enemy.speed += eAccel * dt; // ИИ всегда жмет газ
                    if (enemy.dist > TRACK_LENGTH * 0.3 && enemy.dist < TRACK_LENGTH * 0.6) {
                        // ИИ использует "нитро" в середине трассы
                        enemy.speed += eAccel * 1.0 * dt;
                        eBaseSpeed += 100;
                    }

                    enemy.speed = Math.max(0, Math.min(enemy.speed, eBaseSpeed));
                    enemy.dist += enemy.speed * dt;
                }

                // Обновление HUD
                hudSpeed.textContent = Math.round(player.speed) + ' KM/H';

                // 4. Проверка Финиша
                if (player.dist >= TRACK_LENGTH || enemy.dist >= TRACK_LENGTH) {
                    gameActive = false;
                    let isWin = player.dist >= enemy.dist;
                    
                    if (isMultiplayer && socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({ type: 'finish', senderId: userId }));
                    } else {
                        finishRace(isWin);
                    }
                }

                // 5. Сетевая отправка
                if (isMultiplayer && socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        type: 'move',
                        senderId: userId,
                        dist: player.dist
                    }));
                }
            }

            function gameLoop(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = (timestamp - lastTime) / 1000;
                lastTime = timestamp;

                update(dt);
                render();

                if (gameActive) requestAnimationFrame(gameLoop);
            }

            // ==========================================================================
            // ЛОГИКА СТАРТА И СЕТИ
            // ==========================================================================
            function startRaceVisuals() {
                mainMenu.classList.add('hidden');
                gameHud.classList.remove('hidden');
                controlsLayer.classList.remove('hidden');

                player.dist = 0; player.speed = 0; player.nitroAmount = 100;
                enemy.dist = 0; enemy.speed = 0;
                countdown = 0; countdownTimer = 0;
                bgScrollX = 0;

                gameActive = true;
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }

            async function finishRace(isWin) {
                let winAmt = isWin ? Math.floor(raceBet * 1.9) : 0;
                try {
                    const res = await sendGameResult(isWin ? 'win' : 'lose', raceBet, winAmt);
                    if (res.new_balance !== undefined) {
                        casinoBalance = Number(res.new_balance);
                        hudBalance.textContent = formatNumber(casinoBalance) + ' ₽';
                    }
                } catch(e) {}

                alert(isWin ? `🏆 ПОБЕДА В ДРАГЕ!\nЗаработано: ${formatNumber(winAmt)} ₽` : `❌ ПРОИГРЫШ!\nСоперник оказался быстрее.`);
                location.reload();
            }

            // Синглплеер
            document.getElementById('btnSingle').onclick = () => {
                raceBet = parseNumber(document.getElementById('betInput').value);
                if (raceBet > casinoBalance) { showToast('Недостаточно средств!'); return; }
                
                isMultiplayer = false;
                hudRoom.textContent = "СИНГЛ";
                
                // Выбираем ИИ случайную машину
                enemy.car = CARS_DB[Math.floor(Math.random() * CARS_DB.length)];
                startRaceVisuals();
            };

            // Мультиплеер
            function connectWebSocket(code) {
                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                socket = new WebSocket(`${wsProtocol}//resellgame.bothost.tech/ws/race/${code}?userId=${userId}`);

                socket.onopen = () => {
                    showToast(`Ожидание соперника в комнате ${code}...`);
                    hudRoom.textContent = code;
                    
                    // Сообщаем сопернику, какую машину мы выбрали
                    socket.send(JSON.stringify({ type: 'join', senderId: userId, carId: selectedCar.id }));
                    
                    // Начинаем гонку (в реале лучше ждать подтверждения от второго, но для простоты запускаем)
                    setTimeout(() => startRaceVisuals(), 2000); 
                };

                socket.onmessage = (e) => {
                    try {
                        const data = JSON.parse(e.data);
                        if (data.type === 'join' && data.senderId !== userId) {
                            // Устанавливаем машину сопернику
                            let eCar = CARS_DB.find(c => c.id === data.carId);
                            if (eCar) enemy.car = eCar;
                        }
                        if (data.type === 'move' && data.senderId !== userId) {
                            enemy.dist = data.dist;
                        }
                        if (data.type === 'game_over') {
                            gameActive = false;
                            finishRace(data.winnerId === userId);
                        }
                    } catch(err) {}
                };

                socket.onerror = () => {
                    showToast("Сбой сети. Запуск Сингла.");
                    startRaceVisuals();
                };
            }

            document.getElementById('btnCreateRoom').onclick = () => {
                raceBet = parseNumber(document.getElementById('betInput').value);
                if (raceBet > casinoBalance) { showToast('Недостаточно средств!'); return; }
                isMultiplayer = true;
                let code = Math.floor(1000 + Math.random() * 9000).toString();
                connectWebSocket(code);
            };

            document.getElementById('btnJoinRoom').onclick = () => {
                raceBet = parseNumber(document.getElementById('betInput').value);
                if (raceBet > casinoBalance) { showToast('Недостаточно средств!'); return; }
                let code = document.getElementById('roomCodeInput').value.trim();
                if (!code) { showToast('Введите код комнаты!'); return; }
                isMultiplayer = true;
                connectWebSocket(code);
            };

            // ==========================================================================
            // УПРАВЛЕНИЕ И ИНИЦИАЛИЗАЦИЯ
            // ==========================================================================
            const btnGas = document.getElementById('btnGas');
            const btnNitro = document.getElementById('btnNitro');

            const bindBtn = (el, prop) => {
                const press = (e) => { e.preventDefault(); player[prop] = true; el.classList.add('active'); };
                const release = (e) => { e.preventDefault(); player[prop] = false; el.classList.remove('active'); };
                el.addEventListener('touchstart', press);
                el.addEventListener('mousedown', press);
                el.addEventListener('touchend', release);
                el.addEventListener('mouseup', release);
                el.addEventListener('mouseleave', release);
            };

            bindBtn(btnGas, 'isGas');
            bindBtn(btnNitro, 'isNitro');

            document.querySelectorAll('[data-amt]').forEach(btn => {
                btn.onclick = () => document.getElementById('betInput').value = formatNumber(parseInt(btn.dataset.amt));
            });

            document.getElementById('betInput').addEventListener('input', function() {
                this.value = formatNumber(parseNumber(this.value));
            });

            window.addEventListener('resize', () => {
                cw = window.innerWidth; ch = window.innerHeight;
                canvas.width = cw; canvas.height = ch;
                if (!gameActive) render(); // Перерисовка меню
            });

            initCarSelector();
            loadBalance();
            render(); // Рисуем фон под меню

        })();
    </script>
</body>
</html>
