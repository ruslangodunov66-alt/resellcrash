<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Resell Racing</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,900&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           1. UI ИНТЕРФЕЙС И МЕНЮ (СОВРЕМЕННЫЙ СТИЛЬ)
           ========================================================================== */
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(15, 23, 42, 0.95);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-gold: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background: #000;
            font-family: 'Nunito', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-wrapper {
            max-width: 600px; /* Оптимально для телефонов */
            width: 100%;
            height: 100vh;
            max-height: 900px;
            background: #4ab8f2;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* ===== МЕНЮ ===== */
        .menu-screen {
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.98) 0%, rgba(2, 6, 23, 0.95) 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 20px; z-index: 100; overflow-y: auto;
        }

        .logo {
            font-family: 'Montserrat', sans-serif; font-size: 38px; font-weight: 900; font-style: italic;
            text-transform: uppercase; color: #fff; text-shadow: 0 4px 15px rgba(59, 130, 246, 0.6);
            margin-top: 10px; margin-bottom: 20px; text-align: center; line-height: 1.1;
        }
        .logo span { color: var(--accent-gold); display: block; font-size: 20px; letter-spacing: 4px; }

        .menu-card {
            width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 16px; margin-bottom: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
        }

        .section-title { font-size: 11px; font-weight: 900; color: #94a3b8; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }

        /* Карусель машин */
        .car-carousel {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x mandatory;
        }
        .car-carousel::-webkit-scrollbar { height: 4px; }
        .car-carousel::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 4px; }
        
        .car-card {
            min-width: 140px; background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; transition: all 0.2s;
            scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .car-card.active { background: rgba(245, 158, 11, 0.15); border-color: var(--accent-gold); transform: scale(1.02); }
        .car-card .c-name { font-size: 13px; font-weight: 900; white-space: nowrap; }
        .car-card .c-stats { font-size: 10px; color: var(--accent-green); font-weight: 800; background: rgba(16,185,129,0.15); padding: 2px 6px; border-radius: 6px; }

        .car-preview { width: 100px; height: 45px; }

        input.styled-input {
            width: 100%; height: 48px; background: rgba(0,0,0,0.6); border: 2px solid var(--border-color);
            border-radius: 12px; color: #fff; font-family: 'Montserrat', sans-serif; font-weight: 900;
            font-size: 18px; text-align: center; outline: none; margin-bottom: 8px; transition: 0.2s;
        }
        input.styled-input:focus { border-color: var(--accent-blue); }

        .btn {
            width: 100%; height: 52px; border: none; border-radius: 12px;
            font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 15px;
            color: #fff; cursor: pointer; text-transform: uppercase; transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-green { background: linear-gradient(135deg, #10b981, #047857); box-shadow: 0 4px 15px rgba(16,185,129,0.4); color: #fff; }
        .btn-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); box-shadow: 0 4px 15px rgba(59,130,246,0.4); }
        .btn-gold { background: linear-gradient(135deg, #f59e0b, #b45309); box-shadow: 0 4px 15px rgba(245,158,11,0.4); }
        
        .flex-row { display: flex; gap: 8px; }
        .flex-row .btn { flex: 1; }

        /* ===== HUD ИГРЫ ===== */
        .hud {
            position: absolute; top: 16px; left: 16px; right: 16px;
            display: flex; justify-content: space-between; align-items: flex-start; z-index: 50; pointer-events: none;
        }
        .hud-badge {
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border: 1px solid var(--border-color);
            padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 800; color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center;
        }
        .hud-badge span { color: var(--accent-gold); font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 15px;}

        .tachometer {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            background: rgba(0,0,0,0.7); padding: 8px; border-radius: 12px; border: 1px solid var(--border-color);
        }
        .rpm-bar { width: 100px; height: 10px; background: #334155; border-radius: 5px; overflow: hidden; position: relative; }
        .rpm-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444); transition: width 0.1s linear; }
        .gear-text { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 16px; color: #fff; }

        /* ===== ОВЕРЛЕЙ УПРАВЛЕНИЯ (Как на скриншоте) ===== */
        .controls {
            position: absolute; bottom: 20px; left: 16px; right: 16px;
            display: flex; justify-content: space-between; align-items: flex-end; z-index: 50;
        }
        .ctrl-group { display: flex; gap: 10px; align-items: flex-end; }
        
        .pedal {
            border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 15px; color: #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); cursor: pointer; transition: transform 0.05s;
            border: 2px solid rgba(255,255,255,0.2); user-select: none;
        }
        
        /* Кнопки передач (Стрелки) */
        .btn-shift { width: 65px; height: 65px; background: rgba(30, 41, 59, 0.9); font-size: 24px; border-radius: 16px; }
        .btn-shift:active { background: rgba(59, 130, 246, 0.8); transform: scale(0.92); border-color: #fff; }

        /* N2O (Круглая синяя) */
        .pedal.nitro { background: linear-gradient(135deg, #3b82f6, #1d4ed8); width: 75px; height: 75px; border-radius: 50%; font-size: 18px; margin-left: 10px;}
        .pedal.nitro:active { transform: scale(0.9); background: #2563eb; border-color: #fff; box-shadow: 0 0 20px #3b82f6; }
        
        /* Тормоз (Красный ▼) */
        .pedal.brake { background: linear-gradient(135deg, #ef4444, #b91c1c); width: 65px; height: 65px; }
        .pedal.brake:active { transform: scale(0.92); border-color: #fff; }

        /* Газ (Зеленый ▲ - Вытянутый вверх) */
        .pedal.gas { background: linear-gradient(180deg, #10b981, #047857); width: 80px; height: 110px; }
        .pedal.gas:active { transform: scale(0.95); border-color: #fff; box-shadow: 0 0 25px #10b981; }

        canvas#gameCanvas { width: 100%; height: 100%; display: block; }
        .hidden { display: none !important; }
        
        .toast {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95); border: 2px solid var(--accent-gold); color: #fff;
            padding: 12px 24px; font-weight: 900; border-radius: 12px; z-index: 100;
            display: none; white-space: nowrap; text-transform: uppercase; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div class="game-wrapper" id="appContainer">
        <div class="toast" id="toastMsg">Уведомление</div>

        <!-- ИГРОВОЙ ХУД -->
        <div class="hud hidden" id="gameHud">
            <div class="hud-badge">🏁 <span id="hudRoom">СИНГЛ</span></div>
            
            <div class="tachometer">
                <div class="rpm-bar"><div class="rpm-fill" id="rpmFill"></div></div>
                <div class="gear-text" id="hudGear">GEAR 1</div>
            </div>

            <div class="hud-badge">⚡ <span id="hudSpeed">0</span> KM/H</div>
        </div>

        <!-- ГЛАВНОЕ МЕНЮ -->
        <div class="menu-screen" id="mainMenu">
            <div class="logo">RESELL <span>RACING</span></div>

            <div class="menu-card">
                <div class="section-title">АВТОМОБИЛЬ ИЗ ГАРАЖА</div>
                <div class="car-carousel" id="carSelector"></div>
            </div>

            <div class="menu-card">
                <div class="section-title">Ставка (Баланс: <span id="balanceDisplay">0</span>₽)</div>
                <input type="text" class="styled-input" id="betInput" value="10 000">
                <div class="flex-row">
                    <button class="btn btn-gold" data-amt="5000">5K</button>
                    <button class="btn btn-gold" data-amt="10000">10K</button>
                    <button class="btn btn-gold" data-amt="25000">25K</button>
                </div>
            </div>

            <button class="btn btn-green" id="btnSingle" style="margin-bottom: 12px; height: 56px; font-size: 16px;">🚗 ОДИНОЧНАЯ ИГРА</button>

            <div class="menu-card">
                <div class="section-title">МУЛЬТИПЛЕЕР</div>
                <input type="text" class="styled-input" id="roomCodeInput" placeholder="КОД КОМНАТЫ" maxlength="6">
                <div class="flex-row">
                    <button class="btn btn-blue" id="btnCreateRoom">СОЗДАТЬ</button>
                    <button class="btn btn-gold" id="btnJoinRoom">ВОЙТИ</button>
                </div>
            </div>
        </div>

        <!-- КАНВАС ИГРЫ -->
        <canvas id="gameCanvas"></canvas>

        <!-- ОВЕРЛЕЙ УПРАВЛЕНИЯ -->
        <div class="controls hidden" id="controlsLayer">
            <!-- Левый блок: Нитро и Передачи -->
            <div class="ctrl-group">
                <div class="pedal btn-shift" id="btnShiftDown">◄</div>
                <div class="pedal btn-shift" id="btnShiftUp">►</div>
                <div class="pedal nitro" id="btnNitro">N2O</div>
            </div>
            <!-- Правый блок: Тормоз и Газ -->
            <div class="ctrl-group">
                <div class="pedal brake" id="btnBrake"><span style="font-size: 20px;">▼</span></div>
                <div class="pedal gas" id="btnGas"><span style="font-size: 24px;">▲</span>ГАЗ</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const tg = window.Telegram?.WebApp;
            if (tg) { tg.expand(); tg.ready(); }

            const API_BASE = 'https://resellgame.bothost.tech';
            let userId = null;
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('userId')) userId = urlParams.get('userId');
            else if (urlParams.has('user_id')) userId = urlParams.get('user_id');
            else if (tg?.initDataUnsafe?.user?.id) userId = tg.initDataUnsafe.user.id;

            // ==========================================================================
            // АУДИО ДВИЖОК (Генерация звуков мотора и эффектов)
            // ==========================================================================
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let engineOsc = null;
            let engineGain = null;

            function playSound(type) {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);

                let now = audioCtx.currentTime;
                if (type === 'shift') {
                    // Пшшшш (Blow off valve)
                    osc.type = 'square'; osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'nitro') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(300, now + 1.5);
                    gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 1.5);
                    osc.start(now); osc.stop(now + 1.5);
                } else if (type === 'win') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554, now + 0.2); osc.frequency.setValueAtTime(659, now + 0.4);
                    gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 1.0);
                    osc.start(now); osc.stop(now + 1.0);
                }
            }

            function startEngine() {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                if(!engineOsc) {
                    engineOsc = audioCtx.createOscillator();
                    engineGain = audioCtx.createGain();
                    engineOsc.type = 'sawtooth';
                    engineOsc.connect(engineGain); engineGain.connect(audioCtx.destination);
                    engineGain.gain.value = 0.05;
                    engineOsc.start();
                }
            }
            function updateEngine(rpm) {
                if(engineOsc) {
                    engineOsc.frequency.setValueAtTime(50 + rpm * 100, audioCtx.currentTime); // Pitch based on RPM
                }
            }
            function stopEngine() {
                if(engineOsc) { engineOsc.stop(); engineOsc.disconnect(); engineOsc = null; }
            }

            // ==========================================================================
            // БАЗА 14 МАШИН ИЗ bot.py
            // ==========================================================================
            const CARS_DB = [
                { id: "zhiguli", name: "ВАЗ-2106", speed_bonus: 10, color: '#e74c3c', type: 'box' },
                { id: "granta", name: "Лада Гранта", speed_bonus: 15, color: '#95a5a6', type: 'sedan' },
                { id: "w140", name: "Mercedes W140", speed_bonus: 28, color: '#1e293b', type: 'luxury' },
                { id: "mustang", name: "Ford Mustang", speed_bonus: 30, color: '#3b82f6', type: 'muscle' },
                { id: "cclass", name: "Mercedes C-Class", speed_bonus: 35, color: '#cbd5e1', type: 'sedan' },
                { id: "bmwm4", name: "BMW M4", speed_bonus: 45, color: '#f59e0b', type: 'sport' },
                { id: "challenger", name: "Dodge Challenger", speed_bonus: 55, color: '#8b5cf6', type: 'muscle' },
                { id: "ramtrx", name: "Dodge Ram TRX", speed_bonus: 60, color: '#0f172a', type: 'truck' },
                { id: "bmwm5", name: "BMW M5 F90", speed_bonus: 70, color: '#2563eb', type: 'sport' },
                { id: "sclass", name: "Mercedes S-Class", speed_bonus: 75, color: '#000000', type: 'luxury' },
                { id: "bmwx7", name: "BMW X7", speed_bonus: 70, color: '#ffffff', type: 'suv' },
                { id: "rollsroyce", name: "Rolls-Royce", speed_bonus: 95, color: '#334155', type: 'luxury' },
                { id: "aventador", name: "Lamborghini", speed_bonus: 98, color: '#10b981', type: 'supercar' },
                { id: "brabus", name: "Brabus Mansory", speed_bonus: 99, color: '#111111', type: 'suv' }
            ];

            let selectedCar = CARS_DB[3]; 
            let casinoBalance = 0;
            let raceBet = 10000;
            let socket = null;
            let isMultiplayer = false;

            // DOM Elements
            const mainMenu = document.getElementById('mainMenu');
            const gameHud = document.getElementById('gameHud');
            const controlsLayer = document.getElementById('controlsLayer');
            const toastMsg = document.getElementById('toastMsg');
            const balanceDisplay = document.getElementById('balanceDisplay');
            const hudSpeed = document.getElementById('hudSpeed');
            const hudGear = document.getElementById('hudGear');
            const rpmFill = document.getElementById('rpmFill');

            // Canvas
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            let cw = window.innerWidth; let ch = window.innerHeight;
            canvas.width = cw; canvas.height = ch;

            // Состояние Гонки
            const TRACK_DIST = 10000;
            let gameActive = false;
            let lastTime = 0;
            let bgScrollX = 0;
            let screenShake = 0;
            
            // Светофор: -1 (меню), 0..3 (красные), 4 (Старт)
            let countdown = -1;
            let countdownTimer = 0;

            // Физика машины
            class PlayerState {
                constructor(carDef) {
                    this.car = carDef;
                    this.dist = 0; this.speed = 0; 
                    this.gear = 1; this.maxGear = 6;
                    this.rpm = 0; // 0.0 to 1.0
                    this.nitroAmount = 100;
                    this.isGas = false; this.isNitro = false; this.isBrake = false;
                    
                    // Характеристики на основе speed_bonus
                    this.baseAccel = 40 + carDef.speed_bonus * 1.5;
                    this.topSpeed = 180 + carDef.speed_bonus * 2.5; 
                }
            }

            let player = new PlayerState(selectedCar);
            let enemy = new PlayerState(CARS_DB[1]);

            function showToast(msg) {
                toastMsg.textContent = msg; toastMsg.style.display = 'block';
                setTimeout(() => toastMsg.style.display = 'none', 3000);
            }

            function formatNumber(n) { return (n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
            function parseNumber(s) { return parseInt(s.toString().replace(/\s/g, '')) || 0; }

            async function loadBalance() {
                if (!userId) return;
                try {
                    const resp = await fetch(`${API_BASE}/profile/${encodeURIComponent(userId)}`);
                    const data = await resp.json();
                    casinoBalance = Number(data.casino_balance ?? data.balance ?? 0);
                    balanceDisplay.textContent = formatNumber(casinoBalance);
                } catch(e) {}
            }

            // ==========================================================================
            // 2D ГРАФИКА: КАЧЕСТВЕННЫЙ ФОН
            // ==========================================================================
            function drawEnvironment() {
                // Пустынный градиент неба
                let grad = ctx.createLinearGradient(0, 0, 0, ch * 0.6);
                grad.addColorStop(0, '#1e3a8a'); grad.addColorStop(0.5, '#ea580c'); grad.addColorStop(1, '#fde047');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, cw, ch);

                // Солнце
                ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(cw * 0.7, ch * 0.3, 50, 0, Math.PI*2); ctx.fill();

                // Параллакс Горы 1
                ctx.fillStyle = '#7c2d12'; ctx.beginPath();
                let m1X = -(bgScrollX * 0.1) % cw;
                ctx.moveTo(m1X-cw, ch*0.6); ctx.lineTo(m1X-cw*0.5, ch*0.3); ctx.lineTo(m1X, ch*0.6);
                ctx.lineTo(m1X+cw*0.5, ch*0.35); ctx.lineTo(m1X+cw, ch*0.6); ctx.lineTo(m1X+cw*1.5, ch*0.25);
                ctx.lineTo(cw*2, ch*0.6); ctx.fill();

                // Параллакс Дюны
                ctx.fillStyle = '#b45309'; ctx.beginPath();
                let m2X = -(bgScrollX * 0.3) % cw;
                ctx.moveTo(m2X-cw, ch*0.6); ctx.lineTo(m2X-cw*0.4, ch*0.45); ctx.lineTo(m2X, ch*0.6);
                ctx.lineTo(m2X+cw*0.6, ch*0.42); ctx.lineTo(m2X+cw, ch*0.6); ctx.fill();

                // Кактусы
                ctx.fillStyle = '#065f46';
                let cX = -(bgScrollX * 0.5) % 800;
                for(let i = -800; i < cw + 800; i+= 800) {
                    ctx.fillRect(cX+i, ch*0.48, 12, 60); ctx.fillRect(cX+i-16, ch*0.52, 16, 8); ctx.fillRect(cX+i+12, ch*0.5, 16, 8);
                }

                // Дорога
                let roadY = ch * 0.6; let roadH = ch * 0.4;
                ctx.fillStyle = '#d97706'; ctx.fillRect(0, roadY, cw, 20); // Обочина
                
                let ashY = roadY + 20; let ashH = roadH - 20;
                ctx.fillStyle = '#334155'; ctx.fillRect(0, ashY, cw, ashH); // Асфальт

                // Отбойник
                ctx.fillStyle = '#cbd5e1'; ctx.fillRect(0, ashY - 8, cw, 8);
                ctx.fillStyle = '#94a3b8';
                let pX = -(bgScrollX * 1.0) % 100;
                for(let i = -100; i < cw + 100; i+= 100) ctx.fillRect(pX+i, ashY - 12, 8, 12);

                // Разметка полос
                ctx.fillStyle = '#ffffff';
                let lX = -(bgScrollX * 1.0) % 80;
                for(let i = -80; i < cw + 80; i+= 80) {
                    ctx.fillRect(lX+i, ashY + ashH/2 - 4, 40, 8);
                }

                // Линия Старта
                if (player.dist < 800) {
                    drawCheckeredLine(150 - player.dist, ashY, ashH);
                }
                // Линия Финиша
                if (player.dist > TRACK_DIST - cw - 200) {
                    drawCheckeredLine(150 + (TRACK_DIST - player.dist), ashY, ashH);
                }
            }

            function drawCheckeredLine(x, y, h) {
                if(x < -50 || x > cw+50) return;
                let sq = 12;
                for(let i=0; i < h/sq; i++) {
                    ctx.fillStyle = (i%2===0) ? '#fff' : '#000'; ctx.fillRect(x, y+i*sq, sq, sq);
                    ctx.fillStyle = (i%2===0) ? '#000' : '#fff'; ctx.fillRect(x+sq, y+i*sq, sq, sq);
                }
            }

            // ==========================================================================
            // ПРОРИСОВКА МАШИН
            // ==========================================================================
            function drawCar2D(x, y, pState, isPlayer) {
                ctx.save(); ctx.translate(x, y);

                if (isPlayer && screenShake > 0) ctx.translate(0, Math.sin(Date.now() / 20) * 1.5);

                let color = pState.car.color; let type = pState.car.type;

                // Тень
                ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.beginPath(); ctx.ellipse(0, 16, 65, 8, 0, 0, Math.PI*2); ctx.fill();

                // Огонь из выхлопа (Нитро)
                if (isPlayer && pState.isNitro && pState.nitroAmount > 0 && countdown >= 4) {
                    ctx.fillStyle = '#3b82f6'; ctx.beginPath(); ctx.moveTo(-55, 4); ctx.lineTo(-90-Math.random()*30, 8); ctx.lineTo(-55, 12); ctx.fill();
                    ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.moveTo(-55, 6); ctx.lineTo(-75-Math.random()*15, 8); ctx.lineTo(-55, 10); ctx.fill();
                }

                // Кузов
                ctx.fillStyle = color;
                if (type === 'suv' || type === 'luxury' && pState.car.id === 'brabus') {
                    ctx.fillRect(-55, -20, 110, 30);
                    ctx.fillStyle = '#0f172a'; ctx.fillRect(-30, -18, 60, 14); 
                } else if (type === 'supercar') {
                    ctx.beginPath(); ctx.moveTo(-55, 10); ctx.lineTo(-50, -2); ctx.lineTo(-10, -14); ctx.lineTo(25, -12); ctx.lineTo(60, 4); ctx.lineTo(60, 10); ctx.fill();
                    ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.moveTo(-10, -12); ctx.lineTo(20, -10); ctx.lineTo(35, 0); ctx.lineTo(-5, 0); ctx.fill();
                    ctx.fillStyle = '#000'; ctx.fillRect(-52, -10, 4, 10); ctx.fillRect(-56, -12, 14, 3); // Спойлер
                } else if (type === 'muscle') {
                    ctx.beginPath(); ctx.moveTo(-55, 10); ctx.lineTo(-52, -2); ctx.lineTo(-20, -6); ctx.lineTo(-10, -18); ctx.lineTo(20, -18); ctx.lineTo(40, -4); ctx.lineTo(60, 0); ctx.lineTo(60, 10); ctx.fill();
                    ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.moveTo(-8, -16); ctx.lineTo(18, -16); ctx.lineTo(32, -4); ctx.lineTo(-5, -4); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.fillRect(40, -4, 20, 3); // Полоса
                } else {
                    ctx.beginPath(); ctx.moveTo(-52, 10); ctx.lineTo(-50, -2); ctx.lineTo(-30, -4); ctx.lineTo(-15, -18); ctx.lineTo(15, -18); ctx.lineTo(35, -4); ctx.lineTo(55, 0); ctx.lineTo(55, 10); ctx.fill();
                    ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.moveTo(-12, -16); ctx.lineTo(12, -16); ctx.lineTo(28, -4); ctx.lineTo(-8, -4); ctx.fill();
                }

                // Водитель внутри (силуэт)
                ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(5, -10, 4, 0, Math.PI*2); ctx.fill(); ctx.fillRect(2, -8, 6, 8);

                // Фары
                ctx.fillStyle = '#fef08a'; ctx.fillRect(52, 0, 8, 4);
                ctx.fillStyle = '#ef4444'; ctx.fillRect(-55, 0, 4, 6);

                // Колеса
                let wheelRot = (pState.dist * 0.15) % (Math.PI * 2);
                let wx = [-35, 35]; let wSize = type === 'truck' ? 14 : 12;
                wx.forEach(x => {
                    ctx.save(); ctx.translate(x, 10); ctx.rotate(wheelRot);
                    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0, 0, wSize, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.arc(0, 0, wSize*0.6, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-wSize*0.6,0); ctx.lineTo(wSize*0.6,0); ctx.moveTo(0,-wSize*0.6); ctx.lineTo(0,wSize*0.6); ctx.stroke();
                    ctx.restore();
                });

                ctx.restore();
            }

            function drawTrafficLight() {
                if (countdown < 0 || countdown >= 4) return;
                let lx = cw/2 - 40; let ly = 40;
                
                // Столб
                ctx.fillStyle = '#1e293b'; ctx.fillRect(cw/2 - 10, ly+180, 20, 100);

                // Корпус
                ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.roundRect(lx, ly, 80, 180, 12); ctx.fill();
                ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 3; ctx.stroke();

                let cols = ['#ef4444', '#ef4444', '#f59e0b', '#10b981'];
                for(let i=0; i<4; i++) {
                    ctx.fillStyle = (countdown === i) ? cols[i] : '#334155';
                    ctx.beginPath(); ctx.arc(cw/2, ly + 30 + i*40, 12, 0, Math.PI*2); ctx.fill();
                }
            }

            // ==========================================================================
            // ИГРОВОЙ ЦИКЛ, ФИЗИКА И КПП
            // ==========================================================================
            function render() {
                ctx.clearRect(0, 0, cw, ch);
                drawEnvironment();

                let roadY = ch * 0.6 + 25;
                let laneH = (ch * 0.4 - 25) / 2;

                // Оппонент (Верхняя полоса)
                let enemyScale = 0.85;
                let enemyX = 150 + (enemy.dist - player.dist) * 1.2;
                ctx.save(); ctx.translate(enemyX, roadY + laneH/2 - 10); ctx.scale(enemyScale, enemyScale);
                drawCar2D(0, 0, enemy, false);
                ctx.restore();

                // Игрок (Нижняя полоса, всегда на X=150)
                ctx.save(); ctx.translate(150, roadY + laneH + laneH/2 - 5);
                drawCar2D(0, 0, player, true);
                ctx.restore();

                drawTrafficLight();
            }

            function update(dt) {
                if (!gameActive) return;

                // Отсчет светофора
                if (countdown < 4) {
                    countdownTimer += dt;
                    if (countdownTimer >= 1.0) {
                        countdown++; countdownTimer = 0;
                        if (countdown === 4) { showToast("🚀 GO!"); startEngine(); }
                    }
                    return;
                }

                // --- ФИЗИКА ИГРОКА (Драг-рейсинг с КПП) ---
                // Скорость растет от RPM и текущей передачи
                if (player.isGas) {
                    player.rpm += dt * 1.5; // Набор оборотов
                    if (player.isNitro && player.nitroAmount > 0) {
                        player.rpm += dt * 2.0; player.nitroAmount -= 30 * dt; screenShake = 8;
                        playSound('nitro');
                    }
                } else if (player.isBrake) {
                    player.rpm -= dt * 2.0; player.speed -= 100 * dt;
                } else {
                    player.rpm -= dt * 0.5; // Сброс оборотов
                    player.speed -= 30 * dt; // Трение
                }

                // Ограничение RPM (отсечка)
                if (player.rpm > 1.0) player.rpm = 1.0;
                if (player.rpm < 0.0) player.rpm = 0.0;

                updateEngine(player.rpm);

                // Ограничение скорости для каждой передачи
                let maxSpeedForGear = (player.topSpeed / player.maxGear) * player.gear;
                let accel = player.baseAccel * player.rpm * (1.1 - player.gear * 0.1); // Меньше ускорение на высоких передачах

                if (player.speed < maxSpeedForGear) {
                    player.speed += accel * dt;
                } else if (player.rpm >= 1.0 && player.isGas) {
                    // Отсечка! Машина не разгоняется дальше без переключения.
                    showToast("⚙️ ПЕРЕКЛЮЧАЙ ПЕРЕДАЧУ! ►");
                }

                player.speed = Math.max(0, player.speed);
                player.dist += (player.speed * 0.35) * dt;

                // --- ФИЗИКА ОППОНЕНТА (ИИ) ---
                if (!isMultiplayer) {
                    enemy.rpm += dt * 1.5;
                    if (enemy.rpm >= 0.95 && enemy.gear < enemy.maxGear) {
                        enemy.gear++; enemy.rpm = 0.4; // ИИ переключает передачу
                    }
                    let eMaxS = (enemy.topSpeed / enemy.maxGear) * enemy.gear;
                    if (enemy.speed < eMaxS) enemy.speed += enemy.baseAccel * enemy.rpm * dt;
                    enemy.dist += (enemy.speed * 0.35) * dt;
                }

                // Обновление HUD
                hudSpeed.textContent = Math.round(player.speed) + ' KM/H';
                hudGear.textContent = `GEAR ${player.gear}`;
                rpmFill.style.width = `${player.rpm * 100}%`;
                if (player.rpm > 0.9) rpmFill.style.background = '#ef4444'; // Красная зона
                else rpmFill.style.background = 'linear-gradient(90deg, #10b981, #f59e0b)';

                // Финиш
                if (player.dist >= TRACK_DIST || enemy.dist >= TRACK_DIST) {
                    gameActive = false; stopEngine();
                    let isWin = player.dist >= enemy.dist;
                    playSound('win');
                    if (isMultiplayer && socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({ type: 'finish', senderId: userId }));
                    } else {
                        finishRace(isWin);
                    }
                }

                // Синхронизация сети
                if (isMultiplayer && socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: 'move', senderId: userId, dist: player.dist }));
                }
            }

            function gameLoop(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = (timestamp - lastTime) / 1000;
                lastTime = timestamp;
                update(dt);
                render();
                if (gameActive) requestAnimationFrame(gameLoop);
            }

            // ==========================================================================
            // УПРАВЛЕНИЕ И СЕТЬ
            // ==========================================================================
            function shiftGearUp() {
                if (player.gear < player.maxGear) {
                    player.gear++; player.rpm *= 0.6; // Обороты падают при переключении
                    playSound('shift');
                }
            }
            function shiftGearDown() {
                if (player.gear > 1) {
                    player.gear--; player.rpm = Math.min(1.0, player.rpm * 1.4);
                    playSound('shift');
                }
            }

            async function finishRace(isWin) {
                let winAmt = isWin ? Math.floor(raceBet * 1.85) : 0;
                try {
                    const res = await sendGameResult(isWin ? 'win' : 'lose', raceBet, winAmt);
                    if (res.new_balance !== undefined) {
                        casinoBalance = Number(res.new_balance);
                        balanceDisplay.textContent = formatNumber(casinoBalance);
                    }
                } catch(e) {}
                alert(isWin ? `🏆 ФИНИШ! ВЫИГРЫШ: ${formatNumber(winAmt)} ₽` : `❌ ПРОИГРЫШ! СОПЕРНИК ВПЕРЕДИ.`);
                location.reload();
            }

            function startRaceVisuals() {
                document.getElementById('mainMenu').classList.add('hidden');
                document.getElementById('gameHud').classList.remove('hidden');
                document.getElementById('controlsLayer').classList.remove('hidden');
                player = new PlayerState(selectedCar);
                enemy = new PlayerState(isMultiplayer ? CARS_DB[0] : CARS_DB[Math.floor(Math.random() * CARS_DB.length)]);
                countdown = 0; countdownTimer = 0; bgScrollX = 0;
                gameActive = true; lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }

            function connectWebSocket(code) {
                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                socket = new WebSocket(`${wsProtocol}//resellgame.bothost.tech/ws/race/${code}?userId=${userId}`);
                socket.onopen = () => {
                    showToast(`ЖДЁМ В КОМНАТЕ ${code}...`);
                    document.getElementById('hudRoom').textContent = code;
                    socket.send(JSON.stringify({ type: 'join', senderId: userId, carId: selectedCar.id }));
                    setTimeout(() => startRaceVisuals(), 2000);
                };
                socket.onmessage = (e) => {
                    try {
                        const data = JSON.parse(e.data);
                        if (data.type === 'join' && data.senderId !== userId) {
                            let eCar = CARS_DB.find(c => c.id === data.carId);
                            if (eCar) enemy.car = eCar;
                        }
                        if (data.type === 'move' && data.senderId !== userId) enemy.dist = data.dist;
                        if (data.type === 'game_over') { gameActive = false; finishRace(data.winnerId === userId); }
                    } catch(err) {}
                };
                socket.onerror = () => { showToast("Сбой сети. Одиночный режим."); startRaceVisuals(); };
            }

            // Обработка кликов меню
            async function attemptStart(isMulti, code=null) {
                raceBet = parseNumber(document.getElementById('betInput').value);
                if (raceBet < 100) { showToast('Мин. ставка 100 ₽'); return; }
                if (raceBet > casinoBalance) { showToast('Недостаточно средств!'); return; }
                
                // Проверка машины в гараже через API
                if(userId) {
                    try {
                        const req = await fetch(`${API_BASE}/race/create`, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userId: userId, carId: selectedCar.id, bet: raceBet })
                        });
                        const res = await req.json();
                        if (!res.success && res.error === "Этой машины нет в гараже!") {
                            showToast('Этой машины нет в твоём гараже!'); return; 
                        }
                    } catch(e) {}
                }

                isMultiplayer = isMulti;
                if (!isMulti) {
                    document.getElementById('hudRoom').textContent = "СИНГЛ";
                    startRaceVisuals();
                } else {
                    connectWebSocket(code || Math.floor(1000 + Math.random() * 9000).toString());
                }
            }

            document.getElementById('btnSingle').onclick = () => attemptStart(false);
            document.getElementById('btnCreateRoom').onclick = () => attemptStart(true);
            document.getElementById('btnJoinRoom').onclick = () => {
                let code = document.getElementById('roomCodeInput').value.trim();
                if (!code) { showToast('Введите код!'); return; }
                attemptStart(true, code);
            };

            // Привязка управления
            const bindBtn = (id, onStart, onEnd) => {
                const el = document.getElementById(id);
                const press = (e) => { e.preventDefault(); onStart(); el.classList.add('active'); };
                const release = (e) => { e.preventDefault(); if(onEnd) onEnd(); el.classList.remove('active'); };
                el.addEventListener('touchstart', press); el.addEventListener('mousedown', press);
                el.addEventListener('touchend', release); el.addEventListener('mouseup', release);
                el.addEventListener('mouseleave', release);
            };

            bindBtn('btnGas', () => player.isGas = true, () => player.isGas = false);
            bindBtn('btnBrake', () => player.isBrake = true, () => player.isBrake = false);
            bindBtn('btnNitro', () => player.isNitro = true, () => player.isNitro = false);
            bindBtn('btnShiftUp', () => shiftGearUp());
            bindBtn('btnShiftDown', () => shiftGearDown());

            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp' || e.key === 'w') player.isGas = true;
                if (e.key === 'ArrowDown' || e.key === 's') player.isBrake = true;
                if (e.key === 'ArrowRight' || e.key === 'd') shiftGearUp();
                if (e.key === 'ArrowLeft' || e.key === 'a') shiftGearDown();
                if (e.key === 'Shift') player.isNitro = true;
            });
            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowUp' || e.key === 'w') player.isGas = false;
                if (e.key === 'ArrowDown' || e.key === 's') player.isBrake = false;
                if (e.key === 'Shift') player.isNitro = false;
            });

            // Инициализация
            const sel = document.getElementById('carSelector');
            CARS_DB.forEach(c => {
                const card = document.createElement('div');
                card.className = `car-card ${c.id === selectedCar.id ? 'active' : ''}`;
                // Канвас для превью
                const cv = document.createElement('canvas'); cv.className = 'car-preview';
                cv.width = 100; cv.height = 45; const cctx = cv.getContext('2d');
                cctx.translate(50, 20); cctx.scale(0.5, 0.5);
                drawCar2D(0, 0, {car: c, dist: 0}, false);
                
                card.appendChild(cv);
                card.innerHTML += `<div class="c-name">${c.name}</div><div class="c-price">${formatNumber(c.price)} ₽</div><div class="c-stats">⚡ +${c.speed_bonus}%</div>`;
                card.onclick = () => {
                    document.querySelectorAll('.car-card').forEach(el => el.classList.remove('active'));
                    card.classList.add('active'); selectedCar = c;
                };
                sel.appendChild(card);
            });

            document.querySelectorAll('[data-amt]').forEach(b => b.onclick = () => document.getElementById('betInput').value = formatNumber(parseInt(b.dataset.amt)));
            document.getElementById('betInput').addEventListener('input', function() { this.value = formatNumber(parseNumber(this.value)); });

            window.addEventListener('resize', () => { cw = window.innerWidth; ch = window.innerHeight; canvas.width = cw; canvas.height = ch; if(!gameActive) render(); });
            
            loadBalance();
            render();

        })();
    </script>
</body>
</html>
