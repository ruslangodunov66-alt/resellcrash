<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>R-RACE 2D</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           СТИЛИ
           ========================================================================== */
        :root {
            --bg-dark: #0a0d14;
            --panel-bg: rgba(16, 22, 34, 0.96);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-gold: #fbbf24;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background: #000;
            font-family: 'Nunito', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-wrapper {
            max-width: 500px;
            width: 100%;
            height: 100vh;
            max-height: 900px;
            background: #0a0d14;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
        }

        /* ===== МЕНЮ ===== */
        .menu-screen {
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(10, 13, 20, 0.98) 0%, rgba(2, 6, 23, 0.96) 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 16px; z-index: 100; overflow-y: auto;
        }

        .logo {
            font-family: 'Montserrat', sans-serif; font-size: 28px; font-weight: 900; font-style: italic;
            text-transform: uppercase; color: #fff; text-shadow: 0 4px 15px rgba(59, 130, 246, 0.6);
            margin-top: 4px; margin-bottom: 10px; text-align: center; line-height: 1.1;
        }
        .logo span { color: var(--accent-gold); display: block; font-size: 14px; letter-spacing: 3px; }

        .menu-card {
            width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 10px; margin-bottom: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .section-title { font-size: 9px; font-weight: 900; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 1px; }

        .car-carousel {
            display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x mandatory;
        }
        .car-carousel::-webkit-scrollbar { height: 3px; }
        .car-carousel::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 2px; }
        
        .car-card {
            min-width: 100px; background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.08);
            border-radius: 8px; padding: 4px; text-align: center; cursor: pointer; transition: all 0.2s;
            scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; gap: 1px;
        }
        .car-card.active { background: rgba(245, 158, 11, 0.12); border-color: var(--accent-gold); transform: scale(1.02); }
        .car-card .c-name { font-size: 9px; font-weight: 900; white-space: nowrap; }
        .car-card .c-stats { font-size: 7px; color: var(--accent-green); font-weight: 800; background: rgba(16,185,129,0.12); padding: 1px 4px; border-radius: 3px; }
        .car-card .c-trans { font-size: 7px; color: var(--accent-blue); font-weight: 800; }

        .car-preview { width: 70px; height: 32px; }

        .btn {
            width: 100%; height: 40px; border: none; border-radius: 8px;
            font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 12px;
            color: #fff; cursor: pointer; text-transform: uppercase; transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-green { background: linear-gradient(135deg, #10b981, #047857); box-shadow: 0 4px 15px rgba(16,185,129,0.3); }
        .btn-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); box-shadow: 0 4px 15px rgba(59,130,246,0.3); }
        .btn-gold { background: linear-gradient(135deg, #f59e0b, #b45309); box-shadow: 0 4px 15px rgba(245,158,11,0.3); }
        
        .flex-row { display: flex; gap: 4px; }
        .flex-row .btn { flex: 1; }

        /* ===== МОДАЛКИ ===== */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box {
            background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 16px;
            padding: 16px; width: 90%; max-width: 320px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }
        .modal-title { font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 900; color: var(--accent-gold); margin-bottom: 8px; text-transform: uppercase; }
        .styled-input {
            width: 100%; height: 40px; background: rgba(0,0,0,0.6); border: 2px solid var(--border-color);
            border-radius: 8px; color: #fff; font-family: 'Montserrat', sans-serif; font-weight: 900;
            font-size: 14px; text-align: center; outline: none; margin-bottom: 8px;
        }

        /* ===== HUD ===== */
        .hud {
            position: absolute; top: 8px; left: 8px; right: 8px;
            display: flex; justify-content: space-between; align-items: center; z-index: 50; pointer-events: none;
        }
        .hud-badge {
            background: rgba(10, 13, 20, 0.85); backdrop-filter: blur(8px); border: 1px solid var(--border-color);
            padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .hud-badge span { color: var(--accent-gold); font-family: 'Montserrat', sans-serif; font-weight: 900; }

        .tachometer {
            display: flex; flex-direction: column; align-items: center; gap: 1px;
            background: rgba(0,0,0,0.7); padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border-color);
        }
        .rpm-bar { width: 60px; height: 5px; background: #1e293b; border-radius: 3px; overflow: hidden; }
        .rpm-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444); }
        .gear-text { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 11px; color: #fff; }

        /* ===== УПРАВЛЕНИЕ ===== */
        .controls {
            position: absolute; bottom: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; align-items: flex-end; z-index: 50;
        }
        .ctrl-group { display: flex; gap: 5px; align-items: flex-end; }
        
        .pedal {
            border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: 'Montserrat', sans-serif; font-weight: 900; color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); cursor: pointer; transition: transform 0.05s;
            border: 2px solid rgba(255,255,255,0.2); user-select: none;
        }
        .btn-shift { width: 42px; height: 42px; background: rgba(30, 41, 59, 0.9); font-size: 16px; border-radius: 10px; }
        .btn-shift:active { background: rgba(59, 130, 246, 0.8); transform: scale(0.92); }

        .pedal.nitro { background: linear-gradient(135deg, #3b82f6, #1d4ed8); width: 50px; height: 50px; border-radius: 50%; font-size: 10px; }
        .pedal.nitro:active { transform: scale(0.9); box-shadow: 0 0 15px #3b82f6; }
        
        .pedal.brake { background: linear-gradient(135deg, #ef4444, #b91c1c); width: 42px; height: 42px; font-size: 14px; }
        .pedal.brake:active { transform: scale(0.92); }

        .pedal.gas { background: linear-gradient(180deg, #10b981, #047857); width: 60px; height: 75px; font-size: 11px; }
        .pedal.gas:active { transform: scale(0.95); box-shadow: 0 0 20px #10b981; }

        canvas#gameCanvas { width: 100%; height: 100%; display: block; }
        .hidden { display: none !important; }
        
        .toast {
            position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 13, 20, 0.95); border: 2px solid var(--accent-gold); color: #fff;
            padding: 6px 14px; font-weight: 900; border-radius: 8px; z-index: 100;
            display: none; white-space: nowrap; text-transform: uppercase; font-size: 11px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div class="game-wrapper" id="appContainer">
        <div class="toast" id="toastMsg">Уведомление</div>

        <!-- HUD -->
        <div class="hud hidden" id="gameHud">
            <div class="hud-badge">🏁 <span id="hudRoom">СИНГЛ</span></div>
            <div class="tachometer">
                <div class="rpm-bar"><div class="rpm-fill" id="rpmFill"></div></div>
                <div class="gear-text" id="hudGear">N</div>
            </div>
            <div class="hud-badge">⚡ <span id="hudSpeed">0</span> KM/H</div>
        </div>

        <!-- МЕНЮ -->
        <div class="menu-screen" id="mainMenu">
            <div class="logo">RESELL <span>RACING</span></div>

            <div class="menu-card">
                <div class="section-title">ВАШ ГАРАЖ</div>
                <div class="car-carousel" id="carSelector"></div>
            </div>

            <button class="btn btn-green" id="btnSingle" style="margin-bottom: 6px; height: 42px; font-size: 12px;">🚗 ОДИНОЧНАЯ ИГРА</button>

            <div class="menu-card">
                <div class="section-title">МУЛЬТИПЛЕЕР</div>
                <div class="flex-row">
                    <button class="btn btn-blue" id="btnCreateRoom">СОЗДАТЬ</button>
                    <button class="btn btn-gold" id="btnJoinRoom">ВОЙТИ</button>
                </div>
            </div>
        </div>

        <!-- МОДАЛКА СТАВКИ -->
        <div class="modal-overlay" id="betModal">
            <div class="modal-box">
                <div class="modal-title">Ставка на заезд</div>
                <div style="font-size:10px; color:#94a3b8; font-weight:800; margin-bottom:4px;">БАЛАНС: <span id="modalBalance" style="color:var(--accent-gold);">0</span> ₽</div>
                <input type="text" class="styled-input" id="modalBetInput" value="10 000">
                <div class="flex-row" style="margin-bottom: 8px;">
                    <button class="btn btn-gold" style="height:28px; font-size:9px;" data-amt="5000">5K</button>
                    <button class="btn btn-gold" style="height:28px; font-size:9px;" data-amt="10000">10K</button>
                    <button class="btn btn-gold" style="height:28px; font-size:9px;" data-amt="25000">25K</button>
                </div>
                <div class="flex-row">
                    <button class="btn btn-blue" id="modalBtnCancel">ОТМЕНА</button>
                    <button class="btn btn-green" id="modalBtnConfirm">СТАРТ</button>
                </div>
            </div>
        </div>

        <!-- МОДАЛКА КОДА -->
        <div class="modal-overlay" id="roomModal">
            <div class="modal-box">
                <div class="modal-title">Вход в комнату</div>
                <input type="text" class="styled-input" id="modalRoomInput" placeholder="Код (6 цифр)" maxlength="6">
                <div class="flex-row">
                    <button class="btn btn-blue" id="roomBtnCancel">ОТМЕНА</button>
                    <button class="btn btn-green" id="roomBtnConfirm">ДАЛЕЕ</button>
                </div>
            </div>
        </div>

        <!-- КАНВАС -->
        <canvas id="gameCanvas"></canvas>

        <!-- УПРАВЛЕНИЕ -->
        <div class="controls hidden" id="controlsLayer">
            <div class="ctrl-group">
                <div class="pedal btn-shift" id="btnShiftDown">◄</div>
                <div class="pedal btn-shift" id="btnShiftUp">►</div>
                <div class="pedal nitro" id="btnNitro">N2O</div>
            </div>
            <div class="ctrl-group">
                <div class="pedal brake" id="btnBrake">▼</div>
                <div class="pedal gas" id="btnGas"><span style="font-size: 16px;">▲</span>ГАЗ</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ======== ПОЛИФИЛЛ roundRect ========
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
                    var r = typeof radii === 'number' ? radii : (radii || 0);
                    this.moveTo(x + r, y);
                    this.arcTo(x + w, y, x + w, y + h, r);
                    this.arcTo(x + w, y + h, x, y + h, r);
                    this.arcTo(x, y + h, x, y, r);
                    this.arcTo(x, y, x + w, y, r);
                    return this;
                };
            }

            const tg = window.Telegram?.WebApp;
            if (tg) { tg.expand(); tg.ready(); }

            const API_BASE = 'https://resellgame.bothost.tech';
            let userId = null;
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('userId')) userId = urlParams.get('userId');
            else if (tg?.initDataUnsafe?.user?.id) userId = tg.initDataUnsafe.user.id;

            // ==========================================================================
            // АУДИО ДВИЖОК — РЕАЛИСТИЧНЫЙ ЗВУК МОТОРА
            // ==========================================================================
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let engineOsc = null;
            let engineGain = null;
            let engineFilter = null;
            let engineOsc2 = null;
            let engineGain2 = null;

            function startEngine() {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                if(!engineOsc) {
                    // Основной осциллятор (пила)
                    engineOsc = audioCtx.createOscillator();
                    engineFilter = audioCtx.createBiquadFilter();
                    engineGain = audioCtx.createGain();
                    
                    engineOsc.type = 'sawtooth';
                    engineFilter.type = 'lowpass';
                    engineFilter.frequency.value = 1500;
                    engineFilter.Q.value = 1.2;
                    
                    engineOsc.connect(engineFilter);
                    engineFilter.connect(engineGain);
                    engineGain.connect(audioCtx.destination);
                    engineGain.gain.value = 0.03;
                    engineOsc.start();

                    // Второй осциллятор (квадрат для низов)
                    engineOsc2 = audioCtx.createOscillator();
                    engineGain2 = audioCtx.createGain();
                    engineOsc2.type = 'square';
                    engineOsc2.frequency.value = 40;
                    engineOsc2.connect(engineGain2);
                    engineGain2.connect(audioCtx.destination);
                    engineGain2.gain.value = 0.015;
                    engineOsc2.start();
                }
            }

            function updateEngine(rpm, gear, isNitro) {
                if(engineOsc) {
                    // Частота мотора: от 60 Гц на холостых до ~300 Гц на отсечке
                    let baseFreq = 60 + rpm * 240;
                    if(isNitro && rpm > 0.3) baseFreq *= 1.2;
                    engineOsc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
                    // Фильтр: выше при высоких оборотах
                    engineFilter.frequency.setValueAtTime(200 + rpm * 1300, audioCtx.currentTime);
                    // Громкость
                    let vol = 0.01 + rpm * 0.035;
                    if(isNitro) vol *= 1.3;
                    engineGain.gain.setValueAtTime(Math.min(vol, 0.06), audioCtx.currentTime);
                }
                if(engineOsc2) {
                    engineOsc2.frequency.setValueAtTime(30 + rpm * 80, audioCtx.currentTime);
                    engineGain2.gain.setValueAtTime(0.005 + rpm * 0.015, audioCtx.currentTime);
                }
            }

            function playNitroSound() {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                // Звук турбины/нитро
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(2000, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.5);
            }

            function playShiftSound() {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                // Звук переключения — короткий "всхлип"
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.12);
            }

            function stopEngine() {
                if(engineOsc) { engineOsc.stop(); engineOsc.disconnect(); engineOsc = null; }
                if(engineFilter) { engineFilter.disconnect(); engineFilter = null; }
                if(engineGain) { engineGain.disconnect(); engineGain = null; }
                if(engineOsc2) { engineOsc2.stop(); engineOsc2.disconnect(); engineOsc2 = null; }
                if(engineGain2) { engineGain2.disconnect(); engineGain2 = null; }
            }

            // ==========================================================================
            // БАЗА 14 МАШИН С ТИПОМ КОРОБКИ
            // ==========================================================================
            const CARS_DB = [
                { id: "zhiguli", name: "ВАЗ-2106", speed_bonus: 10, price: 15000, color: '#e74c3c', type: 'box', trans: 'MT' },
                { id: "granta", name: "Лада Гранта", speed_bonus: 15, price: 35000, color: '#95a5a6', type: 'sedan', trans: 'MT' },
                { id: "w140", name: "Mercedes W140", speed_bonus: 28, price: 90000, color: '#1e293b', type: 'luxury', trans: 'AT' },
                { id: "mustang", name: "Ford Mustang", speed_bonus: 30, price: 120000, color: '#3b82f6', type: 'muscle', trans: 'MT' },
                { id: "cclass", name: "Mercedes C-Class", speed_bonus: 35, price: 160000, color: '#cbd5e1', type: 'sedan', trans: 'AT' },
                { id: "bmwm4", name: "BMW M4", speed_bonus: 45, price: 180000, color: '#f59e0b', type: 'sport', trans: 'MT' },
                { id: "challenger", name: "Dodge Challenger", speed_bonus: 55, price: 300000, color: '#8b5cf6', type: 'muscle', trans: 'MT' },
                { id: "ramtrx", name: "Dodge Ram TRX", speed_bonus: 60, price: 350000, color: '#0f172a', type: 'truck', trans: 'AT' },
                { id: "bmwm5", name: "BMW M5 F90", speed_bonus: 70, price: 450000, color: '#2563eb', type: 'sport', trans: 'MT' },
                { id: "sclass", name: "Mercedes S-Class", speed_bonus: 75, price: 650000, color: '#000000', type: 'luxury', trans: 'AT' },
                { id: "bmwx7", name: "BMW X7", speed_bonus: 70, price: 850000, color: '#ffffff', type: 'suv', trans: 'AT' },
                { id: "rollsroyce", name: "Rolls-Royce", speed_bonus: 95, price: 1800000, color: '#334155', type: 'luxury', trans: 'AT' },
                { id: "aventador", name: "Lamborghini", speed_bonus: 98, price: 5000000, color: '#10b981', type: 'supercar', trans: 'MT' },
                { id: "brabus", name: "Brabus Mansory", speed_bonus: 99, price: 20000000, color: '#111111', type: 'suv', trans: 'AT' }
            ];

            let selectedCar = CARS_DB[3];
            let casinoBalance = 0;
            let raceBet = 10000;
            let socket = null;
            let isMultiplayer = false;
            let pendingAction = null;
            let targetRoomCode = null;

            let userGarage = [];

            async function loadGarage() {
                if (!userId) {
                    userGarage = CARS_DB.map(c => c.id);
                    return;
                }
                try {
                    const resp = await fetch(`${API_BASE}/profile/${encodeURIComponent(userId)}`);
                    const data = await resp.json();
                    if (data.car_collection) {
                        userGarage = data.car_collection;
                    } else {
                        userGarage = CARS_DB.map(c => c.id);
                    }
                } catch(e) {
                    userGarage = CARS_DB.map(c => c.id);
                }
                if (!userGarage || userGarage.length === 0) {
                    userGarage = CARS_DB.map(c => c.id);
                }
                initCarSelectorUI();
            }

            // DOM
            const mainMenu = document.getElementById('mainMenu');
            const gameHud = document.getElementById('gameHud');
            const controlsLayer = document.getElementById('controlsLayer');
            const toastMsg = document.getElementById('toastMsg');
            const hudSpeed = document.getElementById('hudSpeed');
            const hudGear = document.getElementById('hudGear');
            const rpmFill = document.getElementById('rpmFill');

            const betModal = document.getElementById('betModal');
            const roomModal = document.getElementById('roomModal');
            const modalBetInput = document.getElementById('modalBetInput');
            const modalBalance = document.getElementById('modalBalance');
            const modalRoomInput = document.getElementById('modalRoomInput');

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            let cw = window.innerWidth;
            let ch = window.innerHeight;
            canvas.width = cw;
            canvas.height = ch;

            // ==========================================================================
            // СОСТОЯНИЕ ГОНКИ
            // ==========================================================================
            const TRACK_DIST = 10000;
            let gameActive = false;
            let lastTime = 0;
            let bgScrollX = 0;
            let screenShake = 0;
            let countdown = -1;
            let countdownTimer = 0;

            const GEAR_RATIOS = [0, 3.8, 2.4, 1.6, 1.2, 0.9, 0.7];
            const FINAL_DRIVE = 3.5;
            const WHEEL_RADIUS = 0.32;

            class PlayerState {
                constructor(carDef) {
                    this.car = carDef;
                    this.dist = 0;
                    this.speed = 0;
                    this.rpm = 0.05;
                    this.nitroAmount = 100;
                    this.isGas = false;
                    this.isNitro = false;
                    this.isBrake = false;
                    
                    this.gear = 0;
                    this.maxGear = 6;
                    this.isAutomatic = (carDef.trans === 'AT');
                    this.shiftCooldown = 0;
                    
                    this.maxRPM = 6800;
                    this.idleRPM = 800;
                    this.power = 70 + carDef.speed_bonus * 1.5;
                    this.topSpeed = 170 + carDef.speed_bonus * 2.5;
                }

                getCurrentGearRatio() {
                    if (this.gear === 0) return 0;
                    return GEAR_RATIOS[this.gear] || 0;
                }

                getSpeedKmh() {
                    return this.speed * 3.6;
                }

                getRPM() {
                    if (this.gear === 0) return this.idleRPM + this.rpm * 400;
                    let wheelRPM = (this.speed / (WHEEL_RADIUS * 2 * Math.PI)) * 60;
                    let engineRPM = wheelRPM * this.getCurrentGearRatio() * FINAL_DRIVE;
                    return Math.max(this.idleRPM, engineRPM);
                }
            }

            let player = new PlayerState(selectedCar);
            let enemy = new PlayerState(CARS_DB[1]);

            // ==========================================================================
            // ПРОРИСОВКА МАШИН (КАЧЕСТВЕННАЯ)
            // ==========================================================================
            function drawCarBody(ctx, color, type, x, y, scale) {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(scale || 1, scale || 1);

                // Тень
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(0, 14, 55, 6, 0, 0, Math.PI*2);
                ctx.fill();

                // Кузов
                ctx.fillStyle = color;
                
                if (type === 'supercar') {
                    // Ламборгини
                    ctx.beginPath();
                    ctx.moveTo(-45, 7); ctx.lineTo(-42, -3); ctx.lineTo(-12, -12);
                    ctx.lineTo(18, -10); ctx.lineTo(48, 1); ctx.lineTo(50, 7);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#1a1a2e';
                    ctx.beginPath();
                    ctx.moveTo(-10, -10); ctx.lineTo(15, -8); ctx.lineTo(30, 0); ctx.lineTo(-3, 0);
                    ctx.fill();
                    // Спойлер
                    ctx.fillStyle = '#000';
                    ctx.fillRect(-44, -10, 4, 8);
                    ctx.fillRect(-48, -12, 10, 3);
                } else if (type === 'muscle') {
                    // Мустанг
                    ctx.beginPath();
                    ctx.moveTo(-46, 7); ctx.lineTo(-44, -1); ctx.lineTo(-20, -5);
                    ctx.lineTo(-8, -14); ctx.lineTo(18, -14); ctx.lineTo(35, -3);
                    ctx.lineTo(48, 2); ctx.lineTo(48, 7);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#1a1a2e';
                    ctx.beginPath();
                    ctx.moveTo(-6, -12); ctx.lineTo(15, -12); ctx.lineTo(28, -3); ctx.lineTo(-3, -3);
                    ctx.fill();
                    // Полоса
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.fillRect(35, -3, 13, 2);
                } else if (type === 'truck') {
                    // Рам TRX
                    ctx.fillRect(-48, -3, 96, 10);
                    ctx.fillRect(-10, -20, 38, 17);
                    ctx.fillStyle = '#1a1a2e';
                    ctx.fillRect(-6, -18, 30, 13);
                    // Кузов
                    ctx.fillStyle = '#0f172a';
                    ctx.fillRect(-48, -13, 38, 10);
                } else if (type === 'luxury') {
                    // S-Class
                    ctx.beginPath();
                    ctx.moveTo(-48, 7); ctx.lineTo(-46, -3); ctx.lineTo(-25, -3);
                    ctx.lineTo(-12, -15); ctx.lineTo(15, -15); ctx.lineTo(30, -3);
                    ctx.lineTo(48, -1); ctx.lineTo(50, 7);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#1a1a2e';
                    ctx.beginPath();
                    ctx.moveTo(-10, -13); ctx.lineTo(12, -13); ctx.lineTo(24, -3); ctx.lineTo(-20, -3);
                    ctx.fill();
                    // Хромированная решетка
                    ctx.fillStyle = '#cbd5e1';
                    ctx.fillRect(46, -2, 4, 4);
                } else if (type === 'suv') {
                    // Brabus / X7
                    ctx.fillRect(-44, -18, 88, 25);
                    ctx.fillStyle = '#1a1a2e';
                    ctx.fillRect(-24, -16, 48, 13);
                    // Запаска
                    if (color === '#111111') {
                        ctx.fillStyle = '#1e293b';
                        ctx.fillRect(-48, -10, 6, 12);
                    }
                } else if (type === 'box') {
                    // Жигули
                    ctx.beginPath();
                    ctx.moveTo(-40, 7); ctx.lineTo(-38, -1); ctx.lineTo(-24, -3);
                    ctx.lineTo(-12, -13); ctx.lineTo(8, -13); ctx.lineTo(22, -3);
                    ctx.lineTo(40, -1); ctx.lineTo(42, 7);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#1a1a2e';
                    ctx.beginPath();
                    ctx.moveTo(-10, -11); ctx.lineTo(6, -11); ctx.lineTo(18, -3); ctx.lineTo(-16, -3);
                    ctx.fill();
                    // Круглые фары
                    ctx.fillStyle = '#fef08a';
                    ctx.beginPath(); ctx.arc(40, 2, 2.5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(40, -2, 2.5, 0, Math.PI*2); ctx.fill();
                } else {
                    // Седан
                    ctx.beginPath();
                    ctx.moveTo(-42, 7); ctx.lineTo(-40, -1); ctx.lineTo(-24, -3);
                    ctx.lineTo(-10, -14); ctx.lineTo(12, -14); ctx.lineTo(28, -3);
                    ctx.lineTo(44, -1); ctx.lineTo(44, 7);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#1a1a2e';
                    ctx.beginPath();
                    ctx.moveTo(-8, -12); ctx.lineTo(10, -12); ctx.lineTo(22, -3); ctx.lineTo(-14, -3);
                    ctx.fill();
                }

                // Фары
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(42, 0, 6, 3);
                ctx.fillRect(42, -4, 6, 3);

                // Стоп-сигналы
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(-42, -2, 4, 4);

                ctx.restore();
            }

            function drawCar2D(x, y, pState, isPlayer) {
                ctx.save();
                ctx.translate(x, y);

                let color = pState.car.color;
                let type = pState.car.type;

                // Нитро пламя
                if (isPlayer && pState.isNitro && pState.nitroAmount > 0 && countdown >= 4) {
                    ctx.fillStyle = '#3b82f6';
                    ctx.beginPath();
                    ctx.moveTo(-46, 0);
                    ctx.lineTo(-70 - Math.random() * 20, 3);
                    ctx.lineTo(-46, 6);
                    ctx.fill();
                    ctx.fillStyle = '#fef08a';
                    ctx.beginPath();
                    ctx.moveTo(-46, 2);
                    ctx.lineTo(-60 - Math.random() * 12, 3);
                    ctx.lineTo(-46, 4);
                    ctx.fill();
                }

                drawCarBody(ctx, color, type, 0, 0, 1);

                // Колеса
                let wheelRot = (pState.dist * 0.12) % (Math.PI * 2);
                let wSize = type === 'truck' ? 12 : 10;
                let wOff = type === 'truck' ? 36 : 30;
                [-wOff, wOff].forEach(wx => {
                    ctx.save();
                    ctx.translate(wx, 8);
                    ctx.rotate(wheelRot);
                    ctx.fillStyle = '#1a1a2e';
                    ctx.beginPath();
                    ctx.arc(0, 0, wSize, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = '#94a3b8';
                    ctx.beginPath();
                    ctx.arc(0, 0, wSize * 0.5, 0, Math.PI*2);
                    ctx.fill();
                    ctx.strokeStyle = '#0f172a';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(-wSize * 0.6, 0);
                    ctx.lineTo(wSize * 0.6, 0);
                    ctx.moveTo(0, -wSize * 0.6);
                    ctx.lineTo(0, wSize * 0.6);
                    ctx.stroke();
                    ctx.restore();
                });

                ctx.restore();
            }

            // ==========================================================================
            // ФОН
            // ==========================================================================
            function drawScene() {
                // Небо
                let grad = ctx.createLinearGradient(0, 0, 0, ch * 0.45);
                grad.addColorStop(0, '#0f172a');
                grad.addColorStop(0.3, '#1e3a8a');
                grad.addColorStop(0.7, '#ea580c');
                grad.addColorStop(1, '#fde047');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, cw, ch);

                // Солнце
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.beginPath();
                ctx.arc(cw * 0.8, ch * 0.12, 35, 0, Math.PI*2);
                ctx.fill();

                // Горы
                ctx.fillStyle = '#4a2810';
                ctx.beginPath();
                let m1X = -(bgScrollX * 0.08) % cw;
                ctx.moveTo(m1X - cw, ch * 0.45);
                ctx.lineTo(m1X - cw * 0.5, ch * 0.15);
                ctx.lineTo(m1X, ch * 0.45);
                ctx.lineTo(m1X + cw * 0.4, ch * 0.22);
                ctx.lineTo(m1X + cw * 0.7, ch * 0.45);
                ctx.lineTo(m1X + cw * 1.2, ch * 0.18);
                ctx.lineTo(cw * 2, ch * 0.45);
                ctx.fill();

                // Холмы
                ctx.fillStyle = '#783f1d';
                ctx.beginPath();
                let m2X = -(bgScrollX * 0.2) % cw;
                ctx.moveTo(m2X - cw, ch * 0.45);
                ctx.lineTo(m2X - cw * 0.3, ch * 0.32);
                ctx.lineTo(m2X, ch * 0.45);
                ctx.lineTo(m2X + cw * 0.4, ch * 0.3);
                ctx.lineTo(m2X + cw * 0.7, ch * 0.45);
                ctx.lineTo(m2X + cw * 1.2, ch * 0.35);
                ctx.lineTo(cw * 2, ch * 0.45);
                ctx.fill();

                // Кактусы (на земле)
                ctx.fillStyle = '#065f46';
                let cX = -(bgScrollX * 0.35) % 500;
                for(let i = -500; i < cw + 500; i += 500) {
                    let px = cX + i;
                    if(px > -10 && px < cw + 10) {
                        let baseY = ch * 0.45;
                        ctx.fillRect(px, baseY - 35, 6, 35);
                        ctx.fillRect(px - 10, baseY - 30, 10, 5);
                        ctx.fillRect(px + 6, baseY - 28, 10, 5);
                        ctx.fillRect(px - 8, baseY - 18, 8, 4);
                        ctx.fillRect(px + 8, baseY - 20, 8, 4);
                    }
                }

                // ДОРОГА
                let roadY = ch * 0.45;
                let roadH = ch * 0.55;

                ctx.fillStyle = '#92400e';
                ctx.fillRect(0, roadY, cw, 12);

                let ashY = roadY + 12;
                let ashH = roadH - 12;
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(0, ashY, cw, ashH);

                // Бордюр
                ctx.fillStyle = '#94a3b8';
                ctx.fillRect(0, ashY - 3, cw, 3);
                ctx.fillRect(0, ashY + ashH - 3, cw, 3);

                // Разметка
                ctx.fillStyle = '#ffffff';
                let lX = -(bgScrollX * 1.5) % 60;
                for(let i = -60; i < cw + 60; i += 60) {
                    ctx.fillRect(lX + i, ashY + ashH/2 - 2.5, 25, 4);
                }

                // Старт/Финиш
                if(player.dist < 500) drawCheckered(120 - player.dist, ashY, ashH);
                if(player.dist > TRACK_DIST - cw - 150) drawCheckered(120 + (TRACK_DIST - player.dist), ashY, ashH);
            }

            function drawCheckered(x, y, h) {
                if(x < -40 || x > cw + 40) return;
                let sq = 8;
                for(let i = 0; i < h/sq; i++) {
                    ctx.fillStyle = (i%2===0) ? '#fff' : '#000';
                    ctx.fillRect(x, y + i*sq, sq, sq);
                    ctx.fillStyle = (i%2===0) ? '#000' : '#fff';
                    ctx.fillRect(x + sq, y + i*sq, sq, sq);
                }
            }

            function drawTrafficLight() {
                if(countdown < 0 || countdown >= 4) return;
                let lx = cw/2 - 25;
                let ly = 12;
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.roundRect(lx, ly, 50, 110, 6);
                ctx.fill();
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 2;
                ctx.stroke();

                let cols = ['#ef4444', '#ef4444', '#f59e0b', '#10b981'];
                for(let i = 0; i < 4; i++) {
                    ctx.fillStyle = (countdown === i) ? cols[i] : '#1e293b';
                    ctx.beginPath();
                    ctx.arc(cw/2, ly + 18 + i * 25, 7, 0, Math.PI*2);
                    ctx.fill();
                }
            }

            // ==========================================================================
            // ИГРОВОЙ ЦИКЛ
            // ==========================================================================
            function render() {
                ctx.clearRect(0, 0, cw, ch);
                drawScene();

                let roadY = ch * 0.45 + 12;
                let laneH = (ch * 0.55 - 12) / 2;

                // Соперник
                let enemyX = 120 + (enemy.dist - player.dist) * 1.2;
                ctx.save();
                ctx.translate(enemyX, roadY + laneH/2 - 5);
                ctx.scale(0.75, 0.75);
                drawCar2D(0, 0, enemy, false);
                ctx.restore();

                // Игрок
                ctx.save();
                ctx.translate(120, roadY + laneH + laneH/2 - 5);
                drawCar2D(0, 0, player, true);
                ctx.restore();

                drawTrafficLight();
            }

            function update(dt) {
                if(!gameActive) return;

                if(countdown < 4) {
                    countdownTimer += dt;
                    if(countdownTimer >= 1.0) {
                        countdown++;
                        countdownTimer = 0;
                        if(countdown === 4) {
                            showToast("🚀 СТАРТ!");
                            startEngine();
                        }
                    }
                    return;
                }

                let p = player;

                // Автомат
                if(p.isAutomatic) {
                    let speedKmh = p.getSpeedKmh();
                    if(p.isGas && speedKmh > 5) {
                        if(p.gear < p.maxGear) {
                            let shiftUpSpeed = 18 + (p.gear * 22);
                            if(speedKmh > shiftUpSpeed) {
                                p.gear++;
                                p.rpm = 0.3;
                                playShiftSound();
                            }
                        }
                    } else if(p.isBrake && speedKmh < 12 && p.gear > 1) {
                        p.gear--;
                        p.rpm = 0.5;
                        playShiftSound();
                    }
                    if(speedKmh < 2 && !p.isGas) p.gear = 1;
                    if(p.gear === 0) p.gear = 1;
                }

                // Механика
                if(!p.isAutomatic) {
                    if(p.gear === 0 && p.isGas) {
                        p.gear = 1;
                        playShiftSound();
                    }
                    let rpm = p.getRPM();
                    if(rpm > p.maxRPM * 0.92 && p.isGas && p.gear > 0) {
                        p.isGas = false;
                        showToast("⚙️ ПЕРЕКЛЮЧАЙ!");
                    }
                }

                // Физика
                let currentRatio = p.getCurrentGearRatio() || 1;
                let speedMs = p.speed;

                if(p.isGas && p.gear > 0) {
                    let accel = p.power * (0.8 + p.rpm * 0.4) / currentRatio;
                    if(p.isNitro && p.nitroAmount > 0) {
                        accel *= 2.0;
                        p.nitroAmount -= 30 * dt;
                        screenShake = 4;
                        playNitroSound();
                    }
                    p.speed += accel * dt;
                } else if(p.isBrake) {
                    p.speed -= 60 * dt;
                    if(p.speed < 0) p.speed = 0;
                } else {
                    p.speed *= (1 - 0.008 * dt * 10);
                    if(p.speed < 0.01) p.speed = 0;
                }

                // Ограничение скорости
                let maxSpeedMs = p.topSpeed / 3.6;
                if(p.speed > maxSpeedMs) p.speed = maxSpeedMs;

                // Обороты
                if(p.gear > 0) {
                    let rpmVal = p.getRPM();
                    p.rpm = (rpmVal - p.idleRPM) / (p.maxRPM - p.idleRPM);
                    p.rpm = Math.max(0.03, Math.min(1, p.rpm));
                } else {
                    p.rpm *= (1 - 0.6 * dt);
                    if(p.rpm < 0.03) p.rpm = 0.03;
                }

                // Движение
                p.dist += p.speed * dt;
                bgScrollX = p.dist;

                // ИИ
                if(!isMultiplayer) {
                    enemy.isGas = true;
                    let eRatio = enemy.getCurrentGearRatio() || 1;
                    let eAccel = enemy.power * 0.7 / eRatio;
                    if(enemy.speed < enemy.topSpeed / 3.6) {
                        enemy.speed += eAccel * dt;
                    }
                    enemy.dist += enemy.speed * dt;
                    // ИИ переключает передачи
                    if(enemy.isAutomatic) {
                        let eSpeed = enemy.getSpeedKmh();
                        if(eSpeed > 18 && enemy.gear < 6) enemy.gear++;
                    } else {
                        if(enemy.gear < 6 && enemy.speed > 10 + enemy.gear * 12) {
                            enemy.gear++;
                            enemy.rpm = 0.3;
                        }
                    }
                }

                // HUD
                hudSpeed.textContent = Math.round(p.getSpeedKmh());
                hudGear.textContent = p.gear === 0 ? 'N' : p.gear;
                rpmFill.style.width = `${p.rpm * 100}%`;

                // Звук
                updateEngine(p.rpm, p.gear, p.isNitro && p.nitroAmount > 0);

                // Финиш
                if(p.dist >= TRACK_DIST || enemy.dist >= TRACK_DIST) {
                    gameActive = false;
                    stopEngine();
                    let isWin = p.dist >= enemy.dist;
                    if(isMultiplayer && socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({ type: 'finish', senderId: userId }));
                    } else {
                        finishRace(isWin);
                    }
                }

                if(isMultiplayer && socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        type: 'move',
                        senderId: userId,
                        dist: p.dist,
                        speed: p.speed,
                        gear: p.gear
                    }));
                }
            }

            function gameLoop(timestamp) {
                if(!lastTime) lastTime = timestamp;
                let dt = Math.min((timestamp - lastTime) / 1000, 0.05);
                lastTime = timestamp;
                update(dt);
                render();
                if(gameActive) requestAnimationFrame(gameLoop);
            }

            // ==========================================================================
            // УПРАВЛЕНИЕ КПП
            // ==========================================================================
            function shiftUp() {
                if(player.gear < player.maxGear) {
                    if(player.gear === 0) player.gear = 1;
                    else player.gear++;
                    player.rpm = Math.max(0.2, player.rpm * 0.55);
                    playShiftSound();
                }
            }

            function shiftDown() {
                if(player.gear > 1) {
                    player.gear--;
                    player.rpm = Math.min(0.9, player.rpm * 1.3);
                    playShiftSound();
                } else if(player.gear === 1) {
                    player.gear = 0;
                    player.rpm = 0.03;
                    playShiftSound();
                }
            }

            // ==========================================================================
            // МЕНЮ И СЕТЬ
            // ==========================================================================
            function showToast(msg) {
                toastMsg.textContent = msg;
                toastMsg.style.display = 'block';
                setTimeout(() => toastMsg.style.display = 'none', 2500);
            }

            function formatNumber(n) { return (n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
            function parseNumber(s) { return parseInt(s.toString().replace(/\s/g, '')) || 0; }

            async function loadBalance() {
                if(!userId) return;
                try {
                    const resp = await fetch(`${API_BASE}/profile/${encodeURIComponent(userId)}`);
                    const data = await resp.json();
                    casinoBalance = Number(data.casino_balance ?? data.balance ?? 0);
                } catch(e) {}
            }

            function sendGameResult(result, bet, win) {
                if(!userId) return Promise.reject();
                return fetch(`${API_BASE}/game_result`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, game: 'racing', result: result, bet: bet, win: win })
                }).then(r => r.json());
            }

            async function finishRace(isWin) {
                let winAmt = isWin ? Math.floor(raceBet * 1.85) : 0;
                try {
                    const res = await sendGameResult(isWin ? 'win' : 'lose', raceBet, winAmt);
                    if(res.new_balance !== undefined) {
                        casinoBalance = Number(res.new_balance);
                    }
                } catch(e) {}
                alert(isWin ? `🏆 ПОБЕДА! +${formatNumber(winAmt)} ₽` : `❌ ПРОИГРЫШ!`);
                location.reload();
            }

            function startDragRace() {
                mainMenu.classList.add('hidden');
                gameHud.classList.remove('hidden');
                controlsLayer.classList.remove('hidden');

                player = new PlayerState(selectedCar);
                enemy = new PlayerState(isMultiplayer ? CARS_DB[0] : CARS_DB[Math.floor(Math.random() * CARS_DB.length)]);
                enemy.gear = 1;
                countdown = 0;
                countdownTimer = 0;
                bgScrollX = 0;
                gameActive = true;
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }

            function connectWebSocket(code) {
                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                socket = new WebSocket(`${wsProtocol}//resellgame.bothost.tech/ws/race/${code}?userId=${userId}`);
                socket.onopen = () => {
                    showToast(`Ждём в комнате ${code}...`);
                    document.getElementById('hudRoom').textContent = code;
                    socket.send(JSON.stringify({ type: 'join', senderId: userId, carId: selectedCar.id }));
                    setTimeout(() => startDragRace(), 2000);
                };
                socket.onmessage = (e) => {
                    try {
                        const data = JSON.parse(e.data);
                        if(data.type === 'join' && data.senderId !== userId) {
                            let eCar = CARS_DB.find(c => c.id === data.carId);
                            if(eCar) enemy.car = eCar;
                        }
                        if(data.type === 'move' && data.senderId !== userId) {
                            enemy.dist = data.dist;
                            enemy.speed = data.speed;
                            enemy.gear = data.gear || 1;
                        }
                        if(data.type === 'game_over') {
                            gameActive = false;
                            finishRace(data.winnerId === userId);
                        }
                    } catch(err) {}
                };
                socket.onerror = () => {
                    showToast("Сбой сети. Одиночный режим.");
                    startDragRace();
                };
            }

            // ==========================================================================
            // МОДАЛКИ
            // ==========================================================================
            function openBetModal(action) {
                pendingAction = action;
                modalBalance.textContent = formatNumber(casinoBalance);
                betModal.classList.add('active');
            }

            document.getElementById('btnSingle').onclick = () => openBetModal('single');
            document.getElementById('btnCreateRoom').onclick = () => openBetModal('create');
            document.getElementById('btnJoinRoom').onclick = () => {
                roomModal.classList.add('active');
            };

            document.getElementById('modalBtnCancel').onclick = () => betModal.classList.remove('active');
            document.getElementById('roomBtnCancel').onclick = () => roomModal.classList.remove('active');

            document.getElementById('roomBtnConfirm').onclick = () => {
                let code = modalRoomInput.value.trim();
                if(!code) { showToast('Введите код!'); return; }
                targetRoomCode = code;
                roomModal.classList.remove('active');
                openBetModal('join');
            };

            document.getElementById('modalBtnConfirm').onclick = async () => {
                raceBet = parseNumber(modalBetInput.value);
                if(raceBet < 100) { showToast('Мин. ставка 100 ₽'); return; }
                if(raceBet > casinoBalance) { showToast('Недостаточно средств!'); return; }

                betModal.classList.remove('active');

                if(pendingAction === 'single') {
                    isMultiplayer = false;
                    document.getElementById('hudRoom').textContent = "СИНГЛ";
                    startDragRace();
                } else if(pendingAction === 'create') {
                    isMultiplayer = true;
                    let code = Math.floor(1000 + Math.random() * 9000).toString();
                    connectWebSocket(code);
                } else if(pendingAction === 'join') {
                    isMultiplayer = true;
                    connectWebSocket(targetRoomCode);
                }
            };

            // ==========================================================================
            // UI КАРУСЕЛЬ
            // ==========================================================================
            function initCarSelectorUI() {
                const selector = document.getElementById('carSelector');
                selector.innerHTML = '';

                let availableCars = CARS_DB.filter(car => userGarage.includes(car.id));
                if(availableCars.length === 0) availableCars = CARS_DB;

                if(availableCars.length > 0 && !availableCars.some(c => c.id === selectedCar.id)) {
                    selectedCar = availableCars[0];
                }

                availableCars.forEach(car => {
                    const card = document.createElement('div');
                    card.className = `car-card ${car.id === selectedCar.id ? 'active' : ''}`;

                    const cv = document.createElement('canvas');
                    cv.className = 'car-preview';
                    cv.width = 70;
                    cv.height = 32;
                    const cctx = cv.getContext('2d');
                    
                    cctx.save();
                    cctx.translate(35, 16);
                    cctx.scale(0.38, 0.38);
                    drawCarBody(cctx, car.color, car.type, 0, 0, 1);
                    // Колеса для превью
                    let wSize = car.type === 'truck' ? 12 : 10;
                    let wOff = car.type === 'truck' ? 36 : 30;
                    [-wOff, wOff].forEach(wx => {
                        cctx.save();
                        cctx.translate(wx, 8);
                        cctx.fillStyle = '#1a1a2e';
                        cctx.beginPath();
                        cctx.arc(0, 0, wSize, 0, Math.PI*2);
                        cctx.fill();
                        cctx.fillStyle = '#94a3b8';
                        cctx.beginPath();
                        cctx.arc(0, 0, wSize * 0.5, 0, Math.PI*2);
                        cctx.fill();
                        cctx.restore();
                    });
                    cctx.restore();

                    card.appendChild(cv);

                    let transLabel = car.trans === 'MT' ? 'МКПП' : 'АКПП';
                    card.innerHTML += `<div class="c-name">${car.name}</div>
                                      <div class="c-trans">${transLabel}</div>
                                      <div class="c-stats">⚡ +${car.speed_bonus}%</div>`;

                    card.onclick = () => {
                        document.querySelectorAll('.car-card').forEach(el => el.classList.remove('active'));
                        card.classList.add('active');
                        selectedCar = car;
                    };
                    selector.appendChild(card);
                });
            }

            // ==========================================================================
            // УПРАВЛЕНИЕ
            // ==========================================================================
            const bindBtn = (id, onStart, onEnd) => {
                const el = document.getElementById(id);
                if(!el) return;
                const press = (e) => { e.preventDefault(); onStart(); el.classList.add('active'); };
                const release = (e) => { e.preventDefault(); if(onEnd) onEnd(); el.classList.remove('active'); };
                el.addEventListener('touchstart', press);
                el.addEventListener('mousedown', press);
                el.addEventListener('touchend', release);
                el.addEventListener('mouseup', release);
                el.addEventListener('mouseleave', release);
            };

            bindBtn('btnGas', () => player.isGas = true, () => player.isGas = false);
            bindBtn('btnBrake', () => player.isBrake = true, () => player.isBrake = false);
            bindBtn('btnNitro', () => player.isNitro = true, () => player.isNitro = false);
            bindBtn('btnShiftUp', () => {
                if(!player.isAutomatic) shiftUp();
            });
            bindBtn('btnShiftDown', () => {
                if(!player.isAutomatic) shiftDown();
            });

            window.addEventListener('keydown', (e) => {
                if(e.key === 'ArrowUp' || e.key === 'w') player.isGas = true;
                if(e.key === 'ArrowDown' || e.key === 's') player.isBrake = true;
                if(e.key === 'ArrowRight' || e.key === 'd') { e.preventDefault(); if(!player.isAutomatic) shiftUp(); }
                if(e.key === 'ArrowLeft' || e.key === 'a') { e.preventDefault(); if(!player.isAutomatic) shiftDown(); }
                if(e.key === 'Shift') player.isNitro = true;
            });
            window.addEventListener('keyup', (e) => {
                if(e.key === 'ArrowUp' || e.key === 'w') player.isGas = false;
                if(e.key === 'ArrowDown' || e.key === 's') player.isBrake = false;
                if(e.key === 'Shift') player.isNitro = false;
            });

            // ==========================================================================
            // ИНИЦИАЛИЗАЦИЯ
            // ==========================================================================
            document.querySelectorAll('[data-amt]').forEach(b => b.onclick = () => modalBetInput.value = formatNumber(parseInt(b.dataset.amt)));
            modalBetInput.addEventListener('input', function() { this.value = formatNumber(parseNumber(this.value)); });

            window.addEventListener('resize', () => {
                cw = window.innerWidth;
                ch = window.innerHeight;
                canvas.width = cw;
                canvas.height = ch;
                if(!gameActive) render();
            });

            loadBalance();
            loadGarage().then(() => {
                render();
            });

        })();
    </script>
</body>
</html>
