<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>R-RACE 2D</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           СТИЛИ ИГРЫ
           ========================================================================== */
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(15, 23, 42, 0.96);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-gold: #fbbf24;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background: #000;
            font-family: 'Nunito', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-wrapper {
            max-width: 500px;
            width: 100%;
            height: 100vh;
            max-height: 900px;
            background: #1e293b;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
        }

        /* ===== МЕНЮ ===== */
        .menu-screen {
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.98) 0%, rgba(2, 6, 23, 0.96) 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 16px; z-index: 100; overflow-y: auto;
        }

        .logo {
            font-family: 'Montserrat', sans-serif; font-size: 30px; font-weight: 900; font-style: italic;
            text-transform: uppercase; color: #fff; text-shadow: 0 4px 15px rgba(59, 130, 246, 0.6);
            margin-top: 6px; margin-bottom: 12px; text-align: center; line-height: 1.1;
        }
        .logo span { color: var(--accent-gold); display: block; font-size: 16px; letter-spacing: 3px; }

        .menu-card {
            width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--border-color);
            border-radius: 14px; padding: 12px; margin-bottom: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
        }

        .section-title { font-size: 10px; font-weight: 900; color: #94a3b8; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 1px; }

        .car-carousel {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory;
        }
        .car-carousel::-webkit-scrollbar { height: 4px; }
        .car-carousel::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 4px; }
        
        .car-card {
            min-width: 120px; background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.1);
            border-radius: 10px; padding: 6px; text-align: center; cursor: pointer; transition: all 0.2s;
            scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px;
            position: relative;
        }
        .car-card.active { background: rgba(245, 158, 11, 0.15); border-color: var(--accent-gold); transform: scale(1.02); }
        .car-card .c-name { font-size: 10px; font-weight: 900; white-space: nowrap; }
        .car-card .c-stats { font-size: 8px; color: var(--accent-green); font-weight: 800; background: rgba(16,185,129,0.15); padding: 1px 4px; border-radius: 4px; }
        .car-card .c-trans { font-size: 8px; color: var(--accent-blue); font-weight: 800; }

        .car-preview { width: 80px; height: 36px; }

        .btn {
            width: 100%; height: 44px; border: none; border-radius: 10px;
            font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 13px;
            color: #fff; cursor: pointer; text-transform: uppercase; transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-green { background: linear-gradient(135deg, #10b981, #047857); box-shadow: 0 4px 15px rgba(16,185,129,0.4); }
        .btn-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); box-shadow: 0 4px 15px rgba(59,130,246,0.4); }
        .btn-gold { background: linear-gradient(135deg, #f59e0b, #b45309); box-shadow: 0 4px 15px rgba(245,158,11,0.4); }
        
        .flex-row { display: flex; gap: 6px; }
        .flex-row .btn { flex: 1; }

        /* ===== МОДАЛКИ ===== */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box {
            background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 18px;
            padding: 18px; width: 90%; max-width: 340px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }
        .modal-title { font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 900; color: var(--accent-gold); margin-bottom: 10px; text-transform: uppercase; }
        .styled-input {
            width: 100%; height: 44px; background: rgba(0,0,0,0.6); border: 2px solid var(--border-color);
            border-radius: 10px; color: #fff; font-family: 'Montserrat', sans-serif; font-weight: 900;
            font-size: 16px; text-align: center; outline: none; margin-bottom: 10px;
        }

        /* ===== HUD ===== */
        .hud {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; align-items: center; z-index: 50; pointer-events: none;
        }
        .hud-badge {
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border: 1px solid var(--border-color);
            padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .hud-badge span { color: var(--accent-gold); font-family: 'Montserrat', sans-serif; font-weight: 900; }

        .tachometer {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border-color);
        }
        .rpm-bar { width: 70px; height: 6px; background: #334155; border-radius: 3px; overflow: hidden; }
        .rpm-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444); }
        .gear-text { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 12px; color: #fff; }

        /* ===== УПРАВЛЕНИЕ ===== */
        .controls {
            position: absolute; bottom: 12px; left: 12px; right: 12px;
            display: flex; justify-content: space-between; align-items: flex-end; z-index: 50;
        }
        .ctrl-group { display: flex; gap: 6px; align-items: flex-end; }
        
        .pedal {
            border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: 'Montserrat', sans-serif; font-weight: 900; color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); cursor: pointer; transition: transform 0.05s;
            border: 2px solid rgba(255,255,255,0.25); user-select: none;
        }
        .btn-shift { width: 48px; height: 48px; background: rgba(30, 41, 59, 0.9); font-size: 18px; border-radius: 12px; }
        .btn-shift:active { background: rgba(59, 130, 246, 0.8); transform: scale(0.92); }

        .pedal.nitro { background: linear-gradient(135deg, #3b82f6, #1d4ed8); width: 56px; height: 56px; border-radius: 50%; font-size: 12px; }
        .pedal.nitro:active { transform: scale(0.9); box-shadow: 0 0 15px #3b82f6; }
        
        .pedal.brake { background: linear-gradient(135deg, #ef4444, #b91c1c); width: 48px; height: 48px; font-size: 16px; }
        .pedal.brake:active { transform: scale(0.92); }

        .pedal.gas { background: linear-gradient(180deg, #10b981, #047857); width: 68px; height: 85px; font-size: 12px; }
        .pedal.gas:active { transform: scale(0.95); box-shadow: 0 0 20px #10b981; }

        canvas#gameCanvas { width: 100%; height: 100%; display: block; }
        .hidden { display: none !important; }
        
        .toast {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95); border: 2px solid var(--accent-gold); color: #fff;
            padding: 8px 16px; font-weight: 900; border-radius: 10px; z-index: 100;
            display: none; white-space: nowrap; text-transform: uppercase; font-size: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div class="game-wrapper" id="appContainer">
        <div class="toast" id="toastMsg">Уведомление</div>

        <!-- HUD -->
        <div class="hud hidden" id="gameHud">
            <div class="hud-badge">🏁 <span id="hudRoom">СИНГЛ</span></div>
            <div class="tachometer">
                <div class="rpm-bar"><div class="rpm-fill" id="rpmFill"></div></div>
                <div class="gear-text" id="hudGear">N</div>
            </div>
            <div class="hud-badge">⚡ <span id="hudSpeed">0</span> KM/H</div>
        </div>

        <!-- МЕНЮ -->
        <div class="menu-screen" id="mainMenu">
            <div class="logo">RESELL <span>RACING</span></div>

            <div class="menu-card">
                <div class="section-title">ВАШ ГАРАЖ</div>
                <div class="car-carousel" id="carSelector"></div>
            </div>

            <button class="btn btn-green" id="btnSingle" style="margin-bottom: 8px; height: 46px; font-size: 13px;">🚗 ОДИНОЧНАЯ ИГРА</button>

            <div class="menu-card">
                <div class="section-title">МУЛЬТИПЛЕЕР</div>
                <div class="flex-row">
                    <button class="btn btn-blue" id="btnCreateRoom">СОЗДАТЬ</button>
                    <button class="btn btn-gold" id="btnJoinRoom">ВОЙТИ</button>
                </div>
            </div>
        </div>

        <!-- МОДАЛКА СТАВКИ -->
        <div class="modal-overlay" id="betModal">
            <div class="modal-box">
                <div class="modal-title">Ставка на заезд</div>
                <div style="font-size:11px; color:#94a3b8; font-weight:800; margin-bottom:6px;">БАЛАНС: <span id="modalBalance" style="color:var(--accent-gold);">0</span> ₽</div>
                <input type="text" class="styled-input" id="modalBetInput" value="10 000">
                <div class="flex-row" style="margin-bottom: 10px;">
                    <button class="btn btn-gold" style="height:30px; font-size:10px;" data-amt="5000">5K</button>
                    <button class="btn btn-gold" style="height:30px; font-size:10px;" data-amt="10000">10K</button>
                    <button class="btn btn-gold" style="height:30px; font-size:10px;" data-amt="25000">25K</button>
                </div>
                <div class="flex-row">
                    <button class="btn btn-blue" id="modalBtnCancel">ОТМЕНА</button>
                    <button class="btn btn-green" id="modalBtnConfirm">СТАРТ</button>
                </div>
            </div>
        </div>

        <!-- МОДАЛКА КОДА -->
        <div class="modal-overlay" id="roomModal">
            <div class="modal-box">
                <div class="modal-title">Вход в комнату</div>
                <input type="text" class="styled-input" id="modalRoomInput" placeholder="Код (6 цифр)" maxlength="6">
                <div class="flex-row">
                    <button class="btn btn-blue" id="roomBtnCancel">ОТМЕНА</button>
                    <button class="btn btn-green" id="roomBtnConfirm">ДАЛЕЕ</button>
                </div>
            </div>
        </div>

        <!-- КАНВАС -->
        <canvas id="gameCanvas"></canvas>

        <!-- УПРАВЛЕНИЕ -->
        <div class="controls hidden" id="controlsLayer">
            <div class="ctrl-group">
                <div class="pedal btn-shift" id="btnShiftDown">◄</div>
                <div class="pedal btn-shift" id="btnShiftUp">►</div>
                <div class="pedal nitro" id="btnNitro">N2O</div>
            </div>
            <div class="ctrl-group">
                <div class="pedal brake" id="btnBrake">▼</div>
                <div class="pedal gas" id="btnGas"><span style="font-size: 18px;">▲</span>ГАЗ</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ======== ПОЛИФИЛЛ roundRect ========
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
                    var r = typeof radii === 'number' ? radii : (radii || 0);
                    this.moveTo(x + r, y);
                    this.arcTo(x + w, y, x + w, y + h, r);
                    this.arcTo(x + w, y + h, x, y + h, r);
                    this.arcTo(x, y + h, x, y, r);
                    this.arcTo(x, y, x + w, y, r);
                    return this;
                };
            }

            const tg = window.Telegram?.WebApp;
            if (tg) { tg.expand(); tg.ready(); }

            const API_BASE = 'https://resellgame.bothost.tech';
            let userId = null;
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('userId')) userId = urlParams.get('userId');
            else if (tg?.initDataUnsafe?.user?.id) userId = tg.initDataUnsafe.user.id;

            // ==========================================================================
            // АУДИО ДВИЖОК (ПРИЯТНЫЙ ЗВУК МОТОРА)
            // ==========================================================================
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let engineOsc = null;
            let engineGain = null;
            let engineFilter = null;

            function startEngine() {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                if(!engineOsc) {
                    engineOsc = audioCtx.createOscillator();
                    engineFilter = audioCtx.createBiquadFilter();
                    engineGain = audioCtx.createGain();
                    
                    engineOsc.type = 'sawtooth';
                    engineFilter.type = 'lowpass';
                    engineFilter.frequency.value = 800;
                    engineFilter.Q.value = 1.5;
                    
                    engineOsc.connect(engineFilter);
                    engineFilter.connect(engineGain);
                    engineGain.connect(audioCtx.destination);
                    engineGain.gain.value = 0.08;
                    engineOsc.start();
                }
            }

            function updateEngine(rpm, gear, isNitro) {
                if(engineOsc) {
                    // Частота мотора (от холостых до отсечки)
                    let baseFreq = 50 + rpm * 350;
                    if(isNitro) baseFreq *= 1.3;
                    engineOsc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
                    engineFilter.frequency.setValueAtTime(200 + rpm * 1200, audioCtx.currentTime);
                    
                    // Громкость чуть выше на высоких оборотах
                    engineGain.gain.setValueAtTime(0.05 + rpm * 0.08, audioCtx.currentTime);
                }
            }

            function playNitroSound() {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(80, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 0.8);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.8);
            }

            function playShiftSound() {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.15);
            }

            function stopEngine() {
                if(engineOsc) { engineOsc.stop(); engineOsc.disconnect(); engineOsc = null; }
                if(engineFilter) { engineFilter.disconnect(); engineFilter = null; }
                if(engineGain) { engineGain.disconnect(); engineGain = null; }
            }

            // ==========================================================================
            // БАЗА 14 МАШИН С ТИПОМ КОРОБКИ (MT = МКПП, AT = АКПП)
            // ==========================================================================
            const CARS_DB = [
                { id: "zhiguli", name: "ВАЗ-2106", speed_bonus: 10, price: 15000, color: '#e74c3c', type: 'box', trans: 'MT' },
                { id: "granta", name: "Лада Гранта", speed_bonus: 15, price: 35000, color: '#95a5a6', type: 'sedan', trans: 'MT' },
                { id: "w140", name: "Mercedes W140", speed_bonus: 28, price: 90000, color: '#1e293b', type: 'luxury', trans: 'AT' },
                { id: "mustang", name: "Ford Mustang", speed_bonus: 30, price: 120000, color: '#3b82f6', type: 'muscle', trans: 'MT' },
                { id: "cclass", name: "Mercedes C-Class", speed_bonus: 35, price: 160000, color: '#cbd5e1', type: 'sedan', trans: 'AT' },
                { id: "bmwm4", name: "BMW M4", speed_bonus: 45, price: 180000, color: '#f59e0b', type: 'sport', trans: 'MT' },
                { id: "challenger", name: "Dodge Challenger", speed_bonus: 55, price: 300000, color: '#8b5cf6', type: 'muscle', trans: 'MT' },
                { id: "ramtrx", name: "Dodge Ram TRX", speed_bonus: 60, price: 350000, color: '#0f172a', type: 'truck', trans: 'AT' },
                { id: "bmwm5", name: "BMW M5 F90", speed_bonus: 70, price: 450000, color: '#2563eb', type: 'sport', trans: 'MT' },
                { id: "sclass", name: "Mercedes S-Class", speed_bonus: 75, price: 650000, color: '#000000', type: 'luxury', trans: 'AT' },
                { id: "bmwx7", name: "BMW X7", speed_bonus: 70, price: 850000, color: '#ffffff', type: 'suv', trans: 'AT' },
                { id: "rollsroyce", name: "Rolls-Royce", speed_bonus: 95, price: 1800000, color: '#334155', type: 'luxury', trans: 'AT' },
                { id: "aventador", name: "Lamborghini", speed_bonus: 98, price: 5000000, color: '#10b981', type: 'supercar', trans: 'MT' },
                { id: "brabus", name: "Brabus Mansory", speed_bonus: 99, price: 20000000, color: '#111111', type: 'suv', trans: 'AT' }
            ];

            let selectedCar = CARS_DB[3];
            let casinoBalance = 0;
            let raceBet = 10000;
            let socket = null;
            let isMultiplayer = false;
            let pendingAction = null;
            let targetRoomCode = null;

            // --- ЗАГРУЗКА ГАРАЖА ИЗ bot.py ---
            let userGarage = []; // Список ID машин, которые есть у игрока

            async function loadGarage() {
                if (!userId) {
                    // Если нет userId, показываем все машины для теста
                    userGarage = CARS_DB.map(c => c.id);
                    return;
                }
                try {
                    const resp = await fetch(`${API_BASE}/profile/${encodeURIComponent(userId)}`);
                    const data = await resp.json();
                    // В ответе должна быть car_collection
                    if (data.car_collection) {
                        userGarage = data.car_collection;
                    } else {
                        // Если не пришло, пробуем через другой эндпоинт
                        const raceResp = await fetch(`${API_BASE}/race/create`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userId: userId, carId: 'mustang', bet: 1000 })
                        });
                        const raceData = await raceResp.json();
                        if (raceData.error === "Этой машины нет в гараже!") {
                            // Значит машины нет, попробуем получить коллекцию через get_car_collection
                            // Для этого используем прямой запрос к handle_action
                            const statsResp = await fetch(`${API_BASE}/profile/${encodeURIComponent(userId)}`);
                            const statsData = await statsResp.json();
                            if (statsData.car_collection) {
                                userGarage = statsData.car_collection;
                            }
                        }
                    }
                } catch(e) {
                    console.warn('Не удалось загрузить гараж, показываем все машины');
                    userGarage = CARS_DB.map(c => c.id);
                }
                // Если гараж всё ещё пуст, показываем все машины
                if (!userGarage || userGarage.length === 0) {
                    userGarage = CARS_DB.map(c => c.id);
                }
                initCarSelectorUI();
            }

            // DOM
            const mainMenu = document.getElementById('mainMenu');
            const gameHud = document.getElementById('gameHud');
            const controlsLayer = document.getElementById('controlsLayer');
            const toastMsg = document.getElementById('toastMsg');
            const hudSpeed = document.getElementById('hudSpeed');
            const hudGear = document.getElementById('hudGear');
            const rpmFill = document.getElementById('rpmFill');

            const betModal = document.getElementById('betModal');
            const roomModal = document.getElementById('roomModal');
            const modalBetInput = document.getElementById('modalBetInput');
            const modalBalance = document.getElementById('modalBalance');
            const modalRoomInput = document.getElementById('modalRoomInput');

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            let cw = window.innerWidth;
            let ch = window.innerHeight;
            canvas.width = cw;
            canvas.height = ch;

            // ==========================================================================
            // СОСТОЯНИЕ ГОНКИ
            // ==========================================================================
            const TRACK_DIST = 10000;
            let gameActive = false;
            let lastTime = 0;
            let bgScrollX = 0;
            let screenShake = 0;
            let countdown = -1;
            let countdownTimer = 0;

            // --------------------------------------------------------------------------
            // РЕАЛИСТИЧНАЯ МКПП (6 ступеней)
            // --------------------------------------------------------------------------
            const GEAR_RATIOS = [
                0,    // Neutral
                3.5,  // 1-я
                2.2,  // 2-я
                1.5,  // 3-я
                1.1,  // 4-я
                0.85, // 5-я
                0.65  // 6-я
            ];

            const FINAL_DRIVE = 3.5;
            const WHEEL_RADIUS = 0.3; // метры

            class PlayerState {
                constructor(carDef) {
                    this.car = carDef;
                    this.dist = 0;
                    this.speed = 0; // м/с
                    this.rpm = 0.05; // 0.0 - 1.0 (от холостых до отсечки)
                    this.nitroAmount = 100;
                    this.isGas = false;
                    this.isNitro = false;
                    this.isBrake = false;
                    
                    // Механика КПП
                    this.gear = 0; // 0 = нейтраль
                    this.maxGear = 6;
                    this.isAutomatic = (carDef.trans === 'AT');
                    this.shiftCooldown = 0;
                    
                    // Характеристики
                    this.maxRPM = 7200; // оборотов в минуту
                    this.idleRPM = 800;
                    this.power = 80 + carDef.speed_bonus * 1.2;
                    this.topSpeed = 160 + carDef.speed_bonus * 2.2; // км/ч
                }

                getCurrentGearRatio() {
                    if (this.gear === 0) return 0;
                    return GEAR_RATIOS[this.gear] || 0;
                }

                getSpeedKmh() {
                    return this.speed * 3.6; // м/с -> км/ч
                }

                getRPM() {
                    if (this.gear === 0) return this.idleRPM + this.rpm * 500;
                    let wheelRPM = (this.speed / (WHEEL_RADIUS * 2 * Math.PI)) * 60;
                    let engineRPM = wheelRPM * this.getCurrentGearRatio() * FINAL_DRIVE;
                    return Math.max(this.idleRPM, engineRPM);
                }
            }

            let player = new PlayerState(selectedCar);
            let enemy = new PlayerState(CARS_DB[1]);

            // ==========================================================================
            // УЛУЧШЕННАЯ ОТРИСОВКА МАШИН
            // ==========================================================================
            function drawCar2D(x, y, pState, isPlayer) {
                ctx.save();
                ctx.translate(x, y);

                let color = pState.car.color;
                let type = pState.car.type;

                // Тень
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath();
                ctx.ellipse(0, 16, 65, 7, 0, 0, Math.PI*2);
                ctx.fill();

                // Нитро пламя
                if (isPlayer && pState.isNitro && pState.nitroAmount > 0 && countdown >= 4) {
                    ctx.fillStyle = '#3b82f6';
                    ctx.beginPath();
                    ctx.moveTo(-52, 2);
                    ctx.lineTo(-85 - Math.random() * 25, 5);
                    ctx.lineTo(-52, 8);
                    ctx.fill();
                    ctx.fillStyle = '#fef08a';
                    ctx.beginPath();
                    ctx.moveTo(-52, 4);
                    ctx.lineTo(-70 - Math.random() * 15, 5);
                    ctx.lineTo(-52, 6);
                    ctx.fill();
                }

                // Кузов
                ctx.fillStyle = color;
                
                if (type === 'supercar') {
                    // Ламборгини - клиновидный
                    ctx.beginPath();
                    ctx.moveTo(-50, 8);
                    ctx.lineTo(-45, -4);
                    ctx.lineTo(-15, -14);
                    ctx.lineTo(20, -12);
                    ctx.lineTo(55, 0);
                    ctx.lineTo(58, 8);
                    ctx.closePath();
                    ctx.fill();
                    // Спойлер
                    ctx.fillStyle = '#000';
                    ctx.fillRect(-48, -12, 4, 10);
                    ctx.fillRect(-52, -14, 10, 3);
                    // Окна
                    ctx.fillStyle = '#0f172a';
                    ctx.beginPath();
                    ctx.moveTo(-12, -12);
                    ctx.lineTo(18, -10);
                    ctx.lineTo(35, -2);
                    ctx.lineTo(-5, -2);
                    ctx.fill();
                } else if (type === 'muscle') {
                    // Мустанг/Челленджер - длинный капот
                    ctx.beginPath();
                    ctx.moveTo(-52, 8);
                    ctx.lineTo(-50, -2);
                    ctx.lineTo(-25, -6);
                    ctx.lineTo(-10, -16);
                    ctx.lineTo(20, -16);
                    ctx.lineTo(40, -4);
                    ctx.lineTo(56, 2);
                    ctx.lineTo(56, 8);
                    ctx.closePath();
                    ctx.fill();
                    // Полосы
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(40, -4, 16, 3);
                    // Окна
                    ctx.fillStyle = '#0f172a';
                    ctx.beginPath();
                    ctx.moveTo(-8, -14);
                    ctx.lineTo(18, -14);
                    ctx.lineTo(32, -4);
                    ctx.lineTo(-5, -4);
                    ctx.fill();
                } else if (type === 'truck') {
                    // Рам TRX
                    ctx.fillRect(-55, -4, 110, 12);
                    ctx.fillRect(-12, -24, 45, 20);
                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(-55, -16, 43, 12);
                    // Окна
                    ctx.fillStyle = '#0f172a';
                    ctx.fillRect(-8, -22, 35, 16);
                } else if (type === 'luxury') {
                    // S-Class / Rolls-Royce
                    ctx.beginPath();
                    ctx.moveTo(-55, 8);
                    ctx.lineTo(-52, -4);
                    ctx.lineTo(-30, -4);
                    ctx.lineTo(-15, -18);
                    ctx.lineTo(18, -18);
                    ctx.lineTo(35, -4);
                    ctx.lineTo(55, -2);
                    ctx.lineTo(58, 8);
                    ctx.closePath();
                    ctx.fill();
                    // Окна
                    ctx.fillStyle = '#0f172a';
                    ctx.beginPath();
                    ctx.moveTo(-12, -16);
                    ctx.lineTo(15, -16);
                    ctx.lineTo(28, -4);
                    ctx.lineTo(-25, -4);
                    ctx.fill();
                } else if (type === 'suv' && pState.car.id === 'brabus') {
                    // Brabus - высокий
                    ctx.fillRect(-50, -22, 100, 30);
                    ctx.fillStyle = '#0f172a';
                    ctx.fillRect(-28, -20, 56, 16);
                    // Запаска
                    ctx.fillStyle = '#111';
                    ctx.fillRect(-54, -12, 6, 14);
                } else {
                    // Седан / хэтчбек
                    ctx.beginPath();
                    ctx.moveTo(-50, 8);
                    ctx.lineTo(-48, -2);
                    ctx.lineTo(-28, -4);
                    ctx.lineTo(-12, -16);
                    ctx.lineTo(15, -16);
                    ctx.lineTo(32, -4);
                    ctx.lineTo(52, 0);
                    ctx.lineTo(52, 8);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#0f172a';
                    ctx.beginPath();
                    ctx.moveTo(-10, -14);
                    ctx.lineTo(12, -14);
                    ctx.lineTo(25, -4);
                    ctx.lineTo(-6, -4);
                    ctx.fill();
                }

                // Фары
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(50, 0, 6, 4);
                ctx.fillRect(50, -4, 6, 3);

                // Стоп-сигналы
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(-50, -2, 4, 5);

                // Колеса
                let wheelRot = (pState.dist * 0.12) % (Math.PI * 2);
                let wSize = type === 'truck' ? 14 : 11;
                [-34, 34].forEach(wx => {
                    ctx.save();
                    ctx.translate(wx, 8);
                    ctx.rotate(wheelRot);
                    ctx.fillStyle = '#111';
                    ctx.beginPath();
                    ctx.arc(0, 0, wSize, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = '#94a3b8';
                    ctx.beginPath();
                    ctx.arc(0, 0, wSize * 0.6, 0, Math.PI*2);
                    ctx.fill();
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(-wSize * 0.6, 0);
                    ctx.lineTo(wSize * 0.6, 0);
                    ctx.moveTo(0, -wSize * 0.6);
                    ctx.lineTo(0, wSize * 0.6);
                    ctx.stroke();
                    ctx.restore();
                });

                ctx.restore();
            }

            // ==========================================================================
            // ОТРИСОВКА ФОНА (ТРАССА СМЕЩЕНА ВВЕРХ)
            // ==========================================================================
            function drawScene() {
                // Небо
                let grad = ctx.createLinearGradient(0, 0, 0, ch * 0.5);
                grad.addColorStop(0, '#1e3a8a');
                grad.addColorStop(0.4, '#ea580c');
                grad.addColorStop(1, '#fde047');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, cw, ch);

                // Солнце
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.beginPath();
                ctx.arc(cw * 0.75, ch * 0.18, 40, 0, Math.PI*2);
                ctx.fill();

                // Горы (параллакс)
                ctx.fillStyle = '#7c2d12';
                ctx.beginPath();
                let m1X = -(bgScrollX * 0.1) % cw;
                ctx.moveTo(m1X - cw, ch * 0.5);
                ctx.lineTo(m1X - cw * 0.6, ch * 0.2);
                ctx.lineTo(m1X - cw * 0.2, ch * 0.5);
                ctx.lineTo(m1X + cw * 0.2, ch * 0.28);
                ctx.lineTo(m1X + cw * 0.6, ch * 0.5);
                ctx.lineTo(m1X + cw * 1.2, ch * 0.22);
                ctx.lineTo(cw * 2, ch * 0.5);
                ctx.fill();

                // Холмы (параллакс)
                ctx.fillStyle = '#b45309';
                ctx.beginPath();
                let m2X = -(bgScrollX * 0.25) % cw;
                ctx.moveTo(m2X - cw, ch * 0.5);
                ctx.lineTo(m2X - cw * 0.4, ch * 0.38);
                ctx.lineTo(m2X, ch * 0.5);
                ctx.lineTo(m2X + cw * 0.5, ch * 0.35);
                ctx.lineTo(m2X + cw, ch * 0.5);
                ctx.lineTo(m2X + cw * 1.5, ch * 0.4);
                ctx.lineTo(cw * 2, ch * 0.5);
                ctx.fill();

                // Кактусы
                ctx.fillStyle = '#065f46';
                let cX = -(bgScrollX * 0.4) % 600;
                for(let i = -600; i < cw + 600; i += 600) {
                    let px = cX + i;
                    if(px > -20 && px < cw + 20) {
                        ctx.fillRect(px, ch * 0.42, 8, 40);
                        ctx.fillRect(px - 12, ch * 0.45, 12, 6);
                        ctx.fillRect(px + 8, ch * 0.44, 12, 6);
                    }
                }

                // ДОРОГА (СМЕЩЕНА ВВЕРХ)
                let roadY = ch * 0.5;
                let roadH = ch * 0.5;

                ctx.fillStyle = '#d97706'; // Обочина
                ctx.fillRect(0, roadY, cw, 16);

                let ashY = roadY + 16;
                let ashH = roadH - 16;
                ctx.fillStyle = '#334155'; // Асфальт
                ctx.fillRect(0, ashY, cw, ashH);

                // Бордюр
                ctx.fillStyle = '#cbd5e1';
                ctx.fillRect(0, ashY - 4, cw, 4);
                ctx.fillRect(0, ashY + ashH - 4, cw, 4);

                // Разметка
                ctx.fillStyle = '#ffffff';
                let lX = -(bgScrollX * 1.5) % 70;
                for(let i = -70; i < cw + 70; i += 70) {
                    ctx.fillRect(lX + i, ashY + ashH/2 - 3, 30, 5);
                }

                // Старт/Финиш
                if(player.dist < 600) drawCheckered(150 - player.dist, ashY, ashH);
                if(player.dist > TRACK_DIST - cw - 200) drawCheckered(150 + (TRACK_DIST - player.dist), ashY, ashH);
            }

            function drawCheckered(x, y, h) {
                if(x < -50 || x > cw + 50) return;
                let sq = 10;
                for(let i = 0; i < h/sq; i++) {
                    ctx.fillStyle = (i%2===0) ? '#fff' : '#000';
                    ctx.fillRect(x, y + i*sq, sq, sq);
                    ctx.fillStyle = (i%2===0) ? '#000' : '#fff';
                    ctx.fillRect(x + sq, y + i*sq, sq, sq);
                }
            }

            function drawTrafficLight() {
                if(countdown < 0 || countdown >= 4) return;
                let lx = cw/2 - 30;
                let ly = 16;
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.roundRect(lx, ly, 60, 130, 8);
                ctx.fill();
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                let cols = ['#ef4444', '#ef4444', '#f59e0b', '#10b981'];
                for(let i = 0; i < 4; i++) {
                    ctx.fillStyle = (countdown === i) ? cols[i] : '#334155';
                    ctx.beginPath();
                    ctx.arc(cw/2, ly + 22 + i * 30, 9, 0, Math.PI*2);
                    ctx.fill();
                }
            }

            // ==========================================================================
            // ИГРОВОЙ ЦИКЛ
            // ==========================================================================
            function render() {
                ctx.clearRect(0, 0, cw, ch);
                drawScene();

                let roadY = ch * 0.5 + 16;
                let laneH = (ch * 0.5 - 16) / 2;

                // Соперник (верхняя полоса)
                let enemyX = 150 + (enemy.dist - player.dist) * 1.2;
                ctx.save();
                ctx.translate(enemyX, roadY + laneH/2 - 5);
                ctx.scale(0.8, 0.8);
                drawCar2D(0, 0, enemy, false);
                ctx.restore();

                // Игрок (нижняя полоса)
                ctx.save();
                ctx.translate(150, roadY + laneH + laneH/2 - 5);
                drawCar2D(0, 0, player, true);
                ctx.restore();

                drawTrafficLight();
            }

            function update(dt) {
                if(!gameActive) return;

                if(countdown < 4) {
                    countdownTimer += dt;
                    if(countdownTimer >= 1.0) {
                        countdown++;
                        countdownTimer = 0;
                        if(countdown === 4) {
                            showToast("🚀 СТАРТ!");
                            startEngine();
                        }
                    }
                    return;
                }

                // ============================================================
                // РЕАЛИСТИЧНАЯ МКПП / АКПП
                // ============================================================
                let p = player;

                // --- Автоматическая коробка ---
                if(p.isAutomatic) {
                    let speedKmh = p.getSpeedKmh();
                    if(p.isGas && speedKmh > 5) {
                        if(p.gear < p.maxGear) {
                            let nextRatio = GEAR_RATIOS[p.gear + 1];
                            let currentRatio = GEAR_RATIOS[p.gear] || GEAR_RATIOS[1];
                            // Переключаем вверх при достижении определённой скорости
                            let shiftUpSpeed = 15 + (p.gear * 25);
                            if(speedKmh > shiftUpSpeed) {
                                p.gear++;
                                playShiftSound();
                                p.rpm = 0.3;
                            }
                        }
                    } else if(p.isBrake && speedKmh < 10 && p.gear > 1) {
                        p.gear--;
                        p.rpm = 0.6;
                        playShiftSound();
                    }
                    // Нейтраль если стоим
                    if(speedKmh < 1 && !p.isGas) p.gear = 1;
                    if(p.gear === 0) p.gear = 1;
                }

                // --- Ручная коробка ---
                if(!p.isAutomatic) {
                    if(p.gear === 0 && p.isGas) {
                        p.gear = 1;
                        playShiftSound();
                    }
                    // Отсечка — если обороты зашкаливают, сигналим
                    let rpm = p.getRPM();
                    if(rpm > p.maxRPM * 0.95 && p.isGas && p.gear > 0) {
                        // Автоматический сброс газа при отсечке
                        p.isGas = false;
                        showToast("⚙️ ПЕРЕКЛЮЧАЙ ПЕРЕДАЧУ!");
                    }
                }

                // --- Физика ---
                let currentRatio = p.getCurrentGearRatio();
                let speedMs = p.speed;

                // Ускорение
                if(p.isGas && p.gear > 0) {
                    let accel = p.power * (1 + p.rpm * 0.5) / (currentRatio || 1);
                    if(p.isNitro && p.nitroAmount > 0) {
                        accel *= 2.2;
                        p.nitroAmount -= 35 * dt;
                        screenShake = 6;
                        playNitroSound();
                    }
                    p.speed += accel * dt;
                } else if(p.isBrake) {
                    p.speed -= 80 * dt;
                    if(p.speed < 0) p.speed = 0;
                } else {
                    // Трение
                    p.speed *= (1 - 0.01 * dt * 10);
                    if(p.speed < 0.01) p.speed = 0;
                }

                // Ограничение скорости (реалистичная топ-скорость)
                let maxSpeedMs = p.topSpeed / 3.6;
                if(p.speed > maxSpeedMs) p.speed = maxSpeedMs;

                // Обороты
                if(p.gear > 0) {
                    let rpmVal = p.getRPM();
                    p.rpm = (rpmVal - p.idleRPM) / (p.maxRPM - p.idleRPM);
                    p.rpm = Math.max(0, Math.min(1, p.rpm));
                } else {
                    // На нейтрали обороты падают
                    p.rpm *= (1 - 0.5 * dt);
                    if(p.rpm < 0.05) p.rpm = 0.05;
                }

                // Движение
                p.dist += p.speed * dt;
                bgScrollX = p.dist;

                // ИИ соперника (упрощённо)
                if(!isMultiplayer) {
                    enemy.isGas = true;
                    let eRatio = enemy.getCurrentGearRatio() || 1;
                    let eAccel = enemy.power / eRatio;
                    if(enemy.speed < enemy.topSpeed / 3.6) {
                        enemy.speed += eAccel * dt;
                    }
                    enemy.dist += enemy.speed * dt;
                    // Автоматическое переключение у ИИ
                    if(enemy.isAutomatic) {
                        let eSpeed = enemy.getSpeedKmh();
                        if(eSpeed > 20 && enemy.gear < 6 && enemy.gear > 0) {
                            enemy.gear++;
                        }
                    } else {
                        if(enemy.gear < 6 && enemy.speed > 8 + enemy.gear * 12) {
                            enemy.gear++;
                            enemy.rpm = 0.3;
                        }
                    }
                }

                // Обновление HUD
                hudSpeed.textContent = Math.round(p.getSpeedKmh());
                hudGear.textContent = p.gear === 0 ? 'N' : p.gear;
                rpmFill.style.width = `${p.rpm * 100}%`;

                // Звук мотора
                updateEngine(p.rpm, p.gear, p.isNitro && p.nitroAmount > 0);

                // Финиш
                if(p.dist >= TRACK_DIST || enemy.dist >= TRACK_DIST) {
                    gameActive = false;
                    stopEngine();
                    let isWin = p.dist >= enemy.dist;
                    if(isMultiplayer && socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({ type: 'finish', senderId: userId }));
                    } else {
                        finishRace(isWin);
                    }
                }

                // Сеть
                if(isMultiplayer && socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        type: 'move',
                        senderId: userId,
                        dist: p.dist,
                        speed: p.speed,
                        gear: p.gear
                    }));
                }
            }

            function gameLoop(timestamp) {
                if(!lastTime) lastTime = timestamp;
                let dt = Math.min((timestamp - lastTime) / 1000, 0.05);
                lastTime = timestamp;
                update(dt);
                render();
                if(gameActive) requestAnimationFrame(gameLoop);
            }

            // ==========================================================================
            // УПРАВЛЕНИЕ КПП
            // ==========================================================================
            function shiftUp() {
                if(player.gear < player.maxGear) {
                    if(player.gear === 0) player.gear = 1;
                    else player.gear++;
                    player.rpm = Math.max(0.2, player.rpm * 0.6);
                    playShiftSound();
                }
            }

            function shiftDown() {
                if(player.gear > 1) {
                    player.gear--;
                    player.rpm = Math.min(1, player.rpm * 1.4);
                    playShiftSound();
                } else if(player.gear === 1) {
                    player.gear = 0;
                    player.rpm = 0.05;
                    playShiftSound();
                }
            }

            // ==========================================================================
            // МЕНЮ И СЕТЬ
            // ==========================================================================
            function showToast(msg) {
                toastMsg.textContent = msg;
                toastMsg.style.display = 'block';
                setTimeout(() => toastMsg.style.display = 'none', 2500);
            }

            function formatNumber(n) { return (n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
            function parseNumber(s) { return parseInt(s.toString().replace(/\s/g, '')) || 0; }

            async function loadBalance() {
                if(!userId) return;
                try {
                    const resp = await fetch(`${API_BASE}/profile/${encodeURIComponent(userId)}`);
                    const data = await resp.json();
                    casinoBalance = Number(data.casino_balance ?? data.balance ?? 0);
                } catch(e) {}
            }

            function sendGameResult(result, bet, win) {
                if(!userId) return Promise.reject();
                return fetch(`${API_BASE}/game_result`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, game: 'racing', result: result, bet: bet, win: win })
                }).then(r => r.json());
            }

            async function finishRace(isWin) {
                let winAmt = isWin ? Math.floor(raceBet * 1.85) : 0;
                try {
                    const res = await sendGameResult(isWin ? 'win' : 'lose', raceBet, winAmt);
                    if(res.new_balance !== undefined) {
                        casinoBalance = Number(res.new_balance);
                    }
                } catch(e) {}
                alert(isWin ? `🏆 ПОБЕДА! +${formatNumber(winAmt)} ₽` : `❌ ПРОИГРЫШ!`);
                location.reload();
            }

            function startDragRace() {
                mainMenu.classList.add('hidden');
                gameHud.classList.remove('hidden');
                controlsLayer.classList.remove('hidden');

                player = new PlayerState(selectedCar);
                enemy = new PlayerState(isMultiplayer ? CARS_DB[0] : CARS_DB[Math.floor(Math.random() * CARS_DB.length)]);
                // У ИИ ставим 1-ю передачу
                enemy.gear = 1;
                countdown = 0;
                countdownTimer = 0;
                bgScrollX = 0;
                gameActive = true;
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }

            function connectWebSocket(code) {
                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                socket = new WebSocket(`${wsProtocol}//resellgame.bothost.tech/ws/race/${code}?userId=${userId}`);
                socket.onopen = () => {
                    showToast(`Ждём в комнате ${code}...`);
                    document.getElementById('hudRoom').textContent = code;
                    socket.send(JSON.stringify({ type: 'join', senderId: userId, carId: selectedCar.id }));
                    setTimeout(() => startDragRace(), 2000);
                };
                socket.onmessage = (e) => {
                    try {
                        const data = JSON.parse(e.data);
                        if(data.type === 'join' && data.senderId !== userId) {
                            let eCar = CARS_DB.find(c => c.id === data.carId);
                            if(eCar) enemy.car = eCar;
                        }
                        if(data.type === 'move' && data.senderId !== userId) {
                            enemy.dist = data.dist;
                            enemy.speed = data.speed;
                            enemy.gear = data.gear || 1;
                        }
                        if(data.type === 'game_over') {
                            gameActive = false;
                            finishRace(data.winnerId === userId);
                        }
                    } catch(err) {}
                };
                socket.onerror = () => {
                    showToast("Сбой сети. Одиночный режим.");
                    startDragRace();
                };
            }

            // ==========================================================================
            // МОДАЛКИ
            // ==========================================================================
            function openBetModal(action) {
                pendingAction = action;
                modalBalance.textContent = formatNumber(casinoBalance);
                betModal.classList.add('active');
            }

            document.getElementById('btnSingle').onclick = () => openBetModal('single');
            document.getElementById('btnCreateRoom').onclick = () => openBetModal('create');
            document.getElementById('btnJoinRoom').onclick = () => {
                roomModal.classList.add('active');
            };

            document.getElementById('modalBtnCancel').onclick = () => betModal.classList.remove('active');
            document.getElementById('roomBtnCancel').onclick = () => roomModal.classList.remove('active');

            document.getElementById('roomBtnConfirm').onclick = () => {
                let code = modalRoomInput.value.trim();
                if(!code) { showToast('Введите код!'); return; }
                targetRoomCode = code;
                roomModal.classList.remove('active');
                openBetModal('join');
            };

            document.getElementById('modalBtnConfirm').onclick = async () => {
                raceBet = parseNumber(modalBetInput.value);
                if(raceBet < 100) { showToast('Мин. ставка 100 ₽'); return; }
                if(raceBet > casinoBalance) { showToast('Недостаточно средств!'); return; }

                betModal.classList.remove('active');

                if(pendingAction === 'single') {
                    isMultiplayer = false;
                    document.getElementById('hudRoom').textContent = "СИНГЛ";
                    startDragRace();
                } else if(pendingAction === 'create') {
                    isMultiplayer = true;
                    let code = Math.floor(1000 + Math.random() * 9000).toString();
                    connectWebSocket(code);
                } else if(pendingAction === 'join') {
                    isMultiplayer = true;
                    connectWebSocket(targetRoomCode);
                }
            };

            // ==========================================================================
            // UI КАРУСЕЛЬ С ПРЕВЬЮ
            // ==========================================================================
            function initCarSelectorUI() {
                const selector = document.getElementById('carSelector');
                selector.innerHTML = '';

                // Фильтруем только те машины, которые есть в гараже
                let availableCars = CARS_DB.filter(car => userGarage.includes(car.id));

                if(availableCars.length === 0) {
                    availableCars = CARS_DB;
                }

                // Устанавливаем первую доступную машину как выбранную
                if(availableCars.length > 0 && !availableCars.some(c => c.id === selectedCar.id)) {
                    selectedCar = availableCars[0];
                }

                availableCars.forEach(car => {
                    const card = document.createElement('div');
                    card.className = `car-card ${car.id === selectedCar.id ? 'active' : ''}`;

                    // Превью машины (мини-канвас)
                    const cv = document.createElement('canvas');
                    cv.className = 'car-preview';
                    cv.width = 80;
                    cv.height = 36;
                    const cctx = cv.getContext('2d');
                    cctx.translate(40, 18);
                    cctx.scale(0.45, 0.45);

                    // Рисуем мини-машину
                    let tempState = { car: car, dist: 0 };
                    // Используем ту же функцию отрисовки, но без тени и деталей
                    cctx.save();
                    let color = car.color;
                    let type = car.type;
                    cctx.fillStyle = color;
                    if(type === 'supercar') {
                        cctx.beginPath();
                        cctx.moveTo(-35,5); cctx.lineTo(-32,-2); cctx.lineTo(-10,-8);
                        cctx.lineTo(12,-7); cctx.lineTo(35,1); cctx.lineTo(38,5);
                        cctx.closePath(); cctx.fill();
                    } else if(type === 'muscle') {
                        cctx.beginPath();
                        cctx.moveTo(-36,5); cctx.lineTo(-34,-1); cctx.lineTo(-16,-4);
                        cctx.lineTo(-6,-10); cctx.lineTo(12,-10); cctx.lineTo(26,-2);
                        cctx.lineTo(38,1); cctx.lineTo(38,5);
                        cctx.closePath(); cctx.fill();
                    } else {
                        cctx.beginPath();
                        cctx.moveTo(-35,5); cctx.lineTo(-33,-1); cctx.lineTo(-18,-2);
                        cctx.lineTo(-8,-10); cctx.lineTo(10,-10); cctx.lineTo(22,-2);
                        cctx.lineTo(36,1); cctx.lineTo(36,5);
                        cctx.closePath(); cctx.fill();
                    }
                    // Колеса
                    cctx.fillStyle = '#111';
                    cctx.beginPath(); cctx.arc(-22,6,6,0,Math.PI*2); cctx.fill();
                    cctx.beginPath(); cctx.arc(22,6,6,0,Math.PI*2); cctx.fill();
                    cctx.fillStyle = '#94a3b8';
                    cctx.beginPath(); cctx.arc(-22,6,3.5,0,Math.PI*2); cctx.fill();
                    cctx.beginPath(); cctx.arc(22,6,3.5,0,Math.PI*2); cctx.fill();
                    cctx.restore();

                    card.appendChild(cv);

                    let transLabel = car.trans === 'MT' ? 'МКПП' : 'АКПП';
                    card.innerHTML += `<div class="c-name">${car.name}</div>
                                      <div class="c-trans">${transLabel}</div>
                                      <div class="c-stats">⚡ +${car.speed_bonus}%</div>`;

                    card.onclick = () => {
                        document.querySelectorAll('.car-card').forEach(el => el.classList.remove('active'));
                        card.classList.add('active');
                        selectedCar = car;
                    };
                    selector.appendChild(card);
                });
            }

            // ==========================================================================
            // УПРАВЛЕНИЕ
            // ==========================================================================
            const bindBtn = (id, onStart, onEnd) => {
                const el = document.getElementById(id);
                if(!el) return;
                const press = (e) => { e.preventDefault(); onStart(); el.classList.add('active'); };
                const release = (e) => { e.preventDefault(); if(onEnd) onEnd(); el.classList.remove('active'); };
                el.addEventListener('touchstart', press);
                el.addEventListener('mousedown', press);
                el.addEventListener('touchend', release);
                el.addEventListener('mouseup', release);
                el.addEventListener('mouseleave', release);
            };

            bindBtn('btnGas', () => player.isGas = true, () => player.isGas = false);
            bindBtn('btnBrake', () => player.isBrake = true, () => player.isBrake = false);
            bindBtn('btnNitro', () => player.isNitro = true, () => player.isNitro = false);
            bindBtn('btnShiftUp', () => {
                if(!player.isAutomatic) shiftUp();
            });
            bindBtn('btnShiftDown', () => {
                if(!player.isAutomatic) shiftDown();
            });

            // Клавиатура
            window.addEventListener('keydown', (e) => {
                if(e.key === 'ArrowUp' || e.key === 'w') player.isGas = true;
                if(e.key === 'ArrowDown' || e.key === 's') player.isBrake = true;
                if(e.key === 'ArrowRight' || e.key === 'd') { e.preventDefault(); if(!player.isAutomatic) shiftUp(); }
                if(e.key === 'ArrowLeft' || e.key === 'a') { e.preventDefault(); if(!player.isAutomatic) shiftDown(); }
                if(e.key === 'Shift') player.isNitro = true;
            });
            window.addEventListener('keyup', (e) => {
                if(e.key === 'ArrowUp' || e.key === 'w') player.isGas = false;
                if(e.key === 'ArrowDown' || e.key === 's') player.isBrake = false;
                if(e.key === 'Shift') player.isNitro = false;
            });

            // ==========================================================================
            // ИНИЦИАЛИЗАЦИЯ
            // ==========================================================================
            document.querySelectorAll('[data-amt]').forEach(b => b.onclick = () => modalBetInput.value = formatNumber(parseInt(b.dataset.amt)));
            modalBetInput.addEventListener('input', function() { this.value = formatNumber(parseNumber(this.value)); });

            window.addEventListener('resize', () => {
                cw = window.innerWidth;
                ch = window.innerHeight;
                canvas.width = cw;
                canvas.height = ch;
                if(!gameActive) render();
            });

            // Загрузка гаража и баланса
            loadBalance();
            loadGarage().then(() => {
                render();
            });

        })();
    </script>
</body>
</html>
