<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>R-RACE | МУЛЬТИПЛЕЕР</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,800;1,900&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
    <style>
        /* ===== СТИЛИ (упрощённые, но рабочие) ===== */
        :root {
            --bg-dark: #0a0612;
            --gta-orange: #ff9d00;
            --gta-pink: #ff2a8d;
            --gta-yellow: #ffee00;
            --gta-border: #ffaa00;
            --text-main: #ffffff;
            --accent-green: #00ff66;
            --accent-red: #ff3344;
        }
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body {
            background: var(--bg-dark);
            font-family: 'Montserrat', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .game-wrapper {
            max-width: 480px;
            width: 100%;
            height: 100vh;
            max-height: 900px;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255,157,0,0.3);
        }
        /* МЕНЮ */
        .gta-menu {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(112,18,206,0.85) 0%, rgba(10,6,18,0.95) 70%), radial-gradient(circle at 50% 30%, #ff2a8d 0%, transparent 60%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 100;
            backdrop-filter: blur(8px);
        }
        .gta-logo-box {
            text-align: center;
            margin-bottom: 20px;
            transform: rotate(-3deg);
            filter: drop-shadow(4px 4px 0px #000);
        }
        .gta-logo-title {
            font-size: 38px;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffee00 0%, #ff9d00 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -1px;
            -webkit-text-stroke: 1.5px #000;
        }
        .gta-logo-sub {
            font-size: 14px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: var(--gta-pink);
            padding: 2px 10px;
            display: inline-block;
            margin-top: -6px;
            box-shadow: 3px 3px 0 #000;
        }
        .gta-card {
            width: 100%;
            background: rgba(18, 10, 32, 0.88);
            border: 2px solid var(--gta-border);
            box-shadow: 6px 6px 0px #000;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .gta-label {
            font-size: 11px;
            font-weight: 900;
            color: var(--gta-yellow);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 6px;
        }
        .gta-input {
            width: 100%;
            height: 46px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #fff;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 16px;
            text-align: center;
            outline: none;
            box-shadow: 3px 3px 0 #000;
            border-radius: 6px;
            padding: 0 8px;
        }
        .gta-btn {
            width: 100%;
            height: 50px;
            border: 2px solid #000;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 15px;
            color: #000;
            cursor: pointer;
            text-transform: uppercase;
            font-style: italic;
            box-shadow: 4px 4px 0px #000;
            transition: all 0.1s;
            border-radius: 8px;
            margin-top: 6px;
        }
        .gta-btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0px #000; }
        .btn-yellow { background: var(--gta-yellow); }
        .btn-pink { background: var(--gta-pink); color: #fff; }
        .btn-orange { background: var(--gta-orange); }

        .car-selector {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 6px 0;
            margin-bottom: 8px;
        }
        .car-option {
            background: rgba(255,255,255,0.05);
            border: 2px solid var(--gta-border);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            white-space: nowrap;
            color: #fff;
            transition: background 0.2s;
        }
        .car-option.active { background: rgba(255,157,0,0.3); border-color: var(--gta-yellow); }
        .car-option .emoji { font-size: 20px; display: block; }

        /* ХУД */
        .gta-header {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            z-index: 50;
            pointer-events: none;
        }
        .hud-badge {
            background: rgba(0,0,0,0.85);
            border: 2px solid var(--gta-border);
            box-shadow: 3px 3px 0 #000;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 900;
            color: #fff;
        }
        .hud-badge span { color: var(--gta-yellow); }

        .controls-overlay {
            position: absolute;
            bottom: 20px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            z-index: 50;
        }
        .ctrl-group { display: flex; gap: 10px; }
        .ctrl-btn {
            width: 60px;
            height: 60px;
            background: rgba(0,0,0,0.85);
            border: 2px solid var(--gta-border);
            box-shadow: 4px 4px 0 #000;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            font-weight: 900;
            cursor: pointer;
        }
        .ctrl-btn:active { background: var(--gta-orange); color: #000; transform: translate(2px,2px); }

        canvas#gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .status-toast {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            border: 2px solid var(--gta-pink);
            color: var(--gta-yellow);
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 4px 4px 0 #000;
            z-index: 60;
            display: none;
            white-space: nowrap;
        }
        .hidden { display: none !important; }
        .room-code-input { margin-top: 4px; }
        .flex-row { display: flex; gap: 8px; }
        .flex-row .gta-btn { flex: 1; }
    </style>
    <!-- Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>
<div class="game-wrapper">
    <div class="status-toast" id="statusToast">Сообщение</div>
    <div class="gta-header hidden" id="gameHud">
        <div class="hud-badge">🏁 <span id="hudRoomCode">—</span></div>
        <div class="hud-badge">💰 <span id="hudBalance">0 ₽</span></div>
        <div class="hud-badge">⚡ <span id="hudSpeed">0 KM/H</span></div>
    </div>

    <!-- МЕНЮ -->
    <div class="gta-menu" id="gtaMenu">
        <div class="gta-logo-box">
            <div class="gta-logo-title">RES-CITY</div>
            <div class="gta-logo-sub">RACE STORIES</div>
        </div>

        <div class="gta-card">
            <span class="gta-label">Выбери машину</span>
            <div class="car-selector" id="carSelector"></div>
        </div>

        <div class="gta-card">
            <span class="gta-label">Ставка за участие</span>
            <input type="text" class="gta-input" id="betInput" value="10 000">
            <div style="display:flex; gap:6px; margin-top:4px;">
                <button class="gta-btn btn-yellow" style="flex:1; height:40px; font-size:13px;" data-amt="5000">5K</button>
                <button class="gta-btn btn-yellow" style="flex:1; height:40px; font-size:13px;" data-amt="10000">10K</button>
                <button class="gta-btn btn-yellow" style="flex:1; height:40px; font-size:13px;" data-amt="25000">25K</button>
            </div>
        </div>

        <button class="gta-btn btn-yellow" id="btnSingleplayer">🚗 ОДИНОЧНАЯ (ИИ)</button>

        <div class="gta-card" style="margin-top:10px;">
            <span class="gta-label">Мультиплеер</span>
            <div class="flex-row">
                <button class="gta-btn btn-pink" id="btnCreateRoom" style="flex:1;">СОЗДАТЬ</button>
                <button class="gta-btn btn-orange" id="btnJoinRoom" style="flex:1;">ВОЙТИ</button>
            </div>
            <input type="text" class="gta-input room-code-input" id="roomCodeInput" placeholder="КОД КОМНАТЫ" maxlength="6" style="margin-top:6px;">
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <div class="controls-overlay hidden" id="controlsOverlay">
        <div class="ctrl-group">
            <div class="ctrl-btn" id="btnLeft">◄</div>
            <div class="ctrl-btn" id="btnRight">►</div>
        </div>
        <div class="ctrl-group">
            <div class="ctrl-btn" id="btnBrake" style="border-color: var(--accent-red);">▼</div>
            <div class="ctrl-btn" id="btnGas" style="border-color: var(--accent-green);">▲</div>
        </div>
    </div>
</div>

<script type="module">
    import * as THREE from 'three';

    // ======= ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ =======
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    const API_BASE = 'https://resellgame.bothost.tech';
    let userId = null;
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('userId')) userId = urlParams.get('userId');
    else if (urlParams.has('user_id')) userId = urlParams.get('user_id');
    else if (tg?.initDataUnsafe?.user?.id) userId = tg.initDataUnsafe.user.id;

    // DOM
    const gtaMenu = document.getElementById('gtaMenu');
    const gameHud = document.getElementById('gameHud');
    const controlsOverlay = document.getElementById('controlsOverlay');
    const hudBalance = document.getElementById('hudBalance');
    const hudSpeed = document.getElementById('hudSpeed');
    const hudRoomCode = document.getElementById('hudRoomCode');
    const statusToast = document.getElementById('statusToast');
    const betInput = document.getElementById('betInput');
    const roomCodeInput = document.getElementById('roomCodeInput');
    const carSelector = document.getElementById('carSelector');

    let casinoBalance = 0;
    let gameActive = false;
    let isMultiplayer = false;
    let socket = null;
    let roomCode = null;
    let raceBet = 10000;
    let selectedCarId = 'zhiguli';

    // Машины (загружаем из бота, но для простоты используем предопределённый список)
    const CARS = [
        { id: 'zhiguli', name: 'Жигули', emoji: '🚗', price: 15000, speed: 10 },
        { id: 'granta', name: 'Гранта', emoji: '🚙', price: 35000, speed: 15 },
        { id: 'mustang', name: 'Mustang', emoji: '🏎', price: 120000, speed: 30 },
        { id: 'cclass', name: 'C-Class', emoji: '🚘', price: 160000, speed: 35 },
        { id: 'bmwm4', name: 'BMW M4', emoji: '🏎', price: 180000, speed: 45 },
        { id: 'sclass', name: 'S-Class', emoji: '🚘', price: 650000, speed: 75 },
        { id: 'rollsroyce', name: 'Rolls-Royce', emoji: '👑', price: 1800000, speed: 95 },
        { id: 'aventador', name: 'Aventador', emoji: '🏎', price: 5000000, speed: 98 },
    ];

    // Состояние игрока и оппонента
    let playerState = { x: -1.5, z: 0, speed: 0, angle: 0 };
    let opponentState = { x: 1.5, z: 0, speed: 0, angle: 0 };
    let keys = { left: false, right: false, gas: false, brake: false };

    // ======= ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =======
    function showToast(msg) {
        statusToast.textContent = msg;
        statusToast.style.display = 'block';
        setTimeout(() => statusToast.style.display = 'none', 3000);
    }

    function formatNumber(n) { return (n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
    function parseNumber(s) { return parseInt(s.toString().replace(/\s/g, '')) || 0; }

    // ======= ЗАГРУЗКА БАЛАНСА =======
    async function loadBalance() {
        if (!userId) return;
        try {
            const resp = await fetch(`${API_BASE}/profile/${userId}`);
            const data = await resp.json();
            casinoBalance = data.casino_balance || data.balance || 0;
            hudBalance.textContent = formatNumber(casinoBalance) + ' ₽';
        } catch(e) {
            console.warn('Не удалось загрузить баланс', e);
        }
    }

    // ======= ОТРИСОВКА МАШИН В ИНТЕРФЕЙСЕ =======
    function renderCarSelector() {
        carSelector.innerHTML = '';
        CARS.forEach(car => {
            const div = document.createElement('div');
            div.className = 'car-option' + (car.id === selectedCarId ? ' active' : '');
            div.innerHTML = `<span class="emoji">${car.emoji}</span> ${car.name}`;
            div.dataset.id = car.id;
            div.addEventListener('click', () => {
                selectedCarId = car.id;
                document.querySelectorAll('.car-option').forEach(el => el.classList.remove('active'));
                div.classList.add('active');
            });
            carSelector.appendChild(div);
        });
    }

    // ======= ЗАПУСК ИГРЫ (ОДИНОЧНАЯ) =======
    function startSingleGame() {
        isMultiplayer = false;
        roomCode = null;
        hudRoomCode.textContent = 'СИНГЛ';
        gtaMenu.classList.add('hidden');
        gameHud.classList.remove('hidden');
        controlsOverlay.classList.remove('hidden');
        gameActive = true;
        playerState = { x: -1.5, z: 0, speed: 0, angle: 0 };
        opponentState = { x: 1.5, z: 0, speed: 0, angle: 0 };
        // Инициализация сцены (вызовется позже в animate)
    }

    // ======= МУЛЬТИПЛЕЕР: СОЗДАНИЕ КОМНАТЫ =======
    async function createRoom() {
        const bet = parseNumber(betInput.value);
        if (bet < 100) { showToast('Мин. ставка 100 ₽'); return; }
        if (bet > casinoBalance) { showToast('Недостаточно средств!'); return; }

        try {
            const resp = await fetch(`${API_BASE}/race/create`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: userId, carId: selectedCarId, bet: bet })
            });
            const data = await resp.json();
            if (data.success) {
                raceBet = bet;
                roomCode = data.roomCode;
                isMultiplayer = true;
                hudRoomCode.textContent = roomCode;
                gtaMenu.classList.add('hidden');
                gameHud.classList.remove('hidden');
                controlsOverlay.classList.remove('hidden');
                gameActive = true;
                playerState = { x: -1.5, z: 0, speed: 0, angle: 0 };
                opponentState = { x: 1.5, z: 0, speed: 0, angle: 0 };
                initWebSocket(roomCode);
                showToast(`Комната ${roomCode} создана!`);
            } else {
                showToast('Ошибка: ' + data.error);
            }
        } catch(e) {
            showToast('Ошибка соединения');
        }
    }

    // ======= МУЛЬТИПЛЕЕР: ПРИСОЕДИНЕНИЕ =======
    async function joinRoom() {
        const code = roomCodeInput.value.trim();
        if (!code) { showToast('Введите код комнаты'); return; }
        const bet = parseNumber(betInput.value);
        if (bet < 100) { showToast('Мин. ставка 100 ₽'); return; }
        if (bet > casinoBalance) { showToast('Недостаточно средств!'); return; }

        try {
            const resp = await fetch(`${API_BASE}/race/join`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: userId, roomCode: code, carId: selectedCarId })
            });
            const data = await resp.json();
            if (data.success) {
                raceBet = bet;
                roomCode = code;
                isMultiplayer = true;
                hudRoomCode.textContent = code;
                gtaMenu.classList.add('hidden');
                gameHud.classList.remove('hidden');
                controlsOverlay.classList.remove('hidden');
                gameActive = true;
                playerState = { x: -1.5, z: 0, speed: 0, angle: 0 };
                opponentState = { x: 1.5, z: 0, speed: 0, angle: 0 };
                initWebSocket(code);
                showToast(`Подключено к комнате ${code}!`);
            } else {
                showToast('Ошибка: ' + data.error);
            }
        } catch(e) {
            showToast('Ошибка соединения');
        }
    }

    // ======= WEBSOCKET =======
    function initWebSocket(roomCode) {
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//resellgame.bothost.tech/ws/race/${roomCode}?userId=${userId}`;
        socket = new WebSocket(wsUrl);

        socket.onopen = () => {
            console.log('WebSocket connected');
        };

        socket.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'move' && data.senderId !== userId) {
                    // Обновляем состояние оппонента
                    opponentState.x = data.x || 0;
                    opponentState.z = data.z || 0;
                    opponentState.angle = data.angle || 0;
                }
                if (data.type === 'game_over') {
                    const winnerId = data.winnerId;
                    if (winnerId === userId) {
                        showToast('🏆 ВЫ ПОБЕДИЛИ!');
                        // Можно перезагрузить страницу или вернуть в меню
                        setTimeout(() => location.reload(), 3000);
                    } else {
                        showToast('😔 Вы проиграли');
                        setTimeout(() => location.reload(), 3000);
                    }
                    gameActive = false;
                }
            } catch(e) {
                console.warn('Ошибка парсинга WebSocket сообщения', e);
            }
        };

        socket.onerror = () => {
            showToast('Ошибка WebSocket');
        };

        socket.onclose = () => {
            if (gameActive) {
                showToast('Соединение потеряно');
                gameActive = false;
            }
        };
    }

    // ======= THREE.JS СЦЕНА =======
    const canvas = document.getElementById('gameCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2d124d);
    scene.fog = new THREE.FogExp2(0xff2a8d, 0.012);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

    // Освещение
    const sunLight = new THREE.DirectionalLight(0xffaa00, 1.8);
    sunLight.position.set(20, 30, -50);
    scene.add(sunLight);
    const ambientLight = new THREE.AmbientLight(0xff2a8d, 0.8);
    scene.add(ambientLight);

    // Дорога
    const roadGeo = new THREE.PlaneGeometry(10, 400);
    const roadMat = new THREE.MeshBasicMaterial({ color: 0x110b1a });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    scene.add(road);

    // Бордюры
    const curbGeo = new THREE.BoxGeometry(0.5, 0.2, 400);
    const curbMat = new THREE.MeshBasicMaterial({ color: 0xff9d00 });
    const leftCurb = new THREE.Mesh(curbGeo, curbMat);
    leftCurb.position.set(-5.2, 0.1, 0);
    scene.add(leftCurb);
    const rightCurb = new THREE.Mesh(curbGeo, curbMat);
    rightCurb.position.set(5.2, 0.1, 0);
    scene.add(rightCurb);

    // Разметка
    const lineGeo = new THREE.PlaneGeometry(0.3, 3);
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xffee00 });
    for (let z = -200; z < 200; z += 8) {
        const line = new THREE.Mesh(lineGeo, lineMat);
        line.rotation.x = -Math.PI / 2;
        line.position.set(0, 0.02, z);
        scene.add(line);
    }

    // Пальмы (упрощённо)
    function createPalm(x, z) {
        const group = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 4, 5), new THREE.MeshBasicMaterial({ color: 0x4a2211 }));
        trunk.position.y = 2;
        group.add(trunk);
        const leavesMat = new THREE.MeshBasicMaterial({ color: 0x00ff88 });
        for (let i = 0; i < 5; i++) {
            const leaf = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 0.6), leavesMat);
            leaf.position.set(Math.sin(i * 1.2), 3.8, Math.cos(i * 1.2));
            leaf.rotation.y = i * 1.2;
            group.add(leaf);
        }
        group.position.set(x, 0, z);
        scene.add(group);
    }
    for (let z = -180; z < 180; z += 15) {
        createPalm(-8, z);
        createPalm(8, z + 7);
    }

    // Машины (игрок и оппонент)
    function createCar(colorHex) {
        const car = new THREE.Group();
        const bodyMat = new THREE.MeshBasicMaterial({ color: colorHex });
        const windowMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const lightMat = new THREE.MeshBasicMaterial({ color: 0xffee00 });
        const tailMat = new THREE.MeshBasicMaterial({ color: 0xff0044 });

        const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.8, 3.2), bodyMat);
        body.position.y = 0.6;
        car.add(body);

        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.7, 2.0), bodyMat);
        cabin.position.set(0, 1.2, -0.2);
        car.add(cabin);

        const win = new THREE.Mesh(new THREE.BoxGeometry(1.42, 0.5, 1.2), windowMat);
        win.position.set(0, 1.3, -0.1);
        car.add(win);

        const l1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.1), lightMat);
        l1.position.set(-0.6, 0.7, 1.61);
        car.add(l1);
        const l2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.1), lightMat);
        l2.position.set(0.6, 0.7, 1.61);
        car.add(l2);

        const t1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.1), tailMat);
        t1.position.set(-0.6, 0.7, -1.61);
        car.add(t1);
        const t2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.1), tailMat);
        t2.position.set(0.6, 0.7, -1.61);
        car.add(t2);

        const wheelMat = new THREE.MeshBasicMaterial({ color: 0x0a0612 });
        const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 8);
        const positions = [[-0.85, 0.3, 1.0], [0.85, 0.3, 1.0], [-0.85, 0.3, -1.0], [0.85, 0.3, -1.0]];
        positions.forEach(pos => {
            const w = new THREE.Mesh(wheelGeo, wheelMat);
            w.rotation.z = Math.PI / 2;
            w.position.set(pos[0], pos[1], pos[2]);
            car.add(w);
        });

        scene.add(car);
        return car;
    }

    const playerCar = createCar(0xff2a8d);   // розовый
    const opponentCar = createCar(0x00ff88); // зелёный

    // Обновление позиций
    function updateCarPositions() {
        playerCar.position.set(playerState.x, 0, playerState.z);
        playerCar.rotation.y = playerState.angle;

        // Для оппонента – плавная интерполяция
        opponentCar.position.x += (opponentState.x - opponentCar.position.x) * 0.15;
        opponentCar.position.z += (opponentState.z - opponentCar.position.z) * 0.15;
        opponentCar.rotation.y += (opponentState.angle - opponentCar.rotation.y) * 0.1;
    }

    // ======= ФИЗИКА ИГРОКА =======
    function updatePhysics() {
        if (!gameActive) return;

        // Управление
        if (keys.gas) playerState.speed = Math.min(playerState.speed + 0.015, 0.8);
        else if (keys.brake) playerState.speed = Math.max(playerState.speed - 0.02, -0.2);
        else playerState.speed *= 0.98;

        if (keys.left) { playerState.x -= 0.08; playerState.angle = 0.15; }
        else if (keys.right) { playerState.x += 0.08; playerState.angle = -0.15; }
        else playerState.angle = 0;

        playerState.x = Math.max(-4.2, Math.min(4.2, playerState.x));
        playerState.z += playerState.speed;

        // Если одиночная игра – ИИ оппонента
        if (!isMultiplayer) {
            opponentState.z += 0.35;
        }

        // Отправка координат в мультиплеер
        if (isMultiplayer && socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({
                type: 'move',
                senderId: userId,
                x: playerState.x,
                z: playerState.z,
                angle: playerState.angle
            }));
        }

        // Проверка финиша (условно z > 280)
        if (playerState.z >= 280) {
            if (isMultiplayer && socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'finish', senderId: userId }));
            }
            gameActive = false;
            showToast('🏁 ФИНИШ!');
            // В мультиплеере результат придёт через WebSocket
            if (!isMultiplayer) {
                // Одиночная – сразу победа
                showToast('🏆 ВЫ ПОБЕДИЛИ!');
                setTimeout(() => location.reload(), 3000);
            }
        }

        // Камера
        camera.position.set(playerState.x, 3.5, playerState.z - 7);
        camera.lookAt(playerState.x, 1.0, playerState.z + 10);

        // Скорость
        hudSpeed.textContent = Math.round(playerState.speed * 180) + ' KM/H';
    }

    // ======= АНИМАЦИОННЫЙ ЦИКЛ =======
    function animate() {
        requestAnimationFrame(animate);
        updatePhysics();
        updateCarPositions();
        renderer.render(scene, camera);
    }
    animate();

    // ======= УПРАВЛЕНИЕ (сенсор + клавиатура) =======
    const bindControl = (id, key) => {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        btn.addEventListener('mousedown', () => keys[key] = true);
        btn.addEventListener('mouseup', () => keys[key] = false);
    };
    bindControl('btnLeft', 'left');
    bindControl('btnRight', 'right');
    bindControl('btnGas', 'gas');
    bindControl('btnBrake', 'brake');

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') keys.left = true;
        if (e.key === 'ArrowRight') keys.right = true;
        if (e.key === 'ArrowUp') keys.gas = true;
        if (e.key === 'ArrowDown') keys.brake = true;
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') keys.left = false;
        if (e.key === 'ArrowRight') keys.right = false;
        if (e.key === 'ArrowUp') keys.gas = false;
        if (e.key === 'ArrowDown') keys.brake = false;
    });

    // ======= СОБЫТИЯ КНОПОК =======
    document.getElementById('btnSingleplayer').addEventListener('click', async () => {
        const bet = parseNumber(betInput.value);
        if (bet < 100) { showToast('Мин. ставка 100 ₽'); return; }
        if (bet > casinoBalance) { showToast('Недостаточно средств!'); return; }
        // В одиночной игре ставка не списывается (для простоты)
        startSingleGame();
    });

    document.getElementById('btnCreateRoom').addEventListener('click', createRoom);
    document.getElementById('btnJoinRoom').addEventListener('click', joinRoom);

    // Быстрые ставки
    document.querySelectorAll('[data-amt]').forEach(btn => {
        btn.addEventListener('click', () => {
            betInput.value = formatNumber(parseInt(btn.dataset.amt));
        });
    });

    // ======= ИНИЦИАЛИЗАЦИЯ =======
    renderCarSelector();
    loadBalance();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Если пользователь вышел из игры, перезагружаем меню (можно повесить на кнопку "Выйти")
    // Для простоты – при перезагрузке страницы меню открыто
</script>
</body>
</html>
