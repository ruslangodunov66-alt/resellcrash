<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>R-RACE 2D | GARAGE DRAG RACING</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0d14;
            --panel-bg: rgba(16, 22, 34, 0.95);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-gold: #ffc700;
            --accent-blue: #2563eb;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
        }

        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-main);
            font-family: 'Nunito', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-wrapper {
            max-width: 500px;
            width: 100%;
            height: 100vh;
            max-height: 900px;
            background: var(--bg-main);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            border: 1px solid var(--border-color);
        }

        /* ===== МЕНЮ В СТИЛЕ ГАРАЖА ===== */
        .menu-screen {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 30%, rgba(37, 99, 235, 0.25), transparent 70%),
                        linear-gradient(180deg, rgba(10, 13, 20, 0.88) 0%, rgba(10, 13, 20, 0.98) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            z-index: 100;
            overflow-y: auto;
        }

        .logo-box { text-align: center; margin-bottom: 16px; margin-top: 10px; }
        .logo-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 36px; font-weight: 900; font-style: italic;
            background: linear-gradient(135deg, #ffffff 0%, #a0c4ff 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            text-transform: uppercase; letter-spacing: -1px;
        }
        .logo-title span { color: var(--accent-gold); -webkit-text-fill-color: var(--accent-gold); }

        .logo-sub {
            font-size: 11px; font-weight: 900; color: #94a3b8;
            letter-spacing: 3px; text-transform: uppercase; margin-top: -4px;
        }

        .menu-card {
            width: 100%; background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px; padding: 14px; margin-bottom: 12px;
            display: flex; flex-direction: column; gap: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-label {
            font-size: 11px; font-weight: 800; color: #94a3b8;
            text-transform: uppercase; letter-spacing: 1px;
        }

        /* Карусель машин из bot 2.py */
        .car-selector {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px;
        }
        .car-selector::-webkit-scrollbar { height: 4px; }
        .car-selector::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 2px; }

        .car-item {
            min-width: 130px; background: rgba(255,255,255,0.04);
            border: 2px solid var(--border-color); border-radius: 12px;
            padding: 10px; text-align: center; cursor: pointer; transition: all 0.2s;
        }
        .car-item.active { background: rgba(255, 199, 0, 0.15); border-color: var(--accent-gold); transform: scale(1.03); }
        .car-item .ci-name { font-size: 12px; font-weight: 900; margin-bottom: 4px; }
        .car-item .ci-stats { font-size: 10px; font-weight: 800; color: var(--accent-green); }

        input.custom-input {
            width: 100%; height: 46px; background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color); border-radius: 12px;
            color: #fff; font-family: 'Montserrat', sans-serif;
            font-weight: 800; font-size: 16px; text-align: center; outline: none;
        }
        input.custom-input:focus { border-color: var(--accent-blue); }

        .btn-group { display: flex; gap: 6px; }

        button.btn-ui {
            width: 100%; height: 46px; border: none; border-radius: 12px;
            font-family: 'Montserrat', sans-serif; font-weight: 900;
            font-size: 13px; color: #fff; cursor: pointer;
            text-transform: uppercase; letter-spacing: 0.5px;
            transition: all 0.15s; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        button.btn-ui:active { transform: scale(0.96); }

        .btn-gold { background: linear-gradient(135deg, #ffc700, #d99b00); color: #000; }
        .btn-blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .btn-green { background: linear-gradient(135deg, #10b981, #047857); color: #000; }

        /* ===== ИГРОВОЙ HUD ===== */
        .hud-top {
            position: absolute; top: 12px; left: 12px; right: 12px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 50; pointer-events: none;
        }

        .hud-card {
            background: rgba(10, 13, 20, 0.85); border: 1px solid var(--border-color);
            backdrop-filter: blur(8px); border-radius: 12px; padding: 6px 12px;
            font-size: 12px; font-weight: 800; color: #fff;
            display: flex; align-items: center; gap: 6px;
        }
        .hud-card span { color: var(--accent-gold); font-family: 'Montserrat', sans-serif; font-weight: 900; }

        /* ===== ПЕДАЛИ УПРАВЛЕНИЯ ===== */
        .controls-layer {
            position: absolute; bottom: 20px; left: 16px; right: 16px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 50;
        }

        .pedal-gas {
            width: 110px; height: 100px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.85), rgba(4, 120, 87, 0.95));
            border: 3px solid #fff; border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff; font-family: 'Montserrat', sans-serif; font-weight: 900;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5); cursor: pointer;
        }
        .pedal-gas:active { transform: scale(0.92); background: #10b981; }

        .pedal-nitro {
            width: 90px; height: 90px;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.85), rgba(29, 78, 216, 0.95));
            border: 3px solid #fff; border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff; font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 900;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5); cursor: pointer;
        }
        .pedal-nitro:active { transform: scale(0.92); }

        canvas#gameCanvas { width: 100%; height: 100%; display: block; }

        .toast-popup {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 13, 20, 0.95); border: 1px solid var(--accent-blue);
            color: #fff; padding: 10px 20px; font-weight: 800; font-size: 13px;
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 60;
            display: none; white-space: nowrap; text-transform: uppercase;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="toast-popup" id="toastMsg">Уведомление</div>

        <!-- ИГРОВОЙ ХУД -->
        <div class="hud-top hidden" id="gameHud">
            <div class="hud-card">🏁 <span id="hudRoom">СИНГЛ</span></div>
            <div class="hud-card">💰 <span id="hudBalance">0 ₽</span></div>
            <div class="hud-card">⚡ <span id="hudSpeed">0 KM/H</span></div>
        </div>

        <!-- ГЛАВНОЕ МЕНЮ И ГАРАЖ -->
        <div class="menu-screen" id="mainMenu">
            <div class="logo-box">
                <div class="logo-title">R-<span>RACE</span> 2D</div>
                <div class="logo-sub">GARAGE & DRAG RACING</div>
            </div>

            <!-- Выбор машины из bot 2.py -->
            <div class="menu-card">
                <span class="card-label">Выбор автомобиля из гаража</span>
                <div class="car-selector" id="carSelector">
                    <!-- Заполняется динамически из CARS -->
                </div>
            </div>

            <div class="menu-card">
                <span class="card-label">Ставка на заезд</span>
                <input type="text" class="custom-input" id="betInput" value="10 000">
                <div class="btn-group" style="margin-top: 6px;">
                    <button class="btn-ui btn-gold" data-amt="5000">5K</button>
                    <button class="btn-ui btn-gold" data-amt="10000">10K</button>
                    <button class="btn-ui btn-gold" data-amt="25000">25K</button>
                </div>
            </div>

            <button class="btn-ui btn-gold" id="btnSingle" style="margin-bottom: 8px;">🚗 ОДИНОЧНЫЙ ДРАГ (ИИ)</button>

            <div class="menu-card">
                <span class="card-label">Мультиплеер (с другом)</span>
                <input type="text" class="custom-input" id="roomCodeInput" placeholder="КОД КОМНАТЫ" maxlength="6">
                <div class="btn-group" style="margin-top: 6px;">
                    <button class="btn-ui btn-blue" id="btnCreateRoom">СОЗДАТЬ</button>
                    <button class="btn-ui btn-green" id="btnJoinRoom">ВОЙТИ</button>
                </div>
            </div>
        </div>

        <!-- КАНВАС ИГРЫ -->
        <canvas id="gameCanvas"></canvas>

        <!-- ПЕДАЛИ УПРАВЛЕНИЯ -->
        <div class="controls-layer hidden" id="controlsLayer">
            <div class="pedal-nitro" id="btnNitro">N2O</div>
            <div class="pedal-gas" id="btnGas">
                <span style="font-size:22px;">▲</span>
                <span>ГАЗ</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const tg = window.Telegram?.WebApp;
            if (tg) { tg.expand(); tg.ready(); }

            const API_BASE = 'https://resellgame.bothost.tech';
            let userId = null;
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('userId')) userId = urlParams.get('userId');
            else if (urlParams.has('user_id')) userId = urlParams.get('user_id');
            else if (tg?.initDataUnsafe?.user?.id) userId = tg.initDataUnsafe.user.id;

            // ==========================================================================
            // ВСЕ АВТОМОБИЛИ ИЗ bot 2.py СО СВОИМИ УНИКАЛЬНЫМИ МОДЕЛЯМИ И СПИДБОНУСОМ
            // ==========================================================================
            const CARS_DB = [
                { id: "zhiguli", name: "ВАЗ-2106 Жигули", speed_bonus: 10, color: '#e74c3c', type: 'box' },
                { id: "granta", name: "Лада Гранта", speed_bonus: 15, color: '#95a5a6', type: 'sedan' },
                { id: "w140", name: "Mercedes W140", speed_bonus: 28, color: '#1e293b', type: 'luxury' },
                { id: "mustang", name: "Ford Mustang", speed_bonus: 30, color: '#3b82f6', type: 'muscle' },
                { id: "cclass", name: "Mercedes C-Class", speed_bonus: 35, color: '#cbd5e1', type: 'sedan' },
                { id: "bmwm4", name: "BMW M4", speed_bonus: 45, color: '#f59e0b', type: 'sport' },
                { id: "challenger", name: "Dodge Challenger", speed_bonus: 55, color: '#8b5cf6', type: 'muscle' },
                { id: "ramtrx", name: "Dodge Ram TRX", speed_bonus: 60, color: '#0f172a', type: 'truck' },
                { id: "bmwm5", name: "BMW M5 F90", speed_bonus: 70, color: '#2563eb', type: 'sport' },
                { id: "sclass", name: "Mercedes S-Class", speed_bonus: 75, color: '#000000', type: 'luxury' },
                { id: "bmwx7", name: "BMW X7", speed_bonus: 70, color: '#ffffff', type: 'suv' },
                { id: "rollsroyce", name: "Rolls-Royce", speed_bonus: 95, color: '#334155', type: 'luxury' },
                { id: "aventador", name: "Lamborghini", speed_bonus: 98, color: '#10b981', type: 'supercar' },
                { id: "brabus", name: "Brabus Mansory", speed_bonus: 99, color: '#111111', type: 'suv' }
            ];

            let selectedCar = CARS_DB[3]; // По умолчанию Ford Mustang
            let casinoBalance = 0;
            let raceBet = 10000;
            let socket = null;
            let isMultiplayer = false;

            // DOM Элементы
            const mainMenu = document.getElementById('mainMenu');
            const gameHud = document.getElementById('gameHud');
            const controlsLayer = document.getElementById('controlsLayer');
            const toastMsg = document.getElementById('toastMsg');
            const hudBalance = document.getElementById('hudBalance');
            const hudSpeed = document.getElementById('hudSpeed');
            const hudRoom = document.getElementById('hudRoom');
            const betInput = document.getElementById('betInput');
            const roomCodeInput = document.getElementById('roomCodeInput');

            // Canvas
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            let cw = window.innerWidth;
            let ch = window.innerHeight;
            canvas.width = cw;
            canvas.height = ch;

            // Состояние Драг-заезда
            const TRACK_DIST = 15000;
            let gameActive = false;
            let lastTime = 0;
            let bgScrollX = 0;
            let screenShake = 0;
            
            // Светофор
            let countdown = -1;
            let countdownTimer = 0;

            // Игрок и Оппонент
            let player = { dist: 0, speed: 0, maxSpeed: 240, accel: 60, nitro: 100, isGas: false, isNitro: false, car: selectedCar };
            let enemy = { dist: 0, speed: 0, maxSpeed: 230, accel: 55, car: CARS_DB[5] };

            function showToast(msg) {
                toastMsg.textContent = msg;
                toastMsg.style.display = 'block';
                setTimeout(() => toastMsg.style.display = 'none', 2500);
            }

            function formatNumber(n) { return (n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
            function parseNumber(s) { return parseInt(s.toString().replace(/\s/g, '')) || 0; }

            // Инициализация карусели машин
            function initCarSelector() {
                const selector = document.getElementById('carSelector');
                selector.innerHTML = '';
                CARS_DB.forEach(car => {
                    const item = document.createElement('div');
                    item.className = `car-item ${car.id === selectedCar.id ? 'active' : ''}`;
                    item.innerHTML = `<div class="ci-name">${car.name}</div><div class="ci-stats">⚡ +${car.speed_bonus}%</div>`;
                    item.onclick = () => {
                        document.querySelectorAll('.car-item').forEach(el => el.classList.remove('active'));
                        item.classList.add('active');
                        selectedCar = car;
                        player.car = car;
                    };
                    selector.appendChild(item);
                });
            }

            // Загрузка баланса
            async function loadBalance() {
                if (!userId) return;
                try {
                    const resp = await fetch(`${API_BASE}/profile/${encodeURIComponent(userId)}`);
                    const data = await resp.json();
                    casinoBalance = Number(data.casino_balance ?? data.balance ?? 0);
                    hudBalance.textContent = formatNumber(casinoBalance) + ' ₽';
                } catch(e) {}
            }

            function sendGameResult(result, bet, win) {
                if (!userId) return Promise.reject();
                return fetch(`${API_BASE}/game_result`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, game: 'racing', result: result, bet: bet, win: win })
                }).then(r => r.json());
            }

            // ==========================================================================
            // ПРОРИСОВКА ФОНА И ДОРОГИ (ПАСХАЛКА: ВИД СБОКУ В СТИЛЕ СКРИНШОТА)
            // ==========================================================================
            function drawBackground() {
                // Небо
                let grad = ctx.createLinearGradient(0, 0, 0, ch * 0.55);
                grad.addColorStop(0, '#3b82f6');
                grad.addColorStop(0.7, '#60a5fa');
                grad.addColorStop(1, '#fef08a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, cw, ch);

                // Солнце
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(cw * 0.8, ch * 0.2, 40, 0, Math.PI * 2);
                ctx.fill();

                // Дальние горы (параллакс)
                ctx.fillStyle = '#c2410c';
                ctx.beginPath();
                let mX = -(bgScrollX * 0.1) % cw;
                ctx.moveTo(mX - cw, ch * 0.55);
                ctx.lineTo(mX - cw * 0.6, ch * 0.28);
                ctx.lineTo(mX, ch * 0.55);
                ctx.lineTo(mX + cw * 0.5, ch * 0.32);
                ctx.lineTo(mX + cw, ch * 0.55);
                ctx.lineTo(mX + cw * 1.5, ch * 0.28);
                ctx.lineTo(cw * 2, ch * 0.55);
                ctx.fill();

                // Пустынные холмы
                ctx.fillStyle = '#ea580c';
                ctx.beginPath();
                let hX = -(bgScrollX * 0.3) % cw;
                ctx.moveTo(hX - cw, ch * 0.55);
                ctx.lineTo(hX - cw * 0.4, ch * 0.45);
                ctx.lineTo(hX + cw * 0.2, ch * 0.55);
                ctx.lineTo(hX + cw * 0.8, ch * 0.42);
                ctx.lineTo(hX + cw * 1.4, ch * 0.55);
                ctx.lineTo(cw * 2, ch * 0.55);
                ctx.fill();

                // Дорога
                let roadY = ch * 0.55;
                let roadH = ch * 0.45;

                ctx.fillStyle = '#d97706'; // Песчаная обочина
                ctx.fillRect(0, roadY, cw, roadH);

                let asphaltY = roadY + 25;
                let asphaltH = 150;
                ctx.fillStyle = '#334155'; // Асфальт
                ctx.fillRect(0, asphaltY, cw, asphaltH);

                // Бордюры (поребрики)
                ctx.fillStyle = '#e2e8f0';
                ctx.fillRect(0, asphaltY - 6, cw, 6);
                ctx.fillRect(0, asphaltY + asphaltH, cw, 6);

                // Прерывистая разметка
                ctx.fillStyle = '#ffffff';
                let stripeW = 40; let gap = 30;
                let offset = (player.dist * 10) % (stripeW + gap);
                for (let x = -offset; x < cw; x += stripeW + gap) {
                    ctx.fillRect(x, asphaltY + asphaltH / 2 - 3, stripeW, 6);
                }
            }

            // ==========================================================================
            // УНИКАЛЬНАЯ ОТРИСОВКА КАЖДОЙ МАШИНЫ ИЗ bot 2.py (ГЕЛИК, СКАЙЛАЙН, МЕРСЕДЕС И Т.Д.)
            // ==========================================================================
            function drawCarSide(x, y, carData, isPlayer) {
                ctx.save();
                ctx.translate(x, y);

                let color = carData.color || '#3b82f6';
                let type = carData.type || 'sedan';

                // Тень
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.beginPath();
                ctx.ellipse(0, 14, 62, 9, 0, 0, Math.PI * 2);
                ctx.fill();

                // Нитро пламя
                if (isPlayer && player.isNitro && player.nitroAmount > 0) {
                    ctx.fillStyle = '#2563eb';
                    ctx.beginPath(); ctx.moveTo(-55, -2); ctx.lineTo(-85 - Math.random()*25, 3); ctx.lineTo(-55, 8); ctx.fill();
                    ctx.fillStyle = '#fef08a';
                    ctx.beginPath(); ctx.moveTo(-55, 1); ctx.lineTo(-70 - Math.random()*15, 3); ctx.lineTo(-55, 5); ctx.fill();
                }

                // Кузов в зависимости от типа модели
                ctx.fillStyle = color;
                
                if (type === 'suv' || type === 'luxury' && carData.id === 'brabus') {
                    // Гелик / Братбус (квадратный)
                    ctx.fillRect(-52, -22, 104, 32);
                    ctx.fillStyle = '#0f172a'; ctx.fillRect(-28, -20, 56, 16); // Окна
                } else if (type === 'supercar') {
                    // Ламборгини (обтекаемый суперкар)
                    ctx.beginPath(); ctx.moveTo(-55, 8); ctx.lineTo(-50, -4); ctx.lineTo(-15, -16);
                    ctx.lineTo(25, -14); ctx.lineTo(58, 2); ctx.lineTo(58, 8); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.moveTo(-10, -14); ctx.lineTo(20, -12); ctx.lineTo(35, -2); ctx.lineTo(-5, -2); ctx.fill();
                } else if (type === 'truck') {
                    // Пикап Рам
                    ctx.fillRect(-58, -4, 116, 12);
                    ctx.fillRect(-12, -26, 45, 22);
                    ctx.fillStyle = '#1e293b'; ctx.fillRect(-58, -16, 46, 12);
                } else if (type === 'muscle') {
                    // Мустанг / Челленджер
                    ctx.beginPath(); ctx.moveTo(-52, 8); ctx.lineTo(-50, -2); ctx.lineTo(-20, -6);
                    ctx.lineTo(-10, -16); ctx.lineTo(25, -16); ctx.lineTo(40, -4); ctx.lineTo(56, 4);
                    ctx.lineTo(56, 8); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.moveTo(-8, -14); ctx.lineTo(20, -14); ctx.lineTo(32, -4); ctx.lineTo(-5, -4); ctx.fill();
                } else {
                    // Стандартный седан / купе (C-Class, M4, Жигули и т.д.)
                    ctx.beginPath(); ctx.moveTo(-52, 8); ctx.lineTo(-50, -4); ctx.lineTo(-30, -6);
                    ctx.lineTo(-15, -18); ctx.lineTo(20, -18); ctx.lineTo(35, -6); ctx.lineTo(52, -2);
                    ctx.lineTo(52, 8); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.moveTo(-12, -16); ctx.lineTo(15, -16); ctx.lineTo(25, -6); ctx.lineTo(-8, -6); ctx.fill();
                }

                // Фары
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(48, -2, 6, 4);

                // Колеса (Вращающиеся)
                let wheelRot = (player.dist * 0.2) % (Math.PI * 2);
                const drawWheel = (wx) => {
                    ctx.save(); ctx.translate(wx, 8); ctx.rotate(wheelRot);
                    ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                };
                drawWheel(-32);
                drawWheel(32);

                ctx.restore();
            }

            function drawTrafficLight() {
                if (countdown < 0 || countdown >= 4) return;
                
                let startX = cw / 2 - 40;
                let startY = 30;
                
                ctx.fillStyle = '#0f172a';
                ctx.beginPath(); ctx.roundRect(startX, startY, 80, 160, 12); ctx.fill();
                ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 3; ctx.stroke();

                let colors = ['#ef4444', '#ef4444', '#f59e0b', '#10b981'];
                for(let i = 0; i < 4; i++) {
                    ctx.fillStyle = (countdown === i) ? colors[i] : '#1e293b';
                    if (countdown >= 4 && i === 3) ctx.fillStyle = '#10b981';
                    
                    ctx.beginPath();
                    ctx.arc(cw / 2, startY + 25 + i * 36, 12, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ==========================================================================
            // РЕНДЕР И ФИЗИКА ЗАЕЗДА
            // ==========================================================================
            function render() {
                bgScrollX = player.dist * 2;
                drawBackground();

                let roadY = ch * 0.55 + 25;
                let laneH = 75;

                // Позиции машин на полосах
                let playerScreenX = 130;
                let playerScreenY = roadY + laneH + 40;

                let distDiff = enemy.dist - player.dist;
                let enemyScreenX = playerScreenX + distDiff * 1.8;
                let enemyScreenY = roadY + 35;

                // Отрисовка
                drawCarSide(enemyScreenX, enemyScreenY, enemy.car, false);
                drawCarSide(playerScreenX, playerScreenY, player.car, true);

                drawTrafficLight();
            }

            function update(dt) {
                if (!gameActive) return;

                // Светофор таймер
                if (countdown < 4) {
                    countdownTimer += dt;
                    if (countdownTimer >= 1.0) {
                        countdown++;
                        countdownTimer = 0;
                        if (countdown === 4) showToast("🚀 СТАРТ!");
                    }
                    return;
                }

                // Физика игрока с учетом бонуса выбранной машины
                let pBaseSpeed = 160 + player.car.speed_bonus * 2.2;
                let pAccel = 70 + player.car.speed_bonus * 1.8;

                if (player.isGas) {
                    let curAccel = pAccel;
                    if (player.isNitro && player.nitroAmount > 0) {
                        curAccel *= 2.5;
                        pBaseSpeed += 180;
                        player.nitroAmount -= 35 * dt;
                        screenShake = 6;
                    }
                    player.speed += curAccel * dt;
                } else {
                    player.speed -= 120 * dt;
                }

                player.speed = Math.max(0, Math.min(player.speed, pBaseSpeed));
                player.dist += (player.speed * 0.3) * dt;

                // ИИ Оппонента
                if (!isMultiplayer) {
                    let eBaseSpeed = 160 + enemy.car.speed_bonus * 2.2;
                    let eAccel = 70 + enemy.car.speed_bonus * 1.8;
                    
                    enemy.speed += eAccel * dt;
                    enemy.speed = Math.max(0, Math.min(enemy.speed, eBaseSpeed));
                    enemy.dist += (enemy.speed * 0.3) * dt;
                }

                hudSpeed.textContent = Math.round(player.speed) + ' KM/H';

                // Финиш
                if (player.dist >= TRACK_DIST || enemy.dist >= TRACK_DIST) {
                    gameActive = false;
                    let isWin = player.dist >= enemy.dist;
                    
                    if (isMultiplayer && socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({ type: 'finish', senderId: userId }));
                    } else {
                        finishRace(isWin);
                    }
                }

                // Отправка в сеть
                if (isMultiplayer && socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: 'move', senderId: userId, dist: player.dist }));
                }
            }

            function gameLoop(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let dt = (timestamp - lastTime) / 1000;
                lastTime = timestamp;

                update(dt);
                render();

                if (gameActive) requestAnimationFrame(gameLoop);
            }

            // ==========================================================================
            // УПРАВЛЕНИЕ ЗАЕЗДОМ И СЕТЬ
            // ==========================================================================
            async function finishRace(isWin) {
                gameActive = false;
                let winAmt = isWin ? Math.floor(raceBet * 1.85) : 0;

                try {
                    const res = await sendGameResult(isWin ? 'win' : 'lose', raceBet, winAmt);
                    if (res.new_balance !== undefined) {
                        casinoBalance = Number(res.new_balance);
                        hudBalance.textContent = formatNumber(casinoBalance) + ' ₽';
                    }
                } catch(e) {}

                alert(isWin ? `🏆 ФИНИШ! ПОБЕДА! ВЫИГРЫШ: ${formatNumber(winAmt)} ₽` : `❌ ВЫ ПРОИГРАЛИ! СОПЕРНИК ОКАЗАЛСЯ БЫСТРЕЕ.`);
                location.reload();
            }

            function startDragRace() {
                mainMenu.classList.add('hidden');
                gameHud.classList.remove('hidden');
                controlsLayer.classList.remove('hidden');

                player.dist = 0; player.speed = 0; player.nitroAmount = 100; player.car = selectedCar;
                enemy.dist = 0; enemy.speed = 0;
                
                countdown = 0; countdownTimer = 0;
                gameActive = true;
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }

            function connectWebSocket(code) {
                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                socket = new WebSocket(`${wsProtocol}//resellgame.bothost.tech/ws/race/${code}?userId=${userId}`);

                socket.onopen = () => {
                    showToast(`Ожидание соперника в комнате ${code}...`);
                    hudRoom.textContent = code;
                    socket.send(JSON.stringify({ type: 'join', senderId: userId, carId: selectedCar.id }));
                    setTimeout(() => startDragRace(), 2000);
                };

                socket.onmessage = (e) => {
                    try {
                        const data = JSON.parse(e.data);
                        if (data.type === 'join' && data.senderId !== userId) {
                            let eCar = CARS_DB.find(c => c.id === data.carId);
                            if (eCar) enemy.car = eCar;
                        }
                        if (data.type === 'move' && data.senderId !== userId) {
                            enemy.dist = data.dist;
                        }
                        if (data.type === 'game_over') {
                            gameActive = false;
                            finishRace(data.winnerId === userId);
                        }
                    } catch(err) {}
                };

                socket.onerror = () => {
                    showToast("Сбой сети. Запуск Сингла.");
                    startDragRace();
                };
            }

            // Кнопки меню
            document.getElementById('btnSingle').onclick = () => {
                raceBet = parseNumber(betInput.value);
                if (raceBet > casinoBalance) { showToast('Недостаточно средств!'); return; }
                isMultiplayer = false;
                hudRoom.textContent = "СИНГЛ";
                // Случайный выбор машины для ИИ из базы
                enemy.car = CARS_DB[Math.floor(Math.random() * CARS_DB.length)];
                startDragRace();
            };

            document.getElementById('btnCreateRoom').onclick = () => {
                raceBet = parseNumber(betInput.value);
                if (raceBet > casinoBalance) { showToast('Недостаточно средств!'); return; }
                isMultiplayer = true;
                let code = Math.floor(1000 + Math.random() * 9000).toString();
                connectWebSocket(code);
            };

            document.getElementById('btnJoinRoom').onclick = () => {
                raceBet = parseNumber(betInput.value);
                if (raceBet > casinoBalance) { showToast('Недостаточно средств!'); return; }
                let code = roomCodeInput.value.trim();
                if (!code) { showToast('Введите код комнаты!'); return; }
                isMultiplayer = true;
                connectWebSocket(code);
            };

            // Управление сенсором
            const btnGas = document.getElementById('btnGas');
            const btnNitro = document.getElementById('btnNitro');

            const bindTouch = (el, onStart, onEnd) => {
                el.addEventListener('touchstart', (e) => { e.preventDefault(); onStart(); });
                el.addEventListener('touchend', (e) => { e.preventDefault(); onEnd(); });
                el.addEventListener('mousedown', () => onStart());
                el.addEventListener('mouseup', () => onEnd());
            };

            bindTouch(btnGas, () => player.isGas = true, () => player.isGas = false);
            bindTouch(btnNitro, () => player.isNitro = true, () => player.isNitro = false);

            document.querySelectorAll('[data-amt]').forEach(btn => {
                btn.onclick = () => betInput.value = formatNumber(parseInt(btn.dataset.amt));
            });

            betInput.addEventListener('input', function() {
                this.value = formatNumber(parseNumber(this.value));
            });

            window.addEventListener('resize', () => {
                cw = window.innerWidth; ch = window.innerHeight;
                canvas.width = cw; canvas.height = ch;
                if (!gameActive) render();
            });

            // Старт
            initCarSelector();
            loadBalance();
            render();

        })();
    </script>
</body>
</html>
