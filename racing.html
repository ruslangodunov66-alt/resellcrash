<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>R-RACE | GTA STYLE EDITION</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,800;1,900&family=Nunito:wght@800;900&display=swap" rel="stylesheet" />
    <style>
        /* ===== СТИЛИ ОСТАВЛЕНЫ БЕЗ ИЗМЕНЕНИЙ (для краткости) ===== */
        :root {
            --gta-orange: #ff9d00;
            --gta-pink: #ff2a8d;
            --gta-purple: #7012ce;
            --gta-yellow: #ffee00;
            --gta-dark: #0a0612;
            --gta-panel: rgba(18, 10, 32, 0.88);
            --gta-border: #ffaa00;
            --text-main: #ffffff;
            --accent-green: #00ff66;
            --accent-red: #ff3344;
        }
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
        body {
            background: var(--gta-dark);
            font-family: 'Montserrat', sans-serif;
            color: var(--text-main);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
        }
        .game-wrapper {
            max-width:480px; width:100%; height:100vh; max-height:900px;
            background:var(--gta-dark);
            display:flex; flex-direction:column; position:relative; overflow:hidden;
            box-shadow:0 0 50px rgba(255,157,0,0.2);
            border:2px solid rgba(255,157,0,0.3);
        }
        /* МЕНЮ */
        .gta-menu {
            position:absolute; inset:0;
            background:linear-gradient(180deg, rgba(112,18,206,0.85) 0%, rgba(10,6,18,0.95) 70%), radial-gradient(circle at 50% 30%, #ff2a8d 0%, transparent 60%);
            display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; z-index:100;
            backdrop-filter:blur(8px);
        }
        .gta-logo-box { text-align:center; margin-bottom:24px; transform:rotate(-3deg); filter:drop-shadow(4px 4px 0px #000); }
        .gta-logo-title {
            font-size:42px; font-weight:900; font-style:italic; text-transform:uppercase;
            background:linear-gradient(180deg, #ffee00 0%, #ff9d00 100%);
            -webkit-background-clip:text; background-clip:text; color:transparent;
            letter-spacing:-1px; -webkit-text-stroke:1.5px #000;
        }
        .gta-logo-sub {
            font-size:16px; font-weight:900; color:#fff; letter-spacing:4px; text-transform:uppercase;
            background:var(--gta-pink); padding:2px 10px; display:inline-block; margin-top:-6px;
            box-shadow:3px 3px 0 #000;
        }
        .gta-card {
            width:100%; background:var(--gta-panel); border:2px solid var(--gta-border);
            box-shadow:6px 6px 0px #000; border-radius:12px; padding:16px; margin-bottom:14px;
            display:flex; flex-direction:column; gap:10px;
        }
        .gta-label { font-size:11px; font-weight:900; color:var(--gta-yellow); text-transform:uppercase; letter-spacing:1px; }
        input.gta-input {
            width:100%; height:46px; background:rgba(0,0,0,0.7); border:2px solid #fff;
            color:#fff; font-family:'Montserrat',sans-serif; font-weight:900; font-size:16px;
            text-align:center; outline:none; box-shadow:3px 3px 0 #000;
        }
        .gta-btn {
            width:100%; height:52px; border:2px solid #000; font-family:'Montserrat',sans-serif;
            font-weight:900; font-size:16px; color:#000; cursor:pointer; text-transform:uppercase;
            font-style:italic; box-shadow:4px 4px 0px #000; transition:all 0.1s;
        }
        .gta-btn:active { transform:translate(2px,2px); box-shadow:2px 2px 0px #000; }
        .btn-yellow { background:var(--gta-yellow); }
        .btn-pink { background:var(--gta-pink); color:#fff; }
        .btn-orange { background:var(--gta-orange); }
        /* ХУД */
        .gta-header {
            position:absolute; top:12px; left:12px; right:12px;
            display:flex; justify-content:space-between; align-items:center; z-index:50; pointer-events:none;
        }
        .hud-badge {
            background:rgba(0,0,0,0.85); border:2px solid var(--gta-border); box-shadow:3px 3px 0 #000;
            padding:6px 12px; font-size:13px; font-weight:900; color:#fff;
        }
        .hud-badge span { color:var(--gta-yellow); }
        /* Управление */
        .controls-overlay {
            position:absolute; bottom:20px; left:12px; right:12px;
            display:flex; justify-content:space-between; z-index:50;
        }
        .ctrl-group { display:flex; gap:10px; }
        .ctrl-btn {
            width:65px; height:65px; background:rgba(0,0,0,0.85); border:2px solid var(--gta-border);
            box-shadow:4px 4px 0 #000; border-radius:12px; display:flex; align-items:center;
            justify-content:center; font-size:26px; color:#fff; font-weight:900; cursor:pointer;
        }
        .ctrl-btn:active { background:var(--gta-orange); color:#000; transform:translate(2px,2px); }
        canvas#gameCanvas { width:100%; height:100%; display:block; }
        .status-toast {
            position:absolute; top:70px; left:50%; transform:translateX(-50%);
            background:rgba(0,0,0,0.9); border:2px solid var(--gta-pink); color:var(--gta-yellow);
            padding:8px 16px; font-size:12px; font-weight:900; text-transform:uppercase;
            box-shadow:4px 4px 0 #000; z-index:60; display:none;
        }
        .hidden { display:none !important; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>
    <div class="game-wrapper">
        <!-- TOAST -->
        <div class="status-toast" id="statusToast">Сообщение</div>

        <!-- ХУД -->
        <div class="gta-header hidden" id="gameHud">
            <div class="hud-badge">🏁 <span id="hudRoomCode">СИНГЛ</span></div>
            <div class="hud-badge">💰 <span id="hudBalance">0 ₽</span></div>
            <div class="hud-badge">⚡ <span id="hudSpeed">0 KM/H</span></div>
        </div>

        <!-- МЕНЮ -->
        <div class="gta-menu" id="gtaMenu">
            <div class="gta-logo-box">
                <div class="gta-logo-title">RES-CITY</div>
                <div class="gta-logo-sub">RACE STORIES</div>
            </div>
            <div class="gta-card">
                <span class="gta-label">Ставка за участие</span>
                <input type="text" class="gta-input" id="betInput" value="10 000" />
            </div>
            <button class="gta-btn btn-yellow" id="btnSingleplayer">🚗 ОДИНОЧНАЯ (ИИ)</button>
            <div class="gta-card" style="margin-top:10px;">
                <span class="gta-label">Мультиплеер (Комната по коду)</span>
                <input type="text" class="gta-input" id="roomCodeInput" placeholder="КОД КОМНАТЫ" maxlength="6" />
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px;">
                    <button class="gta-btn btn-pink" id="btnCreateRoom">СОЗДАТЬ</button>
                    <button class="gta-btn btn-orange" id="btnJoinRoom">ВОЙТИ</button>
                </div>
            </div>
        </div>

        <!-- КАНВАС -->
        <canvas id="gameCanvas"></canvas>

        <!-- ОВЕРЛЕЙ УПРАВЛЕНИЯ -->
        <div class="controls-overlay hidden" id="controlsOverlay">
            <div class="ctrl-group">
                <div class="ctrl-btn" id="btnLeft">◄</div>
                <div class="ctrl-btn" id="btnRight">►</div>
            </div>
            <div class="ctrl-group">
                <div class="ctrl-btn" id="btnBrake" style="border-color:var(--accent-red);">▼</div>
                <div class="ctrl-btn" id="btnGas" style="border-color:var(--accent-green);">▲</div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // --- TELEGRAM / USER ---
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        const API_BASE = 'https://resellgame.bothost.tech';
        let userId = null;
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('userId')) userId = urlParams.get('userId');
        else if (urlParams.has('user_id')) userId = urlParams.get('user_id');
        else if (tg?.initDataUnsafe?.user?.id) userId = tg.initDataUnsafe.user.id;

        // --- DOM ---
        const gtaMenu = document.getElementById('gtaMenu');
        const gameHud = document.getElementById('gameHud');
        const controlsOverlay = document.getElementById('controlsOverlay');
        const hudBalance = document.getElementById('hudBalance');
        const hudSpeed = document.getElementById('hudSpeed');
        const hudRoomCode = document.getElementById('hudRoomCode');
        const statusToast = document.getElementById('statusToast');
        const betInput = document.getElementById('betInput');
        const roomCodeInput = document.getElementById('roomCodeInput');

        let casinoBalance = 0;
        let gameActive = false;
        let currentRoom = null;
        let socket = null;
        let isMultiplayer = false;
        let raceBet = 10000;

        // --- Вспомогательные функции ---
        function showToast(msg, dur = 2500) {
            statusToast.textContent = msg;
            statusToast.style.display = 'block';
            setTimeout(() => statusToast.style.display = 'none', dur);
        }

        function formatNumber(n) { return (n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
        function parseNumber(s) { return parseInt(s.toString().replace(/\s/g, '')) || 0; }

        // --- ЗАГРУЗКА БАЛАНСА ---
        function loadBalance() {
            if (!userId) return;
            fetch(`${API_BASE}/profile/${encodeURIComponent(userId)}`)
                .then(r => r.json())
                .then(d => {
                    casinoBalance = Number(d.casino_balance ?? d.balance ?? 0);
                    hudBalance.textContent = formatNumber(casinoBalance) + ' ₽';
                })
                .catch(() => {});
        }

        // --- ОТПРАВКА РЕЗУЛЬТАТА ---
        function sendGameResult(result, bet, win) {
            if (!userId) return Promise.reject('Нет userId');
            return fetch(`${API_BASE}/game_result`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, game: 'racing', result, bet, win })
            }).then(r => r.json());
        }

        // --- СПИСАНИЕ СТАВКИ ПРИ СТАРТЕ ---
        async function deductBet() {
            if (raceBet > casinoBalance) {
                showToast('❌ Недостаточно средств!', 3000);
                return false;
            }
            // Отправляем "hold" – резервируем средства
            try {
                const res = await sendGameResult('hold', raceBet, 0);
                if (res.new_balance !== undefined) {
                    casinoBalance = Number(res.new_balance);
                    hudBalance.textContent = formatNumber(casinoBalance) + ' ₽';
                    return true;
                } else {
                    showToast('❌ Ошибка сервера', 3000);
                    return false;
                }
            } catch (e) {
                showToast('❌ Ошибка соединения', 3000);
                return false;
            }
        }

        // --- THREE.JS НАСТРОЙКА (оставлена без изменений, кроме камеры) ---
        const canvas = document.getElementById('gameCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2d124d);
        scene.fog = new THREE.FogExp2(0xff2a8d, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

        const sunLight = new THREE.DirectionalLight(0xffaa00, 1.8);
        sunLight.position.set(20, 30, -50);
        scene.add(sunLight);
        const ambientLight = new THREE.AmbientLight(0xff2a8d, 0.8);
        scene.add(ambientLight);

        // Дорога
        const roadGeo = new THREE.PlaneGeometry(10, 400);
        const roadMat = new THREE.MeshBasicMaterial({ color: 0x110b1a });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        scene.add(road);

        // Бордюры
        const curbGeo = new THREE.BoxGeometry(0.5, 0.2, 400);
        const curbMat = new THREE.MeshBasicMaterial({ color: 0xff9d00 });
        const leftCurb = new THREE.Mesh(curbGeo, curbMat);
        leftCurb.position.set(-5.2, 0.1, 0);
        scene.add(leftCurb);
        const rightCurb = new THREE.Mesh(curbGeo, curbMat);
        rightCurb.position.set(5.2, 0.1, 0);
        scene.add(rightCurb);

        // Разметка
        const lineGeo = new THREE.PlaneGeometry(0.3, 3);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffee00 });
        for (let z = -200; z < 200; z += 8) {
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.set(0, 0.02, z);
            scene.add(line);
        }

        // Пальмы
        function createPalm(x, z) {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 4, 5), new THREE.MeshBasicMaterial({ color: 0x4a2211 }));
            trunk.position.y = 2;
            group.add(trunk);
            const leavesMat = new THREE.MeshBasicMaterial({ color: 0x00ff88 });
            for (let i = 0; i < 5; i++) {
                const leaf = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 0.6), leavesMat);
                leaf.position.set(Math.sin(i * 1.2), 3.8, Math.cos(i * 1.2));
                leaf.rotation.y = i * 1.2;
                group.add(leaf);
            }
            group.position.set(x, 0, z);
            scene.add(group);
        }
        for (let z = -180; z < 180; z += 15) {
            createPalm(-8, z);
            createPalm(8, z + 7);
        }

        // --- СОЗДАНИЕ МАШИН ---
        function createGtaCar(colorHex) {
            const car = new THREE.Group();
            const bodyMat = new THREE.MeshBasicMaterial({ color: colorHex });
            const windowMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xffee00 });
            const tailMat = new THREE.MeshBasicMaterial({ color: 0xff0044 });

            const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.8, 3.2), bodyMat);
            body.position.y = 0.6;
            car.add(body);

            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.7, 2.0), bodyMat);
            cabin.position.set(0, 1.2, -0.2);
            car.add(cabin);

            const win = new THREE.Mesh(new THREE.BoxGeometry(1.42, 0.5, 1.2), windowMat);
            win.position.set(0, 1.3, -0.1);
            car.add(win);

            const l1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.1), lightMat);
            l1.position.set(-0.6, 0.7, 1.61);
            car.add(l1);
            const l2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.1), lightMat);
            l2.position.set(0.6, 0.7, 1.61);
            car.add(l2);

            const t1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.1), tailMat);
            t1.position.set(-0.6, 0.7, -1.61);
            car.add(t1);
            const t2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.1), tailMat);
            t2.position.set(0.6, 0.7, -1.61);
            car.add(t2);

            const wheelMat = new THREE.MeshBasicMaterial({ color: 0x0a0612 });
            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 8);
            const positions = [[-0.85, 0.3, 1.0], [0.85, 0.3, 1.0], [-0.85, 0.3, -1.0], [0.85, 0.3, -1.0]];
            positions.forEach(pos => {
                const w = new THREE.Mesh(wheelGeo, wheelMat);
                w.rotation.z = Math.PI / 2;
                w.position.set(pos[0], pos[1], pos[2]);
                car.add(w);
            });

            scene.add(car);
            return car;
        }

        const playerCarMesh = createGtaCar(0xff2a8d);
        const enemyCarMesh = createGtaCar(0x00ff88);

        // Препятствия
        const obstacles = [];
        function createObstacle(z) {
            const obs = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshBasicMaterial({ color: 0xff9d00 }));
            obs.position.set((Math.random() - 0.5) * 7, 0.6, z);
            scene.add(obs);
            obstacles.push(obs);
        }
        for (let z = 50; z < 300; z += 30) createObstacle(z);

        // --- СОСТОЯНИЕ ИГРОКА И СОПЕРНИКА ---
        let playerCarState = { x: -1.5, z: 0, speed: 0, angle: 0 };
        let enemyCarState = { x: 1.5, z: 0, speed: 0, angle: 0 };
        let keys = { left: false, right: false, gas: false, brake: false };

        // --- МУЛЬТИПЛЕЕР (WebSocket) ---
        function initWebSocket(roomCode) {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//resellgame.bothost.tech/ws/race/${roomCode}?userId=${userId}`;
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                showToast(`🏁 Комната ${roomCode} открыта!`, 2000);
                hudRoomCode.textContent = roomCode;
                startGame();
            };

            socket.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === 'move' && data.senderId !== userId) {
                    // Плавная интерполяция
                    enemyCarState.x = data.x;
                    enemyCarState.z = data.z;
                    enemyCarState.angle = data.angle;
                }
                if (data.type === 'game_over') {
                    if (data.winnerId === userId) finishRace(true);
                    else finishRace(false);
                }
                if (data.type === 'error') {
                    showToast(`❌ ${data.message}`, 3000);
                    // Переход в одиночный режим
                    isMultiplayer = false;
                    startSingleGame();
                }
            };

            socket.onclose = () => {
                showToast('⚠️ Соединение потеряно, переход в сингл', 3000);
                isMultiplayer = false;
                startSingleGame();
            };

            socket.onerror = () => {
                showToast('⚠️ Ошибка WebSocket, переключение на сингл', 3000);
                isMultiplayer = false;
                startSingleGame();
            };
        }

        // --- ЗАПУСК ИГРЫ ---
        function startGame() {
            gtaMenu.classList.add('hidden');
            gameHud.classList.remove('hidden');
            controlsOverlay.classList.remove('hidden');
            gameActive = true;
            playerCarState = { x: -1.5, z: 0, speed: 0, angle: 0 };
            enemyCarState = { x: 1.5, z: 0, speed: 0, angle: 0 };
            // Убедимся, что машины на старте
            playerCarMesh.position.set(playerCarState.x, 0, playerCarState.z);
            enemyCarMesh.position.set(enemyCarState.x, 0, enemyCarState.z);
        }

        function startSingleGame() {
            isMultiplayer = false;
            hudRoomCode.textContent = "СИНГЛ";
            startGame();
        }

        // --- ЗАВЕРШЕНИЕ ГОНКИ ---
        async function finishRace(isWin) {
            if (!gameActive) return;
            gameActive = false;
            const winAmount = isWin ? Math.floor(raceBet * 1.9) : 0;

            try {
                const res = await sendGameResult(isWin ? 'win' : 'lose', raceBet, winAmount);
                if (res.new_balance !== undefined) {
                    casinoBalance = Number(res.new_balance);
                    hudBalance.textContent = formatNumber(casinoBalance) + ' ₽';
                }
                showToast(isWin ? `🏆 ПОБЕДА! +${formatNumber(winAmount)} ₽` : `❌ ПРОИГРЫШ`, 4000);
            } catch (e) {
                showToast('❌ Ошибка отправки результата', 3000);
            }

            setTimeout(() => location.reload(), 3000);
        }

        // --- ФИЗИКА ---
        function updatePhysics() {
            if (!gameActive) return;

            // Управление
            if (keys.gas) playerCarState.speed = Math.min(playerCarState.speed + 0.015, 0.8);
            else if (keys.brake) playerCarState.speed = Math.max(playerCarState.speed - 0.02, -0.2);
            else playerCarState.speed *= 0.98;

            if (keys.left) { playerCarState.x -= 0.08; playerCarState.angle = 0.15; }
            else if (keys.right) { playerCarState.x += 0.08; playerCarState.angle = -0.15; }
            else playerCarState.angle = 0;

            playerCarState.x = Math.max(-4.2, Math.min(4.2, playerCarState.x));
            playerCarState.z += playerCarState.speed;

            playerCarMesh.position.set(playerCarState.x, 0, playerCarState.z);
            playerCarMesh.rotation.y = playerCarState.angle;

            // Соперник (ИИ или мультиплеер)
            if (!isMultiplayer) {
                enemyCarState.z += 0.35;
                enemyCarMesh.position.set(enemyCarState.x, 0, enemyCarState.z);
            } else {
                // Интерполяция для плавности
                enemyCarMesh.position.x += (enemyCarState.x - enemyCarMesh.position.x) * 0.15;
                enemyCarMesh.position.z += (enemyCarState.z - enemyCarMesh.position.z) * 0.15;
                // Поворот (приблизительно)
                enemyCarMesh.rotation.y += (enemyCarState.angle - enemyCarMesh.rotation.y) * 0.1;
            }

            // Камера
            camera.position.set(playerCarState.x, 3.5, playerCarState.z - 7);
            camera.lookAt(playerCarState.x, 1.0, playerCarState.z + 10);

            hudSpeed.textContent = Math.round(playerCarState.speed * 180) + ' KM/H';

            // Финиш
            if (playerCarState.z >= 300) {
                finishRace(true);
            }

            // Отправка в мультиплеер
            if (isMultiplayer && socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: 'move',
                    senderId: userId,
                    x: playerCarState.x,
                    z: playerCarState.z,
                    angle: playerCarState.angle
                }));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            renderer.render(scene, camera);
        }
        animate();

        // --- УПРАВЛЕНИЕ (сенсор + клавиатура) ---
        const bindControl = (id, key) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            btn.addEventListener('mousedown', () => keys[key] = true);
            btn.addEventListener('mouseup', () => keys[key] = false);
        };
        bindControl('btnLeft', 'left');
        bindControl('btnRight', 'right');
        bindControl('btnGas', 'gas');
        bindControl('btnBrake', 'brake');

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'ArrowRight') keys.right = true;
            if (e.key === 'ArrowUp') keys.gas = true;
            if (e.key === 'ArrowDown') keys.brake = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'ArrowRight') keys.right = false;
            if (e.key === 'ArrowUp') keys.gas = false;
            if (e.key === 'ArrowDown') keys.brake = false;
        });

        // --- СОБЫТИЯ МЕНЮ ---
        document.getElementById('btnSingleplayer').onclick = async () => {
            raceBet = parseNumber(betInput.value);
            if (raceBet < 100) { showToast('❌ Мин. ставка 100 ₽', 2000); return; }
            if (!await deductBet()) return;
            startSingleGame();
        };

        document.getElementById('btnCreateRoom').onclick = async () => {
            raceBet = parseNumber(betInput.value);
            if (raceBet < 100) { showToast('❌ Мин. ставка 100 ₽', 2000); return; }
            if (!await deductBet()) return;
            isMultiplayer = true;
            const code = Math.floor(1000 + Math.random() * 9000).toString();
            initWebSocket(code);
        };

        document.getElementById('btnJoinRoom').onclick = async () => {
            raceBet = parseNumber(betInput.value);
            if (raceBet < 100) { showToast('❌ Мин. ставка 100 ₽', 2000); return; }
            if (!await deductBet()) return;
            const code = roomCodeInput.value.trim();
            if (!code) { showToast('❌ Введите код комнаты', 2000); return; }
            isMultiplayer = true;
            initWebSocket(code);
        };

        // --- ИНИЦИАЛИЗАЦИЯ ---
        loadBalance();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
